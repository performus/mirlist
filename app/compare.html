<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Сравнение залов: рассадка, площадь, стоимость аренды и групповой запрос в отделы продаж.">
<meta property="og:title" content="Сравнение залов — МирХАБ">
<meta property="og:description" content="Сравнение залов: рассадка, площадь, стоимость аренды и групповой запрос в отделы продаж.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Сравнение залов — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1400px;margin:0 auto;padding:24px 28px 64px;animation:pageIn .5s ease both;}

/* ── шапка раздела ── */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
.d-eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.d-title{font-family:'Literata',Georgia,serif;font-size:32px;font-weight:600;color:var(--slate-deep);line-height:1.15;margin-top:8px;letter-spacing:-.005em;}
.d-limit{font-size:13px;color:var(--slate-muted);margin-top:8px;}
.d-limit b{color:var(--slate-deep);font-weight:700;}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}

.btn{
  display:inline-block;padding:11px 22px;border-radius:var(--r-full);
  font-size:13.5px;font-weight:600;border:1.5px solid var(--slate-pale);
  background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover:not(:disabled){background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}
.btn.sm{padding:7px 14px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.note{
  background:var(--aqua-pale);border-radius:var(--r-md);
  padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--slate-mid);
  margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.note b{color:var(--slate-deep);}

/* ══════════════════════════════════════════════
   ТАБЛИЦА СРАВНЕНИЯ
   ══════════════════════════════════════════════ */
.tscroll{
  overflow-x:auto;background:var(--white);
  border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  scrollbar-width:thin;scrollbar-color:var(--aqua-2) transparent;
}
.tscroll::-webkit-scrollbar{height:8px;}
.tscroll::-webkit-scrollbar-thumb{background:var(--aqua-2);border-radius:4px;}

.cmp{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
.cmp th,.cmp td{
  padding:12px 16px;text-align:left;font-size:13px;
  border-bottom:1px solid rgba(197,227,225,.28);vertical-align:top;
}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none;}

/* первый столбец залипает при горизонтальной прокрутке */
.rowhead{
  position:sticky;left:0;z-index:2;
  width:210px;min-width:210px;
  background:var(--white);
  font-weight:500;color:var(--slate-muted);
  border-right:1px solid rgba(197,227,225,.35);
}
.cmp tbody tr:hover .rowhead{background:var(--aqua-pale);}
.cmp tbody tr:hover td{background:rgba(237,246,245,.45);}

/* шапка колонки-зала */
.colhead{
  width:230px;min-width:230px;
  background:var(--bg);vertical-align:top;
  border-bottom:1px solid rgba(197,227,225,.4);
}
.colhead.corner{position:sticky;left:0;z-index:3;background:var(--bg);}
.ch-img{width:100%;height:96px;border-radius:var(--r-sm);overflow:hidden;background:var(--aqua-pale);margin-bottom:10px;}
.ch-img img{width:100%;height:100%;object-fit:cover;}
.ch-name{font-size:14.5px;font-weight:700;color:var(--slate-deep);line-height:1.3;display:block;transition:color .2s;}
.ch-name:hover{color:var(--coral);}
.ch-venue{font-size:12px;color:var(--slate-muted);margin-top:3px;display:block;transition:color .2s;}
.ch-venue:hover{color:var(--coral);}
.ch-remove{
  margin-top:9px;padding:6px 12px;border-radius:var(--r-full);
  font-size:11.5px;font-weight:600;
  background:var(--white);color:var(--slate-muted);
  border:1.5px solid rgba(197,227,225,.55);transition:all .2s;
}
.ch-remove:hover{border-color:var(--coral);color:var(--coral);}

.cmp td{color:var(--slate-deep);font-weight:600;background:var(--white);}
.cmp td.dim{color:var(--slate-pale);font-weight:500;}
.grp{
  background:var(--coral-soft);color:var(--coral);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  position:sticky;left:0;z-index:2;
}
.cmp tr.grp-row td{background:var(--coral-soft);}

/* ── пустое состояние ── */
.empty{
  background:var(--white);border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg);box-shadow:var(--sh-md);
  padding:60px 28px;text-align:center;max-width:560px;margin:0 auto;
}
.empty h2{font-family:'Literata',Georgia,serif;font-size:26px;font-weight:600;color:var(--slate-deep);margin-bottom:10px;}
.empty p{font-size:13.5px;line-height:1.65;color:var(--slate-muted);margin-bottom:22px;}
.empty .ic-hint{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:var(--coral-soft);color:var(--coral);
  vertical-align:middle;margin:0 3px;
}

/* ══════════════════════════════════════════════
   МОДАЛКИ
   ══════════════════════════════════════════════ */
.ovl{
  position:fixed;inset:0;z-index:900;
  background:rgba(53,78,99,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .18s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--white);border-radius:var(--r-lg);
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:var(--sh-lg);overflow:hidden;animation:slideUp .22s ease both;
}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-title{font-family:'Literata',Georgia,serif;font-size:21px;font-weight:600;color:var(--slate-deep);}
.modal-body{padding:16px 24px 20px;overflow-y:auto;}
.modal-body p{font-size:13.5px;line-height:1.65;color:var(--slate-mid);margin-bottom:14px;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px;flex-wrap:wrap;}
.x{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--slate-pale);background:var(--white);
  color:var(--slate-muted);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.x:hover{border-color:var(--coral);color:var(--coral);}

.fl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--slate-muted);margin:16px 0 7px;}
.fl:first-child{margin-top:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fi{
  width:100%;padding:10px 14px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:13.5px;color:var(--slate-deep);
  outline:none;transition:border-color .2s;
}
.fi:focus{border-color:var(--coral);background:var(--white);}
textarea.fi{min-height:110px;resize:vertical;line-height:1.55;}

.obj-list{display:flex;flex-direction:column;gap:7px;}
.obj{border:1px solid rgba(197,227,225,.4);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;}
.obj b{color:var(--slate-deep);display:block;margin-bottom:3px;}
.obj span{color:var(--slate-muted);font-size:12.5px;}

.mtbl{width:100%;border-collapse:collapse;font-size:13px;}
.mtbl th,.mtbl td{text-align:left;padding:9px 0;border-bottom:1px solid rgba(197,227,225,.3);}
.mtbl tr:last-child th,.mtbl tr:last-child td{border-bottom:none;}
.mtbl th{font-weight:500;color:var(--slate-muted);width:46%;}
.mtbl td{font-weight:600;color:var(--slate-deep);}
.mnote{
  background:var(--aqua-pale);border-radius:var(--r-sm);
  padding:11px 13px;font-size:12px;line-height:1.55;color:var(--slate-mid);margin-top:14px;
}
.ok-num{
  font-family:'Literata',Georgia,serif;font-weight:600;font-size:26px;color:var(--coral);
  display:block;margin:6px 0 12px;
}

@media(max-width:768px){
  .wrap{padding:18px 16px 48px;}
  .d-title{font-size:25px;}
  .rowhead{width:150px;min-width:150px;}
  .colhead{width:190px;min-width:190px;}
  .row2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>
<div id="modalRoot"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const IC = {
  cmp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 7h18M6 7v4M12 7v8M18 7v4"/></svg>',
};

const LETTER_TEMPLATE =
  'Добрый день!\n\nПодбираем площадку под деловое мероприятие. ' +
  'Просим направить коммерческое предложение: стоимость аренды на указанные даты, ' +
  'варианты рассадки под заявленное количество участников, условия по кейтерингу ' +
  'и технические возможности зала.\n\nЗаранее благодарим за ответ.';

/* ══════════════════════════════════════════════
   СТРОКИ ТАБЛИЦЫ
   Порядок задан ТЗ. Значения читаются из зала (h) и его объекта (v).
   ══════════════════════════════════════════════ */
function buildRows() {
  const rows = [
    { g: 'Объект' },
    ['Объект',            (h, v) => `<a href="venue.html?id=${v.id}" style="color:var(--coral)">${esc(v.name)}</a>`],
    ['Категория объекта', (h, v) => esc(v.cat)],
    ['Город',             (h, v) => esc(v.city)],
    { g: 'Зал' },
    ['Тип зала',          h => esc(h.type)],
    ['Площадь, м²',       h => h.area],
    ['Высота потолка, м', h => h.height || '—'],
    { g: 'Вместимость по схемам рассадки' },
  ];
  ML.SEATING.forEach(s => rows.push([s.l, h => h.seats[s.k] || '—']));
  rows.push(
    { g: 'Условия' },
    ['Аренда за день',    h => h.priceDay ? ML.money(h.priceDay) : 'по договорённости'],
    ['Аренда за час',     h => h.priceHour ? ML.money(h.priceHour) : 'не сдаётся почасово'],
    ['Номерной фонд объекта', (h, v) => (v.rooms.twin || v.rooms.sngl) ? `TWIN ${v.rooms.twin} · SNGL ${v.rooms.sngl}` : 'нет'],
    ['Точный план пространства', h => h.plan ? 'есть' : 'нет'],
    ['Рейтинг объекта',   (h, v) => `${v.rating} (${v.reviews})`],
  );
  return rows;
}

/* ══════════════════════════════════════════════
   РЕНДЕР
   ══════════════════════════════════════════════ */
function render() {
  const halls = ML.compareHalls();          // ID залов лежат в состоянии модели
  const t = ML.tariff();
  const root = document.getElementById('root');

  const head = `<div class="crumbs">
      <a href="search.html">Подбор площадок</a><span class="sep">→</span><span class="cur">Сравнение залов</span>
    </div>`;

  /* Гостю сравнение недоступно целиком: показываем экран с объяснением
     вместо содержимого. Условие — только ML.tariff().blur. */
  if (MH.isLocked()) {
    root.innerHTML = head + MH.lockScreen('Сравнение залов — после регистрации',
      'Сравнение подбирает залы бок о бок: вместимость по схемам рассадки, площадь, стоимость аренды и оснащение в одной таблице. Зарегистрируйтесь, чтобы собрать свой список.');
    return;
  }

  if (!halls.length) {
    root.innerHTML = head + `<div class="empty">
      <h2>В сравнении пока пусто</h2>
      <p>Отметьте залы значком <span class="ic-hint">${IC.cmp}</span> на странице подбора —
      здесь появится таблица параметров, выгрузка презентации и групповой запрос в отделы продаж.</p>
      <a class="btn pri" href="search.html">Перейти к подбору</a>
    </div>`;
    return;
  }

  const rows = buildRows();
  const venues = halls.map(h => ML.hallVenue(h));

  const cols = halls.map((h, i) => {
    const v = venues[i];
    return `<th class="colhead">
      <div class="ch-img"><img src="${ML.photoUrl(h.photo)}" alt="" loading="lazy"></div>
      <a class="ch-name" href="hall.html?id=${h.id}">${esc(h.name)}</a>
      <a class="ch-venue" href="venue.html?id=${v.id}">${esc(v.name)}</a>
      <button class="ch-remove" onclick="removeHall(${h.id})">Убрать</button>
    </th>`;
  }).join('');

  const body = rows.map(r => {
    if (r.g) return `<tr class="grp-row"><th class="rowhead grp">${esc(r.g)}</th>${halls.map(() => '<td></td>').join('')}</tr>`;
    const [label, fn] = r;
    return `<tr><th class="rowhead">${esc(label)}</th>${halls.map((h, i) => {
      const val = fn(h, venues[i]);
      const dim = val === '—' || val === 'нет' || val === 'не сдаётся почасово';
      return `<td class="${dim ? 'dim' : ''}">${val}</td>`;
    }).join('')}</tr>`;
  }).join('');

  const limitTxt = t.compare === Infinity ? 'без ограничения' : `до ${t.compare} ${ML.plural(t.compare, ['зала','залов','залов'])}`;

  root.innerHTML = head + `
  <div class="dhead">
    <div>
      <span class="d-eyebrow">Инструмент</span>
      <h1 class="d-title">Сравнение залов</h1>
      <div class="d-limit">Тариф <b>«${esc(t.name)}»</b> — ${limitTxt}. Сейчас: <b>${halls.length}</b>.</div>
    </div>
    <div class="d-actions">
      <button class="btn" onclick="clearAll()">Очистить список</button>
      <button class="btn" ${t.presentation ? '' : 'disabled title="Недоступно на тарифе «СТАРТ»"'} onclick="openPresentation()">Сформировать презентацию</button>
      <button class="btn pri" onclick="openRequest()">Отправить запрос</button>
    </div>
  </div>

  ${!t.presentation ? `<div class="note">
      <span>Выгрузка презентаций недоступна на тарифе <b>«СТАРТ»</b>.
      На «БИЗНЕС» файл собирается с рекламным блоком, на «ПРЕМИУМ» — без него.</span>
      <a class="btn sm" href="pricing.html">Тарифы</a></div>` : ''}

  <div class="tscroll">
    <table class="cmp">
      <thead><tr><th class="colhead corner"></th>${cols}</tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

function removeHall(id) { ML.toggleCompare(id); render(); }
function clearAll() { ML.clearCompare(); MH.toast('Список сравнения очищен', 'info'); render(); }

/* ══════════════════════════════════════════════
   МОДАЛКИ
   ══════════════════════════════════════════════ */
function modal(title, body, foot) {
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title">${title}</div>
        <button class="x" onclick="closeModal()" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
    </div>
  </div>`;
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

/* ── презентация ── */
function openPresentation() {
  const t = ML.tariff();
  if (!t.presentation) { MH.toast('Выгрузка презентаций доступна с тарифа «БИЗНЕС»', 'error'); return; }
  const halls = ML.compareHalls();
  const venues = [...new Set(halls.map(h => h.venueId))];
  const params = ML.filtersSummary(ML.loadFilters());

  modal('Презентация сформирована', `
    <p>В файл вошли <b>${halls.length}</b> ${ML.plural(halls.length, ['зал','зала','залов'])}
    из <b>${venues.length}</b> ${ML.plural(venues.length, ['объекта','объектов','объектов'])}
    с полной информацией, фото и картой.</p>
    <table class="mtbl">
      <tr><th>Залов в файле</th><td>${halls.length}</td></tr>
      <tr><th>Шаблон</th><td>Корпоративный шаблон заказчика</td></tr>
      <tr><th>Рекламный блок</th><td>${t.presentation === 'ads'
        ? 'включён (тариф «БИЗНЕС»)' : 'отсутствует (тариф «ПРЕМИУМ»)'}</td></tr>
      <tr><th>Параметры подбора в файле</th><td>${params.length ? esc(params.join(' · ')) : 'фильтры не задавались'}</td></tr>
    </table>
    <div class="mnote">Печатная версия открывается отдельной страницей — оттуда её можно
    отправить на печать или сохранить в PDF средствами браузера.</div>`,
    `<button class="btn" onclick="closeModal()">Закрыть</button>
     <a class="btn pri" href="venue-presentation.html">Открыть презентацию</a>`);
}

/* ── групповой запрос ── */
function openRequest() {
  const halls = ML.compareHalls();
  if (!halls.length) { MH.toast('Сначала добавьте залы в сравнение', 'error'); return; }

  const byVenue = new Map();
  halls.forEach(h => {
    const v = ML.hallVenue(h);
    if (!byVenue.has(v.id)) byVenue.set(v.id, { venue: v, halls: [] });
    byVenue.get(v.id).halls.push(h);
  });
  const objs = [...byVenue.values()];

  // лимит тарифа проверяет сама модель
  const chk = ML.canGroupRequest(objs.length);
  if (!chk.ok) {
    modal('Групповой запрос недоступен',
      `<p>${esc(chk.reason)}.</p>
       <p>Сейчас в сравнении ${objs.length} ${ML.plural(objs.length, ['объект','объекта','объектов'])}.
       Уберите лишние залы или повысьте тариф.</p>`,
      `<button class="btn" onclick="closeModal()">Закрыть</button>
       <a class="btn pri" href="pricing.html">Перейти к тарифам</a>`);
    return;
  }

  modal('Групповой запрос', `
    <label class="fl">Запрос уйдёт в отделы продаж</label>
    <div class="obj-list">${objs.map(o => `<div class="obj">
      <b>${esc(o.venue.name)}</b>
      <span>${o.halls.map(h => esc(h.name)).join(', ')}</span>
    </div>`).join('')}</div>

    <label class="fl">Параметры мероприятия</label>
    <div class="row2">
      <input class="fi" id="rqDates" value="14–16.10.2026" placeholder="Даты">
      <input class="fi" id="rqGuests" type="number" min="1" value="120" placeholder="Человек">
    </div>

    <label class="fl">Сопроводительное письмо</label>
    <div class="row2" style="margin-bottom:9px">
      <button class="btn sm" onclick="useTemplate()">Взять шаблон</button>
      <button class="btn sm" onclick="clearLetter()">Написать своё</button>
    </div>
    <textarea class="fi" id="rqLetter" placeholder="Текст письма"></textarea>

    <div class="mnote">Контакты пользователя объектам не передаются. Дальнейшая переписка идёт
    через площадку — история запроса остаётся в личном кабинете.</div>`,
    `<button class="btn" onclick="closeModal()">Отмена</button>
     <button class="btn pri" onclick="sendRequest()">Отправить запрос</button>`);
}

function useTemplate() { document.getElementById('rqLetter').value = LETTER_TEMPLATE; }
function clearLetter() { const el = document.getElementById('rqLetter'); el.value = ''; el.focus(); }

function sendRequest() {
  const halls = ML.compareHalls();
  const objCount = new Set(halls.map(h => h.venueId)).size;
  const dates = (document.getElementById('rqDates').value || '').trim();
  const guests = (document.getElementById('rqGuests').value || '').trim();
  const letter = (document.getElementById('rqLetter').value || '').trim();

  const title = `Запрос на ${objCount} ${ML.plural(objCount, ['объект','объекта','объектов'])}`
    + (dates ? `, ${dates}` : '') + (guests ? `, ${guests} чел.` : '');

  // createRequest сам проверяет лимит, присваивает номер и очищает сравнение
  const req = ML.createRequest(title, letter);
  if (!req) {
    const chk = ML.canGroupRequest(objCount);
    MH.toast(chk.reason || 'Не удалось создать запрос', 'error');
    return;
  }

  modal('Запрос отправлен', `
    <p>Запрос ушёл в <b>${objCount}</b> ${ML.plural(objCount, ['объект','объекта','объектов'])}.
    Он сохранён в истории — там же появятся ответы.</p>
    <span class="ok-num">${esc(req.id)}</span>
    <table class="mtbl">
      <tr><th>Дата создания</th><td>${esc(req.date)}</td></tr>
      <tr><th>Залов в запросе</th><td>${req.hallIds.length}</td></tr>
      <tr><th>Объектов</th><td>${req.objects.length}</td></tr>
    </table>
    <div class="mnote">Список сравнения очищен — залы переехали в запрос.</div>`,
    `<a class="btn" href="search.html">К подбору</a>
     <a class="btn pri" href="dashboard.html?role=user&page=requests">В историю запросов</a>`);

  render();   // сравнение очищено моделью — перерисовываем пустое состояние
}

render();
</script>
</body>
</html>
