<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Частые вопросы: бронирование, поиск по залам, контакты, баллы, сметы и стоимость размещения объекта.">
<meta property="og:title" content="FAQ — МАЙСЛИСТ">
<meta property="og:description" content="Частые вопросы: бронирование, поиск по залам, контакты, баллы, сметы и стоимость размещения объекта.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/og-image.png">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>FAQ — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:820px;margin:0 auto;padding:28px 28px 72px;animation:pageIn .5s ease both;}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
h1{font-family:'Literata',Georgia,serif;font-size:36px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;margin-top:10px;letter-spacing:-.005em;}
.lead{font-size:15.5px;line-height:1.7;color:var(--slate-muted);margin-top:14px;}

.faq{margin-top:26px;display:flex;flex-direction:column;gap:10px;}
.q{background:var(--white);border:1px solid rgba(197,227,225,.32);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);overflow:hidden;transition:border-color .25s;}
.q[open]{border-color:var(--aqua-3);}
.q summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:12px;
  font-size:15px;font-weight:700;color:var(--slate-deep);transition:background .18s;}
.q summary::-webkit-details-marker{display:none;}
.q summary:hover{background:var(--aqua-pale);}
.q-mark{flex:none;width:24px;height:24px;border-radius:50%;background:var(--coral-soft);color:var(--coral);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  transition:transform .22s;}
.q[open] .q-mark{transform:rotate(45deg);}
.q-a{padding:0 20px 19px 56px;font-size:14px;line-height:1.75;color:var(--slate-mid);}
.q-a a{color:var(--coral);font-weight:600;}
.q-a a:hover{text-decoration:underline;text-underline-offset:3px;}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:18px 20px;
  font-size:13.5px;line-height:1.7;color:var(--slate-mid);margin-top:26px;}
.note b{color:var(--slate-deep);}
.note a{color:var(--coral);font-weight:600;}

.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
.btn{display:inline-block;padding:12px 26px;border-radius:var(--r-full);font-size:14px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;}
.btn:hover{border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover{background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}

@media(max-width:700px){ h1{font-size:27px;} .wrap{padding:20px 16px 56px;} .q-a{padding-left:20px;} }
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init('faq');

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Ответы, на которые документы дают прямой ответ.
   Цифры подставляются из модели, чтобы не расходиться с тарифами. */
function items(){
  const fees = ML.FEE_TIERS.filter(t => t.fee)
    .map(t => `${ML.money(t.fee)} за ${t.label.toLowerCase()}`).join(', ');
  return [
    { q: 'Можно ли на платформе забронировать зал?',
      a: 'МАЙСЛИСТ помогает подобрать и сравнить залы, подготовить презентацию и отправить запрос. '
       + 'Бронирование зала, согласование сметы и заключение договора происходят вне платформы.' },
    { q: 'Почему объектом поиска и выбора являются залы, а не отели или конгресс-центры?',
      a: 'Организаторам важнее всего найти подходящий зал нужной площади и вместимости, с необходимым оснащением '
       + 'и характеристиками. Тип и назначение здания, где он расположен, тоже имеют значение, но не первостепенное. '
       + 'Поэтому залы ищутся независимо от объектов, в которых находятся, хотя при выдаче сгруппированы, чтобы было '
       + 'понятно их соседство. При этом в поиске, конечно, можно учитывать и локацию, и некоторые существенные '
       + 'характеристики объекта.' },
    { q: 'Кто видит мои контакты?',
      a: 'Менеджер объекта или поставщик получает имя пользователя и общие сведения о мероприятии. '
       + 'В течение установленного времени (от одного часа в рабочие дни — в зависимости от обязательств, '
       + 'взятых на себя объектом или поставщиком) пользователю приходит либо ответ на запрос, либо отказ '
       + 'в проведении мероприятия. Вся коммуникация осуществляется по электронной почте, никакие другие личные '
       + 'контакты автоматически не передаются.' },
    { q: 'Когда мне начислят баллы?',
      a: 'После того как и пользователь, и объект отметили мероприятие как состоявшееся, вам начисляются '
       + 'бонусные баллы. Условия их использования подробно изложены на <a href="bonus.html">странице бонусной программы</a>.' },
    { q: 'Может ли МАЙСЛИСТ посчитать стоимость аренды или смету мероприятия?',
      a: 'МАЙСЛИСТ не обеспечивает и не гарантирует бронирование залов. МАЙСЛИСТ не рассчитывает смету '
       + 'аренды или проведения мероприятия. Стоимость и условия аренды и других услуг обсуждаются с менеджером '
       + 'объекта напрямую, в устраивающих каждую сторону каналах коммуникации.' },
    { q: 'Сколько стоит добавление зала или объекта на платформу?',
      a: 'Размещение информации о залах и объектах на МАЙСЛИСТ — бесплатно. Менеджмент объекта платит '
       + 'фиксированную сумму только за состоявшееся мероприятие, запрос на которое пришёл через платформу. '
       + 'Размер такого платежа рассчитывается исходя из минимального количества участников и не превышает '
       + 'суммарной стоимости одной чашки кофе для каждого из них. '
       + 'Подписку на услуги платформы оплачивают те, кто регулярно ищет залы для мероприятий. В зависимости '
       + 'от тарифа пользователь получает возможность сравнивать между собой залы большего количества объектов.' },
  ];
}

document.getElementById('root').innerHTML = `
  <div class="crumbs"><a href="homepage.html">Главная</a><span class="sep">→</span><span class="cur">FAQ</span></div>

  <h1>FAQ</h1>
  <p class="lead">Коротко о возможностях и ограничениях МАЙСЛИСТ.</p>

  <div class="faq">
    ${items().map(x => `<details class="q">
      <summary><span class="q-mark">+</span>${esc(x.q)}</summary>
      <div class="q-a">${x.a}</div>
    </details>`).join('')}
  </div>

  <div class="note">Не нашли ответа на свой вопрос? Задайте его <a href="support.html">специалистам поддержки</a>.</div>

  <div class="cta">
    <a class="btn pri" href="search.html">Перейти к подбору залов</a>
    <a class="btn" href="how.html">Как это работает</a>
    <a class="btn" href="about.html">О проекте</a>
  </div>`;
</script>
</body>
</html>
