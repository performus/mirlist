<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог площадок — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c:#EB7454;--c6:#D96345;--cs:#FCEAE4;--cg:rgba(235,116,84,.12);
  --aq:#79B9C3;--aq-p:#EDF6F5;
  --s:#46627A;--sm:#3E596F;--sd:#354E63;--sx:#7A919F;--sp:#B4C3CC;
  --bg:#F8F5F2;--w:#FFF;
  --sh:0 4px 20px rgba(53,78,99,.07);--shl:0 8px 40px rgba(53,78,99,.09);--shc:0 4px 18px rgba(235,116,84,.22);
  --r:10px;--rm:14px;--rl:20px;--rf:50px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--s);-webkit-font-smoothing:antialiased;}
body.has-mh-nav{padding-top:64px;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ── TOP FILTER BAR ── */
.top-bar{
  background:var(--w);border-bottom:1px solid rgba(197,227,225,.3);
  padding:0 24px;display:flex;align-items:center;gap:8px;height:52px;overflow-x:auto;
  scrollbar-width:none;flex-shrink:0;
}
.top-bar::-webkit-scrollbar{display:none;}
.tb-chip{
  display:flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:var(--rf);border:1.5px solid var(--sp);background:var(--w);
  font-size:13px;font-weight:500;color:var(--sx);white-space:nowrap;
  transition:all .2s;flex-shrink:0;
}
.tb-chip:hover{border-color:var(--c);color:var(--c);}
.tb-chip.active{background:var(--cs);border-color:var(--c);color:var(--c);font-weight:600;}
.tb-sep{width:1px;height:20px;background:rgba(197,227,225,.4);flex-shrink:0;margin:0 4px;}
.tb-search{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  border-radius:var(--rf);border:1.5px solid var(--sp);background:var(--w);
  font-size:13px;color:var(--sx);white-space:nowrap;flex-shrink:0;
  transition:border-color .2s;
}
.tb-search:hover{border-color:var(--aq);}
.tb-search svg{opacity:.55;}

/* ── CATEGORY CHIPS ── */
.cat-bar{
  background:var(--w);border-bottom:1px solid rgba(197,227,225,.2);
  padding:0 24px;display:flex;align-items:center;gap:8px;height:44px;
  overflow-x:auto;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-chip{
  padding:5px 14px;border-radius:var(--rf);font-size:12.5px;font-weight:500;
  color:var(--sx);border:none;background:none;white-space:nowrap;
  transition:all .2s;flex-shrink:0;
}
.cat-chip:hover{background:var(--aq-p);color:var(--sm);}
.cat-chip.active{background:var(--cs);color:var(--c);font-weight:600;}

/* ── MAIN LAYOUT ── */
.main{display:flex;min-height:calc(100vh - 160px);}

/* ── SIDEBAR ── */
.sidebar{
  width:236px;flex-shrink:0;background:var(--w);
  border-right:1px solid rgba(197,227,225,.3);
  padding:20px 0;overflow-y:auto;
  position:sticky;top:160px;align-self:flex-start;
  max-height:calc(100vh - 160px);scrollbar-width:thin;
  scrollbar-color:var(--sp) transparent;
}
.sb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 16px;border-bottom:1px solid rgba(197,227,225,.25);margin-bottom:4px;
}
.sb-title{font-size:14px;font-weight:700;color:var(--sd);letter-spacing:.02em;}
.sb-reset{font-size:12px;color:var(--sx);background:none;border:none;cursor:pointer;transition:color .2s;}
.sb-reset:hover{color:var(--c);}

.sb-group{padding:16px 18px;border-bottom:1px solid rgba(197,227,225,.18);}
.sb-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sp);margin-bottom:12px;}

.fd-check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--sm);margin-bottom:10px;cursor:pointer;user-select:none;}
.fd-check:last-child{margin-bottom:0;}
.fd-check input{display:none;}
.fd-box{
  width:17px;height:17px;border-radius:4px;border:1.5px solid var(--sp);
  background:var(--w);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.fd-check input:checked ~ .fd-box{background:var(--c);border-color:var(--c);}
.fd-chk{opacity:0;transition:opacity .15s;}
.fd-check input:checked ~ .fd-box .fd-chk{opacity:1;}

.sb-range{padding:0;}
.range-track{width:100%;accent-color:var(--c);cursor:pointer;height:4px;border-radius:2px;}
.range-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sx);margin-top:8px;}
.range-value{font-size:12.5px;font-weight:600;color:var(--sd);text-align:center;margin-bottom:10px;}

.sb-apply{
  margin:16px 18px 8px;width:calc(100% - 36px);
  padding:12px;border-radius:var(--rm);border:none;
  background:var(--c);color:#fff;font-size:13.5px;font-weight:600;
  box-shadow:var(--shc);transition:background .2s;
}
.sb-apply:hover{background:var(--c6);}
.sb-reset-full{display:block;text-align:center;font-size:12px;color:var(--sx);padding:4px;cursor:pointer;transition:color .2s;background:none;border:none;width:100%;}
.sb-reset-full:hover{color:var(--c);}

/* ── CONTENT ── */
.content{flex:1;padding:20px 24px 48px;min-width:0;}
.cards-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:10px;
}
.cards-count{font-size:14px;color:var(--sx);}
.cards-count b{color:var(--sd);font-weight:700;}
.sort-select{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  border-radius:var(--rf);border:1.5px solid var(--sp);background:var(--w);
  font-size:13px;font-weight:500;color:var(--sm);cursor:pointer;transition:border-color .2s;
}
.sort-select:hover{border-color:var(--aq);}
.sort-select svg{opacity:.55;}

.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

/* ── VENUE CARD ── */
.v-card{
  background:var(--w);border-radius:var(--rl);overflow:hidden;
  box-shadow:var(--sh);transition:all .3s cubic-bezier(.22,1,.36,1);cursor:pointer;
}
.v-card:hover{transform:translateY(-4px);box-shadow:var(--shl);}
.v-thumb{position:relative;height:190px;overflow:hidden;}
.v-thumb>img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1);}
.v-card:hover .v-thumb>img{transform:scale(1.05);}
/* badges top-left */
.v-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;}
.v-badge{
  padding:5px 12px;border-radius:var(--rf);
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  font-size:11.5px;font-weight:600;color:var(--sd);
}
.v-badge.premium{background:var(--c);color:#fff;}
/* icon buttons top-right */
.v-tr{position:absolute;top:10px;right:10px;display:flex;gap:6px;}
.v-tr-cmp,.v-tr-fav{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);color:var(--sp);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);transition:all .2s;cursor:pointer;
}
.v-tr-cmp:hover,.v-tr-fav:hover{background:#fff;color:var(--c);transform:scale(1.08);}
.v-tr-cmp.on{background:var(--cs);color:var(--c);}
.v-tr-fav.on{color:var(--c);}
.v-body{padding:14px 14px 16px;}
.v-name{font-size:15px;font-weight:700;color:var(--sd);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.v-loc{font-size:12.5px;color:var(--sx);margin-bottom:10px;
  display:flex;align-items:center;gap:4px;}
.v-meta{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.v-meta-item{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sx);}
.v-meta-item svg{opacity:.65;flex-shrink:0;}
.v-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.v-price{font-size:12px;color:var(--sx);white-space:nowrap;}
.v-price strong{font-size:17px;font-weight:800;color:var(--sd);}
.v-btn-pair{display:flex;gap:6px;}
.v-btn{
  padding:8px 14px;border-radius:var(--rf);border:none;
  background:var(--aq-p);font-size:12.5px;font-weight:600;color:var(--sm);
  transition:all .2s;white-space:nowrap;
}
.v-btn:hover{background:var(--aqua,#D9ECEB);color:var(--sd);}

/* ── COMPARE BAR ── */
.compare-bar{
  position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);z-index:300;
  background:var(--sd);color:#fff;padding:14px 28px;border-radius:var(--rf);
  display:flex;align-items:center;gap:14px;box-shadow:0 8px 40px rgba(53,78,99,.3);
  transition:bottom .4s cubic-bezier(.22,1,.36,1);font-size:14px;font-weight:500;white-space:nowrap;
}
.compare-bar.show{bottom:28px;}
.cb-count{background:var(--c);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.compare-bar button{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:7px 18px;border-radius:var(--rf);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.compare-bar button:hover{background:rgba(255,255,255,.25);}
.cb-clear{background:none!important;border:none!important;color:rgba(255,255,255,.55)!important;padding:7px 8px!important;}

/* ── FOOTER ── */
.footer{background:var(--sd);color:rgba(255,255,255,.45);padding:40px 48px 24px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;max-width:1100px;margin:0 auto 28px;}
.footer-brand p{font-size:13px;line-height:1.7;margin-top:10px;color:rgba(255,255,255,.3);}
.footer-col h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-bottom:12px;}
.footer-col a{display:block;font-size:13px;color:rgba(255,255,255,.45);margin-bottom:7px;transition:color .2s;}
.footer-col a:hover{color:#fff;}
.footer-bottom{max-width:1100px;margin:0 auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.18);}

@media(max-width:1100px){.cards-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .sidebar{display:none;}
  .main{flex-direction:column;}
  .cards-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){.cards-grid{grid-template-columns:1fr;}}
</style>
</head>

</div>

<!-- CATEGORY CHIPS -->
<div class="cat-bar">

  <button class="cat-chip" onclick="filterCat(this,'view')">С панорамой</button>
  <button class="cat-chip" onclick="filterCat(this,'parking')">Парковка</button>
  <button class="cat-chip" onclick="filterCat(this,'outdoor')">Загородные</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar">

      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Банкетный зал</label>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Коворкинг</label>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Галерея</label>

    <div class="sb-group">
      <div class="sb-group-label">Цена за день</div>
      <div class="range-value" id="priceVal">до 100 000 ₽</div>
      <input class="range-track" type="range" min="5000" max="200000" value="100000" oninput="updatePrice(this.value)">
      <div class="range-labels"><span>5 000 ₽</span><span>200 000 ₽</span></div>
    </div>

    <div class="sb-group">
      <div class="sb-group-label">Вместимость</div>
      <div class="range-value" id="capVal">до 300 чел.</div>
      <input class="range-track" type="range" min="10" max="1000" value="300" oninput="updateCap(this.value)">
      <div class="range-labels"><span>10</span><span>1000</span></div>
    </div>

    <div class="sb-group">
      <div class="sb-group-label">Услуги</div>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Wi-Fi</label>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Проектор</label>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Парковка</label>
      <label class="fd-check"><input type="checkbox" onchange="applyFilters()"><span class="fd-box"><svg class="fd-chk" width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Кейтеринг</label>

/* ── COMPARE ── */
let cmpSet=new Set();
function toggleCmp(id,btn){
  if(cmpSet.has(id)){cmpSet.delete(id);btn.classList.remove('on');}
  else if(cmpSet.size<4){cmpSet.add(id);btn.classList.add('on');}
  document.getElementById('cbCount').textContent=cmpSet.size;
  document.getElementById('compareBar').classList.toggle('show',cmpSet.size>0);
}
function openCompare(){MH.go('compare.html?ids='+[...cmpSet].join(','));}
function clearCompare(){cmpSet.clear();document.querySelectorAll('.v-cmp.on').forEach(b=>b.classList.remove('on'));document.getElementById('compareBar').classList.remove('show');document.getElementById('cbCount').textContent='0';}

/* ── FAVORITES ── */
function toggleFavBtn(id,btn){
  const added=MH.toggleFav(id);
  btn.classList.toggle('on',added);
  btn.innerHTML=added?'<svg width="14" height="14" viewBox="0 0 12 12" fill="#EB7454" xmlns="http://www.w3.org/2000/svg"><path d="M6.49994 11.7733L10.6225 7.04126C12.4072 5.11857 12.3285 2.70387 11.1252 1.23784C10.5265 0.507833 9.65454 0.0271597 8.64523 0.00115934C7.78324 -0.0215077 6.87726 0.28783 6.00328 0.962506C5.12663 0.28783 4.21798 -0.0215077 3.35467 0.00115934C2.34469 0.0278264 1.47137 0.507833 0.872051 1.23784C-0.331925 2.7052 -0.40459 5.1199 1.38671 7.04193L5.50862 11.7733C5.63529 11.9173 5.81528 12 6.00395 12C6.09792 11.9999 6.19077 11.9796 6.27622 11.9405C6.36167 11.9013 6.43773 11.8444 6.49927 11.7733H6.49994Z"/></svg>':IC.heart;
}

/* ── RENDER ── */
let activeCat='all';
function renderCards(list){
  const grid=document.getElementById('cardsGrid');
  const ICO_CMP=IC.cmp;
  const ICO_FAV_OFF=IC.heart;
  const ICO_FAV_ON=IC.heartOn;
  grid.innerHTML=list.map(v=>{
    const fav=MH.isFav(v.id);
    const prem=v.r>=4.9;
    return `
    <div class="v-card" onclick="MH.go('venue.html?id=${v.s}')">
      <div class="v-thumb">
        ${vIll(v.h,v.s)}
        <div class="v-badges">
          <div class="v-badge">${v.type}</div>
          ${prem?'<div class="v-badge premium">Premium</div>':''}
        </div>
        <div class="v-tr">
          <button class="v-tr-cmp${cmpSet.has(v.id)?' on':''}" onclick="event.stopPropagation();toggleCmp(${v.id},this)" title="Сравнить">${ICO_CMP}</button>
          <button class="v-tr-fav${fav?' on':''}" onclick="event.stopPropagation();toggleFavBtn(${v.id},this)" title="В избранное">${fav?ICO_FAV_ON:ICO_FAV_OFF}</button>
        </div>
      </div>
      <div class="v-body">
        <div class="v-name">${v.n}</div>
        <div class="v-loc">${IC.pin} ${v.loc}${v.metro?` · ${v.metro}`:''}</div>
        <div class="v-meta">
          <div class="v-meta-item">${IC.cap} до ${v.cap} гостей</div>
          <div class="v-meta-item">${IC.area} ${v.area} м²</div>
        </div>
        <div class="v-foot">
          <div class="v-price">от <strong>${v.p} ₽</strong></div>
          <div class="v-btn-pair">
            <button class="v-btn" onclick="event.stopPropagation();toggleCmp(${v.id},document.querySelector('.v-tr-cmp[data-id=\\'${v.id}\\']'))">Сравнить</button>
            <button class="v-btn" onclick="event.stopPropagation();window.open('venue-presentation.html?ids=${v.id}','_blank')">Презентация</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  const n=list.length;
  const fake=n<12?Math.round(n*32+15):n*32;
  document.getElementById('countLabel').textContent=fake;
  document.getElementById('countBtn').textContent=fake;
}

function filterCat(btn,cat){
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeCat=cat;
  applyFilters();
}

function applyFilters(){
  const filtered=activeCat==='all'?VENUES:VENUES.filter(v=>v.tags.includes(activeCat));
  renderCards(filtered);
}

function resetFilters(){
  document.querySelectorAll('.fd-check input').forEach(i=>{i.checked=false;});
  document.querySelectorAll('.fd-check input')[0].checked=true;
  document.querySelectorAll('.fd-check input')[1].checked=true;
  document.getElementById('priceVal').textContent='до 100 000 ₽';
  document.getElementById('capVal').textContent='до 300 чел.';
  activeCat='all';
  document.querySelectorAll('.cat-chip').forEach((b,i)=>b.classList.toggle('active',i===0));
  applyFilters();
}

function updatePrice(v){
  const n=parseInt(v);
  document.getElementById('priceVal').textContent='до '+(n>=200000?'200 000+':n.toLocaleString('ru'))+' ₽';
}
function updateCap(v){
  const n=parseInt(v);
  document.getElementById('capVal').textContent='до '+(n>=1000?'1000+':n)+' чел.';
}

let sortAsc=false;
function toggleSort(btn){
  sortAsc=!sortAsc;
  btn.firstChild.textContent=sortAsc?'По цене ↑':'По рейтингу';
}

/* ── INIT ── */
applyFilters();
MH.init('catalog');
</script>
