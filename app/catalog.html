<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0;url=search.html">
<meta name="robots" content="noindex">
<link rel="canonical" href="search.html">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Каталог площадок — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757;
  --slate:#46627A; --slate-deep:#354E63; --slate-muted:#7A919F;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-md:0 4px 20px rgba(53,78,99,.07);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Onest',system-ui,sans-serif; background:var(--bg); color:var(--slate);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--white); border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg); box-shadow:var(--sh-md);
  padding:44px 40px; max-width:460px; text-align:center;
}
h1{font-family:'Literata',Georgia,serif; font-size:26px; font-weight:600; color:var(--slate-deep); margin-bottom:12px;}
p{font-size:14px; line-height:1.6; color:var(--slate-muted); margin-bottom:24px;}
a.go{
  display:inline-block; padding:13px 30px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; text-decoration:none;
  font-size:15px; font-weight:600; box-shadow:var(--sh-coral);
  transition:background .2s;
}
a.go:hover{background:var(--coral-hover);}
</style>
</head>
<body>
<div class="card">
  <h1>Каталог переехал</h1>
  <p>Подбор площадок и залов теперь на одной странице — с фильтрами, картой и сравнением.</p>
  <a class="go" href="search.html">Перейти к подбору площадок</a>
</div>
</body>
</html>
