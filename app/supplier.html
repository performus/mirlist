<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" id="metaDesc" content="Карточка поставщика услуг для мероприятий: услуги, цены и оплата баллами.">
<meta property="og:title" id="ogTitle" content="МирХАБ">
<meta property="og:description" id="ogDesc" content="Карточка поставщика услуг для мероприятий: услуги, цены и оплата баллами.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Поставщик — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE; --peach-pale:#EFD6CA;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1240px;margin:0 auto;padding:24px 28px 64px;animation:pageIn .5s ease both;}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a{transition:color .2s;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
.d-eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.d-title{font-family:'Literata',Georgia,serif;font-size:34px;font-weight:600;color:var(--slate-deep);line-height:1.15;margin-top:8px;letter-spacing:-.005em;}
.d-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px;color:var(--slate-muted);align-items:center;}
.d-meta b{color:var(--slate-deep);font-weight:700;}
.d-price{font-size:14px;font-weight:700;color:var(--slate-deep);}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;}

.tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;background:var(--aqua-pale);color:var(--slate-mid);}
.tag.solid{background:var(--coral-soft);color:var(--coral);}

.btn{display:inline-block;padding:11px 22px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover{background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}
.btn.sm{padding:8px 16px;font-size:12.5px;}

.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr;gap:10px;margin-bottom:22px;height:280px;}
/* Строка 1fr прижимается к высоте контейнера; без неё неявная строка auto
   росла до натуральной высоты фото и содержимое вываливалось вниз.
   min-height:0 — у грид-элементов по умолчанию min-height:auto, и они
   отказываются сжиматься меньше содержимого. */
.gal > *{min-height:0;}
.gal-cell{border-radius:var(--r-md);overflow:hidden;background:var(--aqua-pale);}
.gal-cell img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);}
.gal-cell:hover img{transform:scale(1.05);}

.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap;}
.sec-head.first{margin-top:0;}
.sec-title{font-family:'Literata',Georgia,serif;font-size:22px;font-weight:600;color:var(--slate-deep);}
.sec-sub{font-size:12.5px;color:var(--slate-muted);}
.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);box-shadow:var(--sh-md);}
.panel.pad{padding:18px 20px;}
.panel.pad p{font-size:13.5px;line-height:1.65;color:var(--slate-mid);}

/* ── таблица услуг ── */
.tscroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
.tbl th,.tbl td{text-align:left;padding:12px 16px;border-bottom:1px solid rgba(197,227,225,.3);}
.tbl thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--slate-muted);background:var(--aqua-pale);}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl td{color:var(--slate-mid);}
.tbl td.num{font-weight:700;color:var(--slate-deep);white-space:nowrap;}
.tbl td.pts{font-weight:700;color:var(--coral);white-space:nowrap;}
.tbl td.no{color:var(--slate-pale);}

/* ── другие поставщики ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.tile{background:var(--white);border:1px solid rgba(197,227,225,.32);border-radius:var(--r-md);overflow:hidden;
  box-shadow:var(--sh-sm);transition:transform .25s,box-shadow .25s,border-color .25s;display:block;}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--aqua-3);}
.tile-img{height:96px;background:var(--aqua-pale);}
.tile-img img{width:100%;height:100%;object-fit:cover;}
.tile-body{padding:11px 12px 13px;}
.tile-name{font-size:13.5px;font-weight:700;color:var(--slate-deep);line-height:1.3;margin-bottom:4px;}
.tile-sub{font-size:11.5px;color:var(--slate-muted);}

.side{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;}
.side .panel{padding:18px;}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-muted);margin-bottom:10px;}
.side p{font-size:12.5px;line-height:1.6;color:var(--slate-muted);margin-bottom:12px;}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--slate-mid);margin-top:14px;}
.note b{color:var(--slate-deep);}

.nf{max-width:460px;margin:60px auto;text-align:center;padding:48px 36px;}
.nf h2{font-family:'Literata',Georgia,serif;font-size:26px;font-weight:600;color:var(--slate-deep);margin-bottom:10px;}
.nf p{font-size:13.5px;color:var(--slate-muted);margin-bottom:22px;line-height:1.6;}

/* ── модалка запроса ── */
.ovl{position:fixed;inset:0;z-index:900;background:rgba(53,78,99,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:480px;box-shadow:var(--sh-lg);overflow:hidden;}
.modal-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-title{font-family:'Literata',Georgia,serif;font-size:21px;font-weight:600;color:var(--slate-deep);}
.modal-body{padding:16px 24px 22px;}
.modal-body p{font-size:13px;line-height:1.6;color:var(--slate-mid);margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--slate-muted);margin:0 0 6px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.fi{width:100%;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid rgba(197,227,225,.5);
  background:var(--bg);font-family:inherit;font-size:13.5px;color:var(--slate-deep);outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--coral);background:var(--white);}
textarea.fi{min-height:88px;resize:vertical;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px;}
.x{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--slate-pale);background:var(--white);
  color:var(--slate-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.x:hover{border-color:var(--coral);color:var(--coral);}

@media(max-width:900px){
  .two{grid-template-columns:minmax(0,1fr);}
  .side{position:static;}
  .gal{grid-template-columns:1fr;height:220px;}
  .gal-cell:nth-child(n+2){display:none;}
  .d-title{font-size:26px;}
  .wrap{padding:18px 18px 48px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>
<div id="modalRoot"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Пересчёт в баллы — из модели: ML.servicePoints(retail) = retail / ML.POINT_RATE. */

function notFound(msg) {
  document.getElementById('root').innerHTML = `<div class="panel nf">
    <h2>${esc(msg)}</h2>
    <p>Проверьте ссылку — возможно, карточка была удалена.</p>
    <a class="btn pri" href="search.html">К подбору площадок</a>
  </div>`;
  document.title = msg + ' — МирХАБ';
}

let S = null;

function render() {
  const s = S;
  const same = ML.SUPPLIERS.filter(x => x.parent === s.parent && x.id !== s.id).slice(0, 4);

  /* Прайс-лист берём из модели: s.services = [{name, price, loyalty}].
     В бонусной программе участвует не вся карточка, а конкретные позиции. */
  const rows = s.services.map(x => `<tr>
    <td>${esc(x.name)}</td>
    <td class="num">${ML.money(x.price)}</td>
    <td${x.loyalty ? '' : ' class="no"'}>${x.loyalty ? 'да' : 'нет'}</td>
    <td class="${x.loyalty ? 'pts' : 'no'}">${x.loyalty ? ML.servicePoints(x.price).toLocaleString('ru') + ' Б' : '—'}</td>
  </tr>`).join('');

  const tiles = same.map(x => `<a class="tile" href="supplier.html?id=${x.id}">
    <div class="tile-img"><img src="${ML.photoUrl(x.photo)}" alt="" loading="lazy"></div>
    <div class="tile-body">
      <div class="tile-name">${esc(x.name)}</div>
      <div class="tile-sub">${esc(x.child)} · ${esc(x.city)}</div>
    </div></a>`).join('');

  document.getElementById('root').innerHTML = `
  <div class="crumbs">
    <a href="suppliers.html">Каталог поставщиков</a><span class="sep">→</span><span class="cur">${esc(s.name)}</span>
  </div>

  <div class="dhead">
    <div>
      <span class="d-eyebrow">${esc(s.parent)} · ${esc(s.child)}</span>
      <h1 class="d-title">${esc(s.name)}</h1>
      <div class="d-meta">
        <span>${esc(s.city)}</span>
        <span>опыт <b>${s.exp}</b> ${ML.plural(s.exp, ['год','года','лет'])}</span>
        <span class="d-price">${MH.blurOnly('от ' + ML.money(s.price))}</span>
        ${s.loyalty ? '<span class="tag solid">Принимает баллы</span>' : ''}
        ${s.video ? '<span class="tag">Видео</span>' : ''}
        ${s.reviews ? '<span class="tag">Отзывы</span>' : ''}
      </div>
    </div>
    <div class="d-actions">
      <button class="btn pri" onclick="openRequest()">Отправить запрос</button>
    </div>
  </div>

  <div class="gal">
    <div class="gal-cell"><img src="${ML.photoUrl(s.photo)}" alt="${esc(s.name)}"></div>
    <div class="gal-cell"><img src="${ML.photoUrl(s.photo + 1)}" alt="" loading="lazy"></div>
    <div class="gal-cell"><img src="${ML.photoUrl(s.photo + 2)}" alt="" loading="lazy"></div>
  </div>

  <div class="two">
    <div>
      <div class="sec-head first"><h2 class="sec-title">Об услуге</h2></div>
      <div class="panel pad">
        <p>Категория «${esc(s.child)}» в разделе «${esc(s.parent)}». Работает в городе ${esc(s.city)} и области,
        опыт ${s.exp} ${ML.plural(s.exp, ['год','года','лет'])}. Стоимость рассчитывается под задачу мероприятия,
        в карточке указана нижняя граница.</p>
      </div>

      <div class="sec-head">
        <h2 class="sec-title">Услуги в карточке</h2>
        <span class="sec-sub">Курс: 1 балл = ${ML.POINT_RATE.toLocaleString('ru')} ₽</span>
      </div>
      ${MH.lock(`<div class="panel"><div class="tscroll"><table class="tbl">
        <thead><tr><th>Услуга</th><th>Цена от</th><th>В бонусной программе</th><th>В баллах</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>`, 'Прайс-лист доступен после регистрации')}
      <div class="note">Цена в баллах — розничная цена, делённая на курс балла
        (${ML.POINT_RATE.toLocaleString('ru')} ₽). Ресурс платит партнёру
        ${Math.round((1 - ML.LOYALTY_DISCOUNT) * 100)}% розничной цены — на эту разницу и живёт бонусная программа.</div>

      ${same.length ? `<div class="sec-head"><h2 class="sec-title">Другие в разделе «${esc(s.parent)}»</h2></div>
        <div class="tiles">${tiles}</div>` : ''}
    </div>

    <aside class="side">
      <div class="panel">
        <div class="eyebrow">Запрос поставщику</div>
        <p>Групповой запрос отправляется только внутри одной категории — поставщиков из разных
        разделов в один запрос собрать нельзя.</p>
        <button class="btn pri" style="width:100%" onclick="openRequest()">Отправить запрос</button>
      </div>
      <div class="panel">
        <div class="eyebrow">Контакты</div>
        <p>Контакты пользователя поставщику не передаются — общение идёт через площадку.</p>
      </div>
    </aside>
  </div>`;
}

/* ── запрос поставщику ── */
function openRequest() {
  const s = S;
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" id="ovl" onclick="if(event.target===this)closeRequest()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title">Запрос поставщику</div>
        <button class="x" onclick="closeRequest()" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body">
        <p>Запрос уйдёт поставщику <b>${esc(s.name)}</b> (${esc(s.parent)} · ${esc(s.child)}).</p>
        <div class="row2">
          <div><label class="fl">Даты</label><input class="fi" id="rqDates" value="14–16.10.2026"></div>
          <div><label class="fl">Количество человек</label><input class="fi" id="rqGuests" type="number" value="120"></div>
        </div>
        <label class="fl">Сопроводительное письмо</label>
        <textarea class="fi" id="rqLetter" placeholder="Что нужно от поставщика"></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeRequest()">Отмена</button>
        <button class="btn pri" onclick="sendRequest()">Отправить</button>
      </div>
    </div>
  </div>`;
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeRequest(); }
function closeRequest() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function sendRequest() {
  closeRequest();
  MH.toast('Запрос отправлен поставщику', 'success');
}

/* ── старт ── */
(function init() {
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  const s = ML.SUPPLIERS.find(x => x.id === id);
  if (!s) { notFound('Поставщик не найден'); return; }
  S = s;

  const title = `${s.name} — ${s.child} — МирХАБ`;
  const desc = `${s.parent} · ${s.child}. ${s.city}, опыт ${s.exp} ${ML.plural(s.exp, ['год','года','лет'])}, от ${ML.money(s.price)}.`;
  document.title = title;
  document.getElementById('ogTitle').setAttribute('content', title);
  document.getElementById('ogDesc').setAttribute('content', desc);
  document.getElementById('metaDesc').setAttribute('content', desc);

  render();
})();
</script>
</body>
</html>
