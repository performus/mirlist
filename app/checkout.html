<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Оформление подписки: выбор тарифа и периода, автопродление, оплата по счёту для юридических лиц.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Оплата подписки — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1000px;margin:0 auto;padding:28px 28px 72px;animation:pageIn .5s ease both;}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
h1{font-family:'Literata',Georgia,serif;font-size:32px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;margin-top:10px;letter-spacing:-.005em;}
.sub{font-size:14px;line-height:1.65;color:var(--slate-muted);margin-top:10px;}

.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start;margin-top:26px;}
.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:22px 24px;}
.panel + .panel{margin-top:16px;}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--slate-muted);margin-bottom:12px;}

/* выбор тарифа */
.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid rgba(197,227,225,.45);
  border-radius:var(--r-md);padding:15px 17px;margin-bottom:10px;cursor:pointer;transition:all .2s;}
.opt:hover{border-color:var(--aqua-3);}
.opt.on{border-color:var(--coral);background:var(--coral-soft);}
.opt input{margin-top:3px;accent-color:var(--coral);flex-shrink:0;}
.opt-b{flex:1;min-width:0;}
.opt-t{font-size:15px;font-weight:700;color:var(--slate-deep);}
.opt-s{font-size:12.5px;line-height:1.6;color:var(--slate-muted);margin-top:4px;}
.opt-p{font-size:15px;font-weight:800;color:var(--slate-deep);white-space:nowrap;text-align:right;}
.opt-p small{display:block;font-size:11.5px;font-weight:500;color:var(--slate-muted);margin-top:3px;}
.opt-off{display:inline-block;margin-left:7px;padding:3px 9px;border-radius:var(--r-full);
  background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;vertical-align:middle;}

.check{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.6;
  color:var(--slate-mid);cursor:pointer;}
.check input{margin-top:2px;accent-color:var(--coral);flex-shrink:0;}
.check span b{color:var(--slate-deep);}
.check-s{display:block;font-size:12px;color:var(--slate-muted);margin-top:3px;}

/* итог */
.side{position:sticky;top:88px;}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:14px 0;border-bottom:1px solid rgba(197,227,225,.3);}
.total:last-of-type{border-bottom:none;}
.total-k{font-size:13px;color:var(--slate-muted);}
.total-v{font-size:14px;font-weight:700;color:var(--slate-deep);white-space:nowrap;}
.total.big .total-k{font-size:14px;font-weight:600;color:var(--slate-deep);}
.total.big .total-v{font-family:'Literata',Georgia,serif;font-size:28px;font-weight:600;color:var(--coral);}
.old{font-size:12.5px;color:var(--slate-pale);text-decoration:line-through;}

.btn{width:100%;padding:14px;border-radius:var(--r-full);font-size:15px;font-weight:600;
  background:var(--coral);border:none;color:#fff;box-shadow:var(--sh-coral);transition:background .2s;margin-top:16px;}
.btn:hover{background:var(--coral-hover);}
.btn.o{background:var(--white);color:var(--slate);border:1.5px solid var(--slate-pale);box-shadow:none;margin-top:8px;}
.btn.o:hover{border-color:var(--coral);color:var(--coral);background:var(--white);}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:14px 16px;
  font-size:12.5px;line-height:1.65;color:var(--slate-mid);margin-top:16px;}
.note b{color:var(--slate-deep);}

.cur-tar{display:inline-block;padding:4px 12px;border-radius:var(--r-full);
  background:var(--aqua-pale);color:var(--slate-mid);font-size:12px;font-weight:600;margin-top:12px;}

/* реквизиты для счёта (R2 стр.15) */
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 14px;margin-top:6px;}
.inv .full{grid-column:1/-1;}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--slate-deep);margin-bottom:6px;}
.fl small{font-weight:500;color:var(--slate-muted);}
.in{width:100%;padding:11px 14px;border:1.5px solid rgba(197,227,225,.6);border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;color:var(--slate-deep);background:var(--white);transition:border-color .2s;}
.in:focus{outline:none;border-color:var(--coral);}
.in::placeholder{color:var(--slate-pale);}

/* счёт выставлен */
.done{max-width:620px;margin:8px auto 0;text-align:center;padding:36px 32px;}
.done-ic{width:60px;height:60px;border-radius:50%;background:var(--aqua-pale);color:var(--slate-mid);
  display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.done-ic svg{width:28px;height:28px;}
.done .sub b{color:var(--slate-deep);}
.done-rows{text-align:left;margin:22px 0 4px;border-top:1px solid rgba(197,227,225,.3);}
.done-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.done-btns .btn{flex:1 1 200px;width:auto;display:block;text-align:center;margin-top:8px;}

@media(max-width:860px){
  .two{grid-template-columns:minmax(0,1fr);}
  .side{position:static;}
  h1{font-size:26px;}
  .wrap{padding:20px 16px 56px;}
}
@media(max-width:560px){
  .inv{grid-template-columns:minmax(0,1fr);}
  .done{padding:28px 20px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Оплачивать можно только покупаемые тарифы с ненулевой ценой: ML.plans()
   отсекает служебный «ГОСТЬ», условие по цене — бесплатный «СТАРТ». */
const PLANS = ML.plans().filter(t => t.price > 0).map(t => t.key);
const PERIODS = [
  { k:'month', l:'Месяц',      months:1,  total:t => t.price },
  { k:'half',  l:'6 месяцев',  months:6,  total:t => t.priceHalf },
  { k:'year',  l:'Год',        months:12, total:t => t.priceYear },
];

let PLAN = 'biz';
let PERIOD = 'month';
let RENEW = true;
/* Способ оплаты: картой или по счёту для юрлиц (R2 стр.15). Реквизиты держим
   между перерисовками; e-mail подставляем из аккаунта. */
let METHOD = 'card';
const INV = { org:'', inn:'', kpp:'', addr:'', email:(MH.getSession() || {}).email || '' };
let ISSUED = null;

(function init(){
  const p = new URLSearchParams(location.search);
  if (PLANS.includes(p.get('plan'))) PLAN = p.get('plan');
  else if (PLANS.includes(ML.tariff().key)) PLAN = ML.tariff().key;
  if (PERIODS.some(x => x.k === p.get('period'))) PERIOD = p.get('period');
})();

const periodOf = k => PERIODS.find(x => x.k === k);
const INV_FIELDS = [
  { k:'org',   l:'Название организации', ph:'ООО «Ромашка»', cls:'full' },
  { k:'inn',   l:'ИНН', ph:'10 или 12 цифр', mode:'numeric', max:12 },
  { k:'kpp',   l:'КПП', opt:true, ph:'9 цифр', mode:'numeric', max:9 },
  { k:'addr',  l:'Юридический адрес', ph:'Индекс, город, улица, дом', cls:'full' },
  { k:'email', l:'E-mail для счёта', ph:'buh@company.ru', type:'email', cls:'full' },
];
const discount = (t, p) => p.months === 1 ? 0 : Math.round((1 - p.total(t) / (t.price * p.months)) * 100);

function render(){
  if (ISSUED) return renderIssued();
  const t = ML.TARIFFS[PLAN];
  const p = periodOf(PERIOD);
  const total = p.total(t);
  const full = t.price * p.months;
  const off = discount(t, p);
  const cur = ML.tariff();

  const plans = PLANS.map(k => {
    const x = ML.TARIFFS[k];
    return `<label class="opt${PLAN===k?' on':''}">
      <input type="radio" name="plan" ${PLAN===k?'checked':''} onchange="setPlan('${k}')">
      <div class="opt-b">
        <div class="opt-t">${esc(x.name)}</div>
        <div class="opt-s">${k==='biz'
          ? `Все фильтры кроме фильтрации по схемам рассадки · ${x.compare} ${ML.plural(x.compare, ['объект', 'объекта', 'объектов'])} в сравнении · презентация с рекламным блоком · групповой запрос до ${x.groupRequest} объектов`
          : `Все фильтры · ${x.compare} ${ML.plural(x.compare, ['объект', 'объекта', 'объектов'])} в сравнении · презентация без рекламы · групповой запрос без ограничения · блэк-лист · баллы ×${x.bonusRate.toLocaleString('ru')}`}</div>
      </div>
      <div class="opt-p">${ML.money(x.price)}<small>в месяц</small></div>
    </label>`;
  }).join('');

  const periods = PERIODS.map(x => {
    const sum = x.total(t);
    const d = discount(t, x);
    return `<label class="opt${PERIOD===x.k?' on':''}">
      <input type="radio" name="period" ${PERIOD===x.k?'checked':''} onchange="setPeriod('${x.k}')">
      <div class="opt-b">
        <div class="opt-t">${esc(x.l)}${d ? `<span class="opt-off">−${d}%</span>` : ''}</div>
        <div class="opt-s">${x.months > 1
          ? `${ML.money(Math.round(sum / x.months))} в месяц при оплате за ${x.months === 6 ? 'полгода' : 'год'}`
          : 'оплата помесячно, можно отменить в любой момент'}</div>
      </div>
      <div class="opt-p">${ML.money(sum)}</div>
    </label>`;
  }).join('');

  const methods = [
    { k:'card',    t:'Картой', s:'Банковская карта — тариф включится сразу после оплаты.' },
    { k:'invoice', t:'По счёту для юрлиц', s:'Счёт и закрывающие документы формируются после подтверждения заказа, картой платить не нужно.' },
  ].map(x => `<label class="opt${METHOD===x.k?' on':''}">
      <input type="radio" name="method" ${METHOD===x.k?'checked':''} onchange="setMethod('${x.k}')">
      <div class="opt-b"><div class="opt-t">${x.t}</div><div class="opt-s">${x.s}</div></div>
    </label>`).join('');
  const invForm = METHOD !== 'invoice' ? '' : `<div class="inv">${INV_FIELDS.map(f => `
      <div class="${f.cls||''}">
        <label class="fl" for="inv-${f.k}">${f.l}${f.opt ? ' <small>— если есть</small>' : ''}</label>
        <input class="in" id="inv-${f.k}" type="${f.type||'text'}" ${f.mode?`inputmode="${f.mode}"`:''} ${f.max?`maxlength="${f.max}"`:''}
          placeholder="${esc(f.ph)}" value="${esc(INV[f.k])}" oninput="INV['${f.k}']=this.value">
      </div>`).join('')}</div>`;

  document.getElementById('root').innerHTML = `
  <div class="crumbs"><a href="pricing.html">Тарифы</a><span class="sep">→</span><span class="cur">Оплата</span></div>

  <h1>Оформление подписки</h1>
  <p class="sub">Подписка требуется пользователям, ищущим залы и намеревающимся сравнивать их между собой. Добавление объектов и залов в каталог — бесплатно.</p>
  <span class="cur-tar">Сейчас подключён тариф «${esc(cur.name)}»</span>

  <div class="two">
    <div>
      <div class="panel">
        <div class="lbl">Тариф</div>
        ${plans}
      </div>
      <div class="panel">
        <div class="lbl">Период оплаты</div>
        ${periods}
      </div>
      <div class="panel">
        <div class="lbl">Продление</div>
        <label class="check">
          <input type="checkbox" ${RENEW?'checked':''} onchange="setRenew(this.checked)">
          <span><b>Автопродление</b>
            <span class="check-s">Подписка продлится автоматически в конце периода.
            Отключить можно в кабинете в любой момент.</span></span>
        </label>
      </div>
      <div class="panel" id="pay-method">
        <div class="lbl">Способ оплаты</div>
        ${methods}
        ${invForm}
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="lbl">К оплате</div>
        <div class="total"><span class="total-k">Тариф</span><span class="total-v">${esc(t.name)}</span></div>
        <div class="total"><span class="total-k">Период</span><span class="total-v">${esc(p.l)}</span></div>
        <div class="total"><span class="total-k">Цена за месяц</span>
          <span class="total-v">${ML.money(Math.round(total / p.months))}</span></div>
        ${off ? `<div class="total"><span class="total-k">Скидка</span>
          <span class="total-v">−${off}% · <span class="old">${ML.money(full)}</span></span></div>` : ''}
        <div class="total"><span class="total-k">Автопродление</span>
          <span class="total-v">${RENEW ? 'включено' : 'выключено'}</span></div>
        <div class="total big"><span class="total-k">Итого</span>
          <span class="total-v" id="sum">${ML.money(total)}</span></div>

        ${METHOD === 'invoice'
          ? `<button class="btn" onclick="issueInvoice()">Выставить счёт</button>`
          : `<button class="btn" onclick="pay()">Оплатить ${ML.money(total)}</button>`}
        <a class="btn o" style="display:block;text-align:center" href="pricing.html">Вернуться к тарифам</a>

        <div class="note">Юридическим лицам доступна <b>оплата по счёту</b>: счёт и закрывающие
        документы формируются после подтверждения заказа, картой платить не нужно.</div>
      </div>
    </aside>
  </div>`;
}

function setPlan(k){ PLAN = k; render(); }
function setPeriod(k){ PERIOD = k; render(); }
function setRenew(v){ RENEW = v; render(); }
function setMethod(k){ METHOD = k; render(); if (k === 'invoice') document.getElementById('inv-org').focus(); }

/* Счёт для юрлица: проверяем реквизиты, выставляем счёт в модели. Тариф
   включится, когда счёт оплатят (в демо — «Счёт оплачен» в сервисной панели). */
function issueInvoice(){
  const errs = ML.invoiceErrors(INV);
  const ok = MH.requireFields(INV_FIELDS.map(f => {
    const e = errs.find(x => x.field === f.k);
    return { el: document.getElementById('inv-' + f.k), ok: !e, text: e ? e.text : '' };
  }));
  if (!ok) return;
  ISSUED = ML.createInvoice(Object.assign({ plan: PLAN, period: PERIOD }, INV));
  if (!ISSUED) { MH.toast('Не удалось выставить счёт — проверьте реквизиты', 'error'); return; }
  render();
  window.scrollTo(0, 0);
}

function renderIssued(){
  const i = ISSUED, t = ML.TARIFFS[i.plan];
  const row = (k, v) => `<div class="total"><span class="total-k">${k}</span><span class="total-v">${v}</span></div>`;
  document.getElementById('root').innerHTML = `
  <div class="crumbs"><a href="pricing.html">Тарифы</a><span class="sep">→</span><span class="cur">Оплата</span></div>
  <div class="panel done">
    <div class="done-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4h16v16H4z"/><path d="M4 8l8 5 8-5"/></svg></div>
    <h1>Счёт выставлен</h1>
    <p class="sub">Счёт отправлен на <b>${esc(i.email)}</b>. Тариф включится после поступления оплаты.</p>
    <div class="done-rows">
      ${row('Счёт', '№ ' + esc(i.no) + ' от ' + esc(i.date))}
      ${row('Плательщик', esc(i.org))}
      ${row('ИНН', esc(i.inn) + (i.kpp ? ' · КПП ' + esc(i.kpp) : ''))}
      ${row('Тариф', '«' + esc(t.name) + '», ' + esc(ML.BILL_PERIODS[i.period].l))}
      ${row('Сумма', ML.money(i.sum))}
    </div>
    <div class="done-btns">
      <a class="btn" href="dashboard.html?role=user&page=billing">Перейти в «Подписку»</a>
      <a class="btn o" href="pricing.html">Вернуться к тарифам</a>
    </div>
  </div>`;
}

/* Настоящего приёма платежей нет: меняем тариф в модели и показываем уведомление. */
function pay(){
  const t = ML.TARIFFS[PLAN];
  const p = periodOf(PERIOD);
  ML.setTariff(PLAN);
  MH.toast(`Тариф «${t.name}» подключён на ${p.l.toLowerCase()} · ${ML.money(p.total(t))}`, 'success');
  render();
}

render();
</script>
</body>
</html>
