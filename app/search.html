  const t = document.getElementById('filterToggle');
  const b = document.getElementById('fdBackdrop');
  const open = d.classList.toggle('open');

}

/* ══════════════════════════════════════════════
   РЕНДЕР
   ══════════════════════════════════════════════ */
let currentList = [];
let PAGE_IDS = new Set();       // объекты текущей страницы списка — подсвечены на карте

function goPage(n) {
  PAGE = n;
  render();
  const col = document.querySelector('.res-col');
  if (col) window.scrollTo({ top: col.getBoundingClientRect().top + window.scrollY - 140, behavior: 'smooth' });
}

function pagerHTML(total) {
  const pages = Math.ceil(total / PER_PAGE);
  if (pages <= 1) return '';
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - PAGE) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<nav class="pager" aria-label="Страницы выдачи">
    <button ${PAGE === 1 ? 'disabled' : ''} onclick="goPage(${PAGE - 1})" aria-label="Предыдущая страница">‹</button>
    ${nums.map(n => n === '…' ? '<span class="gap">…</span>'
      : `<button class="${n === PAGE ? 'on' : ''}" ${n === PAGE ? 'aria-current="page"' : ''} onclick="goPage(${n})">${n}</button>`).join('')}
    <button ${PAGE === pages ? 'disabled' : ''} onclick="goPage(${PAGE + 1})" aria-label="Следующая страница">›</button>
  </nav>
  <div class="pager-info">Объекты ${(PAGE - 1) * PER_PAGE + 1}–${Math.min(PAGE * PER_PAGE, total)} из ${total}</div>`;
}

/* Вместимость живёт и в URL — ссылкой на подбор можно поделиться. */
function syncUrl() {
  const q = new URLSearchParams(location.search);
  ['people', 'peopleTo', 'guests', 'view', 'city'].forEach(k => q.delete(k));
  /* город и тип из ссылки с главной: после сброса они не должны вернуться при перезагрузке */
  if (F.city) q.set('city', F.city);
  if (!F.eventType) q.delete('type');
  if (F.people) q.set('people', F.people);
  if (F.peopleTo) q.set('peopleTo', F.peopleTo);
  const s = q.toString();
  history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
}

function render() {
  ML.pruneFilters(F);                    // скрытые зависимые фильтры не сужают выдачу
  ML.saveFilters(F);                     // любое изменение проходит через render()
  syncUrl();
  const start = !hasFilters();
  const list = sortList(ML.filterVenues(F));
  currentList = list;
  // новая выборка или сортировка — снова первая страница
  const sig = JSON.stringify([ML.state.filters, SORT, list.length]) + JSON.stringify(F, (k, v) => v instanceof Set ? [...v] : v);
  if (sig !== PAGE_SIG) { PAGE_SIG = sig; PAGE = 1; }
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (PAGE > pages) PAGE = pages;
  const pageList = list.slice((PAGE - 1) * PER_PAGE, PAGE * PER_PAGE);
  PAGE_IDS = start ? new Set() : new Set(pageList.map(x => x.venue.id));
  applyView();

  const halls = list.reduce((a, x) => a + x.halls.length, 0);
  document.getElementById('resCount').innerHTML = list.length
    ? `Найдено <b>${halls}</b> ${ML.plural(halls, ['зал', 'зала', 'залов'])} в <b>${list.length}</b> ${ML.plural(list.length, ['объекте', 'объектах', 'объектах'])}`
    : 'Ничего не найдено';

  /* Одна полоса на всю выдачу, а не кнопка в каждой карточке. */
  document.getElementById('vList').innerHTML = list.length
    ? MH.lockBar('Цены и вместимость залов открыты зарегистрированным пользователям.') + pageList.map(venueBlock).join('')
    : `<div class="res-empty">
         <h3>Под эти условия залов нет</h3>
         <p>Снимите часть фильтров — сейчас условия слишком узкие.</p>
         <button onclick="resetAll()">Сбросить фильтры</button>
       </div>`;

  document.getElementById('pager').innerHTML = start ? '' : pagerHTML(list.length);
  renderChips();
  renderMap(list);
  applyFacets();

  // панель сравнения
  const n = ML.state.compare.size;
  const bar = document.getElementById('cmpBar');
  bar.classList.toggle('show', n > 0);
  document.getElementById('cmpCount').textContent = n;
  document.getElementById('cmpWord').textContent = ML.plural(n, ['зал', 'зала', 'залов']);
  /* стр.98: сравнивать можно от двух залов */
  const go = document.getElementById('cmpGo'), gw = document.getElementById('cmpGoWrap');
  go.disabled = n < 2; gw.dataset.tip = n < 2 ? 'Добавьте ещё хотя бы один зал' : '';
  gw.classList.toggle('tip', n < 2);
  syncRails();
  document.getElementById('resClear').hidden = n === 0;
}

/* Значения в верхней панели — из справочников ML. */
function syncBar() {
  document.getElementById('cbCity').value = F.city || '';
  const ev = document.getElementById('cbEvent');
  ev.innerHTML = `<option value=""${F.eventType ? '' : ' selected'}>Любой тип</option>` + ML.EVENT_TYPES.map(e =>
    `<option value="${e.k}"${F.eventType === e.k ? ' selected' : ''}>${esc(e.l)}</option>`).join('')
    + `<option value="combined"${F.eventType === 'combined' ? ' selected' : ''}>${esc(ML.EVENT_COMBINED.l)}</option>`;
  document.getElementById('cbPeople').value = F.people || '';
  document.getElementById('resSort').value = SORT;
}

/* ══════════════════════════════════════════════
   п.17: ГОРОД — поле с автоподсказкой по первым буквам
   Стрелки двигают выделение, Enter выбирает, Esc закрывает.
   ══════════════════════════════════════════════ */
let CITY_ITEMS = [], CITY_PICK = -1;
function cityMatches(q) {
  const n = String(q || '').trim().toLowerCase();
  return ML.CITIES.filter(c => !n || c.toLowerCase().startsWith(n) || c.toLowerCase().split(/[\s-]+/).some(w => w.startsWith(n)));
}
/* стр.80: первой строкой всегда «Любой город» (пустое значение) — снять город можно в любой момент. */
/* R3-A: первая строка подсказок — «Все города» (комментарий клиента в файле фильтров); плейсхолдер поля — «Любой город». */
const ANY_CITY = ML.ALL_CITIES;
const isAnyCity = (v) => ['все города', 'любой город'].includes(String(v || '').trim().toLowerCase());
function cityDraw() {
  const inp = document.getElementById('cbCity'), ul = document.getElementById('cbCityList');
  const q = isAnyCity(inp.value) ? '' : inp.value;
  CITY_ITEMS = [''].concat(cityMatches(q));
  if (CITY_PICK >= CITY_ITEMS.length) CITY_PICK = CITY_ITEMS.length - 1;
  ul.innerHTML = CITY_ITEMS.map((c, i) => `<li role="option" id="cbc-${i}" class="${i === CITY_PICK ? 'on' : ''}" aria-selected="${i === CITY_PICK}"
        onmousedown="event.preventDefault();cityPick(${i})"><span>${c ? esc(c) : ANY_CITY}</span>
        <span class="n">${c ? ML.VENUES.filter(v => v.city === c).length + ' ' + ML.plural(ML.VENUES.filter(v => v.city === c).length, ['объект', 'объекта', 'объектов'])
          : ML.VENUES.length + ' ' + ML.plural(ML.VENUES.length, ['объект', 'объекта', 'объектов'])}</span></li>`).join('')
    + (CITY_ITEMS.length === 1 && q.trim() ? '<li class="none">Такого города в базе нет</li>' : '');
  ul.hidden = false;
  inp.setAttribute('aria-expanded', 'true');
  inp.setAttribute('aria-activedescendant', CITY_PICK >= 0 ? 'cbc-' + CITY_PICK : '');
}
function cityClose() {
  const ul = document.getElementById('cbCityList');
  ul.hidden = true; CITY_PICK = -1;
  document.getElementById('cbCity').setAttribute('aria-expanded', 'false');
}
function cityPick(i) {
  const c = CITY_ITEMS[i]; if (c === undefined) return;
  document.getElementById('cbCity').value = c;
  cityClose();
  if (F.city !== c) { F.city = c; render(); }
}
function cityCommit() {
  const inp = document.getElementById('cbCity');
  const v = inp.value.trim();
  if (!v || isAnyCity(v)) { inp.value = ''; if (F.city) { F.city = ''; render(); } return; }
  const exact = ML.CITIES.find(c => c.toLowerCase() === v.toLowerCase());
  const only = cityMatches(v);
  const c = exact || (only.length === 1 ? only[0] : null);
  if (c) { inp.value = c; if (F.city !== c) { F.city = c; render(); } }
  else inp.value = F.city || '';
}
(function bindCity() {
  const inp = document.getElementById('cbCity');
  inp.addEventListener('focus', () => { CITY_PICK = -1; cityDraw(); });
  inp.addEventListener('input', () => { CITY_PICK = 0; cityDraw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (document.getElementById('cbCityList').hidden) cityDraw(); CITY_PICK = Math.min(CITY_ITEMS.length - 1, CITY_PICK + 1); cityDraw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); CITY_PICK = Math.max(0, CITY_PICK - 1); cityDraw(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (CITY_PICK >= 0 && CITY_ITEMS[CITY_PICK] !== undefined) cityPick(CITY_PICK); else { cityCommit(); cityClose(); } }
    else if (e.key === 'Escape') { cityClose(); inp.value = F.city || ''; }
  });
  inp.addEventListener('blur', () => { cityCommit(); cityClose(); });
})();

/* п.31: возврат «Назад» из bfcache — shared.js перечитал состояние модели
   (сравнение могли сбросить на другой странице), здесь перерисовываем выдачу. */
function RESTORE() { F = ML.loadFilters(); syncBar(); renderFilters(); render(); }

/* Параметры из URL: ?city= и ?people= приходят с главной. */
(function init() {
  const p = new URLSearchParams(location.search);
  const city = p.get('city');
  if (city && ML.CITIES.includes(city)) F.city = city;
  const people = parseInt(p.get('people') || p.get('guests'), 10);
  if (people > 0) F.people = people;
  const peopleTo = parseInt(p.get('peopleTo'), 10);
  if (peopleTo > 0) F.peopleTo = peopleTo;
  const ev = p.get('type');
  if (ev) F.eventType = ML.normEventType(ev);   // старые ключи ссылок (business, wedding) переводятся

  ML.VENUE_FILTER_GROUPS.forEach(g => { if (groupFilled(g.k)) OPEN.add(g.k); });
  applyView();
  syncBar();
  renderFilters();
  render();
})();
</script>
