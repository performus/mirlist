<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Подбор площадок и залов для деловых мероприятий, банкетов, свадеб и тимбилдинга.">
<meta property="og:title" content="МАЙСЛИСТ — подбор площадок">
<meta property="og:description" content="Подбор площадок и залов для деловых мероприятий, банкетов, свадеб и тимбилдинга.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Подбор площадок — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root {
  /* Coral */
  --coral: #E98667;
  --coral-hover: #D97757;
  --coral-soft: #F6DDD3;
  --coral-glow: rgba(233,134,103,.18);
  /* Aqua */
  --aqua-1: #D9ECEB;
  --aqua-2: #C5E3E1;
  --aqua-3: #A8D4D8;
  --aqua-pale: #EDF6F5;
  /* Slate */
  --slate: #46627A;
  --slate-mid: #3E596F;
  --slate-deep: #354E63;
  --slate-muted: #7A919F;
  --slate-pale: #B4C3CC;
  /* Warm */
  --peach: #F6E6DE;
  --bg: #F8F5F2;
  --white: #FFFFFF;
  /* Shadows & Radii */
  --sh-sm: 0 1px 4px rgba(53,78,99,.05);
  --sh-md: 0 4px 20px rgba(53,78,99,.07);
  --sh-lg: 0 8px 40px rgba(53,78,99,.09);
  --sh-coral: 0 4px 18px rgba(233,134,103,.22);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-full: 50px;
  /* высота фикс-шапки + панели запроса — для sticky-колонок */
  --top-nav: 64px;
  --top-bar: 62px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Onest', system-ui, sans-serif;
  background: var(--bg);
  color: var(--slate);
  -webkit-font-smoothing: antialiased;
}
a { text-decoration:none; color:inherit; }
button { font-family:inherit; cursor:pointer; }
h1,h2,h3 { font-weight:700; }

/* Конец анимации — transform:none: иначе обёртка остаётся отдельным слоем, и выдвижная
   панель фильтров (position:fixed внутри неё) уходит под затемнение и шапку. */
@keyframes pageIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.page-wrap { animation: pageIn .5s ease backwards; }   /* backwards: после анимации transform не остаётся */

/* ══════════════════════════════════════════════
   CONTROL BAR — параметры запроса
   ══════════════════════════════════════════════ */
.control-bar {
  position:sticky; top:var(--top-nav); z-index:40;
  display:flex; align-items:flex-end; gap:12px;
  padding:11px 28px;
  background:var(--white);
  border-bottom:1px solid rgba(197,227,225,.35);
  flex-wrap:wrap;
}
.cb-field { display:flex; flex-direction:column; gap:3px; }
.cb-field label {
  font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.07em; color:var(--slate-muted);
}
.cb-field input, .cb-field select {
  padding:8px 14px; border-radius:var(--r-full);
  font-family:inherit; font-size:13px; font-weight:500;
  border:1.5px solid rgba(197,227,225,.55);
  background:var(--white); color:var(--slate);
  outline:none; transition:border-color .2s, background .2s;
  min-width:150px;
}
.cb-field input:focus, .cb-field select:focus { border-color:var(--coral); }
.cb-field input:hover, .cb-field select:hover { border-color:var(--aqua-3); }

.filter-toggle {
  display:none; align-items:center; gap:7px;
  padding:9px 20px; border-radius:var(--r-full);
  font-size:13.5px; font-weight:600;
  border:1.5px solid var(--slate-pale);
  background:var(--white); color:var(--slate);
  transition:all .2s;
}
.filter-toggle:hover { border-color:var(--coral); color:var(--coral); }
.filter-toggle.open { background:var(--slate-deep); color:#fff; border-color:var(--slate-deep); }
.filter-toggle .ft-count {
  min-width:20px; height:20px; padding:0 6px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.cb-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
/* п.17: город — поле с автоподсказкой */
.cb-city { position:relative; }
.cb-ac {
  position:absolute; top:100%; left:0; min-width:100%; z-index:60; margin-top:6px; padding:4px;
  list-style:none; background:var(--white); border:1px solid rgba(197,227,225,.6);
  border-radius:var(--r-md); box-shadow:var(--sh-lg); max-height:260px; overflow-y:auto;
}
.cb-ac[hidden] { display:none; }
.cb-ac li {
  display:flex; justify-content:space-between; gap:12px; padding:8px 12px; border-radius:var(--r-sm);
  font-size:13px; color:var(--slate-deep); cursor:pointer; white-space:nowrap;
}
.cb-ac li .n { font-size:11.5px; color:var(--slate-muted); }
.cb-ac li.on, .cb-ac li:hover { background:var(--aqua-pale); }
.cb-ac li.none { color:var(--slate-muted); cursor:default; background:none; }
.cb-tariff {
  display:flex; align-items:center; gap:6px;
  font-size:12px; color:var(--slate-muted);
}
.cb-tariff b { color:var(--slate-deep); font-weight:700; }

/* ══════════════════════════════════════════════
   THREE-COLUMN GRID
   ══════════════════════════════════════════════ */
.grid3 {
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 340px;
  gap:18px; align-items:start;
  padding:20px 28px 48px;
  max-width:1760px; margin:0 auto;
}
.grid3 > * { min-width:0; }

/* ══════ переключатель вида ══════ */
/* ══════ конструктор требований к залам ══════ */
.hq {
  border:1.5px solid rgba(197,227,225,.5); border-radius:var(--r-md);
  padding:12px 13px; margin-bottom:10px; background:var(--white);
}
.hq-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.hq-n {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:var(--coral);
}
.hq-x {
  width:22px; height:22px; border:none; background:none; border-radius:6px;
  color:var(--slate-pale); display:flex; align-items:center; justify-content:center;
  transition:color .18s, background .18s;
}
.hq-x:hover { color:var(--coral); background:var(--coral-soft); }
.hq-f { display:block; margin-bottom:9px; }
.hq-f:last-of-type { margin-bottom:0; }
.hq-f > span {
  display:block; font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--slate-muted); margin-bottom:4px;
}
.hq-f select, .hq-f input {
  width:100%; padding:8px 11px; border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.55); background:var(--bg);
  font-family:inherit; font-size:13px; color:var(--slate-deep); outline:none;
}
.hq-f select:focus, .hq-f input:focus { border-color:var(--coral); background:var(--white); }
.hq-f select:disabled { opacity:.55; cursor:not-allowed; }
.hq-ic {
  display:flex; align-items:center; gap:6px; margin-top:9px;
  font-size:11.5px; color:var(--slate-muted);
}
.hq-empty { font-size:12px; color:var(--slate-pale); margin-bottom:10px; }
.hq-add {
  display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  padding:9px; border-radius:var(--r-sm);
  border:1.5px dashed var(--slate-pale); background:none; color:var(--slate-mid);
  font-family:inherit; font-size:12.5px; font-weight:600; transition:all .2s;
}
.hq-add:hover { border-color:var(--coral); color:var(--coral); background:var(--coral-soft); }
.hq-note { font-size:11.5px; line-height:1.55; color:var(--slate-muted); margin-top:10px; }
.hq-note b { color:var(--slate-deep); }
/* R3-D: оснащение конкретного зала — чипы и раскрывающийся список в блоке «Зал N» */
.hq-eq { margin-top:10px; }
.hq-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.hq-chip {
  display:inline-flex; align-items:center; gap:4px; padding:4px 6px 4px 10px; border-radius:999px;
  background:var(--coral-soft); color:var(--slate-deep); font-size:12px; font-weight:500; line-height:1.3;
}
.hq-chip button {
  width:18px; height:18px; border:none; border-radius:50%; background:none; color:var(--slate-muted);
  display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1;
}
.hq-chip button:hover { background:#fff; color:var(--coral); }
.hq-eqbtn {
  border:none; background:none; padding:2px 0; font-family:inherit; font-size:12.5px; font-weight:600;
  color:var(--coral); cursor:pointer;
}
.hq-eqbtn:hover { text-decoration:underline; text-underline-offset:3px; }
.hq-eqbtn[aria-expanded="true"] { color:var(--slate-mid); }
.hq-eqlist { margin-top:8px; padding:8px 10px; border-radius:var(--r-sm); background:var(--bg); }
.hq-eqlist .fd-check { padding:5px 0; }
.hq-eqlock { margin-top:6px; }
.hq-eqlock .fd-lock { margin-top:0; padding-top:0; border-top:none; }
/* общие свойства зала при блоках «Зал N» неактивны */
.fd-hallnote {
  margin:4px 0 6px; padding:9px 11px; border-radius:var(--r-sm); background:var(--aqua-pale);
  font-size:11.5px; line-height:1.5; color:var(--slate-mid);
}


.view-sw {
  display:inline-flex; gap:2px; padding:2px;
  background:var(--aqua-pale); border-radius:var(--r-full);
}
.view-sw button {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 13px; border:none; border-radius:var(--r-full);
  background:none; color:var(--slate-muted);
  font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
  transition:background .18s, color .18s;
}
.view-sw button:hover { color:var(--slate-deep); }
.view-sw button.on { background:var(--coral); color:#fff; }

/* Режим карты: список уходит, карта занимает всю колонку контента.
   Фильтры слева остаются — они и в этом режиме работают. */
.grid3.map-mode { grid-template-columns:300px minmax(0,1fr); }
.grid3.map-mode .res-col { display:none; }
.grid3.map-mode .map-col { display:flex; flex-direction:column; }
.grid3.map-mode .map-canvas {
  height:calc(100vh - var(--top-nav) - var(--top-bar) - 96px);
  min-height:460px;
}

/* Карточка объекта поверх карты — открывается по клику на пин. */
.map-card {
  position:absolute; left:16px; bottom:16px; z-index:40;
  width:min(300px, calc(100% - 32px));
  background:var(--white); border-radius:var(--r-lg);
  box-shadow:0 10px 40px rgba(53,78,99,.22); overflow:hidden;
}
.map-card[hidden] { display:none; }
.map-card-img { height:112px; background:var(--aqua-pale); }
.map-card-img img { width:100%; height:100%; object-fit:cover; }
.map-card-b { padding:13px 15px 15px; }
.map-card-t { font-size:15px; font-weight:700; color:var(--slate-deep); line-height:1.3; }
.map-card-s { font-size:12.5px; color:var(--slate-muted); margin:5px 0 11px; }
.map-card-go {
  display:block; text-align:center; padding:9px 14px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; font-size:13px; font-weight:600;
}
.map-card-x {
  position:absolute; top:9px; right:9px; width:26px; height:26px; border-radius:50%;
  border:none; background:rgba(255,255,255,.92); color:var(--slate-mid);
  display:flex; align-items:center; justify-content:center; font-size:13px;
  box-shadow:0 2px 10px rgba(53,78,99,.18);
}

/* ══════════════════════════════════════════════
   FILTER PANEL
   ══════════════════════════════════════════════ */
.fd-panel {
  position:sticky; top:calc(var(--top-nav) + var(--top-bar));
  background:var(--white);
  border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.fd-head {
  display:flex; align-items:center; gap:10px;
  padding:14px 18px;
  border-bottom:1px solid rgba(197,227,225,.3);
}
.fd-title { font-family:'Literata',Georgia,serif;font-weight:600; font-size:19px; color:var(--slate-deep); flex:1; }
.fd-reset {
  border:none; background:none; padding:0;
  font-size:12.5px; font-weight:600; color:var(--slate-muted);
  transition:color .2s;
}
.fd-reset:hover { color:var(--coral); }
.fd-close {
  display:none;
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--slate-pale); background:var(--white);
  align-items:center; justify-content:center;
  color:var(--slate-muted); transition:all .2s; flex-shrink:0;
}
.fd-close:hover { border-color:var(--coral); color:var(--coral); }
.fd-body {
  max-height:calc(100vh - var(--top-nav) - var(--top-bar) - 120px);
  overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:var(--slate-pale) transparent;
}
.fd-body::-webkit-scrollbar { width:6px; }
.fd-body::-webkit-scrollbar-thumb { background:var(--aqua-2); border-radius:3px; }

/* группа-аккордеон */
.fd-group { border-bottom:1px solid rgba(197,227,225,.28); }
.fd-group:last-child { border-bottom:none; }
.fd-group > summary {
  list-style:none; cursor:pointer;
  padding:13px 18px;
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:600; color:var(--slate-deep);
  transition:background .15s;
}
.fd-group > summary::-webkit-details-marker { display:none; }
.fd-group > summary:hover { background:var(--aqua-pale); }
.fd-gcount {
  min-width:18px; height:18px; padding:0 6px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.fd-chev { margin-left:auto; color:var(--slate-pale); font-size:10px; transition:transform .2s; }
.fd-group[open] .fd-chev { transform:rotate(90deg); }
/* п.24: счётчик заполненных значений — только у свёрнутой секции */
.fd-group[open] > summary .fd-gcount { display:none; }
.fd-gbody { padding:2px 18px 16px; }

/* чекбокс с фасетным счётчиком */
.fd-check {
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:var(--slate-mid);
  padding:6px 0; cursor:pointer;
  transition:opacity .2s;
}
.fd-check input { display:none; }
.fd-box {
  width:18px; height:18px; border-radius:5px;
  border:1.5px solid var(--slate-pale);
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
.fd-check input:checked ~ .fd-box { background:var(--coral); border-color:var(--coral); }
.fd-check input:checked ~ .fd-box svg { opacity:1; }
.fd-box svg { opacity:0; transition:opacity .15s; }
.fd-lbl { flex:1; }
.fd-cnt { font-size:11.5px; color:var(--slate-pale); font-weight:600; flex:none; }
.fd-check.off { opacity:.38; cursor:not-allowed; }
.fd-check:not(.off):hover .fd-lbl { color:var(--slate-deep); }

/* числовые поля и слайдеры */
.fd-row2 { display:flex; gap:10px; }
.fd-row2 > * { flex:1 1 0; min-width:0; }
.fd-mini label { white-space:nowrap; }
.fd-mini { flex:1; }
.fd-mini label { display:block; font-size:11.5px; color:var(--slate-muted); margin-bottom:4px; }
.fd-mini input {
  width:100%; padding:8px 12px; border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.55); background:var(--white);
  font-family:inherit; font-size:13px; color:var(--slate); outline:none;
  transition:border-color .2s;
}
.fd-mini input:focus { border-color:var(--coral); }
.fd-mini input:disabled { background:var(--bg); color:var(--slate-pale); cursor:not-allowed; }

.fd-seatrow {
  display:flex; align-items:center; justify-content:space-between;
  font-size:13px; color:var(--slate-mid); padding-top:9px;
}
.fd-seatrow .v { font-weight:700; color:var(--slate-deep); }
.fd-range input[type=range] {
  width:100%; -webkit-appearance:none; height:4px; margin-top:5px;
  border-radius:2px; background:var(--aqua-2); outline:none;
}
.fd-range input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px;
  border-radius:50%; background:var(--aqua-3); cursor:pointer;
  border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(168,212,216,.45);
  transition:transform .15s, box-shadow .15s;
}
.fd-range input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); box-shadow:0 2px 14px rgba(168,212,216,.6); }
.fd-range input[type=range]::-moz-range-thumb {
  width:16px; height:16px; border-radius:50%;
  background:var(--aqua-3); cursor:pointer;
  border:2.5px solid #fff; box-shadow:0 2px 8px rgba(168,212,216,.45);
}
.fd-range input[type=range]:disabled { opacity:.4; }

/* двойной слайдер цены */
.fd-dual .fd-vals {
  display:flex; justify-content:space-between;
  font-size:12.5px; font-weight:700; color:var(--slate-deep);
  margin-bottom:2px;
}
.fd-dual .fd-track { position:relative; height:26px; }
.fd-dual .fd-rail { position:absolute; top:11px; left:0; right:0; height:4px; background:var(--aqua-2); border-radius:2px; }
.fd-dual .fd-fill { position:absolute; top:11px; height:4px; background:var(--coral); border-radius:2px; }
.fd-dual input[type=range] {
  position:absolute; top:0; left:0; width:100%; margin:0;
  -webkit-appearance:none; appearance:none;
  background:none; pointer-events:none; height:26px;
}
.fd-dual input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; pointer-events:auto;
  width:16px; height:16px; border-radius:50%;
  background:#fff; border:2.5px solid var(--coral); cursor:pointer;
  box-shadow:var(--sh-sm);
}
.fd-dual input[type=range]::-moz-range-thumb {
  pointer-events:auto; width:16px; height:16px; border-radius:50%;
  background:#fff; border:2.5px solid var(--coral); cursor:pointer;
}

/* R3-A: контролы по конфигу фильтров */
.fd-rgt { font-size:12px; font-weight:600; color:var(--slate-deep); margin:10px 0 6px; }
.fd-rgt:first-child { margin-top:4px; }
.fd-rgt span { font-weight:500; color:var(--slate-muted); }
.fd-num { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; font-size:13px; color:var(--slate-mid); }
.fd-num label { flex:1; min-width:0; }
.fd-numin { display:inline-flex; align-items:center; gap:6px; flex:none; font-size:12px; color:var(--slate-muted); }
.fd-numin input, .fd-rgin input {
  width:84px; padding:7px 10px; border-radius:var(--r-sm); border:1.5px solid rgba(197,227,225,.55);
  background:var(--bg); font-family:inherit; font-size:13px; color:var(--slate); outline:none; text-align:right; transition:border-color .2s;
}
.fd-numin input:focus, .fd-rgin input:focus { border-color:var(--coral); background:var(--white); }
.fd-numin input:disabled, .fd-rgin input:disabled { color:var(--slate-pale); cursor:not-allowed; }
.fd-rgin { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
.fd-rgin label { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--slate-muted); flex:1; min-width:0; }
.fd-rgin label input { width:100%; min-width:0; }
.fd-rgu { font-size:12px; color:var(--slate-muted); }
.fd-rg + .fd-rg, .fd-mode + .fd-rg { margin-top:6px; }
.fd-seg { display:flex; gap:4px; padding:3px; background:var(--bg); border-radius:var(--r-full); margin:4px 0 8px; }
.fd-seg button { flex:1; border:none; background:none; padding:7px 8px; border-radius:var(--r-full); font-size:12.5px; font-weight:600; color:var(--slate-muted); transition:all .2s; }
.fd-seg button.on { background:var(--white); color:var(--coral); box-shadow:var(--sh-sm); }
.fd-seg button:disabled { cursor:not-allowed; opacity:.6; }
.fd-adv { margin-top:8px; border-top:1px dashed rgba(197,227,225,.6); }
.fd-adv > summary { list-style:none; cursor:pointer; padding:10px 0 4px; font-size:12.5px; font-weight:600; color:var(--slate-mid); display:flex; align-items:center; gap:6px; }
.fd-adv > summary::-webkit-details-marker { display:none; }
.fd-adv > summary::after { content:'▶'; font-size:9px; color:var(--slate-pale); transition:transform .2s; }
.fd-adv[open] > summary::after { transform:rotate(90deg); }
.fd-search { width:100%; padding:7px 12px; margin:4px 0 6px; border-radius:var(--r-full); border:1.5px solid rgba(197,227,225,.55);
  font-family:inherit; font-size:12.5px; color:var(--slate); outline:none; background:var(--white); }
.fd-search:focus { border-color:var(--coral); }
.fd-multi { max-height:220px; overflow-y:auto; scrollbar-width:thin; }
.fd-info { position:relative; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:6px;
  border-radius:50%; border:1.5px solid var(--slate-pale); color:var(--slate-muted); font-size:10px; font-weight:700; font-style:italic; vertical-align:-2px; cursor:help; outline:none; }
.fd-info:hover, .fd-info:focus { border-color:var(--coral); color:var(--coral); }
.fd-tip { position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:230px; padding:10px 12px; border-radius:var(--r-sm);
  background:var(--slate-deep); color:#fff; font-size:11.5px; font-weight:500; font-style:normal; line-height:1.5; text-align:left;
  box-shadow:var(--sh-md); opacity:0; visibility:hidden; transition:opacity .15s; z-index:20; pointer-events:none; }
.fd-info:hover .fd-tip, .fd-info:focus .fd-tip { opacity:1; visibility:visible; }
.fd-sel { display:block; font-size:12px; color:var(--slate-muted); padding:4px 0 8px; }
.fd-sel span { display:block; margin-bottom:4px; font-weight:600; color:var(--slate-deep); }
.fd-sel select { width:100%; padding:8px 12px; border-radius:var(--r-sm); border:1.5px solid rgba(197,227,225,.55); background:var(--white);
  font-family:inherit; font-size:13px; color:var(--slate); outline:none; }
.fd-reset:disabled { color:var(--slate-pale); cursor:not-allowed; }
.fd-reset:disabled:hover { color:var(--slate-pale); }

/* подсказка о тарифе */
.fd-lock {
  margin-top:10px; padding-top:9px;
  border-top:1px dashed rgba(197,227,225,.6);
  font-size:11.5px; line-height:1.5; color:var(--slate-muted);
}
.fd-lock b { color:var(--slate-deep); font-weight:600; }
/* п.6: закрытая группа целиком ведёт на пейвол */
.fd-paywall { position:relative; cursor:pointer; }
.fd-paywall::after { content:''; position:absolute; inset:0; z-index:2; }
.fd-paywall .fd-lock { color:var(--coral); }
.fd-paywall:hover .fd-lock { text-decoration:underline; text-underline-offset:3px; }
.fd-mini.locked input { background:var(--bg); }
.fd-note {
  margin:14px 18px 16px; padding:12px 14px;
  background:var(--aqua-pale); border-radius:var(--r-sm);
  font-size:11.5px; line-height:1.55; color:var(--slate-mid);
}
.fd-note .fd-up {
  display:inline-block; margin-top:8px;
  padding:7px 16px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; border:none;
  font-size:12px; font-weight:600;
  box-shadow:var(--sh-coral); transition:background .2s;
}
.fd-note .fd-up:hover { background:var(--coral-hover); }

/* ══════════════════════════════════════════════
   RESULTS COLUMN
   ══════════════════════════════════════════════ */
.res-head {
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; flex-wrap:wrap; margin-bottom:12px;
}
.res-count { font-family:'Literata',Georgia,serif;font-weight:600; font-size:22px; color:var(--slate-deep); }
.res-count b { font-weight:400; color:var(--coral); }
.res-tools { display:flex; align-items:center; gap:8px; }
.res-sort {
  padding:8px 14px; border-radius:var(--r-full);
  font-family:inherit; font-size:12.5px; font-weight:500;
  background:var(--white); color:var(--slate);
  border:1.5px solid rgba(197,227,225,.5);
  outline:none; transition:border-color .2s;
}
.res-sort:hover { border-color:var(--aqua-3); }
.res-clear {
  padding:8px 14px; border-radius:var(--r-full);
  font-size:12.5px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate);
  border:none; transition:all .2s;
}
.res-clear:hover { background:var(--aqua-1); color:var(--slate-deep); }

/* чипы выбранных фильтров */
.f-chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
.f-chip {
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 8px 6px 14px; border-radius:var(--r-full);
  font-size:12.5px; font-weight:500;
  background:var(--coral-soft); color:var(--coral);
  border:1.5px solid transparent;
}
.f-chip.black { background:var(--aqua-pale); color:var(--slate-mid); }
.f-chip button {
  width:18px; height:18px; border-radius:50%;
  border:none; background:rgba(255,255,255,.75);
  color:inherit; font-size:11px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.f-chip button:hover { background:#fff; }

/* ── блок объекта ── */
.vlist { display:flex; flex-direction:column; gap:10px; }
.vb {
  background:var(--white);
  border:1px solid rgba(197,227,225,.28);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  padding:11px 16px 5px;
  transition:border-color .25s, box-shadow .25s;
}
.vb.hi { border-color:var(--coral); box-shadow:0 0 0 2px var(--coral-glow), var(--sh-lg); }
/* п.25: реклама в выдаче */
/* ярлык «Реклама» в правом верхнем углу — кнопку «скрыть» сдвигаем левее */
.vb.has-ad .vb-head { padding-right:74px; }
/* п.22: пагинация */
.pager { display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; margin-top:20px; }
.pager button {
  min-width:38px; height:38px; padding:0 12px; border-radius:var(--r-full);
  border:1.5px solid rgba(197,227,225,.6); background:var(--white);
  font-size:13px; font-weight:600; color:var(--slate-mid);
}
.pager button:hover:not(:disabled) { border-color:var(--coral); color:var(--coral); }
.pager button.on { background:var(--coral); border-color:var(--coral); color:#fff; }
.pager button:disabled { opacity:.4; cursor:default; }
.pager .gap { padding:0 4px; color:var(--slate-pale); }
.pager-info { text-align:center; font-size:12px; color:var(--slate-muted); margin-top:8px; }
/* п.16: стартовое состояние — карта всех объектов */
.map-hint {
  position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:30;
  width:min(440px, calc(100% - 32px));
  background:rgba(255,255,255,.96); border-radius:var(--r-lg); box-shadow:0 10px 36px rgba(53,78,99,.18);
  padding:14px 18px; text-align:center; font-size:13px; line-height:1.55; color:var(--slate-mid);
}
.map-hint b { display:block; font-size:14.5px; color:var(--slate-deep); margin-bottom:3px; }
.map-hint[hidden] { display:none; }
.vb-head {
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin-bottom:4px;
}
.vb-name {
  font-size:16px; font-weight:700; color:var(--slate-deep);
  letter-spacing:-.2px; transition:color .2s;
}
.vb-name:hover { color:var(--coral); }
.vb-meta {
  display:flex; gap:14px; flex-wrap:wrap; margin-top:2px;
  font-size:12.5px; color:var(--slate-muted);
}
.vb-meta b { color:var(--slate-deep); font-weight:700; }
.vb-stars { color:#F0B95A; letter-spacing:1px; }
.fd-stars { color:#F0B95A; letter-spacing:2px; font-size:14px; }
.vb-rating { display:inline-flex; align-items:center; gap:4px; }
.vb-rating svg { color:#F0B95A; }
.vb-black {
  width:34px; height:34px; flex-shrink:0; padding:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--white); color:var(--slate-pale);
  border:1.5px solid rgba(197,227,225,.55);
  transition:all .2s;
}
.vb-black:hover { border-color:var(--coral); color:var(--coral); }

/* Метка бонусной программы: выгода пользователя, поэтому акцентом. */
.vb-loyal {
  display:inline-block; margin-left:10px; vertical-align:2px;
  padding:2px 10px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
}

/* Какие залы закрыли требования конструктора. */
.vb-match {
  margin:-4px 0 10px; font-size:12px; color:var(--slate-muted);
}
.vb-match b { color:var(--slate-deep); }

/* ── лента залов ── */
.rail-wrap { position:relative; }
.rail {
  display:flex; gap:12px; overflow-x:auto;
  scroll-snap-type:x proximity;
  padding:4px 2px 5px;
  scrollbar-width:thin; scrollbar-color:var(--aqua-2) transparent;
}
.rail::-webkit-scrollbar { height:6px; }
.rail::-webkit-scrollbar-thumb { background:var(--aqua-2); border-radius:3px; }
.rail-btn {
  position:absolute; top:38%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
  border:1.5px solid rgba(197,227,225,.6);
  color:var(--slate); font-size:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-md); transition:all .2s; z-index:2;
}
.rail-btn:hover { background:#fff; color:var(--coral); border-color:var(--coral); }
.rail-btn[hidden] { display:none; }
.rail-btn.p { left:-10px; }
.rail-btn.n { right:-10px; }

/* ── карточка зала ── */
/* стр.46/88: компактная горизонтальная плитка — на 1440×900 видно не меньше трёх объектов;
   стр.104: плитки в ряду одной высоты, нижняя строка прижата к низу */
.hc {
  flex:0 0 272px; scroll-snap-align:start; display:flex;
  border:1px solid rgba(197,227,225,.32);
  border-radius:var(--r-md); overflow:hidden;
  background:var(--white);
  transition:border-color .25s, box-shadow .25s, transform .25s;
}
.hc .hc-body { display:flex; flex-direction:column; flex:1; min-width:0; }
.hc .hc-foot { margin-top:auto; }
.hc-per { font-size:11px; font-weight:600; color:var(--slate-muted); }
.hc-hour { font-size:11px; line-height:13px; font-weight:600; color:var(--slate-mid); }
.star-badge { display:inline-flex; align-items:center; padding:1px 7px; border-radius:var(--r-full); background:var(--bg);
  border:1px solid rgba(180,195,204,.6); color:var(--slate-mid); font-size:11.5px; font-weight:700; letter-spacing:0; }
.hc:hover { transform:translateY(-3px); box-shadow:var(--sh-lg); }
.hc.picked { border-color:var(--coral); box-shadow:inset 0 0 0 1px var(--coral); }
.hc-img { width:92px; flex:none; position:relative; overflow:hidden; background:var(--aqua-pale); }
.hc-img img { width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.22,1,.36,1); }
.hc:hover .hc-img img { transform:scale(1.06); }
.hc-tags { position:absolute; top:6px; left:6px; right:6px; display:flex; gap:4px; flex-wrap:wrap; }
.hc-tag {
  padding:3px 9px; border-radius:var(--r-full);
  font-size:10px; font-weight:600;
  background:rgba(255,255,255,.9); color:var(--slate);
  backdrop-filter:blur(8px);
}
.hc-tag.plan { background:rgba(233,134,103,.9); color:#fff; }
.hc-body { padding:7px 9px; }
.hc-name { font-size:13px; font-weight:700; color:var(--slate-deep); margin-bottom:3px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hc-caps { display:flex; flex-wrap:nowrap; overflow:hidden; gap:4px; margin-bottom:4px; min-height:18px; }
.hc .hc-cap { padding:2px 5px; font-size:10px; }
.hc-cap {
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate-mid);
  border-radius:5px; padding:3px 6px;
}
.hc-cap .ml-seat { color:var(--slate-muted); }
.hc-price { font-size:13.5px; line-height:17px; font-weight:800; color:var(--slate-deep); margin-bottom:5px; }
.hc-price i { font-style:normal; font-size:11.5px; font-weight:500; color:var(--slate-muted); }
.hc-foot { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.hc-acts { display:flex; gap:6px; }
.hc-ic {
  width:24px; height:24px; border-radius:50%;
  background:var(--aqua-pale); border:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--slate-muted); transition:all .2s;
}
.hc-ic:hover:not(:disabled) { background:var(--coral-soft); color:var(--coral); }
.hc-ic.on { background:var(--coral-soft); color:var(--coral); }
.hc-ic.on svg { fill:currentColor; }
.hc-ic:disabled { opacity:.35; cursor:not-allowed; }
.hc-more {
  padding:4px 10px; border-radius:var(--r-full);
  font-size:12px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate);
  border:none; transition:all .2s; white-space:nowrap;
}
.hc-more:hover { background:var(--coral); color:#fff; }

/* пустая выдача */
.res-empty {
  background:var(--white); border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg); box-shadow:var(--sh-md);
  padding:48px 24px; text-align:center;
}
.res-empty h3 { font-family:'Literata',Georgia,serif; font-size:21px; color:var(--slate-deep); margin-bottom:8px; font-weight:600; }
.res-empty p { font-size:13.5px; color:var(--slate-muted); margin-bottom:18px; }
.res-empty button {
  padding:11px 26px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; border:none;
  font-size:14px; font-weight:600; box-shadow:var(--sh-coral);
  transition:background .2s;
}
.res-empty button:hover { background:var(--coral-hover); }

/* ══════════════════════════════════════════════
   MAP
   ══════════════════════════════════════════════ */
.map-col {
  position:sticky; top:calc(var(--top-nav) + var(--top-bar));
  background:var(--white);
  border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.map-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px; border-bottom:1px solid rgba(197,227,225,.3);
}
.map-head b { font-size:13px; font-weight:700; color:var(--slate-deep); }
.map-head span { font-size:11px; color:var(--slate-pale); }
.map-canvas {
  position:relative; overflow:hidden;
  height:calc(100vh - var(--top-nav) - var(--top-bar) - 150px);
  min-height:400px;
  background:var(--aqua-pale);
}
.map-scale {
  position:absolute; inset:0;
  transform-origin:center center;
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.map-bg { width:100%; height:100%; display:block; }

.map-pin {
  position:absolute; transform:translate(-50%,-100%);
  cursor:pointer; transition:transform .25s, filter .25s; z-index:3;
  border:none; background:none; padding:0;
}
.map-pin:hover { z-index:5; transform:translate(-50%,-100%) scale(1.14); }
.pin-body {
  display:flex; align-items:center; gap:4px;
  background:var(--white); color:var(--slate-deep);
  border:1.5px solid var(--coral);
  padding:5px 11px; border-radius:var(--r-full);
  font-size:11.5px; font-weight:700;
  box-shadow:var(--sh-md);
  white-space:nowrap; position:relative;
}
.pin-body::after {
  content:''; position:absolute;
  bottom:-6px; left:50%; transform:translateX(-50%);
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:6px solid var(--coral);
}
.map-pin.hi { z-index:6; transform:translate(-50%,-100%) scale(1.2); }
.map-pin.hi .pin-body { background:var(--coral); color:#fff; border-color:var(--coral); }
/* объекты текущей страницы списка ярче остальных */
.map-scale.paged .map-pin:not(.pg):not(.hi) { opacity:.42; }
.map-pin.pg .pin-body { background:#FCEAE4; }

/* всплывашка с фото и названием */
.pin-pop {
  position:absolute; transform:translate(-50%,-100%);
  margin-top:-38px; width:176px; z-index:7;
  background:var(--white); border:1px solid rgba(197,227,225,.5);
  border-radius:var(--r-md); overflow:hidden;
  box-shadow:var(--sh-lg); pointer-events:none;
  animation:popIn .18s ease both;
}
@keyframes popIn { from { opacity:0; transform:translate(-50%,-96%); } to { opacity:1; transform:translate(-50%,-100%); } }
.pin-pop-img { height:74px; background:var(--aqua-pale); }
.pin-pop-img img { width:100%; height:100%; object-fit:cover; }
.pin-pop-t { padding:8px 10px; font-size:12px; font-weight:700; color:var(--slate-deep); line-height:1.3; }
.pin-pop-s { padding:0 10px 9px; font-size:11px; color:var(--slate-muted); }

.map-zoom {
  position:absolute; bottom:16px; left:16px; z-index:8;
  display:flex; flex-direction:column; gap:2px;
  border-radius:10px; overflow:hidden; box-shadow:var(--sh-md);
}
.map-zoom button {
  width:36px; height:36px; border:none;
  background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  color:var(--slate); font-size:17px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.map-zoom button:hover:not(:disabled) { background:#fff; color:var(--coral); }
.map-zoom button:disabled { opacity:.4; cursor:not-allowed; }

/* ══════════════════════════════════════════════
   COMPARE BAR
   ══════════════════════════════════════════════ */
.cmp-bar {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px);
  z-index:400; display:flex; align-items:center; gap:14px;
  background:var(--slate-deep); color:#fff;
  border-radius:var(--r-full); padding:12px 18px 12px 22px;
  box-shadow:0 8px 32px rgba(53,78,99,.25);
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.cmp-bar.show { transform:translateX(-50%) translateY(0); }
.cmp-bar span { font-size:13px; font-weight:600; white-space:nowrap; }
.cmp-go {
  padding:8px 20px; border-radius:var(--r-full);
  background:var(--coral); border:none; color:#fff;
  font-size:13px; font-weight:600; transition:background .2s;
}
.cmp-go:hover { background:var(--coral-hover); }
.cmp-clear {
  background:none; border:1.5px solid rgba(255,255,255,.35); color:rgba(255,255,255,.85);
  font-size:12.5px; font-weight:600; padding:6px 14px; border-radius:var(--r-full); transition:all .2s;
}
.cmp-clear:hover { color:#fff; border-color:#fff; }
.cmp-go:disabled { background:rgba(255,255,255,.18); color:rgba(255,255,255,.55); cursor:not-allowed; }
.cmp-go-w { position:relative; display:inline-flex; }
.cmp-go-w.tip:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
  white-space:nowrap; background:#fff; color:var(--slate-deep); font-size:12px; font-weight:600; padding:7px 12px;
  border-radius:var(--r-sm); box-shadow:var(--sh-md); }
/* стр.103: обзор по городам */
.map-city { position:absolute; transform:translate(-50%,-50%); z-index:3; padding:7px 13px; border-radius:var(--r-full);
  border:2px solid #fff; background:var(--coral); color:#fff; font-size:12.5px; font-weight:600; white-space:nowrap;
  box-shadow:0 4px 14px rgba(53,78,99,.25); cursor:pointer; transition:transform .2s; }
.map-city:hover { transform:translate(-50%,-50%) scale(1.07); }
.map-city b { font-weight:700; }

/* ══════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════ */
@media(max-width:1180px) {
  .grid3 { grid-template-columns:280px minmax(0,1fr); }
  .map-col { display:none; }
  .grid3.map-mode { grid-template-columns:300px minmax(0,1fr); }
}
@media(max-width:900px) {
  .grid3 { grid-template-columns:minmax(0,1fr); padding:16px 18px 40px; }
  /* На узком экране карта заменяет список целиком. */
  .grid3.map-mode { grid-template-columns:minmax(0,1fr); }
  .grid3.map-mode .map-canvas { height:calc(100vh - var(--top-nav) - 150px); min-height:380px; }
  .filter-toggle { display:flex; }
  .fd-close { display:flex; }
  /* фильтры уезжают в выдвижную панель */
  .fd-panel {
    position:fixed; top:0; left:0; bottom:0;
    width:min(340px,88vw); border-radius:0; z-index:700;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
    box-shadow:0 8px 40px rgba(53,78,99,.18);
  }
  .fd-panel.open { transform:translateX(0); }
  .fd-body { max-height:calc(100vh - 62px); }
  .fd-backdrop {
    position:fixed; inset:0; z-index:690;
    background:rgba(53,78,99,.35); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .fd-backdrop.open { opacity:1; pointer-events:auto; }
  .control-bar { padding:10px 18px; gap:9px; }
  .cb-field input, .cb-field select { min-width:0; width:100%; }
  .cb-field { flex:1 1 132px; }
}
/* стр.69: вместимость «от / до» — поля ввода рядом с подписью и ползунок с двумя ручками */
.fd-capin { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.fd-capin > span { font-size:12.5px; color:var(--slate-muted); }
.fd-capin label { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--slate-muted); }
.fd-capin input, .hq-num input {
  width:78px; padding:6px 9px; border-radius:var(--r-sm); text-align:right;
  border:1.5px solid rgba(197,227,225,.55); background:var(--bg);
  font-family:inherit; font-size:13px; color:var(--slate-deep); outline:none;
}
.fd-capin input:focus, .hq-num input:focus { border-color:var(--coral); background:var(--white); }
.hq-f > span.hq-num { display:flex; align-items:center; gap:6px; margin:0; text-transform:none; letter-spacing:0; font-weight:400; }
.hq-num input { width:100%; text-align:left; }
.hq-num span { font-size:12.5px; color:var(--slate-muted); }
.fd-stars { display:inline-flex; gap:1px; color:#F0B95A; vertical-align:-1px; }
.fd-stars svg { width:13px; height:13px; }

@media(max-width:560px) {
  .res-count { font-size:18px; }
  .hc { flex:0 0 178px; }
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="page-wrap">

  <!-- ══════ ПАРАМЕТРЫ ЗАПРОСА ══════ -->
  <div class="control-bar">
    <button class="filter-toggle" id="filterToggle" onclick="toggleFilter()">
      <svg width="15" height="15" fill="none" viewBox="0 0 15 15"><path d="M2 3.5h11M4 7.5h7M5.5 11.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Фильтр
      <span class="ft-count" id="ftCount">0</span>
    </button>
    <div class="cb-field cb-city">
      <label for="cbCity">Город</label>
      <input id="cbCity" type="text" role="combobox" autocomplete="off" placeholder="Любой город"
        aria-autocomplete="list" aria-expanded="false" aria-controls="cbCityList">
      <ul class="cb-ac" id="cbCityList" role="listbox" hidden></ul>
    </div>
    <div class="cb-field">
      <label for="cbPeople">Кол-во участников</label>
      <input id="cbPeople" type="number" min="0" step="10" placeholder="любое" onchange="F.people=capClean(this.value);renderFilters();render()">
    </div>
    <div class="cb-field">
      <label for="cbEvent">Тип мероприятия</label>
      <select id="cbEvent" onchange="setEvent(this.value)"></select>
    </div>
    <div class="cb-right">
      <div class="view-sw" role="group" aria-label="Вид отображения">
        <button id="viewList" onclick="setView('list')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
          <span>Списком</span>
        </button>
        <button id="viewMap" onclick="setView('map')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.2 2 4v9.8L6 12l4 1.8 4-1.8V2.2L10 4z"/><path d="M6 2.2V12M10 4v9.8"/></svg>
          <span>На карте</span>
        </button>
      </div>
    </div>
  </div>

  <div class="grid3">

    <!-- ══════ ФИЛЬТРЫ ══════ -->
    <aside class="fd-panel" id="filterDrawer">
      <div class="fd-head">
        <div class="fd-title">Фильтры</div>
        <button class="fd-reset" onclick="resetAll()">Сбросить всё</button>
        <button class="fd-close" onclick="toggleFilter()" aria-label="Закрыть">
          <svg width="12" height="12" fill="none" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="fd-body" id="fdBody"></div>
    </aside>

    <!-- ══════ ВЫДАЧА ══════ -->
    <div class="res-col">
      <div class="res-head">
        <div class="res-count" id="resCount">—</div>
        <div class="res-tools">
          <button class="res-clear" id="resClear" onclick="clearCompare()" hidden>Очистить сравнение</button>
          <select class="res-sort" id="resSort" onchange="SORT=this.value;render()">
            <option value="rel">Сначала релевантные</option>
            <option value="price">По цене ↑</option>
            <option value="cap">По вместимости ↓</option>
            <option value="rating">По рейтингу ↓</option>
          </select>
        </div>
      </div>
      <div class="f-chips" id="fChips"></div>
      <div class="vlist" id="vList"></div>
      <div id="pager"></div>
    </div>

    <!-- ══════ КАРТА ══════ -->
    <aside class="map-col" id="mapCol">
      <div class="map-head">
        <b>На карте · <span id="mapCount">0</span></b>
      </div>
      <div class="map-canvas" id="mapCanvas">
        <div class="map-hint" id="mapHint" hidden><b>Все объекты на карте</b>Примените хотя бы один фильтр —
          появится список залов по объектам.</div>
        <div class="map-scale" id="mapScale"></div>
        <div class="map-card" id="mapCard" hidden></div>
        <div class="map-zoom">
          <button id="zoomIn" onclick="zoom(1)" aria-label="Приблизить">+</button>
          <button id="zoomOut" onclick="zoom(-1)" aria-label="Отдалить">−</button>
        </div>
      </div>
    </aside>

  </div>
</div>

<div class="fd-backdrop" id="fdBackdrop" onclick="toggleFilter()"></div>

<div id="mh-footer"></div>

<div class="cmp-bar" id="cmpBar">
  <span><b id="cmpCount">0</b> <span id="cmpWord">залов</span> в сравнении</span>
  <span class="cmp-go-w" id="cmpGoWrap"><button class="cmp-go" id="cmpGo" onclick="openCompare()">Сравнить</button></span>
  <button class="cmp-clear" onclick="clearCompare(true)">Очистить</button>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init('map');

/* ══════════════════════════════════════════════
   СОСТОЯНИЕ
   ══════════════════════════════════════════════ */
let F = ML.loadFilters();   // выборка переживает уход на карточку и возврат
/* стр.8/79: вид выдачи.
   Без фильтров — стартовое состояние: колонка фильтров и карта со всеми объектами.
   Применён любой фильтр — автоматически «Списком». Если человек сам выбрал вид,
   автопереключение больше не срабатывает (до перезагрузки или «Сбросить всё»). */
let USER_VIEW = null;
let VIEW = 'map';                 // текущий вид — вычисляется в applyView()
let HOVER = null;                 // id объекта, подсвеченного на карте
let SORT = 'rel';
let ZOOM = 1;
const OPEN = new Set(['main', 'type']);   // раскрытые группы фильтров
const PER_PAGE = 20;              // стр.46/88: 20 объектов на страницу
let PAGE = 1, PAGE_SIG = '';
/** Применён ли хоть один фильтр. Без фильтров — стартовая карта со всеми объектами. */
function hasFilters() { return ML.filtersActive(F) || ML.state.blacklist.size > 0; }

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const jt  = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

const IC = {
  hide: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.7a3 3 0 004.2 4.2"/><path d="M9.4 5.2A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17.6 17.6 0 01-3.4 4.2M6.3 6.5C3.7 8.2 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/></svg>',
  check: '<svg width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  star:  '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  cmp:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 7h18M6 7v4M12 7v8M18 7v4"/></svg>',
  heart: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
};

/* Какие группы фильтров доступны на текущем тарифе.
   Правила берём из самого тарифа (ML.TARIFFS[...].filters), а не выдумываем. */
function canUse(group) { return ML.canUseFilter(ML.tariff().key, group); }

/* ══════════════════════════════════════════════
   ПАНЕЛЬ ФИЛЬТРОВ — строится из конфига ML.VENUE_FILTERS (R3-A)
   Группы и порядок — ML.VENUE_FILTER_GROUPS, контрол — d.control, условие
   показа — ML.venueFilterVisible(d, F). Своих списков фильтров страница не держит.
   ══════════════════════════════════════════════ */
function fgroup(key, title, body, n) {
  return `<details class="fd-group" data-k="${key}" ${OPEN.has(key) ? 'open' : ''} ontoggle="OPEN[this.open?'add':'delete']('${key}')">
    <summary>${title}${n ? `<span class="fd-gcount">${n}</span>` : ''}<span class="fd-chev">▶</span></summary>
    <div class="fd-gbody">${body}</div>
  </details>`;
}

/* п.6: какой тариф открывает фильтр и обёртка, ведущая на пейвол */
const needFor = (code) => ['rooms_twin', 'rooms_single', 'seats', 'twin', 'sngl'].includes(code) ? 'prem' : 'biz';
function payWrap(code, html, title) {
  return `<div class="fd-paywall" role="button" tabindex="0" ${MH.payAttr(needFor(code), title || 'Этот фильтр')}
    onkeydown="if(event.key==='Enter')this.click()">${html}</div>`;
}
function lockNote(code) {
  return canUse(code) ? '' : `<div class="fd-lock">Доступно с тарифа <b>«${needFor(code) === 'prem' ? 'ПРЕМИУМ' : 'БИЗНЕС'}»</b> →</div>`;
}

/* чекбокс со счётчиком; data-code/data-val — для applyFacets */
function checkRow(code, val, label, on, locked, extra) {
  return `<label class="fd-check${locked ? ' off' : ''}" data-code="${esc(code)}" data-val="${esc(val)}">
    <input type="checkbox" ${on ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="${extra || `togFeat('${jt(code)}')`}">
    <span class="fd-box">${IC.check}</span>
    <span class="fd-lbl">${label}</span><span class="fd-cnt"></span></label>`;
}
function togFeat(code) { F.feats.has(code) ? F.feats.delete(code) : F.feats.add(code); renderFilters(); render(); }
/* R3-D: пока есть блоки «Зал N», общие свойства зала неактивны — оснащение задаётся в каждом зале */
const hallBlocks = () => (F.halls || []).length > 0;
const hallBlocked = (d) => !!d && d.control === 'check' && d.level === 'hall' && hallBlocks();
function togSet(key, value) { const s = F[key]; s.has(value) ? s.delete(value) : s.add(value); renderFilters(); render(); }
function togStar(n) { F.stars.has(n) ? F.stars.delete(n) : F.stars.add(n); renderFilters(); render(); }
function setVal(key, v) { F[key] = v; renderFilters(); render(); }
const numClean = (v) => { const n = parseInt(String(v).replace(/\D+/g, ''), 10); return isNaN(n) ? 0 : n; };

/* подсказка (i) — показывается при наведении и фокусе */
const infoTip = (text) => `<span class="fd-info" tabindex="0" aria-label="Что это значит"><span aria-hidden="true">i</span><span class="fd-tip" role="tooltip">${esc(text)}</span></span>`;

/** Один контрол фильтра. locked — тариф не открывает: рисуем неактивным. */
function control(d, locked) {
  const dis = locked ? 'disabled' : '';
  switch (d.control) {
    case 'check': return checkRow(d.code, '', esc(d.label) + (d.info ? infoTip(d.info) : ''), F.feats.has(d.code), locked || hallBlocked(d));
    case 'checks':
      if (d.code === 'stars') return `<div class="fd-rgt">${esc(d.label)}</div>` + ML.STAR_OPTIONS.map(o => checkRow('stars', o.k,
        o.k ? `<span class="fd-stars" role="img" aria-label="${esc(o.l)}">${IC.star.repeat(o.k)}</span>` : esc(o.l),
        F.stars.has(o.k), locked, `togStar(${o.k})`)).join('');
      return `<div class="fd-rgt">${esc(d.label)}</div>` + d.opts.map(o => checkRow('category', o.l, esc(o.l), F.cats.has(o.l), locked, `togSet('cats','${jt(o.l)}')`)).join('');
    case 'numFrom': return `<div class="fd-num"><label for="fn-${d.code}">${esc(d.label)}</label>
        <span class="fd-numin"><input id="fn-${d.code}" inputmode="numeric" placeholder="любое" value="${F[d.fkey] || ''}" ${dis}
          oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="setVal('${d.fkey}',numClean(this.value))">${d.unit ? `<span>${esc(d.unit)}</span>` : ''}</span></div>`;
    case 'numTo': {
      const mx = ML.LIMITS[d.fkey] || 10000, v = F[d.fkey] || 0;
      return `<div class="fd-num"><label for="fn-${d.code}">${esc(d.label)}</label>
        <span class="fd-numin"><input id="fn-${d.code}" inputmode="numeric" placeholder="любой" value="${v || ''}" ${dis}
          oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="setVal('${d.fkey}',Math.min(${mx},numClean(this.value)))"><span>₽</span></span></div>
        <div class="fd-range"><input type="range" min="0" max="${mx}" step="100" value="${v || mx}" ${dis} aria-label="${esc(d.label)}, ползунок"
          oninput="document.getElementById('fn-${d.code}').value=(+this.value>=${mx}?'':this.value)"
          onchange="setVal('${d.fkey}',+this.value>=${mx}?0:+this.value)"></div>`;
    }
    case 'range2': return d.code === 'guests' ? `<div class="fd-rgt">${esc(d.label)}</div>` + capBody() : rangeBody(d, locked);
    case 'multi': {
      const q = (CUISINE_Q || '').toLowerCase();
      return `<div class="fd-rgt">${esc(d.label)}</div><input class="fd-search" type="search" placeholder="Найти кухню" value="${esc(CUISINE_Q)}" ${dis} aria-label="Поиск по кухням"
          oninput="CUISINE_Q=this.value;filterCuisine()">
        <div class="fd-multi" id="cuisineList">${d.opts.map(o => `<div class="fd-mopt" data-l="${esc(o.l.toLowerCase())}"${q && !o.l.toLowerCase().includes(q) ? ' hidden' : ''}>
          ${checkRow('cuisine', o.code, esc(o.l), F.cuisine.has(o.code), locked, `togSet('cuisine','${o.code}')`)}</div>`).join('')}</div>`;
    }
    case 'segments': return `<div class="fd-rgt">${esc(d.label)}</div><div class="fd-seg" role="radiogroup" aria-label="${esc(d.label)}">${ML.PARKING_OPTS.map(o =>
        `<button type="button" role="radio" aria-checked="${F.parking === o.code}" class="${F.parking === o.code ? 'on' : ''}" ${dis}
          onclick="setVal('parking','${o.code}')">${esc(o.l)}</button>`).join('')}</div>`;
    case 'select': return `<label class="fd-sel"><span>${esc(d.label)}</span><select ${dis} onchange="setEvent(this.value)">
        <option value="">Любой тип</option>${d.opts.map(o => `<option value="${o.code}"${F.eventType === o.code ? ' selected' : ''}>${esc(o.l)}</option>`).join('')}
      </select></label>`;
    case 'halls': return hallsBuilder();
  }
  return '';
}
let CUISINE_Q = '';
function filterCuisine() {
  const q = CUISINE_Q.trim().toLowerCase();
  document.querySelectorAll('#cuisineList .fd-mopt').forEach(el => { el.hidden = !!q && !el.dataset.l.includes(q); });
}
/** Тип мероприятия: в панели и в строке параметров. Скрытые зависимые фильтры сбрасываются. */
function setEvent(v) {
  F.eventType = v;
  const dropped = ML.pruneFilters(F);
  if (dropped.length) MH.toast('Сброшены фильтры, которых нет у этого типа мероприятия: ' + dropped.map(c => (ML.venueFilter(c) || {}).label).join(', '), 'info');
  syncBar(); renderFilters(); render();
}

/* «2 поля + двойной ползунок»: цена за день, за час, конференц-пакет. */
const RANGE_STEP = { priceDay: 5000, priceHour: 500, confPkg: 100 };
function rangeBody(d, locked) {
  const k = d.fkey, mx = ML.LIMITS[k], [a, b] = F[k], dis = locked ? 'disabled' : '';
  return `<div class="fd-rg" data-k="${k}">
    ${d.code === 'conference_package_price_per_person' ? `<div class="fd-rgt">${esc(d.label)} <span>${esc(d.unit)}</span></div>` : ''}
    <div class="fd-rgin">
      <label><span>от</span><input inputmode="numeric" placeholder="0" value="${a || ''}" ${dis} data-end="0" aria-label="${esc(d.label)} от"
        oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="rangeSet('${k}',0,this.value)"></label>
      <label><span>до</span><input inputmode="numeric" placeholder="${mx.toLocaleString('ru')}" value="${b < mx ? b : ''}" ${dis} data-end="1" aria-label="${esc(d.label)} до"
        oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="rangeSet('${k}',1,this.value)"></label>
      <span class="fd-rgu">₽</span>
    </div>
    <div class="fd-dual"><div class="fd-track"><div class="fd-rail"></div><div class="fd-fill"></div>
      <input type="range" class="lo" min="0" max="${mx}" step="${RANGE_STEP[k]}" value="${a}" ${dis} aria-label="${esc(d.label)}: от, ползунок">
      <input type="range" class="hi" min="0" max="${mx}" step="${RANGE_STEP[k]}" value="${b}" ${dis} aria-label="${esc(d.label)}: до, ползунок">
    </div></div></div>`;
}
function rangeSet(k, end, raw) {
  const mx = ML.LIMITS[k];
  let [a, b] = F[k];
  const v = Math.min(mx, numClean(raw));
  if (end === 0) a = v; else b = v || mx;
  if (a > b) [a, b] = [b, a];
  F[k] = [a, b]; renderFilters(); render();
}
function bindRanges() {
  document.querySelectorAll('#fdBody .fd-rg').forEach(box => {
    const k = box.dataset.k, mx = ML.LIMITS[k];
    const lo = box.querySelector('input.lo'), hi = box.querySelector('input.hi'), fill = box.querySelector('.fd-fill');
    const [fa, fb] = box.querySelectorAll('.fd-rgin input');
    const upd = (commit) => {
      let a = +lo.value, b = +hi.value;
      if (a > b) { [a, b] = [b, a]; lo.value = a; hi.value = b; }
      fill.style.left = (a / mx * 100) + '%'; fill.style.right = (100 - b / mx * 100) + '%';
      fa.value = a || ''; fb.value = b >= mx ? '' : b;
      if (commit) { F[k] = [a, b]; renderFilters(); render(); }
    };
    lo.oninput = () => upd(false); hi.oninput = () => upd(false);
    lo.onchange = () => upd(true); hi.onchange = () => upd(true);
    upd(false);
  });
}

/** Сколько значений заполнено в группе — счётчик у свёрнутой секции. */
function groupCount(g) {
  let n = 0;
  for (const d of ML.VENUE_FILTERS) {
    if (d.group !== g || !d.control || d.control === 'city') continue;
    if (d.control === 'check') n += F.feats.has(d.code) ? 1 : 0;
    else if (d.code === 'guests') n += (F.people ? 1 : 0) + (F.peopleTo ? 1 : 0);
    else if (d.code === 'event_type') n += F.eventType ? 1 : 0;
    else if (d.code === 'category') n += F.cats.size;
    else if (d.code === 'stars') n += F.stars.size;
    else if (d.code === 'cuisine') n += F.cuisine.size;
    else if (d.code === 'hall_requirements') n += (F.halls || []).filter(ML.hallReqOn).length;
    else if (d.control === 'range2') n += (F[d.fkey][0] > 0 || F[d.fkey][1] < ML.LIMITS[d.fkey]) ? 1 : 0;
    else n += F[d.fkey] ? 1 : 0;
  }
  return n;
}
/* п.24: после перезагрузки раскрыты секции, где есть заполненные значения. */
const groupFilled = (g) => groupCount(g) > 0;

function renderFilters() {
  const t = ML.tariff();
  let h = '';
  for (const g of ML.VENUE_FILTER_GROUPS) {
    const defs = ML.VENUE_FILTERS.filter(d => d.group === g.k && d.control && d.control !== 'city' && ML.venueFilterVisible(d, F));
    if (g.k === 'price') defs.unshift({ code: 'price_mode', control: 'mode' });
    if (!defs.length) continue;
    const groupLocked = defs.every(d => d.control === 'mode' || !canUse(d.code));
    const main = defs.filter(d => !d.advanced), adv = defs.filter(d => d.advanced);
    const draw = (d, i, arr) => {
      if (d.control === 'mode') return `<div class="fd-seg fd-mode" role="radiogroup" aria-label="Стоимость">
        ${[['day', 'За день'], ['hour', 'За час']].map(([m, l]) => `<button type="button" role="radio" aria-checked="${(F.priceMode || 'day') === m}"
          class="${(F.priceMode || 'day') === m ? 'on' : ''}" ${canUse('price_day') ? '' : 'disabled'} onclick="setMode('${m}')">${l}</button>`).join('')}</div>`;
      const locked = !canUse(d.code);
      if (d.control === 'halls') return control(d, locked);
      if (hallBlocked(d) && !locked) return control(d, false);
      const html = control(d, locked);
      const nextLocked = arr && arr[i + 1] && arr[i + 1].control !== 'mode' && !canUse(arr[i + 1].code) && needFor(arr[i + 1].code) === needFor(d.code);
      return locked && !groupLocked ? payWrap(d.code, html + (nextLocked ? '' : lockNote(d.code)), d.label) : html;
    };
    let body = main.map(draw).join('');
    if (adv.length) body += `<details class="fd-adv"${OPEN.has('adv') ? ' open' : ''} ontoggle="OPEN[this.open?'add':'delete']('adv')">
      <summary>Расширенные параметры</summary><div>${adv.map(draw).join('')}</div></details>`;
    if (g.k !== 'halls' && defs.some(hallBlocked) && !groupLocked)
      body = `<div class="fd-hallnote">Оснащение задаётся в каждом зале выше</div>` + body;
    if (groupLocked) body = payWrap(defs.find(d => d.control !== 'mode').code, body + lockNote(defs.find(d => d.control !== 'mode').code), g.l);
    h += fgroup(g.k, esc(g.l), body, groupCount(g.k));
  }
  if (!t.fullInfo) {
    h += `<div class="fd-note">Тариф <b>«${esc(t.name)}»</b>: доступны только категории объектов, город и количество гостей.
      Остальные фильтры и полная информация о залах — с тарифа «БИЗНЕС».
      <button class="fd-up" onclick="MH.go('pricing.html')">Сравнить тарифы</button></div>`;
  }
  document.getElementById('fdBody').innerHTML = h;
  bindRanges();
  bindCapDual();
  applyFacets();
  syncResetBtn();
}
function setMode(m) { F.priceMode = m; ML.pruneFilters(F); renderFilters(); render(); }

/* «Сбросить всё» неактивна, пока не применён ни один фильтр (R3-B, строка 97). */
function syncResetBtn() {
  const b = document.querySelector('.fd-reset');
  if (b) { const on = hasFilters(); b.disabled = !on; b.title = on ? '' : 'Фильтры не применены'; }
}

/* Фасетные счётчики: сколько объектов останется, если добавить условие. */
function applyFacets() {
  document.querySelectorAll('#fdBody label.fd-check[data-code]').forEach(lb => {
    const code = lb.dataset.code, val = lb.dataset.val, inp = lb.querySelector('input');
    const n = ML.facetCount(F, code, val);
    lb.querySelector('.fd-cnt').textContent = '(' + n + ')';
    const lockedByTariff = !canUse(code);
    const dead = !inp.checked && n === 0;
    const blocked = !lb.closest('.hq') && hallBlocked(ML.VENUE_FILTERS.find(d => d.code === code));
    inp.disabled = lockedByTariff || dead || blocked;
    lb.classList.toggle('off', lockedByTariff || dead || blocked);
  });
}

/* ══════════════════════════════════════════════
   КОНСТРУКТОР ТРЕБОВАНИЙ К ЗАЛАМ

   Каждый блок — отдельный зал объекта. Два требования означают ДВА РАЗНЫХ
   зала: подбор делает ML.filterVenues, здесь только форма. Пустая схема —
   «любая», так ищется «два зала от 80 человек».

   Тарифы: на СТАРТ конструктор закрыт целиком, на БИЗНЕС задаётся только
   вместимость — по договору схемы рассадки премиальный фильтр.

   R3-D: «+ Оснащение» — свойства этого зала (уровень 'hall' в конфиге). Открыто там же,
   где схемы рассадки, — на ПРЕМИУМЕ. С первым блоком общие свойства зала переезжают
   в «Зал 1» (ML.hallReqAdd), выбранное видно чипами внутри блока.
   ══════════════════════════════════════════════ */
function hallsBuilder() {
  if (!canUse('halls')) {
    return payWrap('halls', '<div class="fd-lock">Подбор по залам доступен с тарифа <b>«БИЗНЕС»</b> →</div>', 'Подбор по залам');
  }
  const canSeat = canUse('seats');
  const list = F.halls || [];
  const rows = list.map((r, i) => `
    <div class="hq" data-i="${i}">
      <div class="hq-top">
        <span class="hq-n">Зал ${i + 1}</span>
        <button class="hq-x" onclick="hallDel(${i})" title="Убрать требование" aria-label="Убрать зал ${i + 1}">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
      <label class="hq-f">
        <span>Схема</span>
        <select ${canSeat ? '' : 'disabled'} onchange="hallSet(${i},'seating',this.value)">
          <option value="">Любая схема</option>
          ${ML.SEATING.map(s => `<option value="${s.k}"${r.seating === s.k ? ' selected' : ''}>${esc(s.l)}</option>`).join('')}
        </select>
      </label>
      <label class="hq-f hq-min">
        <span>Вместимость от</span>
        <span class="hq-num"><input inputmode="numeric" value="${r.min || ''}" placeholder="любое"
          oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="hallSet(${i},'min',capClean(this.value))"><span>чел.</span></span>
      </label>
      ${r.seating && canSeat ? `<div class="hq-ic">${MH.seatIcon(r.seating, { size: 15 })}<span>${esc((ML.seatingByKey(r.seating) || {}).l || '')}</span></div>` : ''}
      ${hallEquip(r, i, canSeat)}
    </div>`).join('');

  return `${rows || '<div class="hq-empty">Требований нет — в выдаче все объекты</div>'}
    <button class="hq-add" onclick="hallAdd()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"/></svg>
      Добавить зал
    </button>
    ${canSeat ? '' : payWrap('seats', '<div class="fd-lock">Выбор схемы рассадки доступен на тарифе <b>«ПРЕМИУМ»</b> → сейчас требование считается по любой схеме</div>')}
    ${list.length > 1 ? '<div class="hq-note">Каждое требование закрывает <b>отдельный</b> зал объекта.</div>' : ''}`;
}

/** «+ Оснащение» в блоке зала: чипы выбранного и список свойств зала по конфигу. */
function hallEquip(r, i, canSeat) {
  const feats = r.feats || [];
  const chips = feats.length ? `<div class="hq-chips">${feats.map(c => `<span class="hq-chip">${esc(ML.featureLabel(c))}<button type="button"
      onclick="hallEq(${i},'${jt(c)}')" aria-label="Убрать «${esc(ML.featureLabel(c))}» у зала ${i + 1}">✕</button></span>`).join('')}</div>` : '';
  if (!canSeat) return `<div class="hq-eq">${chips}<div class="hq-eqlock">${payWrap('seats',
    '<div class="fd-lock">«+ Оснащение» для отдельного зала — на тарифе <b>«ПРЕМИУМ»</b> →</div>', 'Оснащение зала')}</div></div>`;
  const open = OPEN.has('hq-eq-' + i);
  const list = open ? `<div class="hq-eqlist">${ML.hallReqDefs().filter(d => ML.venueFilterVisible(d, F)).map(d =>
    `<label class="fd-check"><input type="checkbox" ${feats.includes(d.code) ? 'checked' : ''} onchange="hallEq(${i},'${jt(d.code)}')">
      <span class="fd-box">${IC.check}</span><span class="fd-lbl">${esc(d.label)}</span></label>`).join('')}</div>` : '';
  return `<div class="hq-eq">${chips}<button type="button" class="hq-eqbtn" aria-expanded="${open}" onclick="hallEqOpen(${i})">${open ? '− Скрыть оснащение' : '+ Оснащение'}</button>${list}</div>`;
}
function hallEqOpen(i) { const k = 'hq-eq-' + i; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); renderFilters(); }
function hallEq(i, code) { ML.hallReqToggle(F, i, code); renderFilters(); render(); }
function hallAdd() { ML.hallReqAdd(F); OPEN.add('halls'); renderFilters(); render(); }
function hallDel(i) {
  ML.hallReqRemove(F, i);
  // раскрытые списки «+ Оснащение» сдвигаются вместе с блоками
  const open = [...OPEN].filter(k => k.startsWith('hq-eq-')).map(k => +k.slice(6));
  open.forEach(n => OPEN.delete('hq-eq-' + n));
  open.filter(n => n !== i).forEach(n => OPEN.add('hq-eq-' + (n > i ? n - 1 : n)));
  renderFilters(); render();
}
function hallSet(i, k, v) { F.halls[i][k] = v; renderFilters(); render(); }


/* ── стр.69: вместимость «от / до» ──
   Поля и ползунок синхронизированы в обе стороны. Только целые 0…CAP_MAX;
   пустое поле — «любое». Если «до» меньше «от», значения меняются местами. */
const CAP_MAX = ML.capacityMax();
const capClean = (v) => { const n = parseInt(String(v).replace(/\D+/g, ''), 10); return isNaN(n) ? 0 : Math.max(0, Math.min(CAP_MAX, n)); };
function capBody() {
  const a = F.people || 0, b = F.peopleTo || 0;
  return `<div class="fd-capin"><span>Не менее</span>
      <label><input id="capFrom" inputmode="numeric" placeholder="любое" value="${a || ''}" aria-label="Вместимость не менее, человек"
        oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="capSet('from',this.value)"> чел.</label></div>
    <div class="fd-capin"><span>Не более</span>
      <label><input id="capTo" inputmode="numeric" placeholder="любое" value="${b || ''}" aria-label="Вместимость не более, человек"
        oninput="this.value=this.value.replace(/\\D+/g,'')" onchange="capSet('to',this.value)"> чел.</label></div>
    <div class="fd-dual" id="capDual" data-min="0" data-max="${CAP_MAX}">
      <div class="fd-track"><div class="fd-rail"></div><div class="fd-fill"></div>
        <input type="range" class="lo" min="0" max="${CAP_MAX}" step="10" value="${a}" aria-label="Ползунок: не менее">
        <input type="range" class="hi" min="0" max="${CAP_MAX}" step="10" value="${b || CAP_MAX}" aria-label="Ползунок: не более">
      </div></div>`;
}
/** Записать порог и перерисовать: поле → модель → ползунок. */
function capSet(which, raw) {
  let a = F.people || 0, b = F.peopleTo || 0;
  const v = capClean(raw);
  if (which === 'from') a = v; else b = (v >= CAP_MAX ? 0 : v);
  if (a && b && b < a) [a, b] = [b, a];
  F.people = a; F.peopleTo = b;
  syncBar(); renderFilters(); render();
}
function bindCapDual() {
  const d = document.getElementById('capDual'); if (!d) return;
  const lo = d.querySelector('input.lo'), hi = d.querySelector('input.hi'), fill = d.querySelector('.fd-fill');
  const fa = document.getElementById('capFrom'), fb = document.getElementById('capTo');
  const upd = (commit) => {
    let a = +lo.value, b = +hi.value;
    if (a > b) { [a, b] = [b, a]; lo.value = a; hi.value = b; }
    fill.style.left = (a / CAP_MAX * 100) + '%'; fill.style.right = (100 - b / CAP_MAX * 100) + '%';
    fa.value = a || ''; fb.value = b >= CAP_MAX ? '' : b;
    if (commit) { F.people = a; F.peopleTo = b >= CAP_MAX ? 0 : b; syncBar(); render(); }
  };
  lo.oninput = () => upd(false); hi.oninput = () => upd(false);
  lo.onchange = () => upd(true); hi.onchange = () => upd(true);
  upd(false);
}

/* ══════════════════════════════════════════════
   ЧИПЫ ВЫБРАННЫХ ФИЛЬТРОВ
   ══════════════════════════════════════════════ */
function renderChips() {
  const c = [];
  const money = (n) => n.toLocaleString('ru');
  if (F.city) c.push(['Город: ' + F.city, () => F.city = '']);
  if (F.people || F.peopleTo) c.push([ML.peopleLabel(F), () => { F.people = 0; F.peopleTo = 0; }]);
  if (F.eventType === 'combined') c.push(['Комбинированное', () => F.eventType = '']);
  if (F.rooms) c.push(['Номеров от ' + F.rooms, () => F.rooms = 0]);
  if (F.twin) c.push(['TWIN от ' + F.twin, () => F.twin = 0]);
  if (F.sngl) c.push(['SNGL от ' + F.sngl, () => F.sngl = 0]);
  (F.halls || []).forEach((r, i) => { if (!ML.hallReqOn(r)) return;
    c.push([ML.hallReqLabel(r, i), () => hallDel(i)]); });
  if (F.hallArea) c.push(['Площадь зала от ' + F.hallArea + ' м²', () => F.hallArea = 0]);
  if (F.dressing) c.push(['Гримёрок от ' + F.dressing, () => F.dressing = 0]);
  const rng = (k, unit) => { const [a, b] = F[k]; if (a > 0 || b < ML.LIMITS[k]) c.push([`${money(a)}–${money(b)} ₽${unit}`, () => F[k] = [0, ML.LIMITS[k]]]); };
  if ((F.priceMode || 'day') === 'day') rng('priceDay', ' / день'); else rng('priceHour', ' / час');
  if (F.priceMode === 'hour') c.push(['Стоимость за час', () => { F.priceMode = 'day'; F.priceHour = [0, ML.LIMITS.priceHour]; }]);
  rng('confPkg', ' / чел., конференц-пакет');
  if (F.avgCheck) c.push(['Средний чек до ' + money(F.avgCheck) + ' ₽', () => F.avgCheck = 0]);
  if (F.wardrobe) c.push(['Гардероб от ' + F.wardrobe + ' мест', () => F.wardrobe = 0]);
  if (F.parking) c.push([(ML.PARKING_OPTS.find(o => o.code === F.parking) || {}).full, () => { F.parking = ''; F.parkingSpaces = 0; }]);
  if (F.parkingSpaces) c.push(['Парковочных мест от ' + F.parkingSpaces, () => F.parkingSpaces = 0]);
  F.cats.forEach(x => c.push([x, () => F.cats.delete(x)]));
  [...F.stars].sort().forEach(n => c.push([(ML.STAR_OPTIONS.find(o => o.k === n) || { l: n + '★' }).l, () => F.stars.delete(n)]));
  F.cuisine.forEach(x => c.push(['Кухня: ' + (ML.CUISINE_OPTS.find(o => o.code === x) || { l: x }).l.toLowerCase(), () => F.cuisine.delete(x)]));
  F.feats.forEach(x => c.push([ML.featureLabel(x), () => F.feats.delete(x)]));
  [...ML.state.blacklist].forEach(id => {
    const v = ML.venueById(id);
    if (v) c.push(['Скрыт: ' + v.name, () => ML.removeFromBlacklist(id), true]);
  });

  window._chips = c;
  document.getElementById('fChips').innerHTML = c.map((x, i) =>
    `<span class="f-chip${x[2] ? ' black' : ''}">${esc(x[0])}<button onclick="_chips[${i}][1]();syncBar();renderFilters();render()" aria-label="Убрать">✕</button></span>`).join('');

  document.getElementById('ftCount').textContent = c.length;
}

/* ══════════════════════════════════════════════
   ВЫДАЧА: объекты-контейнеры с лентой залов
   ══════════════════════════════════════════════ */
function sortList(list) {
  const arr = list.slice();
  if (SORT === 'price') arr.sort((a, b) => (ML.venueMinPrice(a.venue) || 1e9) - (ML.venueMinPrice(b.venue) || 1e9));
  else if (SORT === 'cap') arr.sort((a, b) => ML.venueCapacity(b.venue) - ML.venueCapacity(a.venue));
  else if (SORT === 'rating') arr.sort((a, b) => b.venue.rating - a.venue.rating);
  return arr;
}

          <button class="hc-ic${fav ? ' on' : ''}" onclick="toggleFavHall(${h.id})" title="${fav ? 'Убрать из избранного' : 'В избранное'}">${IC.heart}</button>

function scrollRail(id, d) {

}
/* стр.89/113: стрелки — только когда залы не помещаются в карточку; левая — только если ряд прокручен. */
function syncRails() {
  document.querySelectorAll('.rail-wrap').forEach(w => {
    const r = w.querySelector('.rail'); if (!r) return;
    const over = r.scrollWidth > r.clientWidth + 2;
    w.querySelector('.rail-btn.n').hidden = !over || r.scrollLeft + r.clientWidth >= r.scrollWidth - 2;
    w.querySelector('.rail-btn.p').hidden = !over || r.scrollLeft <= 2;
    if (!r._rs) { r._rs = true; r.addEventListener('scroll', () => syncRails(), { passive: true }); }
  });
}
window.addEventListener('resize', () => syncRails());

function renderMap(list) {
  /* стр.103: объекты из нескольких городов — одна метка на город «Москва · 12»; клик выставляет город. */
  const cities = [...new Set(list.map(x => x.venue.city))];
  if (cities.length > 1) {
    const marks = cities.map(c => {
      const n = list.filter(x => x.venue.city === c).length, pt = CITY_OVERVIEW[c] || ML.CITY_MAP[c] || [50, 50];
      return `<button class="map-city" style="left:${pt[0]}%;top:${pt[1]}%" onclick="pickCity('${jt(c)}')"
        title="Показать объекты: ${esc(c)}"><b>${esc(c)}</b> · ${n}</button>`;
    }).join('');
    const sc0 = document.getElementById('mapScale');
    sc0.innerHTML = MAP_SVG + marks + '<div class="pin-pop" id="pinPop" hidden></div>';
    sc0.classList.remove('paged');
    document.getElementById('mapCount').textContent = list.length;
    return;
  }
  const pins = list.map(x => {
    const v = x.venue;
    return `<button class="map-pin${HOVER === v.id ? ' hi' : ''}${PAGE_IDS.has(v.id) ? ' pg' : ''}" data-vid="${v.id}"
      style="left:${v.px}%;top:${v.py}%"
      onmouseenter="setHover(${v.id})" onmouseleave="setHover(null)"
      onclick="focusCard(${v.id})"
      title="${esc(v.name)}">
      <span class="pin-body">${x.halls.length} ${ML.plural(x.halls.length, ['зал', 'зала', 'залов'])}</span>
    </button>`;
  }).join('');

  // Пустой контейнер всплывашки. Наполняем его в setHover, а не перерисовкой
  // всей карты: иначе пин под курсором уничтожается и подсветка мерцает.
  const sc = document.getElementById('mapScale');
  sc.innerHTML = MAP_SVG + pins + '<div class="pin-pop" id="pinPop" hidden></div>';
  sc.classList.toggle('paged', PAGE_IDS.size > 0 && PAGE_IDS.size < list.length);
  document.getElementById('mapCount').textContent = list.length;
  paintHover();
}

/* Метки обзора по городам разнесены по вертикали, чтобы подписи не налезали в узкой колонке карты. */
const CITY_OVERVIEW = { 'Санкт-Петербург': [36, 12], 'Подмосковье': [62, 25], 'Москва': [46, 38], 'Нижний Новгород': [62, 51],
  'Казань': [38, 64], 'Самара': [60, 77], 'Сочи': [40, 89] };
function pickCity(c) { F.city = c; PAGE = 1; syncBar(); renderFilters(); render(); }

/* Подсветка: наведение на блок объекта ↔ пин на карте. Без перерисовки DOM. */
function setHover(id) {
  if (HOVER === id) return;
  HOVER = id;
  paintHover();
}

function paintHover() {
  document.querySelectorAll('.map-pin').forEach(p => p.classList.toggle('hi', +p.dataset.vid === HOVER));
  document.querySelectorAll('.vb').forEach(b => b.classList.toggle('hi', +b.dataset.vid === HOVER));

  const pop = document.getElementById('pinPop');
  if (!pop) return;
  const hovered = currentList.find(x => x.venue.id === HOVER);
  if (!hovered) { pop.hidden = true; return; }
  const v = hovered.venue;
  pop.style.left = v.px + '%';
  pop.style.top = v.py + '%';
  pop.innerHTML = `<div class="pin-pop-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
    <div class="pin-pop-t">${esc(v.name)}</div>
    <div class="pin-pop-s">${esc(v.city)} · ${hovered.halls.length} ${ML.plural(hovered.halls.length, ['зал', 'зала', 'залов'])}</div>`;
  pop.hidden = false;
}

/* Клик по пину. В списке — подсветить и подскроллить к блоку объекта,
   на карте списка нет, поэтому показываем карточку поверх карты. */
function focusCard(vid) {
  if (VIEW === 'map') { showMapCard(vid); return; }
  const card = document.querySelector(`.vb[data-vid="${vid}"]`);
  if (!card) return;
  document.querySelectorAll('.vb').forEach(b => b.classList.remove('hi'));
  card.classList.add('hi');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => { if (HOVER !== vid) card.classList.remove('hi'); }, 2200);
}

function showMapCard(vid) {
  const box = document.getElementById('mapCard');
  const x = currentList.find(y => y.venue.id === vid);
  if (!box || !x) return;
  const v = x.venue;
  box.innerHTML = `<button class="map-card-x" onclick="hideMapCard()" aria-label="Закрыть">✕</button>
    <div class="map-card-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
    <div class="map-card-b">
      <div class="map-card-t">${esc(v.name)}</div>
      <div class="map-card-s">${esc(v.city)} · ${x.halls.length} ${ML.plural(x.halls.length, ['зал', 'зала', 'залов'])}</div>
      <a class="map-card-go" href="venue.html?id=${v.id}">Карточка объекта</a>
    </div>`;
  box.hidden = false;
}
function hideMapCard() {
  const box = document.getElementById('mapCard');
  if (box) box.hidden = true;
}

function setView(v) {
  USER_VIEW = v === 'map' ? 'map' : 'list';
  hideMapCard();
  applyView();
  render();
}

function applyView() {
  const start = !hasFilters();
  VIEW = start ? 'map' : (USER_VIEW || 'list');
  document.querySelector('.grid3').classList.toggle('map-mode', VIEW === 'map');
  document.getElementById('viewList').classList.toggle('on', VIEW === 'list');
  document.getElementById('viewMap').classList.toggle('on', VIEW === 'map');
  document.getElementById('viewList').disabled = start;
  document.getElementById('viewList').title = start ? 'Список появится после применения фильтра' : '';
  document.getElementById('mapHint').hidden = !start;
}

function zoom(dir) {
  ZOOM = Math.min(2.5, Math.max(1, +(ZOOM + dir * 0.25).toFixed(2)));
  document.getElementById('mapScale').style.transform = `scale(${ZOOM})`;
  document.getElementById('zoomIn').disabled = ZOOM >= 2.5;
  document.getElementById('zoomOut').disabled = ZOOM <= 1;
}

/* стр.101: «Очистить» очищает сравнение без перехода; 5 секунд можно вернуть список. */
function clearCompare(undo) {
  const was = [...ML.state.compare];
  ML.clearCompare(); render();
  if (undo && was.length) MH.toast('Список сравнения очищен', 'info', { ms: 5000, action: { label: 'Вернуть', fn: () => {
    was.forEach(id => { if (!ML.inCompare(id)) ML.toggleCompare(id); }); render();
  } } });
}
function openCompare() {
  // compare.html читает список из состояния модели, параметры в URL не нужны
  if (ML.state.compare.size < 2) { MH.toast('Добавьте ещё хотя бы один зал', 'error'); return; }
  MH.go('compare.html');
}
function resetAll() {
  F = ML.resetFilters();            // город тоже сбрасывается: в поле снова «Любой город»
  PAGE = 1;
  USER_VIEW = null;                 // стартовое состояние: фильтры и карта
  [...ML.state.blacklist].forEach(id => ML.removeFromBlacklist(id));
  syncBar();
  renderFilters();
  render();
}
function toggleFilter() {
