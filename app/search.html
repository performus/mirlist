<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Подбор площадок и залов для деловых мероприятий, банкетов, свадеб и тимбилдинга.">
<meta property="og:title" content="МАЙСЛИСТ — подбор площадок">
<meta property="og:description" content="Подбор площадок и залов для деловых мероприятий, банкетов, свадеб и тимбилдинга.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Подбор площадок — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root {
  /* Coral */
  --coral: #E98667;
  --coral-hover: #D97757;
  --coral-soft: #F6DDD3;
  --coral-glow: rgba(233,134,103,.18);
  /* Aqua */
  --aqua-1: #D9ECEB;
  --aqua-2: #C5E3E1;
  --aqua-3: #A8D4D8;
  --aqua-pale: #EDF6F5;
  /* Slate */
  --slate: #46627A;
  --slate-mid: #3E596F;
  --slate-deep: #354E63;
  --slate-muted: #7A919F;
  --slate-pale: #B4C3CC;
  /* Warm */
  --peach: #F6E6DE;
  --bg: #F8F5F2;
  --white: #FFFFFF;
  /* Shadows & Radii */
  --sh-sm: 0 1px 4px rgba(53,78,99,.05);
  --sh-md: 0 4px 20px rgba(53,78,99,.07);
  --sh-lg: 0 8px 40px rgba(53,78,99,.09);
  --sh-coral: 0 4px 18px rgba(233,134,103,.22);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-full: 50px;
  /* высота фикс-шапки + панели запроса — для sticky-колонок */
  --top-nav: 64px;
  --top-bar: 62px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Onest', system-ui, sans-serif;
  background: var(--bg);
  color: var(--slate);
  -webkit-font-smoothing: antialiased;
}
a { text-decoration:none; color:inherit; }
button { font-family:inherit; cursor:pointer; }
h1,h2,h3 { font-weight:700; }

@keyframes pageIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.page-wrap { animation: pageIn .5s ease both; }

/* ══════════════════════════════════════════════
   CONTROL BAR — параметры запроса
   ══════════════════════════════════════════════ */
.control-bar {
  position:sticky; top:var(--top-nav); z-index:40;
  display:flex; align-items:flex-end; gap:12px;
  padding:11px 28px;
  background:var(--white);
  border-bottom:1px solid rgba(197,227,225,.35);
  flex-wrap:wrap;
}
.cb-field { display:flex; flex-direction:column; gap:3px; }
.cb-field label {
  font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.07em; color:var(--slate-muted);
}
.cb-field input, .cb-field select {
  padding:8px 14px; border-radius:var(--r-full);
  font-family:inherit; font-size:13px; font-weight:500;
  border:1.5px solid rgba(197,227,225,.55);
  background:var(--white); color:var(--slate);
  outline:none; transition:border-color .2s, background .2s;
  min-width:150px;
}
.cb-field input:focus, .cb-field select:focus { border-color:var(--coral); }
.cb-field input:hover, .cb-field select:hover { border-color:var(--aqua-3); }

.filter-toggle {
  display:none; align-items:center; gap:7px;
  padding:9px 20px; border-radius:var(--r-full);
  font-size:13.5px; font-weight:600;
  border:1.5px solid var(--slate-pale);
  background:var(--white); color:var(--slate);
  transition:all .2s;
}
.filter-toggle:hover { border-color:var(--coral); color:var(--coral); }
.filter-toggle.open { background:var(--slate-deep); color:#fff; border-color:var(--slate-deep); }
.filter-toggle .ft-count {
  min-width:20px; height:20px; padding:0 6px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.cb-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.cb-tariff {
  display:flex; align-items:center; gap:6px;
  font-size:12px; color:var(--slate-muted);
}
.cb-tariff b { color:var(--slate-deep); font-weight:700; }

/* ══════════════════════════════════════════════
   THREE-COLUMN GRID
   ══════════════════════════════════════════════ */
.grid3 {
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 340px;
  gap:18px; align-items:start;
  padding:20px 28px 48px;
  max-width:1760px; margin:0 auto;
}
.grid3 > * { min-width:0; }

/* ══════ переключатель вида ══════ */
/* ══════ конструктор требований к залам ══════ */
.hq {
  border:1.5px solid rgba(197,227,225,.5); border-radius:var(--r-md);
  padding:12px 13px; margin-bottom:10px; background:var(--white);
}
.hq-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.hq-n {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:var(--coral);
}
.hq-x {
  width:22px; height:22px; border:none; background:none; border-radius:6px;
  color:var(--slate-pale); display:flex; align-items:center; justify-content:center;
  transition:color .18s, background .18s;
}
.hq-x:hover { color:var(--coral); background:var(--coral-soft); }
.hq-f { display:block; margin-bottom:9px; }
.hq-f:last-of-type { margin-bottom:0; }
.hq-f > span {
  display:block; font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--slate-muted); margin-bottom:4px;
}
.hq-f select, .hq-f input {
  width:100%; padding:8px 11px; border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.55); background:var(--bg);
  font-family:inherit; font-size:13px; color:var(--slate-deep); outline:none;
}
.hq-f select:focus, .hq-f input:focus { border-color:var(--coral); background:var(--white); }
.hq-f select:disabled { opacity:.55; cursor:not-allowed; }
.hq-ic {
  display:flex; align-items:center; gap:6px; margin-top:9px;
  font-size:11.5px; color:var(--slate-muted);
}
.hq-empty { font-size:12px; color:var(--slate-pale); margin-bottom:10px; }
.hq-add {
  display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
  padding:9px; border-radius:var(--r-sm);
  border:1.5px dashed var(--slate-pale); background:none; color:var(--slate-mid);
  font-family:inherit; font-size:12.5px; font-weight:600; transition:all .2s;
}
.hq-add:hover { border-color:var(--coral); color:var(--coral); background:var(--coral-soft); }
.hq-note { font-size:11.5px; line-height:1.55; color:var(--slate-muted); margin-top:10px; }
.hq-note b { color:var(--slate-deep); }


.view-sw {
  display:inline-flex; gap:2px; padding:2px;
  background:var(--aqua-pale); border-radius:var(--r-full);
}
.view-sw button {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 13px; border:none; border-radius:var(--r-full);
  background:none; color:var(--slate-muted);
  font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
  transition:background .18s, color .18s;
}
.view-sw button:hover { color:var(--slate-deep); }
.view-sw button.on { background:var(--coral); color:#fff; }

/* Режим карты: список уходит, карта занимает всю колонку контента.
   Фильтры слева остаются — они и в этом режиме работают. */
.grid3.map-mode { grid-template-columns:300px minmax(0,1fr); }
.grid3.map-mode .res-col { display:none; }
.grid3.map-mode .map-col { display:flex; flex-direction:column; }
.grid3.map-mode .map-canvas {
  height:calc(100vh - var(--top-nav) - var(--top-bar) - 96px);
  min-height:460px;
}

/* Карточка объекта поверх карты — открывается по клику на пин. */
.map-card {
  position:absolute; left:16px; bottom:16px; z-index:40;
  width:min(300px, calc(100% - 32px));
  background:var(--white); border-radius:var(--r-lg);
  box-shadow:0 10px 40px rgba(53,78,99,.22); overflow:hidden;
}
.map-card[hidden] { display:none; }
.map-card-img { height:112px; background:var(--aqua-pale); }
.map-card-img img { width:100%; height:100%; object-fit:cover; }
.map-card-b { padding:13px 15px 15px; }
.map-card-t { font-size:15px; font-weight:700; color:var(--slate-deep); line-height:1.3; }
.map-card-s { font-size:12.5px; color:var(--slate-muted); margin:5px 0 11px; }
.map-card-go {
  display:block; text-align:center; padding:9px 14px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; font-size:13px; font-weight:600;
}
.map-card-x {
  position:absolute; top:9px; right:9px; width:26px; height:26px; border-radius:50%;
  border:none; background:rgba(255,255,255,.92); color:var(--slate-mid);
  display:flex; align-items:center; justify-content:center; font-size:13px;
  box-shadow:0 2px 10px rgba(53,78,99,.18);
}

/* ══════════════════════════════════════════════
   FILTER PANEL
   ══════════════════════════════════════════════ */
.fd-panel {
  position:sticky; top:calc(var(--top-nav) + var(--top-bar));
  background:var(--white);
  border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.fd-head {
  display:flex; align-items:center; gap:10px;
  padding:14px 18px;
  border-bottom:1px solid rgba(197,227,225,.3);
}
.fd-title { font-family:'Literata',Georgia,serif;font-weight:600; font-size:19px; color:var(--slate-deep); flex:1; }
.fd-reset {
  border:none; background:none; padding:0;
  font-size:12.5px; font-weight:600; color:var(--slate-muted);
  transition:color .2s;
}
.fd-reset:hover { color:var(--coral); }
.fd-close {
  display:none;
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--slate-pale); background:var(--white);
  align-items:center; justify-content:center;
  color:var(--slate-muted); transition:all .2s; flex-shrink:0;
}
.fd-close:hover { border-color:var(--coral); color:var(--coral); }
.fd-body {
  max-height:calc(100vh - var(--top-nav) - var(--top-bar) - 120px);
  overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:var(--slate-pale) transparent;
}
.fd-body::-webkit-scrollbar { width:6px; }
.fd-body::-webkit-scrollbar-thumb { background:var(--aqua-2); border-radius:3px; }

/* группа-аккордеон */
.fd-group { border-bottom:1px solid rgba(197,227,225,.28); }
.fd-group:last-child { border-bottom:none; }
.fd-group > summary {
  list-style:none; cursor:pointer;
  padding:13px 18px;
  display:flex; align-items:center; gap:8px;
  font-size:13px; font-weight:600; color:var(--slate-deep);
  transition:background .15s;
}
.fd-group > summary::-webkit-details-marker { display:none; }
.fd-group > summary:hover { background:var(--aqua-pale); }
.fd-gcount {
  min-width:18px; height:18px; padding:0 6px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.fd-chev { margin-left:auto; color:var(--slate-pale); font-size:10px; transition:transform .2s; }
.fd-group[open] .fd-chev { transform:rotate(90deg); }
.fd-gbody { padding:2px 18px 16px; }

/* чекбокс с фасетным счётчиком */
.fd-check {
  display:flex; align-items:center; gap:10px;
  font-size:13px; color:var(--slate-mid);
  padding:6px 0; cursor:pointer;
  transition:opacity .2s;
}
.fd-check input { display:none; }
.fd-box {
  width:18px; height:18px; border-radius:5px;
  border:1.5px solid var(--slate-pale);
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
.fd-check input:checked ~ .fd-box { background:var(--coral); border-color:var(--coral); }
.fd-check input:checked ~ .fd-box svg { opacity:1; }
.fd-box svg { opacity:0; transition:opacity .15s; }
.fd-lbl { flex:1; }
.fd-cnt { font-size:11.5px; color:var(--slate-pale); font-weight:600; flex:none; }
.fd-check.off { opacity:.38; cursor:not-allowed; }
.fd-check:not(.off):hover .fd-lbl { color:var(--slate-deep); }

/* числовые поля и слайдеры */
.fd-row2 { display:flex; gap:10px; }
.fd-mini { flex:1; }
.fd-mini label { display:block; font-size:11.5px; color:var(--slate-muted); margin-bottom:4px; }
.fd-mini input {
  width:100%; padding:8px 12px; border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.55); background:var(--white);
  font-family:inherit; font-size:13px; color:var(--slate); outline:none;
  transition:border-color .2s;
}
.fd-mini input:focus { border-color:var(--coral); }
.fd-mini input:disabled { background:var(--bg); color:var(--slate-pale); cursor:not-allowed; }

.fd-seatrow {
  display:flex; align-items:center; justify-content:space-between;
  font-size:13px; color:var(--slate-mid); padding-top:9px;
}
.fd-seatrow .v { font-weight:700; color:var(--slate-deep); }
.fd-range input[type=range] {
  width:100%; -webkit-appearance:none; height:4px; margin-top:5px;
  border-radius:2px; background:var(--aqua-2); outline:none;
}
.fd-range input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px;
  border-radius:50%; background:var(--aqua-3); cursor:pointer;
  border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(168,212,216,.45);
  transition:transform .15s, box-shadow .15s;
}
.fd-range input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); box-shadow:0 2px 14px rgba(168,212,216,.6); }
.fd-range input[type=range]::-moz-range-thumb {
  width:16px; height:16px; border-radius:50%;
  background:var(--aqua-3); cursor:pointer;
  border:2.5px solid #fff; box-shadow:0 2px 8px rgba(168,212,216,.45);
}
.fd-range input[type=range]:disabled { opacity:.4; }

/* двойной слайдер цены */
.fd-dual .fd-vals {
  display:flex; justify-content:space-between;
  font-size:12.5px; font-weight:700; color:var(--slate-deep);
  margin-bottom:2px;
}
.fd-dual .fd-track { position:relative; height:26px; }
.fd-dual .fd-rail { position:absolute; top:11px; left:0; right:0; height:4px; background:var(--aqua-2); border-radius:2px; }
.fd-dual .fd-fill { position:absolute; top:11px; height:4px; background:var(--coral); border-radius:2px; }
.fd-dual input[type=range] {
  position:absolute; top:0; left:0; width:100%; margin:0;
  -webkit-appearance:none; appearance:none;
  background:none; pointer-events:none; height:26px;
}
.fd-dual input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; pointer-events:auto;
  width:16px; height:16px; border-radius:50%;
  background:#fff; border:2.5px solid var(--coral); cursor:pointer;
  box-shadow:var(--sh-sm);
}
.fd-dual input[type=range]::-moz-range-thumb {
  pointer-events:auto; width:16px; height:16px; border-radius:50%;
  background:#fff; border:2.5px solid var(--coral); cursor:pointer;
}

/* подсказка о тарифе */
.fd-lock {
  margin-top:10px; padding-top:9px;
  border-top:1px dashed rgba(197,227,225,.6);
  font-size:11.5px; line-height:1.5; color:var(--slate-muted);
}
.fd-lock b { color:var(--slate-deep); font-weight:600; }
.fd-note {
  margin:14px 18px 16px; padding:12px 14px;
  background:var(--aqua-pale); border-radius:var(--r-sm);
  font-size:11.5px; line-height:1.55; color:var(--slate-mid);
}
.fd-note .fd-up {
  display:inline-block; margin-top:8px;
  padding:7px 16px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; border:none;
  font-size:12px; font-weight:600;
  box-shadow:var(--sh-coral); transition:background .2s;
}
.fd-note .fd-up:hover { background:var(--coral-hover); }

/* ══════════════════════════════════════════════
   RESULTS COLUMN
   ══════════════════════════════════════════════ */
.res-head {
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; flex-wrap:wrap; margin-bottom:12px;
}
.res-count { font-family:'Literata',Georgia,serif;font-weight:600; font-size:22px; color:var(--slate-deep); }
.res-count b { font-weight:400; color:var(--coral); }
.res-tools { display:flex; align-items:center; gap:8px; }
.res-sort {
  padding:8px 14px; border-radius:var(--r-full);
  font-family:inherit; font-size:12.5px; font-weight:500;
  background:var(--white); color:var(--slate);
  border:1.5px solid rgba(197,227,225,.5);
  outline:none; transition:border-color .2s;
}
.res-sort:hover { border-color:var(--aqua-3); }
.res-clear {
  padding:8px 14px; border-radius:var(--r-full);
  font-size:12.5px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate);
  border:none; transition:all .2s;
}
.res-clear:hover { background:var(--aqua-1); color:var(--slate-deep); }

/* чипы выбранных фильтров */
.f-chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
.f-chip {
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 8px 6px 14px; border-radius:var(--r-full);
  font-size:12.5px; font-weight:500;
  background:var(--coral-soft); color:var(--coral);
  border:1.5px solid transparent;
}
.f-chip.black { background:var(--aqua-pale); color:var(--slate-mid); }
.f-chip button {
  width:18px; height:18px; border-radius:50%;
  border:none; background:rgba(255,255,255,.75);
  color:inherit; font-size:11px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.f-chip button:hover { background:#fff; }

/* ── блок объекта ── */
.vlist { display:flex; flex-direction:column; gap:16px; }
.vb {
  background:var(--white);
  border:1px solid rgba(197,227,225,.28);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  padding:18px 18px 12px;
  transition:border-color .25s, box-shadow .25s;
}
.vb.hi { border-color:var(--coral); box-shadow:0 0 0 2px var(--coral-glow), var(--sh-lg); }
.vb-head {
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin-bottom:14px;
}
.vb-name {
  font-size:17px; font-weight:700; color:var(--slate-deep);
  letter-spacing:-.2px; transition:color .2s;
}
.vb-name:hover { color:var(--coral); }
.vb-meta {
  display:flex; gap:14px; flex-wrap:wrap; margin-top:5px;
  font-size:12.5px; color:var(--slate-muted);
}
.vb-meta b { color:var(--slate-deep); font-weight:700; }
.vb-stars { color:#F0B95A; letter-spacing:1px; }
.fd-stars { color:#F0B95A; letter-spacing:2px; font-size:14px; }
.vb-rating { display:inline-flex; align-items:center; gap:4px; }
.vb-rating svg { color:#F0B95A; }
.vb-black {
  width:34px; height:34px; flex-shrink:0; padding:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--white); color:var(--slate-pale);
  border:1.5px solid rgba(197,227,225,.55);
  transition:all .2s;
}
.vb-black:hover { border-color:var(--coral); color:var(--coral); }

/* Метка бонусной программы: выгода пользователя, поэтому акцентом. */
.vb-loyal {
  display:inline-block; margin-left:10px; vertical-align:2px;
  padding:4px 11px; border-radius:var(--r-full);
  background:var(--coral); color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
}

/* Какие залы закрыли требования конструктора. */
.vb-match {
  margin:-4px 0 10px; font-size:12px; color:var(--slate-muted);
}
.vb-match b { color:var(--slate-deep); }

/* ── лента залов ── */
.rail-wrap { position:relative; }
.rail {
  display:flex; gap:12px; overflow-x:auto;
  scroll-snap-type:x proximity;
  padding:2px 2px 10px;
  scrollbar-width:thin; scrollbar-color:var(--aqua-2) transparent;
}
.rail::-webkit-scrollbar { height:6px; }
.rail::-webkit-scrollbar-thumb { background:var(--aqua-2); border-radius:3px; }
.rail-btn {
  position:absolute; top:38%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
  border:1.5px solid rgba(197,227,225,.6);
  color:var(--slate); font-size:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh-md); transition:all .2s; z-index:2;
}
.rail-btn:hover { background:#fff; color:var(--coral); border-color:var(--coral); }
.rail-btn.p { left:-10px; }
.rail-btn.n { right:-10px; }

/* ── карточка зала ── */
.hc {
  flex:0 0 208px; scroll-snap-align:start;
  border:1px solid rgba(197,227,225,.32);
  border-radius:var(--r-md); overflow:hidden;
  background:var(--white);
  transition:border-color .25s, box-shadow .25s, transform .25s;
}
.hc:hover { transform:translateY(-3px); box-shadow:var(--sh-lg); }
.hc.picked { border-color:var(--coral); box-shadow:inset 0 0 0 1px var(--coral); }
.hc-img { height:104px; position:relative; overflow:hidden; background:var(--aqua-pale); }
.hc-img img { width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.22,1,.36,1); }
.hc:hover .hc-img img { transform:scale(1.06); }
.hc-tags { position:absolute; top:8px; left:8px; display:flex; gap:5px; flex-wrap:wrap; }
.hc-tag {
  padding:3px 9px; border-radius:var(--r-full);
  font-size:10px; font-weight:600;
  background:rgba(255,255,255,.9); color:var(--slate);
  backdrop-filter:blur(8px);
}
.hc-tag.plan { background:rgba(233,134,103,.9); color:#fff; }
.hc-body { padding:11px 12px 12px; }
.hc-name { font-size:13.5px; font-weight:700; color:var(--slate-deep); margin-bottom:8px; line-height:1.3; }
.hc-caps { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:9px; min-height:20px; }
.hc-cap {
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate-mid);
  border-radius:5px; padding:3px 6px;
}
.hc-cap .ml-seat { color:var(--slate-muted); }
.hc-price { font-size:15px; font-weight:800; color:var(--slate-deep); margin-bottom:10px; }
.hc-price i { font-style:normal; font-size:11.5px; font-weight:500; color:var(--slate-muted); }
.hc-foot { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.hc-acts { display:flex; gap:6px; }
.hc-ic {
  width:30px; height:30px; border-radius:50%;
  background:var(--aqua-pale); border:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--slate-muted); transition:all .2s;
}
.hc-ic:hover:not(:disabled) { background:var(--coral-soft); color:var(--coral); }
.hc-ic.on { background:var(--coral-soft); color:var(--coral); }
.hc-ic.on svg { fill:currentColor; }
.hc-ic:disabled { opacity:.35; cursor:not-allowed; }
.hc-more {
  padding:7px 12px; border-radius:var(--r-full);
  font-size:12px; font-weight:600;
  background:var(--aqua-pale); color:var(--slate);
  border:none; transition:all .2s; white-space:nowrap;
}
.hc-more:hover { background:var(--coral); color:#fff; }

/* пустая выдача */
.res-empty {
  background:var(--white); border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg); box-shadow:var(--sh-md);
  padding:48px 24px; text-align:center;
}
.res-empty h3 { font-family:'Literata',Georgia,serif; font-size:21px; color:var(--slate-deep); margin-bottom:8px; font-weight:600; }
.res-empty p { font-size:13.5px; color:var(--slate-muted); margin-bottom:18px; }
.res-empty button {
  padding:11px 26px; border-radius:var(--r-full);
  background:var(--coral); color:#fff; border:none;
  font-size:14px; font-weight:600; box-shadow:var(--sh-coral);
  transition:background .2s;
}
.res-empty button:hover { background:var(--coral-hover); }

.res-note {
  margin-top:16px; padding:13px 16px;
  background:var(--white); border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-md);
  font-size:11.5px; line-height:1.6; color:var(--slate-muted);
}

/* ══════════════════════════════════════════════
   MAP
   ══════════════════════════════════════════════ */
.map-col {
  position:sticky; top:calc(var(--top-nav) + var(--top-bar));
  background:var(--white);
  border:1px solid rgba(197,227,225,.3);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-md);
  overflow:hidden;
}
.map-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px; border-bottom:1px solid rgba(197,227,225,.3);
}
.map-head b { font-size:13px; font-weight:700; color:var(--slate-deep); }
.map-head span { font-size:11px; color:var(--slate-pale); }
.map-canvas {
  position:relative; overflow:hidden;
  height:calc(100vh - var(--top-nav) - var(--top-bar) - 150px);
  min-height:400px;
  background:var(--aqua-pale);
}
.map-scale {
  position:absolute; inset:0;
  transform-origin:center center;
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.map-bg { width:100%; height:100%; display:block; }

.map-pin {
  position:absolute; transform:translate(-50%,-100%);
  cursor:pointer; transition:transform .25s, filter .25s; z-index:3;
  border:none; background:none; padding:0;
}
.map-pin:hover { z-index:5; transform:translate(-50%,-100%) scale(1.14); }
.pin-body {
  display:flex; align-items:center; gap:4px;
  background:var(--white); color:var(--slate-deep);
  border:1.5px solid var(--coral);
  padding:5px 11px; border-radius:var(--r-full);
  font-size:11.5px; font-weight:700;
  box-shadow:var(--sh-md);
  white-space:nowrap; position:relative;
}
.pin-body::after {
  content:''; position:absolute;
  bottom:-6px; left:50%; transform:translateX(-50%);
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:6px solid var(--coral);
}
.map-pin.hi { z-index:6; transform:translate(-50%,-100%) scale(1.2); }
.map-pin.hi .pin-body { background:var(--coral); color:#fff; border-color:var(--coral); }

/* всплывашка с фото и названием */
.pin-pop {
  position:absolute; transform:translate(-50%,-100%);
  margin-top:-38px; width:176px; z-index:7;
  background:var(--white); border:1px solid rgba(197,227,225,.5);
  border-radius:var(--r-md); overflow:hidden;
  box-shadow:var(--sh-lg); pointer-events:none;
  animation:popIn .18s ease both;
}
@keyframes popIn { from { opacity:0; transform:translate(-50%,-96%); } to { opacity:1; transform:translate(-50%,-100%); } }
.pin-pop-img { height:74px; background:var(--aqua-pale); }
.pin-pop-img img { width:100%; height:100%; object-fit:cover; }
.pin-pop-t { padding:8px 10px; font-size:12px; font-weight:700; color:var(--slate-deep); line-height:1.3; }
.pin-pop-s { padding:0 10px 9px; font-size:11px; color:var(--slate-muted); }

.map-zoom {
  position:absolute; bottom:16px; left:16px; z-index:8;
  display:flex; flex-direction:column; gap:2px;
  border-radius:10px; overflow:hidden; box-shadow:var(--sh-md);
}
.map-zoom button {
  width:36px; height:36px; border:none;
  background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  color:var(--slate); font-size:17px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.map-zoom button:hover:not(:disabled) { background:#fff; color:var(--coral); }
.map-zoom button:disabled { opacity:.4; cursor:not-allowed; }

/* ══════════════════════════════════════════════
   COMPARE BAR
   ══════════════════════════════════════════════ */
.cmp-bar {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px);
  z-index:400; display:flex; align-items:center; gap:14px;
  background:var(--slate-deep); color:#fff;
  border-radius:var(--r-full); padding:12px 18px 12px 22px;
  box-shadow:0 8px 32px rgba(53,78,99,.25);
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.cmp-bar.show { transform:translateX(-50%) translateY(0); }
.cmp-bar span { font-size:13px; font-weight:600; white-space:nowrap; }
.cmp-go {
  padding:8px 20px; border-radius:var(--r-full);
  background:var(--coral); border:none; color:#fff;
  font-size:13px; font-weight:600; transition:background .2s;
}
.cmp-go:hover { background:var(--coral-hover); }
.cmp-clear {
  background:none; border:none; color:rgba(255,255,255,.6);
  font-size:17px; line-height:1; padding:0 4px; transition:color .2s;
}
.cmp-clear:hover { color:#fff; }

/* ══════════════════════════════════════════════
   RESPONSIVE
   ══════════════════════════════════════════════ */
@media(max-width:1180px) {
  .grid3 { grid-template-columns:280px minmax(0,1fr); }
  .map-col { display:none; }
  .grid3.map-mode { grid-template-columns:300px minmax(0,1fr); }
}
@media(max-width:900px) {
  .grid3 { grid-template-columns:minmax(0,1fr); padding:16px 18px 40px; }
  /* На узком экране карта заменяет список целиком. */
  .grid3.map-mode { grid-template-columns:minmax(0,1fr); }
  .grid3.map-mode .map-canvas { height:calc(100vh - var(--top-nav) - 150px); min-height:380px; }
  .filter-toggle { display:flex; }
  .fd-close { display:flex; }
  /* фильтры уезжают в выдвижную панель */
  .fd-panel {
    position:fixed; top:0; left:0; bottom:0;
    width:min(340px,88vw); border-radius:0; z-index:600;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
    box-shadow:0 8px 40px rgba(53,78,99,.18);
  }
  .fd-panel.open { transform:translateX(0); }
  .fd-body { max-height:calc(100vh - 62px); }
  .fd-backdrop {
    position:fixed; inset:0; z-index:599;
    background:rgba(53,78,99,.35); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .fd-backdrop.open { opacity:1; pointer-events:auto; }
  .control-bar { padding:10px 18px; gap:9px; }
  .cb-field input, .cb-field select { min-width:0; width:100%; }
  .cb-field { flex:1 1 132px; }
}
@media(max-width:560px) {
  .res-count { font-size:18px; }
  .hc { flex:0 0 178px; }
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="page-wrap">

  <!-- ══════ ПАРАМЕТРЫ ЗАПРОСА ══════ -->
  <div class="control-bar">
    <button class="filter-toggle" id="filterToggle" onclick="toggleFilter()">
      <svg width="15" height="15" fill="none" viewBox="0 0 15 15"><path d="M2 3.5h11M4 7.5h7M5.5 11.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Фильтр
      <span class="ft-count" id="ftCount">0</span>
    </button>
    <div class="cb-field">
      <label for="cbCity">Город</label>
      <select id="cbCity" onchange="F.city=this.value;render()"></select>
    </div>
    <div class="cb-field">
      <label for="cbPeople">Кол-во участников</label>
      <input id="cbPeople" type="number" min="0" step="10" placeholder="любое" onchange="F.people=+this.value||0;render()">
    </div>
    <div class="cb-field">
      <label for="cbEvent">Тип мероприятия</label>
      <select id="cbEvent" onchange="F.eventType=this.value;renderFilters();render()"></select>
    </div>
    <div class="cb-right">
      <div class="view-sw" role="group" aria-label="Вид отображения">
        <button id="viewList" onclick="setView('list')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
          <span>Списком</span>
        </button>
        <button id="viewMap" onclick="setView('map')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.2 2 4v9.8L6 12l4 1.8 4-1.8V2.2L10 4z"/><path d="M6 2.2V12M10 4v9.8"/></svg>
          <span>На карте</span>
        </button>
      </div>
      <span class="cb-tariff">Тариф: <b id="cbTariff">—</b></span>
    </div>
  </div>

  <div class="grid3">

    <!-- ══════ ФИЛЬТРЫ ══════ -->
    <aside class="fd-panel" id="filterDrawer">
      <div class="fd-head">
        <div class="fd-title">Фильтры</div>
        <button class="fd-reset" onclick="resetAll()">Сбросить всё</button>
        <button class="fd-close" onclick="toggleFilter()" aria-label="Закрыть">
          <svg width="12" height="12" fill="none" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="fd-body" id="fdBody"></div>
    </aside>

    <!-- ══════ ВЫДАЧА ══════ -->
    <div class="res-col">
      <div class="res-head">
        <div class="res-count" id="resCount">—</div>
        <div class="res-tools">
          <button class="res-clear" id="resClear" onclick="clearCompare()" hidden>Очистить сравнение</button>
          <select class="res-sort" id="resSort" onchange="SORT=this.value;render()">
            <option value="rel">Сначала релевантные</option>
            <option value="price">По цене ↑</option>
            <option value="cap">По вместимости ↓</option>
            <option value="rating">По рейтингу ↓</option>
          </select>
        </div>
      </div>
      <div class="f-chips" id="fChips"></div>
      <div class="vlist" id="vList"></div>
      <div class="res-note">
        Залы с ценой «по договорённости» остаются в выдаче всегда.
      </div>
    </div>

    <!-- ══════ КАРТА ══════ -->
    <aside class="map-col" id="mapCol">
      <div class="map-head">
        <b>На карте · <span id="mapCount">0</span></b>
      </div>
      <div class="map-canvas" id="mapCanvas">
        <div class="map-scale" id="mapScale"></div>
        <div class="map-card" id="mapCard" hidden></div>
        <div class="map-zoom">
          <button id="zoomIn" onclick="zoom(1)" aria-label="Приблизить">+</button>
          <button id="zoomOut" onclick="zoom(-1)" aria-label="Отдалить">−</button>
        </div>
      </div>
    </aside>

  </div>
</div>

<div class="fd-backdrop" id="fdBackdrop" onclick="toggleFilter()"></div>

<div class="cmp-bar" id="cmpBar">
  <span><b id="cmpCount">0</b> <span id="cmpWord">залов</span> в сравнении</span>
  <button class="cmp-go" onclick="openCompare()">Сравнить</button>
  <button class="cmp-clear" onclick="clearCompare()" aria-label="Очистить">✕</button>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init('map');

/* ══════════════════════════════════════════════
   СОСТОЯНИЕ
   ══════════════════════════════════════════════ */
let F = ML.loadFilters();   // выборка переживает уход на карточку и возврат
/* Вид отображения держим в sessionStorage: возврат с карточки объекта
   не должен сбрасывать выбранный режим. */
let VIEW = (() => {
  try { return sessionStorage.getItem('ml_search_view') === 'map' ? 'map' : 'list'; }
  catch (e) { return 'list'; }
})();
let HOVER = null;                 // id объекта, подсвеченного на карте
let SORT = 'rel';
let ZOOM = 1;
const OPEN = new Set(['cap', 'cats']);   // раскрытые группы фильтров

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const jt  = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

const IC = {
  hide: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.7a3 3 0 004.2 4.2"/><path d="M9.4 5.2A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17.6 17.6 0 01-3.4 4.2M6.3 6.5C3.7 8.2 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/></svg>',
  check: '<svg width="11" height="11" fill="none" viewBox="0 0 11 11"><path d="M2 5.5l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  star:  '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  cmp:   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 7h18M6 7v4M12 7v8M18 7v4"/></svg>',
  heart: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
};

/* Какие группы фильтров доступны на текущем тарифе.
   Правила берём из самого тарифа (ML.TARIFFS[...].filters), а не выдумываем. */
function canUse(group) {
  const f = ML.tariff().filters;
  if (f === 'all') return true;
  if (f === 'all-except-seating-twin') return group !== 'seats' && group !== 'twin';
  if (Array.isArray(f)) return f.includes(group);
  return true;
}

/* ══════════════════════════════════════════════
   ПАНЕЛЬ ФИЛЬТРОВ
   ══════════════════════════════════════════════ */
function fgroup(key, title, body, n) {
  return `<details class="fd-group" data-k="${key}" ${OPEN.has(key) ? 'open' : ''} ontoggle="OPEN[this.open?'add':'delete']('${key}')">
    <summary>${title}${n ? `<span class="fd-gcount">${n}</span>` : ''}<span class="fd-chev">▶</span></summary>
    <div class="fd-gbody">${body}</div>
  </details>`;
}

function checks(group, items, locked) {
  return items.map(x => `<label class="fd-check${locked ? ' off' : ''}" data-g="${group}" data-item="${esc(x)}">
    <input type="checkbox" ${F[group].has(x) ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="togSet('${group}','${jt(x)}')">
    <span class="fd-box">${IC.check}</span>
    <span class="fd-lbl">${esc(x)}</span><span class="fd-cnt"></span></label>`).join('');
}

function togSet(group, value) { const s = F[group]; s.has(value) ? s.delete(value) : s.add(value); render(); }

/* Звёздность — отдельная группа: значения числовые, метка рисуется звёздами.
   Логика «ИЛИ», как у категорий, и так же доступна на бесплатном тарифе. */
function starChecks() {
  return [3, 4, 5].map(n => `<label class="fd-check" data-g="stars" data-item="${n}">
    <input type="checkbox" ${F.stars.has(n) ? 'checked' : ''} onchange="togStar(${n})">
    <span class="fd-box">${IC.check}</span>
    <span class="fd-lbl"><span class="fd-stars">${'★'.repeat(n)}</span></span><span class="fd-cnt"></span></label>`).join('');
}
function togStar(n) { F.stars.has(n) ? F.stars.delete(n) : F.stars.add(n); render(); }

function lockNote(group, tariffName) {
  return canUse(group) ? '' : `<div class="fd-lock">Доступно с тарифа <b>«${tariffName}»</b></div>`;
}

function renderFilters() {
  const t = ML.tariff();
  const lockFeat = !canUse('food');     // группы удобств открываются все разом
  let h = '';

  // Вместимость
  h += fgroup('cap', 'Вместимость',
    `<div class="fd-seatrow"><span>Не менее</span><span class="v" id="capVal">${F.people || '—'} чел.</span></div>
     <div class="fd-range"><input type="range" min="0" max="900" step="10" value="${F.people}"
       oninput="document.getElementById('capVal').textContent=(+this.value||'—')+' чел.'"
       onchange="F.people=+this.value;render()"></div>`,
    F.people ? 1 : 0);

  // Категории объектов — единственная группа с логикой «ИЛИ»
  h += fgroup('cats', 'Категории объектов', checks('cats', ML.VENUE_CATS, false), F.cats.size);

  // Звёздность — отдельно от категории: она есть только у отелей
  h += fgroup('stars', 'Звёздность', starChecks(), F.stars.size);

  /* Проживание. ПРЕМИУМ — номера TWIN и SNGL; БИЗНЕС — общий фонд и SNGL,
     TWIN закрыт; на бесплатных тарифах группа заблокирована. */
  const roomsBody = canUse('twin')
    ? `<div class="fd-row2">
         <div class="fd-mini"><label>TWIN от</label>
           <input type="number" min="0" value="${F.twin || ''}"
             onchange="F.twin=+this.value||0;render()"></div>
         <div class="fd-mini"><label>SNGL от</label>
           <input type="number" min="0" value="${F.sngl || ''}"
             onchange="F.sngl=+this.value||0;render()"></div>
       </div>`
    : canUse('sngl')
    ? `<div class="fd-row2">
         <div class="fd-mini"><label>Номеров от</label>
           <input type="number" min="0" value="${F.rooms || ''}"
             onchange="F.rooms=+this.value||0;render()"></div>
         <div class="fd-mini"><label>SNGL от</label>
           <input type="number" min="0" value="${F.sngl || ''}"
             onchange="F.sngl=+this.value||0;render()"></div>
       </div>
       <div class="fd-lock">Фильтр по номерам TWIN доступен на тарифе <b>«ПРЕМИУМ»</b></div>`
    : `<div class="fd-mini"><label>Номеров от</label>
         <input type="number" min="0" value="${F.rooms || ''}" disabled
           onchange="F.rooms=+this.value||0;render()"></div>
       ${lockNote('rooms', 'БИЗНЕС')}`;
  h += fgroup('rooms', 'Проживание', roomsBody,
    canUse('twin') ? (F.twin ? 1 : 0) + (F.sngl ? 1 : 0)
      : canUse('sngl') ? (F.rooms ? 1 : 0) + (F.sngl ? 1 : 0) : (F.rooms ? 1 : 0));

  h += fgroup('halls', 'Залы', hallsBuilder(),
    (F.halls || []).filter(r => r.seating || +r.min).length);

  // Стоимость
  h += fgroup('price', 'Стоимость аренды зала',
    canUse('priceDay')
      ? dualPrice()
      : `<div class="fd-lock">Фильтр по стоимости доступен с тарифа <b>«БИЗНЕС»</b></div>`,
    (F.priceDay[0] > 0 || F.priceDay[1] < 200000) ? 1 : 0);

  // Группы удобств — список берём из ML.FEATURE_GROUPS / ML.FEATURES
  ML.FEATURE_GROUPS.forEach(g => {
    if (g.onlyEvent && g.onlyEvent !== F.eventType) return;
    h += fgroup(g.k, esc(g.l), checks(g.k, ML.FEATURES[g.k], lockFeat) + lockNote(g.k, 'БИЗНЕС'), F[g.k].size);
  });

  if (!t.fullInfo) {
    h += `<div class="fd-note">Тариф <b>«${esc(t.name)}»</b>: доступны только категории объектов, город и количество гостей.
      Остальные фильтры и полная информация о залах — с тарифа «БИЗНЕС».
      <button class="fd-up" onclick="MH.go('pricing.html')">Сравнить тарифы</button></div>`;
  }

  document.getElementById('fdBody').innerHTML = h;
  bindDual();
}

/* ══════════════════════════════════════════════
   КОНСТРУКТОР ТРЕБОВАНИЙ К ЗАЛАМ

   Каждый блок — отдельный зал объекта. Два требования означают ДВА РАЗНЫХ
   зала: подбор делает ML.filterVenues, здесь только форма. Пустая схема —
   «любая», так ищется «два зала от 80 человек».

   Тарифы: на СТАРТ конструктор закрыт целиком, на БИЗНЕС задаётся только
   вместимость — по договору схемы рассадки премиальный фильтр.
   ══════════════════════════════════════════════ */
function hallsBuilder() {
  if (!canUse('halls')) {
    return '<div class="fd-lock">Подбор по залам доступен с тарифа <b>«БИЗНЕС»</b></div>';
  }
  const canSeat = canUse('seats');
  const list = F.halls || [];
  const rows = list.map((r, i) => `
    <div class="hq" data-i="${i}">
      <div class="hq-top">
        <span class="hq-n">Зал ${i + 1}</span>
        <button class="hq-x" onclick="hallDel(${i})" title="Убрать требование" aria-label="Убрать зал ${i + 1}">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
      <label class="hq-f">
        <span>Схема рассадки</span>
        <select ${canSeat ? '' : 'disabled'} onchange="hallSet(${i},'seating',this.value)">
          <option value="">Любая схема</option>
          ${ML.SEATING.map(s => `<option value="${s.k}"${r.seating === s.k ? ' selected' : ''}>${esc(s.l)}</option>`).join('')}
        </select>
      </label>
      <label class="hq-f hq-min">
        <span>Вместимость от</span>
        <input type="number" min="0" step="10" value="${r.min || ''}" placeholder="—"
          onchange="hallSet(${i},'min',+this.value||0)">
      </label>
      ${r.seating && canSeat ? `<div class="hq-ic">${MH.seatIcon(r.seating, { size: 15 })}<span>${esc((ML.seatingByKey(r.seating) || {}).l || '')}</span></div>` : ''}
    </div>`).join('');

  return `${rows || '<div class="hq-empty">Требований нет — в выдаче все объекты</div>'}
    <button class="hq-add" onclick="hallAdd()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"/></svg>
      Добавить зал
    </button>
    ${canSeat ? '' : '<div class="fd-lock">Выбор схемы рассадки доступен на тарифе <b>«ПРЕМИУМ»</b> — сейчас требование считается по любой схеме</div>'}
    ${list.length > 1 ? '<div class="hq-note">Каждое требование закрывает <b>отдельный</b> зал объекта.</div>' : ''}`;
}

function hallAdd() { (F.halls = F.halls || []).push({ seating: '', min: 0 }); render(); }
function hallDel(i) { F.halls.splice(i, 1); render(); }
function hallSet(i, k, v) { F.halls[i][k] = v; render(); }


/* двойной слайдер цены */
function dualPrice() {
  const [a, b] = F.priceDay;
  return `<div class="fd-dual" id="priceDual" data-min="0" data-max="200000">
    <div class="fd-vals"><span class="lo">${a.toLocaleString('ru')} ₽</span><span class="hi">${b.toLocaleString('ru')} ₽</span></div>
    <div class="fd-track">
      <div class="fd-rail"></div><div class="fd-fill"></div>
      <input type="range" class="lo" min="0" max="200000" step="5000" value="${a}">
      <input type="range" class="hi" min="0" max="200000" step="5000" value="${b}">
    </div></div>`;
}
function bindDual() {
  const d = document.getElementById('priceDual');
  if (!d) return;
  const lo = d.querySelector('input.lo'), hi = d.querySelector('input.hi');
  const fill = d.querySelector('.fd-fill'), lv = d.querySelector('.fd-vals .lo'), hv = d.querySelector('.fd-vals .hi');
  const mn = +d.dataset.min, mx = +d.dataset.max;
  const upd = commit => {
    let a = +lo.value, b = +hi.value;
    if (a > b) { [a, b] = [b, a]; lo.value = a; hi.value = b; }
    F.priceDay = [a, b];
    fill.style.left = ((a - mn) / (mx - mn) * 100) + '%';
    fill.style.right = (100 - (b - mn) / (mx - mn) * 100) + '%';
    lv.textContent = a.toLocaleString('ru') + ' ₽';
    hv.textContent = b.toLocaleString('ru') + ' ₽';
    if (commit) render();
  };
  lo.oninput = () => upd(false); hi.oninput = () => upd(false);
  lo.onchange = () => upd(true); hi.onchange = () => upd(true);
  upd(false);
}

/* Фасетные счётчики: сколько объектов останется, если добавить условие. */
function applyFacets() {
  document.querySelectorAll('#fdBody label.fd-check[data-g]').forEach(lb => {
    const g = lb.dataset.g, item = lb.dataset.item, inp = lb.querySelector('input');
    const n = ML.facetCount(F, g, item);
    lb.querySelector('.fd-cnt').textContent = '(' + n + ')';
    const lockedByTariff = g !== 'cats' && g !== 'stars' && !canUse(g);
    const dead = !inp.checked && n === 0;
    inp.disabled = lockedByTariff || dead;
    lb.classList.toggle('off', lockedByTariff || dead);
  });
}

/* ══════════════════════════════════════════════
   ЧИПЫ ВЫБРАННЫХ ФИЛЬТРОВ
   ══════════════════════════════════════════════ */
function renderChips() {
  const c = [];
  if (F.city) c.push(['Город: ' + F.city, () => F.city = '']);
  if (F.people) c.push(['от ' + F.people + ' чел.', () => F.people = 0]);
  if (F.rooms) c.push(['Номеров от ' + F.rooms, () => F.rooms = 0]);
  if (F.twin) c.push(['TWIN от ' + F.twin, () => F.twin = 0]);
  if (F.sngl) c.push(['SNGL от ' + F.sngl, () => F.sngl = 0]);
  if (F.priceDay[0] > 0 || F.priceDay[1] < 200000)
    c.push([`${F.priceDay[0].toLocaleString('ru')}–${F.priceDay[1].toLocaleString('ru')} ₽`, () => F.priceDay = [0, 200000]]);
  (F.halls || []).forEach((r, i) => { if (!r.seating && !+r.min) return;
    const s = ML.seatingByKey(r.seating);
    c.push([`Зал ${i + 1}: ${s ? s.l : 'любая схема'}${+r.min ? ' от ' + r.min : ''}`,
      () => F.halls.splice(i, 1)]); });
  ['cats', 'food', 'opts', 'other', 'sport'].forEach(g => F[g].forEach(x => c.push([x, () => F[g].delete(x)])));
  [...F.stars].sort().forEach(n => c.push([n + '★', () => F.stars.delete(n)]));
  [...ML.state.blacklist].forEach(id => {
    const v = ML.venueById(id);
    if (v) c.push(['Скрыт: ' + v.name, () => ML.removeFromBlacklist(id), true]);
  });

  window._chips = c;
  document.getElementById('fChips').innerHTML = c.map((x, i) =>
    `<span class="f-chip${x[2] ? ' black' : ''}">${esc(x[0])}<button onclick="_chips[${i}][1]();render()" aria-label="Убрать">✕</button></span>`).join('');

  document.getElementById('ftCount').textContent = c.length;
}

/* ══════════════════════════════════════════════
   ВЫДАЧА: объекты-контейнеры с лентой залов
   ══════════════════════════════════════════════ */
function sortList(list) {
  const arr = list.slice();
  if (SORT === 'price') arr.sort((a, b) => (ML.venueMinPrice(a.venue) || 1e9) - (ML.venueMinPrice(b.venue) || 1e9));
  else if (SORT === 'cap') arr.sort((a, b) => ML.venueCapacity(b.venue) - ML.venueCapacity(a.venue));
  else if (SORT === 'rating') arr.sort((a, b) => b.venue.rating - a.venue.rating);
  return arr;
}

function hallCard(h) {
  const t = ML.tariff();
  const inC = ML.inCompare(h.id);
  const fav = ML.isFav(h.id);
  // На «СТАРТ» вместо схем рассадки показываем площадь.
  const caps = t.fullInfo
    ? ML.SEATING.filter(s => h.seats[s.k]).slice(0, 4)
        .map(s => `<span class="hc-cap">${MH.seatIcon(s.k, { size: 14 })}${h.seats[s.k]}</span>`).join('')
    : `<span class="hc-cap">${h.area} м²</span>`;
  return `<article class="hc${inC ? ' picked' : ''}">
    <div class="hc-img">
      <img src="${ML.photoUrl(h.photo)}" alt="" loading="lazy">
      <div class="hc-tags">
        <span class="hc-tag">${esc(h.type)}</span>
        ${h.plan ? '<span class="hc-tag plan">План</span>' : ''}
      </div>
    </div>
    <div class="hc-body">
      <div class="hc-name">${esc(h.name)}</div>
      <div class="hc-caps">${MH.blurOnly(caps)}</div>
      <div class="hc-price">${MH.blurOnly(h.priceDay ? ML.money(h.priceDay) : '<i>по договорённости</i>')}</div>
      <div class="hc-foot">
        <div class="hc-acts">
          <button class="hc-ic${inC ? ' on' : ''}" onclick="toggleCmp(${h.id})" title="${inC ? 'Убрать из сравнения' : 'В сравнение'}">${IC.cmp}</button>
          <button class="hc-ic${fav ? ' on' : ''}" onclick="toggleFavHall(${h.id})" title="${fav ? 'Убрать из избранного' : 'В избранное'}">${IC.heart}</button>
        </div>
        <a class="hc-more" href="hall.html?id=${h.id}">Подробнее</a>
      </div>
    </div>
  </article>`;
}

function venueBlock(x) {
  const v = x.venue, halls = x.halls, t = ML.tariff();
  const cap = ML.venueCapacity(v);
  return `<section class="vb${HOVER === v.id ? ' hi' : ''}" data-vid="${v.id}"
      onmouseenter="setHover(${v.id})" onmouseleave="setHover(null)">
    <div class="vb-head">
      <div>
        <a class="vb-name" href="venue.html?id=${v.id}">${esc(v.name)}</a>
        ${v.loyaltyContract ? '<span class="vb-loyal">Бонусная программа</span>' : ''}
        <div class="vb-meta">
          <span>${esc(v.cat)}</span>
          <span>${esc(v.city)}${t.fullInfo && v.addr ? ' · ' + esc(v.addr) : ''}</span>
          <span>${MH.blurOnly('до <b>' + cap + '</b> чел.')}</span>
          <span><b>${halls.length}</b> ${ML.plural(halls.length, ['зал', 'зала', 'залов'])}${halls.length < v.halls.length ? ` из ${v.halls.length}` : ''}</span>
          ${v.stars ? `<span class="vb-stars">${'★'.repeat(v.stars)}</span>` : ''}
          <span class="vb-rating">${IC.star} <b>${v.rating}</b> (${v.reviews})</span>
        </div>
      </div>
      ${t.blacklist ? `<button class="vb-black" onclick="addBlack(${v.id})"
        title="Скрыть объект из выдачи" aria-label="Скрыть объект из выдачи">${IC.hide}</button>` : ''}
    </div>
    ${x.matched ? `<div class="vb-match">Требованиям отвечают: ${halls.map(h => esc(h.name)).join(' · ')}</div>` : ''}
    <div class="rail-wrap">
      <div class="rail" id="rail-${v.id}">${halls.map(hallCard).join('')}</div>
      ${halls.length > 2 ? `<button class="rail-btn p" onclick="scrollRail(${v.id},-1)" aria-label="Назад">‹</button>
      <button class="rail-btn n" onclick="scrollRail(${v.id},1)" aria-label="Вперёд">›</button>` : ''}
    </div>
  </section>`;
}

function scrollRail(id, d) {
  const el = document.getElementById('rail-' + id);
  if (el) el.scrollBy({ left: d * 220, behavior: 'smooth' });
}

/* ══════════════════════════════════════════════
   КАРТА
   ══════════════════════════════════════════════ */
const MAP_SVG = `<svg class="map-bg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="100" y2="100">
      <stop stop-color="#E2F0EF" offset="0"/>
      <stop stop-color="#CDE5E3" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#mg)"/>
  ${Array.from({ length: 28 }, (_, i) => {
    const x = 8 + (i * 3.2 + (i * 5) % 22);
    const y = 12 + ((i * 9 + 5) % 72);
    const w = 3 + (i % 4);
    const h = 2.5 + (i % 3);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx=".4" fill="#B8CDD8" opacity="${0.18 + (i % 3) * 0.07}"/>`;
  }).join('')}
  <ellipse cx="22" cy="58" rx="9" ry="7" fill="#8FC8B8" opacity=".28"/>
  <ellipse cx="70" cy="32" rx="7" ry="6" fill="#8FC8B8" opacity=".24"/>
  <ellipse cx="48" cy="78" rx="11" ry="5" fill="#8FC8B8" opacity=".22"/>
  <ellipse cx="82" cy="68" rx="6" ry="4" fill="#8FC8B8" opacity=".2"/>
  <path d="M0 38 Q22 28 50 34 T100 30" stroke="#fff" stroke-width="1.4" fill="none" opacity=".7"/>
  <path d="M0 55 Q25 48 52 54 T100 50" stroke="#fff" stroke-width="1.1" fill="none" opacity=".6"/>
  <path d="M0 70 Q30 64 55 70 T100 68" stroke="#fff" stroke-width=".9" fill="none" opacity=".5"/>
  <path d="M38 0 Q40 28 38 55 T42 100" stroke="#fff" stroke-width="1.2" fill="none" opacity=".65"/>
  <path d="M62 0 Q60 22 63 50 T60 100" stroke="#fff" stroke-width=".9" fill="none" opacity=".55"/>
  <path d="M0 38 Q22 28 50 34 T100 30" stroke="#9BBFC8" stroke-width=".5" fill="none" opacity=".6"/>
  <path d="M0 55 Q25 48 52 54 T100 50" stroke="#9BBFC8" stroke-width=".4" fill="none" opacity=".5"/>
  <path d="M38 0 Q40 28 38 55 T42 100" stroke="#9BBFC8" stroke-width=".4" fill="none" opacity=".5"/>
  <path d="M0 44 Q18 40 38 46 T68 42 T100 48" stroke="#7BB8C8" stroke-width="2.2" fill="none" opacity=".45"/>
  <path d="M0 44 Q18 40 38 46 T68 42 T100 48" stroke="#A8D4DC" stroke-width="1.2" fill="none" opacity=".6"/>
</svg>`;

function renderMap(list) {
  const pins = list.map(x => {
    const v = x.venue;
    return `<button class="map-pin${HOVER === v.id ? ' hi' : ''}" data-vid="${v.id}"
      style="left:${v.px}%;top:${v.py}%"
      onmouseenter="setHover(${v.id})" onmouseleave="setHover(null)"
      onclick="focusCard(${v.id})"
      title="${esc(v.name)}">
      <span class="pin-body">${x.halls.length} ${ML.plural(x.halls.length, ['зал', 'зала', 'залов'])}</span>
    </button>`;
  }).join('');

  // Пустой контейнер всплывашки. Наполняем его в setHover, а не перерисовкой
  // всей карты: иначе пин под курсором уничтожается и подсветка мерцает.
  document.getElementById('mapScale').innerHTML = MAP_SVG + pins + '<div class="pin-pop" id="pinPop" hidden></div>';
  document.getElementById('mapCount').textContent = list.length;
  paintHover();
}

/* Подсветка: наведение на блок объекта ↔ пин на карте. Без перерисовки DOM. */
function setHover(id) {
  if (HOVER === id) return;
  HOVER = id;
  paintHover();
}

function paintHover() {
  document.querySelectorAll('.map-pin').forEach(p => p.classList.toggle('hi', +p.dataset.vid === HOVER));
  document.querySelectorAll('.vb').forEach(b => b.classList.toggle('hi', +b.dataset.vid === HOVER));

  const pop = document.getElementById('pinPop');
  if (!pop) return;
  const hovered = currentList.find(x => x.venue.id === HOVER);
  if (!hovered) { pop.hidden = true; return; }
  const v = hovered.venue;
  pop.style.left = v.px + '%';
  pop.style.top = v.py + '%';
  pop.innerHTML = `<div class="pin-pop-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
    <div class="pin-pop-t">${esc(v.name)}</div>
    <div class="pin-pop-s">${esc(v.city)} · ${hovered.halls.length} ${ML.plural(hovered.halls.length, ['зал', 'зала', 'залов'])}</div>`;
  pop.hidden = false;
}

/* Клик по пину. В списке — подсветить и подскроллить к блоку объекта,
   на карте списка нет, поэтому показываем карточку поверх карты. */
function focusCard(vid) {
  if (VIEW === 'map') { showMapCard(vid); return; }
  const card = document.querySelector(`.vb[data-vid="${vid}"]`);
  if (!card) return;
  document.querySelectorAll('.vb').forEach(b => b.classList.remove('hi'));
  card.classList.add('hi');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => { if (HOVER !== vid) card.classList.remove('hi'); }, 2200);
}

function showMapCard(vid) {
  const box = document.getElementById('mapCard');
  const x = currentList.find(y => y.venue.id === vid);
  if (!box || !x) return;
  const v = x.venue;
  box.innerHTML = `<button class="map-card-x" onclick="hideMapCard()" aria-label="Закрыть">✕</button>
    <div class="map-card-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
    <div class="map-card-b">
      <div class="map-card-t">${esc(v.name)}</div>
      <div class="map-card-s">${esc(v.city)} · ${x.halls.length} ${ML.plural(x.halls.length, ['зал', 'зала', 'залов'])}</div>
      <a class="map-card-go" href="venue.html?id=${v.id}">Карточка объекта</a>
    </div>`;
  box.hidden = false;
}
function hideMapCard() {
  const box = document.getElementById('mapCard');
  if (box) box.hidden = true;
}

function setView(v) {
  VIEW = v === 'map' ? 'map' : 'list';
  try { sessionStorage.setItem('ml_search_view', VIEW); } catch (e) { /* приватный режим */ }
  hideMapCard();
  applyView();
  render();
}

function applyView() {
  document.querySelector('.grid3').classList.toggle('map-mode', VIEW === 'map');
  document.getElementById('viewList').classList.toggle('on', VIEW === 'list');
  document.getElementById('viewMap').classList.toggle('on', VIEW === 'map');
}

function zoom(dir) {
  ZOOM = Math.min(2.5, Math.max(1, +(ZOOM + dir * 0.25).toFixed(2)));
  document.getElementById('mapScale').style.transform = `scale(${ZOOM})`;
  document.getElementById('zoomIn').disabled = ZOOM >= 2.5;
  document.getElementById('zoomOut').disabled = ZOOM <= 1;
}

/* ══════════════════════════════════════════════
   ДЕЙСТВИЯ
   ══════════════════════════════════════════════ */
function toggleCmp(hallId) {
  const r = ML.toggleCompare(hallId);       // лимит тарифа проверяет сам ML
  if (!r.ok) { MH.toast(r.reason, 'error'); return; }
  render();
}
function toggleFavHall(hallId) {
  const added = ML.toggleFav(hallId);
  MH.toast(added ? 'Зал добавлен в избранное' : 'Зал удалён из избранного', added ? 'success' : 'info');
  render();
}
function addBlack(venueId) {
  ML.addToBlacklist(venueId);
  MH.toast('Объект скрыт из выдачи', 'info');
  render();
}
function clearCompare() { ML.clearCompare(); render(); }
function openCompare() {
  // compare.html читает список из состояния модели, параметры в URL не нужны
  if (!ML.state.compare.size) { MH.toast('Сначала добавьте залы в сравнение', 'error'); return; }
  MH.go('compare.html');
}
function resetAll() {
  F = ML.resetFilters();
  [...ML.state.blacklist].forEach(id => ML.removeFromBlacklist(id));
  syncBar();
  renderFilters();
  render();
}
function toggleFilter() {
  const d = document.getElementById('filterDrawer');
  const t = document.getElementById('filterToggle');
  const b = document.getElementById('fdBackdrop');
  const open = d.classList.toggle('open');
  t.classList.toggle('open', open);
  b.classList.toggle('open', open);
}

/* ══════════════════════════════════════════════
   РЕНДЕР
   ══════════════════════════════════════════════ */
let currentList = [];

function render() {
  ML.saveFilters(F);                     // любое изменение проходит через render()
  const list = sortList(ML.filterVenues(F));
  currentList = list;

  const halls = list.reduce((a, x) => a + x.halls.length, 0);
  document.getElementById('resCount').innerHTML = list.length
    ? `Найдено <b>${halls}</b> ${ML.plural(halls, ['зал', 'зала', 'залов'])} в <b>${list.length}</b> ${ML.plural(list.length, ['объекте', 'объектах', 'объектах'])}`
    : 'Ничего не найдено';

  /* Одна полоса на всю выдачу, а не кнопка в каждой карточке. */
  document.getElementById('vList').innerHTML = list.length
    ? MH.lockBar('Цены и вместимость залов открыты зарегистрированным пользователям.') + list.map(venueBlock).join('')
    : `<div class="res-empty">
         <h3>Под эти условия залов нет</h3>
         <p>Снимите часть фильтров — сейчас условия слишком узкие.</p>
         <button onclick="resetAll()">Сбросить фильтры</button>
       </div>`;

  renderChips();
  renderMap(list);
  applyFacets();

  // панель сравнения
  const n = ML.state.compare.size;
  const bar = document.getElementById('cmpBar');
  bar.classList.toggle('show', n > 0);
  document.getElementById('cmpCount').textContent = n;
  document.getElementById('cmpWord').textContent = ML.plural(n, ['зал', 'зала', 'залов']);
  document.getElementById('resClear').hidden = n === 0;
}

/* Значения в верхней панели — из справочников ML. */
function syncBar() {
  const city = document.getElementById('cbCity');
  city.innerHTML = '<option value="">Любой</option>' +
    ML.CITIES.map(c => `<option value="${esc(c)}"${F.city === c ? ' selected' : ''}>${esc(c)}</option>`).join('');
  const ev = document.getElementById('cbEvent');
  ev.innerHTML = ML.EVENT_TYPES.map(e =>
    `<option value="${e.k}"${F.eventType === e.k ? ' selected' : ''}>${esc(e.l)}</option>`).join('');
  document.getElementById('cbPeople').value = F.people || '';
  document.getElementById('cbTariff').textContent = ML.tariff().name;
  document.getElementById('resSort').value = SORT;
}

/* Параметры из URL: ?city= и ?people= приходят с главной. */
(function init() {
  const p = new URLSearchParams(location.search);
  const city = p.get('city');
  if (city && ML.CITIES.includes(city)) F.city = city;
  const people = parseInt(p.get('people') || p.get('guests'), 10);
  if (people > 0) F.people = people;
  const ev = p.get('type');
  if (ev) F.eventType = ML.normEventType(ev);   // старые ключи ссылок (business, wedding) переводятся

  applyView();
  syncBar();
  renderFilters();
  render();
})();
</script>
