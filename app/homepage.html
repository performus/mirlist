<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Поиск залов для деловых мероприятий: подбор по параметрам ТЗ, сравнение залов между собой, один запрос сразу во все объекты и выгрузка презентации.">
<meta property="og:title" content="МирХАБ — поиск залов для деловых мероприятий">
<meta property="og:description" content="Поиск залов по параметрам ТЗ, сравнение между собой, один запрос сразу во все объекты и презентация под мероприятие.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/og-image.png">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>МирХАБ — поиск залов для деловых мероприятий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px 72px;animation:pageIn .5s ease both;}

/* ══════ 1. ПОИСКОВАЯ СТРОКА ══════ */
.hero{padding:52px 0 40px;text-align:center;}
.hero .eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.hero h1{font-family:'Literata',Georgia,serif;font-size:42px;font-weight:600;color:var(--slate-deep);
  line-height:1.12;margin-top:12px;letter-spacing:-.005em;}
.hero p{font-size:15px;line-height:1.7;color:var(--slate-muted);margin:14px auto 0;max-width:660px;}

.sbar{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;align-items:end;
  background:var(--white);border:1px solid rgba(197,227,225,.4);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:14px;margin:28px auto 0;max-width:900px;text-align:left;}
.sf label{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--slate-muted);margin-bottom:5px;}
.sf input,.sf select{width:100%;padding:11px 14px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:14px;color:var(--slate-deep);outline:none;transition:border-color .2s,background .2s;}
.sf input:focus,.sf select:focus{border-color:var(--coral);background:var(--white);}
.sbtn{padding:12px 30px;border-radius:var(--r-sm);background:var(--coral);border:none;color:#fff;
  font-size:14.5px;font-weight:600;box-shadow:var(--sh-coral);transition:background .2s;white-space:nowrap;}
.sbtn:hover{background:var(--coral-hover);}

/* ══════ секции ══════ */
.sec{margin-top:52px;}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.sec-title{font-family:'Literata',Georgia,serif;font-size:27px;font-weight:600;color:var(--slate-deep);
  line-height:1.2;margin-top:6px;}
.sec-sub{font-size:13px;color:var(--slate-muted);margin-top:6px;}
.btn{display:inline-block;padding:10px 20px;border-radius:var(--r-full);font-size:13px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--coral);color:var(--coral);}

/* ══════ плитки ══════ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;}
.tile{display:block;text-align:left;background:var(--white);border:1px solid rgba(197,227,225,.32);
  border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);width:100%;padding:0;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;}
.tile:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--aqua-3);}
.tile-img{height:132px;background:var(--aqua-pale);overflow:hidden;}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1);}
.tile:hover .tile-img img{transform:scale(1.06);}
.tile-b{padding:13px 15px 15px;}
.tile-name{font-size:14.5px;font-weight:700;color:var(--slate-deep);line-height:1.3;}
.tile-sub{font-size:12.5px;color:var(--slate-muted);margin-top:4px;}
.tile-cnt{font-size:13px;font-weight:700;color:var(--coral);margin-top:7px;}

/* ══════ 3. рекламный слот ══════ */
.adslot{border:2px dashed var(--slate-pale);border-radius:var(--r-lg);background:var(--white);
  padding:34px 28px;text-align:center;}
.adslot-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--slate-pale);}
.adslot-s{font-size:13.5px;line-height:1.65;color:var(--slate-muted);margin-top:10px;max-width:560px;
  margin-left:auto;margin-right:auto;}

/* ══════ 6. события отрасли ══════ */
.events{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:6px 20px;}
.ev{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 0;
  border-bottom:1px solid rgba(197,227,225,.25);}
.ev:last-child{border-bottom:none;}
.ev-date{font-size:13px;font-weight:700;color:var(--slate-deep);white-space:nowrap;min-width:92px;}
.ev-kind{font-size:11px;font-weight:600;padding:4px 11px;border-radius:var(--r-full);
  background:var(--aqua-pale);color:var(--slate-mid);white-space:nowrap;}
.ev-name{font-size:14px;color:var(--slate-mid);flex:1;min-width:200px;}

/* ══════ 7. отзывы ══════ */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(292px,1fr));gap:14px;}
.rev{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);padding:20px;display:flex;flex-direction:column;}
.rev-top{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.rev-ava{width:38px;height:38px;border-radius:50%;background:var(--coral-soft);color:var(--coral);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.rev-who{flex:1;min-width:0;}
.rev-name{font-size:13.5px;font-weight:700;color:var(--slate-deep);}
.rev-role{font-size:12px;color:var(--slate-muted);margin-top:2px;}
.rev-stars{color:#F0B95A;font-size:13px;letter-spacing:1px;white-space:nowrap;}
.rev-ev{font-size:12px;color:var(--slate-muted);margin-bottom:9px;}
.rev-text{font-size:13.5px;line-height:1.65;color:var(--slate-mid);flex:1;}
.rev-target{margin-top:13px;padding-top:12px;border-top:1px solid rgba(197,227,225,.3);
  font-size:12.5px;color:var(--slate-muted);}
.rev-target a{font-weight:700;color:var(--slate-deep);transition:color .2s;}
.rev-target a:hover{color:var(--coral);}

@media(max-width:900px){
  .sbar{grid-template-columns:1fr 1fr;}
  .hero h1{font-size:31px;}
  /* Literata шире предшественника: на узком экране заголовок секции
     уходил в две строки — уменьшаем кегль, а не трекинг. */
  .sec-title{font-size:23px;}
  .hero{padding:36px 0 28px;}
  .wrap{padding:0 16px 56px;}
  .sec{margin-top:40px;}
}
@media(max-width:560px){
  .sbar{grid-template-columns:1fr;}
  .hero h1{font-size:26px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Отраслевые события: в модели их нет.
   КОНТЕНТ ПОД НАПОЛНЕНИЕ ЧЕРЕЗ АДМИНКУ — правится редактором, не кодом. */
const EVENTS = [
  { date: '12.09.2026', kind: 'Выставка', name: 'MICE Excellence Forum — Москва, Экспоцентр' },
  { date: '04.10.2026', kind: 'Премия',   name: 'Национальная премия event-индустрии' },
  { date: '21.11.2026', kind: 'Воркшоп',  name: 'Воркшоп площадок Поволжья — Казань' },
  { date: '05.12.2026', kind: 'Выставка', name: 'Событийный туризм: регионы России — Сочи' },
];

/* Сколько залов в городе — считаем по модели, без выдуманных чисел. */
function hallsInCity(city){
  return ML.VENUES.filter(v => v.city === city).reduce((a, v) => a + v.halls.length, 0);
}

function initials(name){
  const p = String(name).trim().split(/\s+/);
  return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || '');
}

function render(){
  const F = ML.loadFilters();

  /* ── 2. города: только те, где реально есть залы ── */
  const cities = ML.CITIES
    .map(c => ({ city: c, halls: hallsInCity(c) }))
    .filter(x => x.halls > 0)
    .sort((a, b) => b.halls - a.halls);

  const cityTiles = cities.map((x, i) => `
    <button class="tile" onclick="goCity('${esc(x.city)}')">
      <div class="tile-img"><img src="${ML.photoUrl(i + 3)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(x.city)}</div>
        <div class="tile-cnt">${x.halls} ${ML.plural(x.halls, ['зал','зала','залов'])}</div>
      </div>
    </button>`).join('');

  /* ── 4. новые площадки ── */
  const venueTiles = ML.VENUES.slice(0, 4).map(v => `
    <a class="tile" href="venue.html?id=${v.id}">
      <div class="tile-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(v.name)}</div>
        <div class="tile-sub">${esc(v.cat)} · ${esc(v.city)}</div>
      </div>
    </a>`).join('');

  /* ── 5. новые поставщики ── */
  const supTiles = ML.SUPPLIERS.slice(0, 4).map(s => `
    <a class="tile" href="supplier.html?id=${s.id}">
      <div class="tile-img"><img src="${ML.photoUrl(s.photo)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(s.name)}</div>
        <div class="tile-sub">${esc(s.parent)} · ${esc(s.city)}</div>
      </div>
    </a>`).join('');

  /* ── 7. отзывы ── */
  const revs = ML.reviewsLatest(3).map(r => {
    const isVenue = r.target === 'venue';
    const obj = isVenue ? ML.venueById(r.targetId) : ML.SUPPLIERS.find(s => s.id === r.targetId);
    const href = isVenue ? `venue.html?id=${r.targetId}` : `supplier.html?id=${r.targetId}`;
    const name = obj ? obj.name : (isVenue ? 'Объект' : 'Поставщик');
    return `<article class="rev">
      <div class="rev-top">
        <div class="rev-ava">${esc(initials(r.author))}</div>
        <div class="rev-who">
          <div class="rev-name">${esc(r.author)}</div>
          <div class="rev-role">${esc(r.role || '')}</div>
        </div>
        <div class="rev-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
      </div>
      ${r.event ? `<div class="rev-ev">${esc(r.event)} · ${esc(r.date)}</div>` : ''}
      <p class="rev-text">${esc(r.text)}</p>
      <div class="rev-target">${isVenue ? 'Объект' : 'Поставщик'}:
        <a href="${href}">${esc(name)}</a></div>
    </article>`;
  }).join('');

  document.getElementById('root').innerHTML = `

  <!-- ══════ 1. ПОИСКОВАЯ СТРОКА ══════ -->
  <section class="hero">
    <span class="eyebrow">Поисковый инструмент MICE и Event</span>
    <h1>Поиск залов, а не отелей</h1>
    <p>Подбирайте залы по параметрам технического задания независимо от объекта,
    сравнивайте их между собой, отправляйте один запрос сразу во все выбранные объекты
    и выгружайте презентацию по отобранным залам.</p>

    <div class="sbar">
      <div class="sf">
        <label for="sCity">Город</label>
        <select id="sCity">
          <option value="">Любой город</option>
          ${ML.CITIES.map(c => `<option value="${esc(c)}"${F.city === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="sf">
        <label for="sPeople">Участников</label>
        <input id="sPeople" type="number" min="0" step="10" placeholder="любое" value="${F.people || ''}">
      </div>
      <div class="sf">
        <label for="sEvent">Тип мероприятия</label>
        <select id="sEvent">
          ${ML.EVENT_TYPES.map(e => `<option value="${e.k}"${F.eventType === e.k ? ' selected' : ''}>${esc(e.l)}</option>`).join('')}
        </select>
      </div>
      <div class="sf"><button class="sbtn" onclick="goSearch()">Найти залы</button></div>
    </div>
  </section>

  <!-- ══════ 2. ПЛОЩАДКИ ПО НАПРАВЛЕНИЯМ ══════ -->
  <section class="sec">
    <div class="sec-head">
      <div>
        <span class="sec-eyebrow">География</span>
        <h2 class="sec-title">Площадки по направлениям</h2>
        <div class="sec-sub">Счётчик — количество залов в объектах города</div>
      </div>
      <a class="btn" href="search.html">Все направления</a>
    </div>
    <div class="tiles">${cityTiles}</div>
  </section>

  <!-- ══════ 3. РЕКЛАМНЫЙ БЛОК ══════ -->
  <section class="sec">
    <div class="adslot">
      <div class="adslot-t">Рекламное место</div>
      <div class="adslot-s">Баннер объекта или поставщика. Место продаётся на срок —
      отдельная статья монетизации ресурса, независимая от вознаграждения за мероприятия
      и подписок.</div>
    </div>
  </section>

  <!-- ══════ 4. НОВЫЕ ПЛОЩАДКИ ══════ -->
  <section class="sec">
    <div class="sec-head">
      <div>
        <span class="sec-eyebrow">Динамическая выдача</span>
        <h2 class="sec-title">Новые площадки на сайте</h2>
      </div>
      <a class="btn" href="search.html">Весь подбор</a>
    </div>
    <div class="tiles">${venueTiles}</div>
  </section>

  <!-- ══════ 5. НОВЫЕ ПОСТАВЩИКИ ══════ -->
  <section class="sec">
    <div class="sec-head">
      <div>
        <span class="sec-eyebrow">Динамическая выдача</span>
        <h2 class="sec-title">Новые поставщики на сайте</h2>
      </div>
      <a class="btn" href="suppliers.html">Весь каталог</a>
    </div>
    <div class="tiles">${supTiles}</div>
  </section>

  <!-- ══════ 6. СОБЫТИЯ ОТРАСЛИ ══════ -->
  <section class="sec">
    <div class="sec-head">
      <div>
        <span class="sec-eyebrow">Отрасль</span>
        <h2 class="sec-title">События MICE и Event</h2>
        <div class="sec-sub">Календарь выставок, премий и воркшопов</div>
      </div>
    </div>
    <div class="events">
      ${EVENTS.map(e => `<div class="ev">
        <span class="ev-date">${esc(e.date)}</span>
        <span class="ev-kind">${esc(e.kind)}</span>
        <span class="ev-name">${esc(e.name)}</span>
      </div>`).join('')}
    </div>
  </section>

  <!-- ══════ 7. ОТЗЫВЫ ══════ -->
  <section class="sec">
    <div class="sec-head">
      <div>
        <span class="sec-eyebrow">Обратная связь</span>
        <h2 class="sec-title">Отзывы по объектам и поставщикам</h2>
        <div class="sec-sub">Пишут те, у кого мероприятие состоялось</div>
      </div>
    </div>
    <div class="revs">${revs}</div>
  </section>`;
}

/* ── поиск: пишем фильтры в модель и уходим в подбор ── */
function goSearch(){
  const F = ML.loadFilters();
  F.city = document.getElementById('sCity').value || '';
  F.people = +document.getElementById('sPeople').value || 0;
  F.eventType = document.getElementById('sEvent').value || F.eventType;
  ML.saveFilters(F);
  MH.go('search.html');
}
function goCity(city){
  const F = ML.loadFilters();
  F.city = city;
  ML.saveFilters(F);
  MH.go('search.html');
}

render();
</script>
</body>
</html>
