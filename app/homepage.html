<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Поиск залов для деловых мероприятий: подбор по параметрам ТЗ, сравнение залов между собой, один запрос сразу во все объекты и выгрузка презентации.">
<meta property="og:title" content="МАЙСЛИСТ — поиск залов для деловых мероприятий">
<meta property="og:description" content="Поиск залов по параметрам ТЗ, сравнение между собой, один запрос сразу во все объекты и презентация под мероприятие.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/og-image.png">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>МАЙСЛИСТ — поиск залов для деловых мероприятий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<!-- Фон hero грузим заранее: иначе экран открывается тёмным прямоугольником,
     а фотография въезжает рывком уже после первой отрисовки. -->
<link rel="preload" as="image" href="../assets/photos/v2.jpg">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  /* Две производные подложки: разбавляют полотно, оставаясь фоном, а не заливкой. */
  --peach-pale:#FBF2EC;
  --aqua-faint:#F3FAF9;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* Внутренний контейнер: секции тянутся во всю ширину ради подложек,
   а содержимое остаётся в общей колонке. */
.in{max-width:1240px;margin:0 auto;padding:0 28px;}

/* ══════ 1. HERO ══════ */
.hero{
  position:relative; overflow:hidden;
  height:50vh; min-height:380px; max-height:560px;
  display:flex; align-items:center;
}
.hero-bg{
  position:absolute; inset:0;
  background:url(../assets/photos/v2.jpg) center 55% / cover no-repeat;
}
/* Затемнение: белый текст по светлой фотографии иначе не читается.
   Сверху и снизу плотнее — там лежат надзаголовок и поисковая строка. */
.hero-bg::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(24,38,49,.78) 0%,
    rgba(24,38,49,.60) 42%,
    rgba(24,38,49,.74) 100%);
}
.hero-in{position:relative; z-index:1; width:100%; text-align:center;}
.hero .eyebrow{
  display:inline-block; font-size:11.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.09em; color:#F3C7B6;
}
.hero h1{
  font-family:'Literata',Georgia,serif; font-size:42px; font-weight:600;
  color:#fff; line-height:1.12; margin-top:10px; letter-spacing:-.005em;
  text-shadow:0 2px 18px rgba(16,26,34,.45);
}
.hero p{
  font-size:15px; line-height:1.6; color:rgba(255,255,255,.88);
  margin:12px auto 0; max-width:640px;
}

.sbar{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;align-items:end;
  background:var(--white);border:1px solid rgba(255,255,255,.5);border-radius:var(--r-lg);
  box-shadow:0 12px 44px rgba(16,26,34,.28);padding:14px;margin:24px auto 0;max-width:900px;text-align:left;}
.sf{position:relative;}
.sf label{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--slate-muted);margin-bottom:5px;}
.sf input,.sf select{width:100%;padding:11px 14px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:14px;color:var(--slate-deep);outline:none;transition:border-color .2s,background .2s;}
.sf input:focus,.sf select:focus{border-color:var(--coral);background:var(--white);}
.sbtn{padding:12px 30px;border-radius:var(--r-sm);background:var(--coral);border:none;color:#fff;
  font-size:14.5px;font-weight:600;box-shadow:var(--sh-coral);transition:background .2s;white-space:nowrap;}
.sbtn:hover{background:var(--coral-hover);}

/* ── автоподбор города ── */
.ac-list{
  position:absolute; top:100%; left:0; right:0; z-index:40; margin-top:6px;
  list-style:none; background:var(--white); border:1px solid rgba(197,227,225,.6);
  border-radius:var(--r-sm); box-shadow:var(--sh-lg); overflow:hidden;
  max-height:264px; overflow-y:auto;
}
.ac-list[hidden]{display:none;}
.ac-item{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:9px 14px; font-size:13.5px; color:var(--slate-deep); cursor:pointer;
}
.ac-item .cnt{font-size:12px; color:var(--slate-muted); white-space:nowrap;}
.ac-item:hover,.ac-item.on{background:var(--aqua-pale);}
.ac-item.on .cnt{color:var(--slate-mid);}
.ac-empty{padding:10px 14px; font-size:12.5px; color:var(--slate-muted);}

/* ══════ 2. БАННЕР БОНУСНОЙ ПРОГРАММЫ ══════ */
.bonus{background:linear-gradient(115deg,#E98667 0%,#D96345 58%,#C7563B 100%);color:#fff;}
.bonus-in{
  display:flex; align-items:center; justify-content:space-between;
  gap:26px; flex-wrap:wrap; padding-top:30px; padding-bottom:30px;
}
.bonus h2{font-family:'Literata',Georgia,serif;font-size:24px;font-weight:600;line-height:1.2;}
.bonus p{font-size:14px;line-height:1.6;margin-top:8px;max-width:720px;color:rgba(255,255,255,.92);}
.bonus b{font-weight:700;color:#fff;}
.bonus-cta{
  display:inline-block; padding:12px 26px; border-radius:var(--r-full);
  background:#fff; color:#C7563B; font-size:14px; font-weight:700; white-space:nowrap;
  box-shadow:0 6px 20px rgba(16,26,34,.18); transition:transform .2s, box-shadow .2s;
}
.bonus-cta:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,26,34,.24);}

/* ══════ секции и подложки ══════ */
.sec{padding:52px 0;}
.sec.tint-paper{background:var(--bg);}
.sec.tint-white{background:var(--white);}
.sec.tint-aqua{background:var(--aqua-faint);}
.sec.tint-peach{background:var(--peach-pale);}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.sec-title{font-family:'Literata',Georgia,serif;font-size:27px;font-weight:600;color:var(--slate-deep);
  line-height:1.2;}
.sec-sub{font-size:13px;color:var(--slate-muted);margin-top:6px;}
.btn{display:inline-block;padding:10px 20px;border-radius:var(--r-full);font-size:13px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--coral);color:var(--coral);}

/* ══════ плитки ══════ */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.tile{display:block;text-align:left;background:var(--white);border:1px solid rgba(197,227,225,.32);
  border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);width:100%;padding:0;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;}
.tile:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--aqua-3);}
.tile-img{height:132px;background:var(--aqua-pale);overflow:hidden;}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1);}
.tile:hover .tile-img img{transform:scale(1.06);}
.tile-b{padding:13px 15px 15px;}
.tile-name{font-size:14.5px;font-weight:700;color:var(--slate-deep);line-height:1.3;}
.tile-sub{font-size:12.5px;color:var(--slate-muted);margin-top:4px;}
.tile-cnt{font-size:13px;font-weight:700;color:var(--coral);margin-top:7px;}

/* ══════ рекламный слот ══════ */
.adslot{border:2px dashed var(--slate-pale);border-radius:var(--r-lg);background:var(--white);
  padding:30px 28px;text-align:center;}
.adslot-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--slate-pale);}

/* ══════ события отрасли ══════ */
.events{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:6px 20px;}
.ev{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 0;
  border-bottom:1px solid rgba(197,227,225,.25);}
.ev:last-child{border-bottom:none;}
.ev-date{font-size:13px;font-weight:700;color:var(--slate-deep);white-space:nowrap;min-width:92px;}
.ev-kind{font-size:11px;font-weight:600;padding:4px 11px;border-radius:var(--r-full);
  background:var(--aqua-pale);color:var(--slate-mid);white-space:nowrap;}
.ev-name{font-size:14px;color:var(--slate-mid);flex:1;min-width:200px;}

/* ══════ отзывы: горизонтальная карусель ══════ */
/* Прокрутка родная, со scroll-snap: тогда свайп на телефоне работает сам,
   без обработчиков касаний. */
.rev-wrap{position:relative;}
.rev-rail{
  display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; padding:2px 2px 8px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.rev-rail::-webkit-scrollbar{display:none;}
.rev{
  flex:0 0 clamp(268px, 31%, 372px); scroll-snap-align:start;
  background:var(--white);border:1px solid rgba(197,227,225,.35);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);padding:20px;display:flex;flex-direction:column;
}
.rev-top{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.rev-ava{width:38px;height:38px;border-radius:50%;background:var(--coral-soft);color:var(--coral);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.rev-who{flex:1;min-width:0;}
.rev-name{font-size:13.5px;font-weight:700;color:var(--slate-deep);}
.rev-role{font-size:12px;color:var(--slate-muted);margin-top:2px;}
.rev-stars{color:#F0B95A;font-size:13px;letter-spacing:1px;white-space:nowrap;}
.tile-stars{color:#F0B95A;letter-spacing:1px;}
.rev-ev{font-size:12px;color:var(--slate-muted);margin-bottom:9px;}
.rev-text{font-size:13.5px;line-height:1.65;color:var(--slate-mid);flex:1;}
.rev-target{margin-top:13px;padding-top:12px;border-top:1px solid rgba(197,227,225,.3);
  font-size:12.5px;color:var(--slate-muted);}
.rev-target a{font-weight:700;color:var(--slate-deep);transition:color .2s;}
.rev-target a:hover{color:var(--coral);}

.rev-nav{display:flex;gap:8px;}
.rev-arrow{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.rev-arrow:hover{border-color:var(--coral);color:var(--coral);}
.rev-arrow[hidden]{display:none;}

@media(max-width:1000px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:900px){
  .in{padding:0 16px;}
  .sec{padding:40px 0;}
  .sbar{grid-template-columns:1fr 1fr;}
  .hero{height:44vh;min-height:340px;max-height:460px;}
  .hero h1{font-size:31px;}
  .sec-title{font-size:23px;}
  .bonus-in{padding-top:24px;padding-bottom:24px;}
  .bonus h2{font-size:21px;}
}
@media(max-width:700px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));}
  .rev{flex:0 0 84%;}
}
@media(max-width:560px){
  .sbar{grid-template-columns:1fr;}
  .sbtn{width:100%;}
  .hero{height:auto;min-height:0;max-height:none;padding:34px 0 30px;}
  .hero h1{font-size:26px;}
  .hero p{font-size:14px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Отраслевые события: в модели их нет, правятся редактором. */
const EVENTS = [
  { date: '12.09.2026', kind: 'Выставка', name: 'MICE Excellence Forum — Москва, Экспоцентр' },
  { date: '04.10.2026', kind: 'Премия',   name: 'Национальная премия event-индустрии' },
  { date: '21.11.2026', kind: 'Воркшоп',  name: 'Воркшоп площадок Поволжья — Казань' },
  { date: '05.12.2026', kind: 'Выставка', name: 'Событийный туризм: регионы России — Сочи' },
];

const IC_PREV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const IC_NEXT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

/* Сколько залов в городе — считаем по модели, без выдуманных чисел. */
function hallsInCity(city){
  return ML.VENUES.filter(v => v.city === city).reduce((a, v) => a + v.halls.length, 0);
}

function initials(name){
  const p = String(name).trim().split(/\s+/);
  return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || '');
}

/* Города с залами — источник и для плиток направлений, и для автоподбора. */
function cityList(){
  return ML.CITIES
    .map(c => ({ city: c, halls: hallsInCity(c) }))
    .filter(x => x.halls > 0)
    .sort((a, b) => b.halls - a.halls);
}

function render(){
  const F = ML.loadFilters();
  const cities = cityList();

  const cityTiles = cities.map((x, i) => `
    <button class="tile" onclick="goCity('${esc(x.city)}')">
      <div class="tile-img"><img src="${ML.photoUrl(i + 3)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(x.city)}</div>
        <div class="tile-cnt">${x.halls} ${ML.plural(x.halls, ['зал','зала','залов'])}</div>
      </div>
    </button>`).join('');

  const venueTiles = ML.VENUES.slice(0, 8).map(v => `
    <a class="tile" href="venue.html?id=${v.id}">
      <div class="tile-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(v.name)}</div>
        <div class="tile-sub">${esc(v.cat)}${v.stars ? ' <span class="tile-stars">' + '★'.repeat(v.stars) + '</span>' : ''} · ${esc(v.city)}</div>
      </div>
    </a>`).join('');

  const supTiles = ML.SUPPLIERS.slice(0, 8).map(s => `
    <a class="tile" href="supplier.html?id=${s.id}">
      <div class="tile-img"><img src="${ML.photoUrl(s.photo)}" alt="" loading="lazy"></div>
      <div class="tile-b">
        <div class="tile-name">${esc(s.name)}</div>
        <div class="tile-sub">${esc(s.parent)} · ${esc(s.city)}</div>
      </div>
    </a>`).join('');

  /* Отзывы — все, что есть в модели: карусель их пролистает. */
  const revs = ML.state.reviews.map(r => {
    const isVenue = r.target === 'venue';
    const obj = isVenue ? ML.venueById(r.targetId) : ML.SUPPLIERS.find(s => s.id === r.targetId);
    const href = isVenue ? `venue.html?id=${r.targetId}` : `supplier.html?id=${r.targetId}`;
    const name = obj ? obj.name : (isVenue ? 'Объект' : 'Поставщик');
    return `<article class="rev">
      <div class="rev-top">
        <div class="rev-ava">${esc(initials(r.author))}</div>
        <div class="rev-who">
          <div class="rev-name">${esc(r.author)}</div>
          <div class="rev-role">${esc(r.role || '')}</div>
        </div>
        <div class="rev-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
      </div>
      ${r.event ? `<div class="rev-ev">${esc(r.event)} · ${esc(r.date)}</div>` : ''}
      <p class="rev-text">${esc(r.text)}</p>
      <div class="rev-target">${isVenue ? 'Объект' : 'Поставщик'}:
        <a href="${href}">${esc(name)}</a></div>
    </article>`;
  }).join('');

  document.getElementById('root').innerHTML = `

  <!-- ══════ 1. HERO ══════ -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-in in">
      <!-- REMOVED BY CLIENT: надзаголовок <span class="eyebrow">Поисковый инструмент MICE и Event</span> -->
      <h1>Умный поиск залов</h1>
      <p>Найдите залы по параметрам мероприятия, сравните подходящие варианты, отправьте запрос менеджерам
      выбранных объектов и скачайте презентацию.</p>

      <div class="sbar">
        <div class="sf">
          <label for="sCity">Город</label>
          <input id="sCity" type="text" autocomplete="off" placeholder="Любой город"
                 value="${esc(F.city || '')}"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cityAc">
          <ul class="ac-list" id="cityAc" role="listbox" hidden></ul>
        </div>
        <div class="sf">
          <label for="sPeople">Кол-во участников</label>
          <input id="sPeople" type="number" min="0" step="10" placeholder="любое" value="${F.people || ''}">
        </div>
        <div class="sf">
          <label for="sEvent">Тип мероприятия</label>
          <select id="sEvent">
            ${ML.EVENT_TYPES.map(e => `<option value="${e.k}"${F.eventType === e.k ? ' selected' : ''}>${esc(e.l)}</option>`).join('')}
          </select>
        </div>
        <div class="sf"><button class="sbtn" onclick="goSearch()">Найти залы</button></div>
      </div>
    </div>
  </section>

  <!-- ══════ 2. БОНУСНАЯ ПРОГРАММА ══════ -->
  <section class="bonus">
    <div class="in bonus-in">
      <div>
        <h2>Бонусы за активную работу на платформе</h2>
        <p>Баллы начисляются за состоявшиеся мероприятия и за отзывы о площадках.
        Потратить их можно на услуги объектов и поставщиков
        или на повышение уровня доступа.</p>
      </div>
      <a class="bonus-cta" href="bonus.html">О бонусной программе</a>
    </div>
  </section>

  <!-- ══════ 3. ПЛОЩАДКИ ПО НАПРАВЛЕНИЯМ ══════ -->
  <section class="sec tint-paper">
    <div class="in">
      <div class="sec-head">
        <div>
          <h2 class="sec-title">Площадки по направлениям</h2>
          <!-- REMOVED BY CLIENT: подзаголовок <div class="sec-sub">Количество залов в объектах города</div> -->
        </div>
        <a class="btn" href="search.html">Все направления</a>
      </div>
      <div class="tiles">${cityTiles}</div>
    </div>
  </section>

  <!-- ══════ 4. НОВЫЕ ПЛОЩАДКИ ══════ -->

/* ══════════════════════════════════════════════
   АВТОПОДБОР ГОРОДА
   Список короткий — в базе семь городов. Мышь и клавиатура равноправны:
   стрелки двигают выделение, Enter подставляет, Esc закрывает.
   ══════════════════════════════════════════════ */
let AC_ITEMS = [];   // текущие подсказки
let AC_PICK = -1;    // выделенная стрелками

function acClose(){
  const list = document.getElementById('cityAc');
  const inp = document.getElementById('sCity');
  if (!list) return;
  list.hidden = true;
  AC_ITEMS = []; AC_PICK = -1;
  if (inp) inp.setAttribute('aria-expanded', 'false');
}

function acDraw(q){
  const list = document.getElementById('cityAc');
  const inp = document.getElementById('sCity');
  const needle = String(q || '').trim().toLowerCase();
  /* Фильтрация по вхождению без учёта регистра; пустой ввод показывает всё. */
  AC_ITEMS = cityList().filter(x => !needle || x.city.toLowerCase().includes(needle));
  AC_PICK = -1;

  if (!AC_ITEMS.length) {
    /* Своего города в списке нет — не мешаем: поиск и так ищет по вхождению. */
    list.innerHTML = '<li class="ac-empty">Города нет в списке — поиск всё равно отработает</li>';
    list.hidden = false;
    inp.setAttribute('aria-expanded', 'true');
    return;
  }
  list.innerHTML = AC_ITEMS.map((x, i) => `
    <li class="ac-item" role="option" data-i="${i}" onmousedown="acPick(${i})">
      <span>${esc(x.city)}</span>
      <span class="cnt">${x.halls} ${ML.plural(x.halls, ['зал','зала','залов'])}</span>
    </li>`).join('');
  list.hidden = false;
  inp.setAttribute('aria-expanded', 'true');
}

function acHighlight(){
  document.querySelectorAll('#cityAc .ac-item').forEach((el, i) => {
    el.classList.toggle('on', i === AC_PICK);
    if (i === AC_PICK) el.scrollIntoView({ block: 'nearest' });
  });
}

function acPick(i){
  const x = AC_ITEMS[i];
  if (!x) return;
  document.getElementById('sCity').value = x.city;
  acClose();
}

function bindCityAc(){
  const inp = document.getElementById('sCity');
  const list = document.getElementById('cityAc');
  if (!inp || !list) return;

  inp.addEventListener('input', () => acDraw(inp.value));
  inp.addEventListener('focus', () => acDraw(inp.value));

  inp.addEventListener('keydown', e => {
    const open = !list.hidden && AC_ITEMS.length;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open) { acDraw(inp.value); AC_PICK = 0; } else { AC_PICK = (AC_PICK + 1) % AC_ITEMS.length; }
      acHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) return;
      AC_PICK = (AC_PICK - 1 + AC_ITEMS.length) % AC_ITEMS.length;
      acHighlight();
    } else if (e.key === 'Enter') {
      if (open && AC_PICK >= 0) { e.preventDefault(); acPick(AC_PICK); }
      else { acClose(); goSearch(); }
    } else if (e.key === 'Escape') {
      acClose();
    }
  });

  /* Клик вне поля закрывает список. */
  document.addEventListener('click', e => {
    if (!e.target.closest('#sCity') && !e.target.closest('#cityAc')) acClose();
  });
}

/* ══════════════════════════════════════════════
   КАРУСЕЛЬ ОТЗЫВОВ
   Прокрутка родная: свайп на телефоне работает без обработчиков касаний.
   Стрелки прячем, когда листать в эту сторону некуда.
   ══════════════════════════════════════════════ */
function revScroll(dir){
  const rail = document.getElementById('revRail');
  if (!rail) return;
  rail.scrollBy({ left: dir * Math.round(rail.clientWidth * 0.8), behavior: 'smooth' });
}

function revArrows(){
  const rail = document.getElementById('revRail');
  const prev = document.getElementById('revPrev');
  const next = document.getElementById('revNext');
  if (!rail || !prev || !next) return;
  const max = rail.scrollWidth - rail.clientWidth;
  prev.hidden = rail.scrollLeft <= 2;
  next.hidden = rail.scrollLeft >= max - 2;
}

function bindRevRail(){
  const rail = document.getElementById('revRail');
  if (!rail) return;
  rail.addEventListener('scroll', revArrows, { passive: true });
  window.addEventListener('resize', revArrows);
  revArrows();
}

/* ── поиск: пишем фильтры в модель и уходим в подбор ── */
function goSearch(){
  const F = ML.loadFilters();
  F.city = document.getElementById('sCity').value.trim() || '';
  F.people = +document.getElementById('sPeople').value || 0;
  F.eventType = document.getElementById('sEvent').value || F.eventType;
  ML.saveFilters(F);
  MH.go('search.html');
}
function goCity(city){
  const F = ML.loadFilters();
  F.city = city;
  ML.saveFilters(F);
  MH.go('search.html');
}

render();
</script>
