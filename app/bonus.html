<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Бонусная программа: как начисляются баллы за состоявшиеся мероприятия и на что их потратить.">
<meta property="og:title" content="Бонусная программа — МАЙСЛИСТ">
<meta property="og:description" content="Бонусная программа: как начисляются баллы за состоявшиеся мероприятия и на что их потратить.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Бонусная программа — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1240px;margin:0 auto;padding:24px 28px 64px;animation:pageIn .5s ease both;}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

.d-eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.d-title{font-family:'Literata',Georgia,serif;font-size:34px;font-weight:600;color:var(--slate-deep);line-height:1.15;margin-top:8px;letter-spacing:-.005em;}
.d-sub{font-size:14px;line-height:1.65;color:var(--slate-muted);margin-top:10px;max-width:720px;}

/* ── плитки шапки ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0;}
.tile{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-md);}
.tile .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-muted);margin-bottom:8px;}
.tile .val{font-family:'Literata',Georgia,serif;font-weight:600;font-size:27px;color:var(--slate-deep);line-height:1.1;}
.tile .val.coral{color:var(--coral);}
.tile .sub{font-size:12px;color:var(--slate-muted);margin-top:6px;line-height:1.5;}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 14px;flex-wrap:wrap;}
.sec-title{font-family:'Literata',Georgia,serif;font-size:23px;font-weight:600;color:var(--slate-deep);}
.sec-sub{font-size:12.5px;color:var(--slate-muted);}
.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);box-shadow:var(--sh-md);}

/* ── таблица начислений ── */
.tscroll{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
.tbl th,.tbl td{text-align:left;padding:13px 18px;border-bottom:1px solid rgba(197,227,225,.25);}
.tbl thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-muted);background:var(--aqua-pale);}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl td.num{font-weight:700;color:var(--slate-deep);white-space:nowrap;}
.tbl td.pts{font-weight:700;color:var(--coral);white-space:nowrap;}
.tbl td.dim{color:var(--slate-pale);font-weight:500;}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:16px 18px;font-size:13px;line-height:1.7;color:var(--slate-mid);margin-top:16px;}
.note b{color:var(--slate-deep);}
.note + .note{margin-top:10px;}

/* ── витрина ── */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.card{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-md);overflow:hidden;
  box-shadow:var(--sh-sm);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;
  display:flex;flex-direction:column;}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--aqua-3);}
.card-img{height:126px;background:var(--aqua-pale);position:relative;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-own{position:absolute;top:9px;left:9px;padding:4px 11px;border-radius:var(--r-full);
  font-size:10.5px;font-weight:600;background:var(--coral-soft);color:var(--coral);}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;}
.card-name{font-size:14.5px;font-weight:700;color:var(--slate-deep);line-height:1.35;margin-bottom:5px;}
.card-prov{font-size:12px;color:var(--slate-muted);margin-bottom:12px;}
.card-price{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap;}
.card-pts{font-size:19px;font-weight:800;color:var(--coral);white-space:nowrap;}
.card-rub{font-size:13px;color:var(--slate-pale);text-decoration:line-through;white-space:nowrap;}
.card-foot{margin-top:auto;}
.btn{display:inline-block;padding:10px 20px;border-radius:var(--r-full);font-size:13px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover:not(:disabled){border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover:not(:disabled){background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.wide{width:100%;text-align:center;}
.lack{font-size:11.5px;color:var(--slate-muted);margin-top:7px;text-align:center;}

/* Модальное окно заказа за баллы */
.ovl{position:fixed;inset:0;background:rgba(53,78,99,.42);backdrop-filter:blur(3px);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:min(520px,100%);
  max-height:88vh;overflow:auto;}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 24px 0;}
.modal-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:20px;color:var(--slate-deep);flex:1;}
.modal-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);color:var(--slate-muted);font-size:15px;}
.modal-b{padding:16px 24px;font-size:13.5px;line-height:1.65;color:var(--slate-mid);}
.modal-b p + p{margin-top:8px;}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px;}
.msum{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;}
.msum th{text-align:left;font-weight:500;color:var(--slate-muted);padding:6px 0;}
.msum td{text-align:right;font-weight:700;color:var(--slate-deep);padding:6px 0;}
.fl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--slate-muted);margin:12px 0 6px;}
.fi{width:100%;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid rgba(197,227,225,.5);
  background:var(--bg);font-family:inherit;font-size:13.5px;color:var(--slate-deep);outline:none;resize:vertical;}
.fi:focus{border-color:var(--coral);background:var(--white);}

@media(max-width:768px){
  .wrap{padding:18px 16px 48px;}
  .d-title{font-size:26px;}
  .tiles{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>
<div id="modalRoot"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init('bonus');

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render(){
  /* Бонусная программа гостю недоступна целиком. */
  if (MH.isLocked()) {
    document.getElementById('root').innerHTML = MH.lockScreen('Доступ к бонусной программе откроется после регистрации',
      'Баллы начисляются за проведённые мероприятия и отзывы и тратятся на услуги подрядчиков. Зарегистрируйтесь, чтобы открыть счёт и витрину.');
    return;
  }
  const P = ML.state.points;
  const rev = ML.POINTS_REVIEW;

  // ── начисление за мероприятие: строки из ML.FEE_TIERS ──
  const rows = ML.FEE_TIERS.map(t => `<tr>
    <td>${esc(t.label)}</td>
    <td class="${t.ptsBiz?'pts':'dim'}">${t.ptsBiz?t.ptsBiz.toLocaleString('ru'):'—'}</td>
    <td class="${t.ptsPrem?'pts':'dim'}">${t.ptsPrem?t.ptsPrem.toLocaleString('ru'):'—'}</td>
  </tr>`).join('');

  // ── витрина: затравка плюс опубликованные позиции владельцев ──
  const catalog = ML.shopCatalog();
  const shop = catalog.map((s, i) => {
    const can = P.free >= s.pts;
    const pic = typeof s.id === 'number' ? s.id : i + 1;
    return `<article class="card">
      <div class="card-img">
        <img src="${ML.photoUrl(pic)}" alt="" loading="lazy">
        ${s.own?'<span class="card-own">от площадки</span>':''}
      </div>
      <div class="card-b">
        <div class="card-name">${esc(s.title)}</div>
        <div class="card-prov">${esc(s.provider)}</div>
        <div class="card-price">
          <span class="card-pts">${s.pts.toLocaleString('ru')} Б</span>
        </div>
        <div class="card-foot">
          <button class="btn pri wide" ${can?'':'disabled'} onclick="buy('${String(s.id).replace(/'/g,"\'")}')">Оставить заявку</button>
          ${can?'':`<div class="lack">не хватает ${(s.pts-P.free).toLocaleString('ru')} Б</div>`}
        </div>
      </div>
    </article>`;
  }).join('');

  document.getElementById('root').innerHTML = `
  <div class="crumbs"><a href="search.html">Подбор залов</a><span class="sep">→</span>
    <span class="cur">Бонусная программа</span></div>

  <h1 class="d-title">Бонусная программа</h1>
  <p class="d-sub">Часть агентского вознаграждения возвращается вам баллами — за состоявшиеся мероприятия и за отзывы о площадках.</p>

  <div class="tiles">
    <div class="tile">
      <div class="lbl">Приветственный бонус</div>
      <div class="val">${ML.POINTS_HELLO.toLocaleString('ru')}</div>
      <div class="sub">разово за регистрацию</div>
    </div>
    <div class="tile">
      <div class="lbl">За отзыв</div>
      <div class="val">${rev.biz} / ${rev.prem}</div>
      <div class="sub">БИЗНЕС / ПРЕМИУМ</div>
    </div>
    <div class="tile">
      <div class="lbl">Ваш баланс</div>
      <div class="val coral">${P.free.toLocaleString('ru')}</div>
      <div class="sub">Заблокировано ${P.locked.toLocaleString('ru')} Б</div>
    </div>
  </div>

  <div class="sec-head">
    <h2 class="sec-title">Начисление за мероприятие</h2>
    <span class="sec-sub">зависит от числа участников и вашего тарифа</span>
  </div>
  <div class="panel"><div class="tscroll"><table class="tbl">
    <thead><tr>
      <th>Минимальное количество участников</th>
      <th>Баллы · БИЗНЕС</th><th>Баллы · ПРЕМИУМ</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>

  <div class="note">До поступления оплаты от объекта баллы зачисляются со статусом
  <b>«нельзя потратить»</b>: после подтверждения от объекта баллы становятся доступны
  для использования. Сейчас в этом статусе <b>${P.locked.toLocaleString('ru')} Б</b>.</div>

  <div class="sec-head">
    <div>
      <h2 class="sec-title" style="margin-top:6px">Витрина</h2>
    </div>
    <span class="sec-sub">${catalog.length} ${ML.plural(catalog.length,['позиция','позиции','позиций'])}</span>
  </div>
  <div class="shop">${shop}</div>

  <div class="note">На первом этапе в витрине <b>только услуги</b> — без физических товаров:
  ресурс не берёт на себя хранение, доставку и возвраты. Заявка уходит партнёру,
  баллы списываются в момент оформления.</div>`;
}

/* Заказ за баллы: комментарий партнёру, списание через ML.orderFromShop,
   подтверждение с номером заказа. Своих расчётов здесь нет. */
function findItem(id) { return ML.shopCatalog().find(s => String(s.id) === String(id)); }

function buy(id) {
  const item = findItem(id);
  if (!item) return;
  const P = ML.state.points;
  if (P.free < item.pts) { MH.toast('Не хватает баллов', 'error'); return; }
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" onclick="if(event.target===this)closeBuy()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title">Заказ за баллы</div>
        <button class="modal-x" onclick="closeBuy()" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-b">
        <p><b>${esc(item.title)}</b> — ${esc(item.provider)}</p>
        <table class="msum">
          <tr><th>Спишется с баланса</th><td>${item.pts.toLocaleString('ru')} Б</td></tr>
          <tr><th>Останется после заказа</th><td>${(P.free - item.pts).toLocaleString('ru')} Б</td></tr>
        </table>
        <label class="fl" for="bsNote">Комментарий партнёру</label>
        <textarea class="fi" id="bsNote" rows="3" placeholder="Даты, количество человек, пожелания"></textarea>
        <div class="note" style="margin-top:14px">Баллы спишутся сразу. Партнёр подтвердит заказ
        и свяжется с вами через ресурс. Если заказ отклонят, баллы вернутся на счёт.</div>
      </div>
      <div class="modal-f">
        <button class="btn" onclick="closeBuy()">Отмена</button>
        <button class="btn pri" onclick="confirmBuy('${String(item.id).replace(/'/g, "\'")}')">Оформить заказ</button>
      </div>
    </div>
  </div>`;
  document.addEventListener('keydown', buyEsc);
}
function buyEsc(e) { if (e.key === 'Escape') closeBuy(); }
function closeBuy() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', buyEsc);
}
function confirmBuy(id) {
  const item = findItem(id);
  const note = (document.getElementById('bsNote') || {}).value || '';
  const o = ML.orderFromShop(item, note.trim());
  closeBuy();
  if (!o) { MH.toast('Не хватает баллов', 'error'); return; }
  render();
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" onclick="if(event.target===this)closeBuy()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><div class="modal-title">Заказ оформлен</div>
        <button class="modal-x" onclick="closeBuy()" aria-label="Закрыть">✕</button></div>
      <div class="modal-b">
        <p>Номер заказа <b>${esc(o.id)}</b>, списано <b>${o.pts.toLocaleString('ru')} Б</b>.</p>
        <p>Партнёр «${esc(o.provider)}» получит заказ во входящих и подтвердит его.
        Статус виден в кабинете, в разделе «Мои баллы».</p>
      </div>
      <div class="modal-f"><a class="btn pri" href="dashboard.html?page=points">В мои баллы</a></div>
    </div>
  </div>`;
  document.addEventListener('keydown', buyEsc);
}

render();
</script>
</body>
</html>
