<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" id="metaDesc" content="Карточка объекта: залы, вместимость, оснащение и условия аренды.">
<meta property="og:title" id="ogTitle" content="МирХАБ">
<meta property="og:description" id="ogDesc" content="Карточка объекта: залы, вместимость, оснащение и условия аренды.">
<meta property="og:image" content="https://mirhub.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirhub.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Объект — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE; --peach-pale:#EFD6CA;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1240px;margin:0 auto;padding:24px 28px 64px;animation:pageIn .5s ease both;}

/* ── хлебные крошки ── */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a{transition:color .2s;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

/* ── шапка карточки ── */
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
.d-eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.d-title{font-family:'DM Serif Display',serif;font-size:34px;font-weight:400;color:var(--slate-deep);line-height:1.15;margin-top:8px;letter-spacing:-.3px;}
.d-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--slate-muted);align-items:center;}
.d-meta b{color:var(--slate-deep);font-weight:700;}
.d-stars{color:#F0B95A;letter-spacing:1px;}
.d-rating{display:inline-flex;align-items:center;gap:4px;}
.d-rating svg{color:#F0B95A;}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;}

.tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;background:var(--aqua-pale);color:var(--slate-mid);}
.tag.solid{background:var(--coral-soft);color:var(--coral);}

.btn{display:inline-block;padding:11px 22px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover{background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}
.btn.sm{padding:8px 16px;font-size:12.5px;}

/* ── галерея ── */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:22px;height:300px;}
.gal.solo{grid-template-columns:1fr;}
.gal-cell{border-radius:var(--r-md);overflow:hidden;background:var(--aqua-pale);}
.gal-cell img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);}
.gal-cell:hover img{transform:scale(1.05);}
.gal-stack{display:grid;grid-template-rows:1fr 1fr;gap:10px;}

/* ── двухколоночная сетка ── */
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap;}
.sec-head.first{margin-top:0;}
.sec-title{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:var(--slate-deep);}
.sec-sub{font-size:12.5px;color:var(--slate-muted);}

.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);box-shadow:var(--sh-md);}
.about{padding:18px 22px;}
.about p{font-size:14px;line-height:1.7;color:var(--slate-mid);}

/* ── строки залов ── */
.hrows{display:flex;flex-direction:column;gap:10px;}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);padding:12px;transition:border-color .25s,box-shadow .25s;}
.hrow:hover{border-color:var(--aqua-3);box-shadow:var(--sh-md);}
.hrow.picked{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral);}
.hrow-img{width:116px;height:80px;border-radius:var(--r-sm);overflow:hidden;flex:none;background:var(--aqua-pale);}
.hrow-img img{width:100%;height:100%;object-fit:cover;}
.hrow-mid{flex:1;min-width:160px;}
.hrow-name{font-size:15px;font-weight:700;color:var(--slate-deep);transition:color .2s;}
.hrow-name:hover{color:var(--coral);}
.hrow-sub{font-size:12.5px;color:var(--slate-muted);margin-top:3px;}
.hrow-caps{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.hrow-cap{font-size:10.5px;font-weight:600;background:var(--aqua-pale);color:var(--slate-mid);border-radius:5px;padding:3px 6px;}
.hrow-right{text-align:right;margin-left:auto;}
.hrow-price{font-size:16px;font-weight:800;color:var(--slate-deep);margin-bottom:8px;white-space:nowrap;}
.hrow-price i{font-style:normal;font-size:12px;font-weight:500;color:var(--slate-muted);}
.hrow-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center;}
.ic{width:34px;height:34px;border-radius:50%;background:var(--aqua-pale);border:none;display:flex;align-items:center;justify-content:center;color:var(--slate-muted);transition:all .2s;}
.ic:hover{background:var(--coral-soft);color:var(--coral);}
.ic.on{background:var(--coral-soft);color:var(--coral);}
.ic.on svg{fill:currentColor;}

/* ── оснащение ── */
.fgroup{margin-bottom:18px;}
.fgroup h3{font-size:13px;font-weight:700;color:var(--slate-deep);margin-bottom:9px;}
.ftags{display:flex;flex-wrap:wrap;gap:6px;}

/* ── таблица ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th,.tbl td{text-align:left;padding:10px 0;border-bottom:1px solid rgba(197,227,225,.3);vertical-align:top;}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:none;}
.tbl th{font-weight:500;color:var(--slate-muted);width:48%;}
.tbl td{font-weight:600;color:var(--slate-deep);}

/* ── боковая колонка ── */
.side{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;}
.side .panel{padding:18px;}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-muted);margin-bottom:10px;}
.side p{font-size:12.5px;line-height:1.6;color:var(--slate-muted);margin-bottom:12px;}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--slate-mid);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.note b{color:var(--slate-deep);}

/* ── заглушка ── */
.nf{max-width:460px;margin:60px auto;text-align:center;padding:48px 36px;}
.nf h2{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;color:var(--slate-deep);margin-bottom:10px;}
.nf p{font-size:13.5px;color:var(--slate-muted);margin-bottom:22px;line-height:1.6;}

@media(max-width:900px){
  .two{grid-template-columns:minmax(0,1fr);}
  .side{position:static;}
  .gal{grid-template-columns:1fr;height:auto;}
  .gal-cell{height:220px;}
  .gal-stack{display:none;}
  .d-title{font-size:26px;}
  .wrap{padding:18px 18px 48px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const IC = {
  star:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  cmp:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 7h18M6 7v4M12 7v8M18 7v4"/></svg>',
  heart:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
};

function notFound(msg) {
  document.getElementById('root').innerHTML = `<div class="panel nf">
    <h2>${esc(msg)}</h2>
    <p>Проверьте ссылку — возможно, карточка была удалена или объект скрыт в блэк-листе.</p>
    <a class="btn pri" href="search.html">К подбору площадок</a>
  </div>`;
  document.title = msg + ' — МирХАБ';
}

/* Галерея: обложка объекта + фото залов. На «СТАРТ» — только общее фото. */
function gallery(v, full) {
  const shots = [v.photo, ...v.halls.map(h => h.photo)].filter((x, i, a) => a.indexOf(x) === i);
  if (!full || shots.length < 3) {
    return `<div class="gal solo"><div class="gal-cell"><img src="${ML.photoUrl(shots[0])}" alt="${esc(v.name)}"></div></div>`;
  }
  const at = i => ML.photoUrl(shots[i % shots.length]);
  return `<div class="gal">
    <div class="gal-cell"><img src="${at(0)}" alt="${esc(v.name)}"></div>
    <div class="gal-stack">
      <div class="gal-cell"><img src="${at(1)}" alt="" loading="lazy"></div>
      <div class="gal-cell"><img src="${at(2)}" alt="" loading="lazy"></div>
    </div>
    <div class="gal-stack">
      <div class="gal-cell"><img src="${at(3)}" alt="" loading="lazy"></div>
      <div class="gal-cell"><img src="${at(4)}" alt="" loading="lazy"></div>
    </div>
  </div>`;
}

let V = null;

function render() {
  const v = V, t = ML.tariff(), full = t.fullInfo;
  const cap = ML.venueCapacity(v);

  // ── список залов: главный блок страницы ──
  const hallRows = v.halls.map(h => {
    const inC = ML.inCompare(h.id), fav = ML.isFav(h.id);
    const caps = full
      ? ML.SEATING.filter(s => h.seats[s.k]).map(s => `<span class="hrow-cap">${esc(s.l)} ${h.seats[s.k]}</span>`).join('')
      : '';
    return `<div class="hrow${inC ? ' picked' : ''}">
      <div class="hrow-img"><img src="${ML.photoUrl(h.photo)}" alt="" loading="lazy"></div>
      <div class="hrow-mid">
        <a class="hrow-name" href="hall.html?id=${h.id}">${esc(h.name)}</a>
        <div class="hrow-sub">${esc(h.type)} · ${h.area} м² · до ${ML.hallCapacity(h)} чел.${h.height ? ' · потолок ' + h.height + ' м' : ''}</div>
        ${caps ? `<div class="hrow-caps">${caps}</div>` : ''}
      </div>
      <div class="hrow-right">
        <div class="hrow-price">${h.priceDay ? ML.money(h.priceDay) : '<i>по договорённости</i>'}</div>
        <div class="hrow-acts">
          <button class="ic${inC ? ' on' : ''}" onclick="toggleCmp(${h.id})" title="${inC ? 'Убрать из сравнения' : 'В сравнение'}">${IC.cmp}</button>
          <button class="ic${fav ? ' on' : ''}" onclick="toggleFavHall(${h.id})" title="${fav ? 'Убрать из избранного' : 'В избранное'}">${IC.heart}</button>
          <a class="btn sm" href="hall.html?id=${h.id}">Открыть зал</a>
        </div>
      </div>
    </div>`;
  }).join('');

  // ── оснащение по ML.FEATURE_GROUPS, только то, что реально есть у объекта ──
  const featureBlocks = ML.FEATURE_GROUPS.map(g => {
    const have = ML.FEATURES[g.k].filter(x => v.features.includes(x));
    if (!have.length) return '';
    return `<div class="fgroup"><h3>${esc(g.l)}</h3>
      <div class="ftags">${have.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div></div>`;
  }).join('');

  const rows = full
    ? [['Категория', v.cat], ['Город', v.city], ['Адрес', v.addr],
       ['Вместимость', cap + ' чел.'],
       ['Номерной фонд', (v.rooms.twin || v.rooms.sngl) ? `TWIN ${v.rooms.twin} · SNGL ${v.rooms.sngl}` : 'нет'],
       ['Залов', v.halls.length],
       ['Рейтинг', `${v.rating} (${v.reviews})`],
       ['Договор по бонусной программе', v.loyaltyContract ? 'да' : 'нет']]
    : [['Категория', v.cat], ['Регион', v.city], ['Звёздность', v.stars ? '★'.repeat(v.stars) : '—']];

  document.getElementById('root').innerHTML = `
  <div class="crumbs">
    <a href="search.html">Подбор площадок</a><span class="sep">→</span><span class="cur">${esc(v.name)}</span>
  </div>

  <div class="dhead">
    <div>
      <span class="d-eyebrow">${esc(v.cat)}</span>
      <h1 class="d-title">${esc(v.name)}</h1>
      <div class="d-meta">
        <span>${esc(v.city)}${full && v.addr ? ' · ' + esc(v.addr) : ''}</span>
        <span>до <b>${cap}</b> чел.</span>
        <span><b>${v.halls.length}</b> ${ML.plural(v.halls.length, ['зал','зала','залов'])}</span>
        ${v.stars ? `<span class="d-stars">${'★'.repeat(v.stars)}</span>` : ''}
        <span class="d-rating">${IC.star} <b>${v.rating}</b> (${v.reviews})</span>
        ${v.loyaltyContract ? '<span class="tag solid">Бонусная программа</span>' : ''}
      </div>
    </div>
    <div class="d-actions">
      ${t.blacklist ? `<button class="btn" onclick="hideVenue(${v.id})">В блэк-лист</button>` : ''}
      <a class="btn pri" href="search.html">К подбору</a>
    </div>
  </div>

  ${gallery(v, full)}

  ${!full ? `<div class="note">
      <span>Тариф <b>«${esc(t.name)}»</b> показывает общее фото, название, категорию, регион и звёздность.
      Адрес, оснащение и схемы рассадки — с тарифа «БИЗНЕС».</span>
      <a class="btn sm" href="pricing.html">Тарифы</a></div>` : ''}

  <div class="two">
    <div>
      ${v.desc ? `<div class="sec-head first"><h2 class="sec-title">О площадке</h2></div>
      <div class="panel about"><p>${esc(v.desc)}</p></div>` : ''}

      <div class="sec-head${v.desc ? '' : ' first'}">
        <h2 class="sec-title">Залы объекта</h2>
        <span class="sec-sub">В подбор попадают именно залы</span>
      </div>
      <div class="hrows">${hallRows}</div>

      ${full && featureBlocks ? `<div class="sec-head"><h2 class="sec-title">Оснащение и услуги</h2></div>${featureBlocks}` : ''}
    </div>

    <aside class="side">
      <div class="panel">
        <div class="eyebrow">Характеристики</div>
        <table class="tbl">${rows.map(([k, x]) => `<tr><th>${esc(k)}</th><td>${esc(x)}</td></tr>`).join('')}</table>
      </div>
      <div class="panel">
        <div class="eyebrow">Как отправить запрос</div>
        <p>Бронирования на ресурсе нет. Соберите нужные залы в сравнение — запрос уходит одной кнопкой сразу во все выбранные объекты.</p>
        <a class="btn pri" style="display:block;text-align:center" href="compare.html">Перейти в сравнение (${ML.state.compare.size})</a>
      </div>
    </aside>
  </div>`;
}

/* ── действия ── */
function toggleCmp(hallId) {
  const r = ML.toggleCompare(hallId);
  if (!r.ok) { MH.toast(r.reason, 'error'); return; }
  render();
}
function toggleFavHall(hallId) {
  const added = ML.toggleFav(hallId);
  MH.toast(added ? 'Зал добавлен в избранное' : 'Зал удалён из избранного', added ? 'success' : 'info');
  render();
}
function hideVenue(id) {
  ML.addToBlacklist(id);
  MH.toast('Объект скрыт из выдачи', 'info');
  MH.go('search.html');
}

/* ── старт ── */
(function init() {
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  const v = ML.venueById(id);
  if (!v) { notFound('Объект не найден'); return; }
  V = v;

  const title = `${v.name} — ${v.city} — МирХАБ`;
  const desc = `${v.cat} в городе ${v.city}. ${v.halls.length} ${ML.plural(v.halls.length, ['зал','зала','залов'])}, до ${ML.venueCapacity(v)} человек.`;
  document.title = title;
  document.getElementById('ogTitle').setAttribute('content', title);
  document.getElementById('ogDesc').setAttribute('content', desc);
  document.getElementById('metaDesc').setAttribute('content', desc);

  render();
})();
</script>
</body>
</html>
