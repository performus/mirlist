<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Личный кабинет — Площадки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --c:#EB7454;--c6:#D96345;--c8:#B14A32;--cs:#FCEAE4;--cg:rgba(235,116,84,.14);
  --aq:#79B9C3;--aq-s:#D9ECEB;--aq-p:#EDF6F5;
  --s:#46627A;--sm:#3E596F;--sd:#354E63;--sx:#7A919F;--sp:#B4C3CC;
  --pc:#F6E6DE;--bg:#F8F5F2;--w:#FFF;
  --sh:0 4px 20px rgba(53,78,99,.07);--shl:0 8px 40px rgba(53,78,99,.09);--shc:0 4px 18px rgba(235,116,84,.2);
  --r:10px;--rm:14px;--rl:20px;--rf:50px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--s);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.db-layout{display:flex;flex:1;overflow:hidden;min-height:0;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--sp);border-radius:3px;}

/* SIDEBAR */
.sb{width:256px;height:100%;background:var(--w);border-right:1px solid rgba(197,227,225,.3);display:flex;flex-direction:column;flex-shrink:0;}
.sb-top{padding:16px 22px 16px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 12px;}
.sb-section{margin-bottom:8px;}
.sb-section-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sp);padding:12px 12px 6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13.5px;font-weight:500;color:var(--sx);cursor:pointer;transition:all .2s;margin-bottom:2px;}
.sb-item:hover{background:var(--aq-p);color:var(--sm);}
.sb-item.active{background:var(--cs);color:var(--c);font-weight:600;}
.sb-item svg{flex-shrink:0;opacity:.55;}
.sb-item.active svg{opacity:1;color:var(--c);}
.sb-badge{margin-left:auto;padding:2px 8px;border-radius:var(--rf);font-size:11px;font-weight:700;background:var(--c);color:#fff;}
.sb-item-special{color:var(--c)!important;opacity:.8;}
.sb-item-special svg{opacity:.8!important;}
.sb-item-special:hover{background:var(--cs)!important;opacity:1;}
.sb-bottom{padding:16px;border-top:1px solid rgba(197,227,225,.25);}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);cursor:pointer;transition:background .2s;}
.sb-user:hover{background:var(--aq-p);}
.sb-avatar{width:36px;height:36px;border-radius:50%;background:var(--cs);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--c);flex-shrink:0;}
.sb-uname{font-size:13px;font-weight:600;color:var(--sd);}
.sb-urole{font-size:11.5px;color:var(--sx);}
.sb-premium{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--rf);background:linear-gradient(135deg,var(--c),var(--c6));color:#fff;font-size:10px;font-weight:700;margin-top:2px;}

/* MAIN */
.main{flex:1;height:100%;overflow-y:auto;padding:28px 36px 60px;}
.db-ft{margin:48px -36px -60px;}
@media(max-width:1024px){.db-ft{margin:40px -16px -40px;}}
.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Common */
.page-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:28px;color:var(--sd);margin-bottom:6px;}
.page-sub{font-size:15px;color:var(--sx);margin-bottom:28px;}
.card{background:var(--w);border:1px solid rgba(197,227,225,.18);border-radius:var(--rl);padding:24px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s;}
.card[onclick]:hover{transform:translateY(-2px);box-shadow:var(--shl);border-color:rgba(235,116,84,.22);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.btn{padding:10px 22px;border-radius:var(--rf);font-size:13.5px;font-weight:600;border:none;transition:all .25s;display:inline-flex;align-items:center;gap:7px;}
.btn-c{background:var(--c);color:#fff;box-shadow:var(--shc);}.btn-c:hover{background:var(--c6);}
.btn-cs{background:var(--cs);color:var(--c);}.btn-cs:hover{background:var(--c);color:#fff;}
.btn-o{background:none;color:var(--s);border:1.5px solid var(--sp);}.btn-o:hover{border-color:var(--c);color:var(--c);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:var(--rf);font-size:12px;font-weight:500;background:var(--pc);color:var(--sm);}
.chip.coral{background:var(--cs);color:var(--c);font-weight:600;}
.divider{height:1px;background:rgba(197,227,225,.25);margin:20px 0;}
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-text{font-size:15px;color:var(--sx);margin-bottom:20px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.section-label{font-family:'Literata',Georgia,serif;font-weight:600;font-size:20px;color:var(--sd);}

/* STAT CARDS */
.stat-card{background:var(--w);border:1px solid rgba(197,227,225,.15);border-radius:var(--rl);padding:22px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 80px;opacity:.08;}
.stat-card.coral::before{background:var(--c);}
.stat-card.aqua::before{background:var(--aq);}
.stat-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:8px;}
.stat-val{font-size:30px;font-weight:700;color:var(--sd);}
.stat-val.coral{color:var(--c);}
.stat-change{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
.stat-change.up{color:#4CAF78;}
.stat-change.down{color:var(--c8);}

/* VENUE CARDS (favorites / listing) */
.v-card{border-radius:var(--rl);overflow:hidden;background:var(--w);border:1px solid rgba(197,227,225,.12);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;cursor:pointer;}
.v-card:hover{transform:translateY(-4px);box-shadow:var(--shl);}
.v-thumb{height:140px;overflow:hidden;position:relative;}
.v-thumb svg{width:100%;height:100%;transition:transform .5s;}
.v-card:hover .v-thumb svg{transform:scale(1.05);}
.v-tag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:var(--rf);font-size:10.5px;font-weight:600;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);color:var(--s);}
.v-status{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:var(--rf);font-size:10.5px;font-weight:600;}
.v-status.active{background:rgba(76,175,120,.15);color:#3a8a5c;}
.v-status.pending{background:var(--cs);color:var(--c);}
.v-body{padding:14px 16px 16px;}
.v-name{font-size:14.5px;font-weight:600;color:var(--sd);margin-bottom:4px;}
.v-loc{font-size:12.5px;color:var(--sx);margin-bottom:10px;}
.v-foot{display:flex;align-items:center;justify-content:space-between;}
.v-price{font-size:12px;color:var(--sx);}.v-price strong{font-size:15px;font-weight:700;color:var(--sd);}
.v-rating{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--sd);}
.v-rating svg{color:#F0B95A;}
.v-actions-row{display:flex;gap:6px;margin-top:10px;}
.v-act-btn{flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid rgba(197,227,225,.3);background:var(--w);color:var(--sx);text-align:center;transition:all .2s;}
.v-act-btn:hover{border-color:var(--c);color:var(--c);}


/* REQUEST CARDS */
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.req-card{background:var(--w);border:1px solid rgba(197,227,225,.18);border-radius:var(--rl);padding:20px;cursor:pointer;transition:all .3s;position:relative;}
.req-card:hover{border-color:rgba(235,116,84,.2);box-shadow:var(--sh);}
.req-card.active{border-color:var(--c);box-shadow:0 0 0 2px var(--cg);}
.req-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.req-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.req-name{font-size:14.5px;font-weight:600;color:var(--sd);}
.req-role{font-size:12px;color:var(--sx);}
.req-status{position:absolute;top:16px;right:16px;padding:4px 12px;border-radius:var(--rf);font-size:11px;font-weight:600;}
.req-status.new{background:var(--cs);color:var(--c);}
.req-status.progress{background:var(--aq-p);color:var(--aq);}
.req-status.closed{background:var(--bg);color:var(--sp);}
.req-details{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.req-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sx);}
.req-row svg{flex-shrink:0;color:var(--sp);opacity:.6;}
.req-row b{color:var(--sd);font-weight:600;}
.req-preview{font-size:12.5px;color:var(--sx);line-height:1.5;padding:10px 14px;background:var(--bg);border-radius:var(--r);margin-bottom:12px;border-left:3px solid var(--cs);}
.req-foot{display:flex;align-items:center;justify-content:space-between;}
.req-time{font-size:11.5px;color:var(--sp);}
.req-unread{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}


@media(max-width:600px){
  .req-grid{grid-template-columns:1fr;}
}

/* CHECKLIST */
.check-list{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--rm);background:var(--w);border:1px solid rgba(197,227,225,.18);cursor:pointer;transition:all .2s;}
.check-item:hover{border-color:var(--cs);}
.check-item.done{background:var(--cs);border-color:rgba(235,116,84,.15);}
.check-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--sp);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.check-item.done .check-box{background:var(--c);border-color:var(--c);}
.check-box svg{opacity:0;transition:opacity .15s;}
.check-item.done .check-box svg{opacity:1;}
.check-text{font-size:14px;color:var(--sm);font-weight:500;}
.check-item.done .check-text{color:var(--c6);}

/* HISTORY */
.hist-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--rm);background:var(--w);border:1px solid rgba(197,227,225,.15);margin-bottom:8px;transition:all .2s;}
.hist-item:hover{border-color:var(--cs);box-shadow:var(--sh);}
.hist-icon{width:38px;height:38px;border-radius:10px;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hist-text{flex:1;}.hist-query{font-size:14px;font-weight:600;color:var(--sd);}
.hist-detail{font-size:12px;color:var(--sx);}
.hist-action{padding:7px 14px;border-radius:var(--rf);font-size:12px;font-weight:600;background:var(--cs);color:var(--c);border:none;transition:all .2s;cursor:pointer;}
.hist-action:hover{background:var(--c);color:#fff;}

/* PROFILE FORM */
.form-group{margin-bottom:20px;}
.form-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:8px;display:block;}
.form-input{width:100%;padding:12px 16px;border-radius:var(--r);border:1.5px solid rgba(197,227,225,.4);background:var(--w);font-family:inherit;font-size:14px;color:var(--sd);transition:border-color .2s;outline:none;}
.form-input:focus{border-color:var(--c);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-toggle{display:flex;gap:4px;padding:3px;background:var(--bg);border-radius:var(--r);}
.form-toggle button{flex:1;padding:9px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;color:var(--sx);background:none;transition:all .25s;}
.form-toggle button.active{background:var(--w);color:var(--c);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);}

/* ONBOARDING STEPPER */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:32px;padding:0 10px;}

/* HALL CARDS */
.hall-card{background:var(--bg);border:1.5px solid rgba(197,227,225,.25);border-radius:var(--rl);padding:24px;margin-bottom:14px;position:relative;transition:border-color .3s;}
.hall-card:hover{border-color:rgba(235,116,84,.15);}
.hall-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.hall-num{font-family:'Literata',Georgia,serif;font-weight:600;font-size:18px;color:var(--sd);display:flex;align-items:center;gap:8px;}
.hall-num::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--c);}
.hall-remove{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sp);background:var(--w);display:flex;align-items:center;justify-content:center;color:var(--sp);font-size:14px;cursor:pointer;transition:all .2s;}
.hall-remove:hover{border-color:var(--c);color:var(--c);background:var(--cs);}
.hall-photos{display:flex;gap:8px;flex-wrap:wrap;}
.hall-photo-add{width:90px;height:90px;border-radius:var(--r);border:2px dashed var(--sp);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
.hall-photo-add:hover{border-color:var(--c);background:var(--cs);}
.hall-photo-thumb{width:90px;height:90px;border-radius:var(--r);background:var(--aq-p);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;}
.hall-photo-thumb .photo-placeholder{font-size:11px;color:var(--aq);font-weight:600;}
.hall-photo-thumb .photo-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;}
.hall-photo-thumb:hover .photo-remove{opacity:1;}
.step{display:flex;align-items:center;gap:8px;flex:1;}
.step-num{width:32px;height:32px;border-radius:50%;border:2px solid var(--sp);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sp);flex-shrink:0;transition:all .25s;}
.step.active .step-num{background:var(--c);border-color:var(--c);color:#fff;}
.step.done .step-num{background:var(--cs);border-color:var(--c);color:var(--c);}
.step-label{font-size:12.5px;font-weight:500;color:var(--sx);}
.step.active .step-label{color:var(--c);font-weight:600;}
.step-line{flex:1;height:2px;background:var(--sp);opacity:.3;margin:0 8px;}
.step.done .step-line,.step.active .step-line{background:var(--c);opacity:.5;}

/* OWNER STATS */
.owner-chart{height:140px;background:linear-gradient(to top,var(--cs),var(--w));border-radius:var(--rl);display:flex;align-items:flex-end;padding:16px 20px;gap:8px;}
.chart-bar{flex:1;background:var(--c);border-radius:6px 6px 0 0;transition:height .4s;opacity:.7;}
.chart-bar:hover{opacity:1;}

/* GUEST */
.guest-hero{text-align:center;padding:60px 40px;background:linear-gradient(135deg,var(--cs),var(--pc));border-radius:var(--rl);margin-bottom:24px;}
.guest-hero h2{font-family:'Literata',Georgia,serif;font-weight:600;font-size:28px;color:var(--sd);margin-bottom:10px;}
.guest-hero p{font-size:15px;color:var(--sx);max-width:400px;margin:0 auto 24px;}
.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.benefit{text-align:center;padding:24px 16px;background:var(--w);border-radius:var(--rl);border:1px solid rgba(197,227,225,.18);}
.benefit-icon{font-size:32px;margin-bottom:10px;}
.benefit-title{font-size:14px;font-weight:600;color:var(--sd);margin-bottom:4px;}
.benefit-desc{font-size:12.5px;color:var(--sx);line-height:1.5;}

/* ═══ RESPONSIVE ═══ */

/* Tablet */
@media(max-width:1100px){
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .benefit-grid{grid-template-columns:1fr 1fr;}
}

/* Sidebar collapse + layout shifts */
@media(max-width:900px){
  .sb{width:64px;overflow:visible;}
  .sb-top{padding:10px 10px 10px;}
  .sb-section-label,.sb-uname,.sb-urole,.sb-premium{display:none;}
  .sb-nav{padding:4px 8px;}
  .sb-item{justify-content:center;padding:12px 8px;border-radius:8px;}
  .sb-item span{display:none;}
  .sb-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;padding:0;font-size:9px;display:flex;align-items:center;justify-content:center;}
  .sb-item{position:relative;}
  .sb-bottom{padding:10px 8px;}
  .sb-user{justify-content:center;}
  .sb-user>div:last-child{display:none;}

  .main{padding:20px 16px 40px;}
  .page-title{font-size:22px;}
  .page-sub{font-size:13.5px;margin-bottom:20px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .section-head{flex-wrap:wrap;gap:8px;}
  .section-label{font-size:18px;}
  .stat-val{font-size:24px;}
  .stat-card{padding:16px;}
  .card{padding:18px;}
}

/* Mobile */
@media(max-width:600px){
  .sb{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%!important;height:auto;flex-direction:row;border-right:none;border-top:1px solid rgba(197,227,225,.35);z-index:100;padding:0;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom);}
  .sb-top,.sb-bottom,.sb-section-label{display:none!important;}
  .sb-nav{display:flex;flex-direction:row;padding:4px 0;overflow:visible;gap:0;scrollbar-width:none;flex:1;}
  .sb-item{flex:1;padding:10px 4px 12px;flex-direction:column;gap:4px;align-items:center;justify-content:center;border-radius:0;margin-bottom:0;background:none!important;position:relative;min-height:52px;}
  .sb-item svg{width:22px;height:22px;}
  .sb-item span:not(.sb-badge){display:block!important;font-size:9.5px;line-height:1.15;white-space:normal;text-align:center;color:var(--sx);}
  /* семь пунктов: подписи переносятся, при нехватке места панель прокручивается */
  .sb-nav{overflow-x:auto!important;}
  .sb-item{flex:1 0 54px!important;min-width:54px;padding-left:2px!important;padding-right:2px!important;}
  .sb-item.active span:not(.sb-badge){color:var(--c);}
  .sb-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--c);}
  .sb-badge{position:absolute;top:8px;left:calc(50% + 5px);width:14px;height:14px;font-size:8px;display:flex;align-items:center;justify-content:center;line-height:1;}

  body{flex-direction:column;}
  .main{height:100%;padding:16px 14px calc(110px + env(safe-area-inset-bottom));}
  #stepNav{flex-wrap:wrap;gap:8px;}
  #stepNav .btn{flex:1;justify-content:center;min-width:120px;}

  .page-title{font-size:20px;line-height:1.2;}
  .page-sub{font-size:13px;margin-bottom:16px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .benefit-grid{grid-template-columns:1fr;}
  .section-head{margin-bottom:12px;}
  .section-label{font-size:17px;}

  .stat-card{padding:14px;}
  .stat-val{font-size:22px;}
  .stat-label{font-size:11px;}
  .stat-change{font-size:11px;}

  .card{padding:14px;border-radius:var(--rm);}
  .v-card{border-radius:var(--rm);}
  .v-thumb{height:120px;}
  .v-name{font-size:13.5px;}
  .v-body{padding:12px 14px 14px;}
  .v-actions-row{flex-wrap:wrap;}
  .v-act-btn{font-size:11px;padding:6px;}

  .btn{padding:9px 18px;font-size:12.5px;}
  .chip{padding:5px 12px;font-size:11.5px;}

  .check-item{padding:12px 14px;}
  .check-text{font-size:13px;}



  .hist-item{padding:12px 14px;}
  .hist-query{font-size:13px;}

  .form-row{grid-template-columns:1fr;}
  .form-input{padding:10px 14px;font-size:13px;}
  .form-toggle button{padding:8px 12px;font-size:12px;}

  .stepper{flex-wrap:wrap;gap:6px;padding:0;}
  .step{flex:0 0 auto;}
  .step-line{display:none;}
  .step-num{width:28px;height:28px;font-size:12px;}
  .step-label{font-size:11px;}

  .owner-chart{height:100px;padding:12px 14px;}

  .guest-hero{padding:36px 20px;border-radius:var(--rm);}
  .guest-hero h2{font-size:22px;}
  .guest-hero p{font-size:14px;}

  /* Horizontal card layouts in dashboard */
  .card[style*="display:flex"][style*="overflow:hidden"] {
    flex-direction:column!important;
  }
  .card[style*="display:flex"][style*="overflow:hidden"] > div:first-child {
    width:100%!important;height:100px!important;
  }
}
/* ══════ КАБИНЕТ ПОЛЬЗОВАТЕЛЯ ══════ */
/* Токены не заводим — используем набор, уже объявленный в :root этого файла,
   чтобы разделы владельца остались нетронутыми. */

.lk-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.lk-tile{background:var(--w);border:1px solid rgba(197,227,225,.18);border-radius:var(--rl);padding:20px;box-shadow:var(--sh);}
.lk-tile .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:8px;}
.lk-tile .val{font-family:'Literata',Georgia,serif;font-weight:600;font-size:27px;color:var(--sd);line-height:1.1;}
.lk-tile .val.coral{color:var(--c);}
.lk-tile .sub{font-size:12px;color:var(--sx);margin-top:6px;line-height:1.5;}

/* ── блок запроса ── */
.rq{background:var(--w);border:1px solid rgba(197,227,225,.2);border-radius:var(--rl);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;}
.rq-head{padding:18px 20px;border-bottom:1px solid rgba(197,227,225,.22);display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.rq-id{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.04em;}
.rq-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--sd);
  margin-top:5px;cursor:pointer;flex-wrap:wrap;}
.rq-title:hover .rq-pen{opacity:1;}
.rq-pen{width:26px;height:26px;flex-shrink:0;border:none;background:none;padding:0;border-radius:6px;
  color:var(--sx);opacity:.45;transition:opacity .2s,color .2s,background .2s;
  display:flex;align-items:center;justify-content:center;}
.rq-pen svg{width:15px;height:15px;}
.rq-pen:hover{color:var(--c);background:var(--cs);opacity:1;}
.rq-title-inp{flex:1;min-width:200px;padding:7px 11px;border-radius:var(--r);
  border:1.5px solid var(--c);background:var(--w);font-family:inherit;font-size:15px;
  font-weight:700;color:var(--sd);outline:none;}

/* ── витрина карточками: как на bonus.html ── */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px;}
.scard{background:var(--w);border:1px solid rgba(197,227,225,.3);border-radius:var(--rl);
  overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s;}
.scard:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(53,78,99,.10);}
.scard-img{height:126px;background:var(--aq-p);overflow:hidden;}
.scard-img img{width:100%;height:100%;object-fit:cover;}
.scard-b{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;}
.scard-name{font-size:14.5px;font-weight:700;color:var(--sd);line-height:1.35;margin-bottom:5px;}
.scard-prov{font-size:12px;color:var(--sx);margin-bottom:12px;}
.scard-pts{font-size:19px;font-weight:800;color:var(--c);margin-bottom:12px;margin-top:auto;}
.scard-btn{width:100%;}
.scard-lack{font-size:11.5px;color:var(--sx);margin-top:7px;text-align:center;}
/* Недоступное приглушаем целиком и не даём кликнуть. */
.scard.off{opacity:.55;}
.scard.off:hover{transform:none;box-shadow:var(--sh);}
.scard.off .scard-img img{filter:grayscale(.6);}
.scard.off .scard-pts{color:var(--sp);}
.scard-btn:disabled{opacity:.6;cursor:default;}

/* ── рекламный слот: тот же вид, что на главной ── */
.adslot{border:2px dashed var(--sp);border-radius:var(--rl);background:var(--w);
  padding:30px 28px;text-align:center;margin-bottom:26px;}
.adslot-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sp);}

/* Родной date в Chrome выше обычного поля — выравниваем по соседям. */
.form-input[type="date"]{line-height:1.2;-webkit-appearance:none;appearance:none;}
.form-input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;}
.form-input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1;}

/* начисление за мероприятие в строке объекта */
.acc{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:var(--rf);white-space:nowrap;}
.acc.pending{background:var(--aq-p);color:var(--sm);}
.acc.waiting{background:var(--aq-p);color:var(--sp);}
.acc.done{background:var(--cs);color:var(--c);}
.rq-date{font-size:12px;color:var(--sx);margin-top:3px;}
.rq-params{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.rq-param{font-size:11.5px;font-weight:500;background:var(--aq-p);color:var(--sm);border-radius:var(--r);padding:4px 9px;}
.rq-params .none{font-size:11.5px;color:var(--sp);}

.rq-obj{padding:14px 20px;border-bottom:1px solid rgba(197,227,225,.16);}
.rq-fold{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border:none;border-bottom:1px solid rgba(197,227,225,.16);
  background:var(--bg,#FAF7F4);font-family:inherit;text-align:left;cursor:pointer;color:var(--sd);}
.rq-fold:hover{background:#F6F1EC;}
.rq-fold:last-child{border-bottom:none;}
.rq-fold-t{font-size:13px;font-weight:600;white-space:nowrap;}
.rq-fold-s{flex:1;min-width:0;font-size:12px;color:var(--sx);}
.rq-fold-c{width:12px;height:12px;flex-shrink:0;color:var(--sx);transition:transform .18s;}
.rq-fold.open .rq-fold-c{transform:rotate(180deg);}
.rq-tabs{display:flex;gap:6px;margin-bottom:16px;}
.ctr-list{display:flex;flex-direction:column;gap:8px;}
.ctr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:var(--r);
  background:var(--bg,#FAF7F4);font-size:13.5px;color:var(--sd);}
@media(max-width:560px){.ctr-row{flex-direction:column;align-items:flex-start;}}
.rq-tab{padding:8px 16px;border-radius:var(--rf);border:1.5px solid rgba(197,227,225,.6);background:var(--w);
  font-family:inherit;font-size:13px;font-weight:600;color:var(--sm);cursor:pointer;}
.rq-tab.on{border-color:var(--c);color:var(--c);background:var(--cs);}
.st.declined{background:var(--bg);color:var(--c8);}
@media(max-width:560px){.rq-fold{flex-wrap:wrap;}.rq-fold-s{flex-basis:100%;order:3;}}
.rq-obj:last-child{border-bottom:none;}
.rq-obj.dead{opacity:.45;}
.rq-obj-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:11px;}
/* Миниатюра объекта: фиксированный квадрат, кадрируем, а не растягиваем. */
.rq-thumb{width:44px;height:44px;flex-shrink:0;border-radius:10px;object-fit:cover;
  background:var(--aq-s);border:1px solid rgba(197,227,225,.35);}
.rq-upd{color:var(--c);font-weight:600;}
.rq-acts{flex-wrap:wrap;justify-content:flex-end;}

/* ── просмотр и корректировка запроса ── */
.rv-obj{border:1px solid rgba(197,227,225,.35);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.rv-obj-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rv-obj-name{font-size:14px;font-weight:700;color:var(--sd);}
.rv-halls{display:flex;flex-wrap:wrap;gap:6px;}
.rv-hall{font-size:12px;padding:4px 10px;border-radius:var(--rf);background:var(--aq-p);color:var(--sm);}
.rv-none{font-size:12px;color:var(--sx);}
.rv-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.rv-row > div{flex:1;min-width:150px;}
.rv-k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:4px;}
.rv-v{font-size:13.5px;color:var(--sd);font-weight:600;}
.rv-letter{white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--sm);
  background:var(--aq-p);border-radius:var(--r);padding:12px 14px;}
.rq-obj-name{font-size:14.5px;font-weight:700;color:var(--sd);transition:color .2s;}
.rq-obj-name:hover{color:var(--c);}
.rq-obj-meta{font-size:12px;color:var(--sx);}
.st{padding:4px 12px;border-radius:var(--rf);font-size:11px;font-weight:700;white-space:nowrap;}
.st.sent{background:var(--cs);color:var(--c);}
.st.done{background:#E6F4EC;color:#3E9A6B;}
.st.reviewed{background:var(--pc);color:var(--sm);}
.st.cancelled{background:var(--bg);color:var(--sp);}
.st.new{background:var(--cs);color:var(--c);}
.st.rejected{background:var(--bg);color:var(--c8);}
/* Заказы за баллы отличаются от обычных запросов рамкой и подложкой. */
.ordcard{border:1.5px solid var(--aq-s);background:linear-gradient(180deg,var(--aq-p) 0%,var(--w) 90px);}
.ord-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--rf);
  background:var(--c);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.ord-note{font-size:12px;color:var(--sx);margin-top:3px;max-width:320px;}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;}
.btn-xs{padding:7px 13px;border-radius:var(--rf);font-size:12px;font-weight:600;border:1.5px solid rgba(197,227,225,.5);background:var(--w);color:var(--s);transition:all .18s;white-space:nowrap;}
.btn-xs:hover:not(:disabled){border-color:var(--c);color:var(--c);}
.btn-xs:disabled{opacity:.4;cursor:not-allowed;}
.btn-xs.danger:hover:not(:disabled){border-color:var(--c8);color:var(--c8);}

.sortbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.sortbar span{font-size:12.5px;color:var(--sx);}

/* ── избранное ── */
.fav-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--w);border:1px solid rgba(197,227,225,.2);border-radius:var(--rm);box-shadow:var(--sh);padding:12px;margin-bottom:10px;}
.fav-img{width:96px;height:66px;border-radius:var(--r);overflow:hidden;flex:none;background:var(--aq-p);}
.fav-img img{width:100%;height:100%;object-fit:cover;}
.fav-mid{flex:1;min-width:150px;}
.fav-name{font-size:14.5px;font-weight:700;color:var(--sd);transition:color .2s;}
.fav-name:hover{color:var(--c);}
.fav-sub{font-size:12.5px;color:var(--sx);margin-top:3px;}
.fav-price{font-size:15px;font-weight:700;color:var(--sd);white-space:nowrap;}

/* ── баллы ── */
.ptbl{width:100%;border-collapse:collapse;font-size:13px;}
.ptbl th,.ptbl td{text-align:left;padding:11px 14px;border-bottom:1px solid rgba(197,227,225,.22);}
.ptbl thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);background:var(--aq-p);}
.ptbl tbody tr:last-child td{border-bottom:none;}
.ptbl td.num{font-weight:700;color:var(--sd);white-space:nowrap;}
.ptbl td.plus{color:#3E9A6B;font-weight:700;}
.shop-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid rgba(197,227,225,.22);}
.shop-row:last-of-type{border-bottom:none;}
.shop-mid{flex:1;min-width:170px;}
.shop-name{font-size:14px;font-weight:600;color:var(--sd);}
.shop-prov{font-size:12px;color:var(--sx);margin-top:2px;}
.shop-pts{font-size:15px;font-weight:700;color:var(--c);white-space:nowrap;}

/* ── модалка кабинета ── */
.dm-ovl{position:fixed;inset:0;z-index:900;background:rgba(53,78,99,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;}
.dm{background:var(--w);border-radius:var(--rl);width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shl);overflow:hidden;}
.dm-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.dm-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:20px;color:var(--sd);}
.dm-body{padding:16px 24px 20px;overflow-y:auto;}
.dm-body p{font-size:13.5px;line-height:1.6;color:var(--sm);margin-bottom:14px;}
.dm-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px;flex-wrap:wrap;}
.dm-x{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sp);background:var(--w);color:var(--sx);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.dm-x:hover{border-color:var(--c);color:var(--c);}
.dm-note{background:var(--aq-p);border-radius:var(--r);padding:11px 13px;font-size:12px;line-height:1.55;color:var(--sm);margin-top:14px;}

.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid rgba(197,227,225,.4);border-radius:var(--r);margin-bottom:7px;cursor:pointer;font-size:13.5px;transition:all .18s;}
.opt:hover{border-color:var(--aq);}
.opt input{accent-color:var(--c);}
.opt.sel{border-color:var(--c);background:var(--cs);}
.opt .fee{margin-left:auto;font-size:12px;font-weight:700;color:var(--c);white-space:nowrap;}

.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;}
.dg-h{font-size:10.5px;font-weight:600;color:var(--sx);text-align:center;padding-bottom:2px;}
.dcell{padding:8px 2px;border:1.5px solid rgba(197,227,225,.4);border-radius:8px;background:var(--w);font-size:12.5px;color:var(--s);transition:all .15s;}
.dcell:hover{border-color:var(--aq);}
.dcell.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700;}
.dcell.past{opacity:.3;cursor:not-allowed;}

.orow-stars{color:#F0B95A;letter-spacing:1px;}
.stars{display:flex;gap:5px;margin-bottom:6px;}
.star{font-size:26px;line-height:1;color:var(--sp);background:none;border:none;padding:0;transition:color .15s;}
.star.on{color:#F0B95A;}

/* ══════ КАБИНЕТЫ ОБЪЕКТА И ПОСТАВЩИКА ══════ */
.orow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid rgba(197,227,225,.22);}
.orow:last-child{border-bottom:none;}
.orow-mid{flex:1;min-width:190px;}
.orow-name{font-size:14.5px;font-weight:700;color:var(--sd);}
.orow-sub{font-size:12.5px;color:var(--sx);margin-top:3px;}
.orow-halls{font-size:12px;color:var(--sm);margin-top:5px;}
.mod{padding:4px 12px;border-radius:var(--rf);font-size:11px;font-weight:700;white-space:nowrap;}
.mod.review{background:var(--cs);color:var(--c);}
.mod.published{background:#E6F4EC;color:#3E9A6B;}
.mod.draft{background:var(--bg);color:var(--sp);}
.mod.rejected{background:var(--bg);color:var(--c8);}

.dtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
.dtbl th,.dtbl td{text-align:left;padding:11px 14px;border-bottom:1px solid rgba(197,227,225,.22);vertical-align:middle;}
.dtbl thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);background:var(--aq-p);}
.dtbl tbody tr:last-child td{border-bottom:none;}
.dtbl td.num{font-weight:700;color:var(--sd);white-space:nowrap;}
.dtbl tr.dead{opacity:.45;}
.dscroll{overflow-x:auto;}
.wait{font-size:12px;color:var(--sx);}
.paid{font-size:12.5px;font-weight:700;color:#3E9A6B;}

/* ══════ ВИЗАРДЫ ══════ */
.wz-ovl{position:fixed;inset:0;z-index:950;background:rgba(53,78,99,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;}
.wz{background:var(--w);border-radius:var(--rl);width:100%;max-width:840px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shl);overflow:hidden;}
.wz-head{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid rgba(197,227,225,.25);}
.wz-head h2{font-family:'Literata',Georgia,serif;font-size:20px;color:var(--sd);font-weight:600;flex:1;}
.wz-cnt{font-size:12.5px;color:var(--sx);white-space:nowrap;}
.wz-body{display:grid;grid-template-columns:212px minmax(0,1fr);flex:1;min-height:0;}
.wz-steps{border-right:1px solid rgba(197,227,225,.25);padding:14px 10px;overflow-y:auto;background:var(--bg);}
.wz-steps button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border:none;background:none;border-radius:var(--r);font-size:12.5px;color:var(--sx);transition:all .18s;margin-bottom:2px;}
.wz-steps button:hover{background:var(--aq-p);}
.wz-steps button.on{background:var(--cs);color:var(--c);font-weight:700;}
.wz-steps button.done{color:var(--sd);}
.wz-steps .n{width:20px;height:20px;border-radius:50%;background:var(--w);border:1.5px solid var(--sp);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;}
.wz-steps button.on .n{background:var(--c);border-color:var(--c);color:#fff;}
.wz-steps button.done .n{background:#3E9A6B;border-color:#3E9A6B;color:#fff;}
.wz-form{padding:20px 24px;overflow-y:auto;}
.wz-foot{display:flex;align-items:center;gap:8px;padding:14px 24px;border-top:1px solid rgba(197,227,225,.25);flex-wrap:wrap;}

.wf{margin-bottom:17px;}
.wf label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:6px;}
.wf input,.wf select,.wf textarea{width:100%;padding:10px 14px;border-radius:var(--r);border:1.5px solid rgba(197,227,225,.5);background:var(--bg);font-family:inherit;font-size:13.5px;color:var(--sd);outline:none;transition:border-color .2s,background .2s;}
.wf input:focus,.wf select:focus,.wf textarea:focus{border-color:var(--c);background:var(--w);}
.wf textarea{min-height:92px;resize:vertical;line-height:1.55;}
.wf.bad input,.wf.bad select,.wf.bad textarea{border-color:var(--c8);background:#FDF3F0;}
.wf .hint{font-size:11.5px;line-height:1.5;color:var(--sx);margin-top:6px;}
.wz-note{background:var(--aq-p);border-radius:var(--r);padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--sm);margin-bottom:17px;}
.wz-warn{background:var(--cs);color:var(--sm);}
.wchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;}
.wcheck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sm);padding:5px 0;cursor:pointer;}
.wcheck input{width:auto;accent-color:var(--c);}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;}
.seatgrid label{font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--sm);font-weight:500;}
.wmap{position:relative;height:230px;border-radius:var(--rm);overflow:hidden;border:1.5px solid rgba(197,227,225,.5);cursor:crosshair;margin-bottom:10px;background:var(--aq-p);}
.wmap svg{width:100%;height:100%;display:block;}
.wmap-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.9);border-radius:var(--rf);padding:7px 14px;font-size:12.5px;color:var(--sm);pointer-events:none;}
.wmap-pin{position:absolute;width:18px;height:18px;margin:-18px 0 0 -9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);box-shadow:0 2px 6px rgba(53,78,99,.3);pointer-events:none;}
.wmap-pin::after{content:'';position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff;}
.drop{border:2px dashed var(--sp);border-radius:var(--rm);padding:24px;text-align:center;font-size:13px;color:var(--sx);cursor:pointer;transition:all .2s;}
.drop:hover{border-color:var(--c);background:var(--cs);color:var(--c);}
.wlist{display:flex;flex-direction:column;gap:7px;margin-bottom:13px;}
.witem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid rgba(197,227,225,.4);border-radius:var(--r);padding:10px 12px;font-size:13px;}
.witem b{flex:1;min-width:120px;color:var(--sd);}
.witem .sub{font-size:12px;color:var(--sx);}
.wprev{border:1px solid rgba(197,227,225,.4);border-radius:var(--rm);overflow:hidden;max-width:300px;}
.wprev-img{height:110px;background:var(--aq-p);}
.wprev-b{padding:12px 14px;}
.wsum{width:100%;border-collapse:collapse;font-size:13px;}
.wsum th,.wsum td{text-align:left;padding:9px 0;border-bottom:1px solid rgba(197,227,225,.25);}
.wsum tr:last-child th,.wsum tr:last-child td{border-bottom:none;}
.wsum th{font-weight:500;color:var(--sx);width:44%;}
.wsum td{font-weight:600;color:var(--sd);}

@media(max-width:768px){
  .lk-tiles{grid-template-columns:1fr 1fr;}
  .rq-head{padding:14px;}
  .rq-obj{padding:12px 14px;}
  .wz-body{grid-template-columns:minmax(0,1fr);}
  .wz-steps{display:flex;gap:6px;overflow-x:auto;border-right:none;border-bottom:1px solid rgba(197,227,225,.25);padding:10px;}
  .wz-steps button{width:auto;white-space:nowrap;margin-bottom:0;}
  .wz-steps button span:not(.n){display:none;}
  .wz-steps button.on span:not(.n){display:inline;}
}

<script>
/* ═══ SVG helper ═══ */
function vIll(h,s){const n=((s-1)%16)+1;return '<img src="../assets/photos/v'+n+'.jpg" alt="" style="opacity:0;transition:opacity .4s;width:100%;height:100%;object-fit:cover;" onload="this.style.opacity=1" onerror="this.style.opacity=1">';}

const IC={
  dash:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>`,

  hist:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,

  add:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>`,
  req:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>`,
  stat:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>`,

  shop:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M3 9 6 3h12l3 6"/><path d="M9 13a3 3 0 0 0 6 0"/></svg>`,
  chk:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,

/* ═══ NAV CONFIG ═══
   Состав пунктов — MH.CABINET_MENU (shared.js): из него же собирается
   выпадающее меню пользователя в шапке. Здесь только иконки и счётчики. */
const NAV_ICONS={dash:IC.dash,requests:IC.req,compare:IC.check,favs:IC.fav,points:IC.star,profile:IC.user,billing:IC.stat,
  odash:IC.dash,ovenues:IC.venue,oreqs:IC.req,oshop:IC.shop,ostats:IC.stat,oprofile:IC.user,
  sdash:IC.dash,sservices:IC.venue,sreqs:IC.req,sshop:IC.shop,ssub:IC.stat,sprofile:IC.user};
const NAV_BADGES={
  requests:()=>ML.activeRequests().length||null,
  compare:()=>ML.state.compare.size||null,
  favs:()=>ML.state.favs.size||null,
  ovenues:()=>ML.state.myVenues.length||null,
  oreqs:()=>venueIncoming().filter(x=>!ML.isClosedRow(x.obj)).length||null,
  oshop:()=>ML.myShopItems('venue').length||null,
  sservices:()=>ML.state.myServices.length||null,
  sshop:()=>ML.myShopItems('supplier').length||null,
};
const NAVS={guest:[{id:'guest',icon:IC.user,label:'Вход'}]};
Object.keys(MH.CABINET_MENU).forEach(role=>{
  NAVS[role]=MH.CABINET_MENU[role].map(it=>({id:it.id,label:it.label,href:it.href||'',icon:NAV_ICONS[it.id]||IC.dash,badgeFn:NAV_BADGES[it.id]}));
});

/* ═══ RENDER SIDEBAR NAV ═══ */
let currentRole='user', currentPage='dash';

function renderNav(){
  const nav=document.getElementById('sideNav');
  const items=NAVS[currentRole];
  nav.innerHTML='<div class="sb-section-label">Меню</div>'+items.map(it=>{
    const b=it.badgeFn?it.badgeFn():it.badge;
    const isSpecial=it.special;
    return `<div class="sb-item${it.id===currentPage?' active':''}${isSpecial?' sb-item-special':''}" data-page="${it.id}" data-href="${it.href||''}">
      ${it.icon}<span>${it.label}</span>
      ${b?`<span class="sb-badge">${b}</span>`:''}
    </div>`;
  }).join('');
  nav.querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.page==='_addvenue'){MH.go('list-venue.html');return;}
      if(el.dataset.href){MH.go(el.dataset.href);return;}
      closeAllWiz();   // смена раздела закрывает все открытые визарды
      currentPage=el.dataset.page;renderNav();renderPage();
    });
  });
  // Bottom user
  const bot=document.getElementById('sbBottom');
  const s=window._mhSess;
  const ini=s?s.initials:'АК';
  const uname=s?s.name:'Пользователь';
  const prem=s&&s.premium;
  const logoutBtn=`<button onclick="MH.logout()" style="width:100%;margin-top:8px;padding:8px;border-radius:var(--r);border:1.5px solid rgba(197,227,225,.3);background:none;font-family:inherit;font-size:12.5px;color:var(--sx);cursor:pointer;transition:all .2s;" onmouseover="this.style.borderColor='var(--c)';this.style.color='var(--c)'" onmouseout="this.style.borderColor='rgba(197,227,225,.3)';this.style.color='var(--sx)'">Выйти</button>`;
  if(currentRole==='guest'){bot.innerHTML=`<a href="auth.html" style="display:block;text-align:center;padding:10px;border-radius:var(--r);background:var(--c);color:#fff;font-size:13px;font-weight:600;text-decoration:none;">Войти / Зарегистрироваться</a>`;}
  else if(currentRole==='user'){bot.innerHTML=`<div class="sb-user"><div class="sb-avatar">${ini}</div><div><div class="sb-uname">${uname}</div><div class="sb-urole">Пользователь</div>${prem?`<div class="sb-premium">${IC.star} Premium</div>`:''}</div></div>${logoutBtn}`;}
  else{bot.innerHTML=`<div class="sb-user"><div class="sb-avatar" style="background:var(--aq-s);color:var(--sm)">${ini}</div><div><div class="sb-uname">${uname}</div><div class="sb-urole">${currentRole==='supplier'?'Поставщик':'Менеджер объекта'}</div></div></div>${logoutBtn}`;}
}

/* Переключатель ролей переехал в демо-панель в шапке (shared.js).
   Роль по-прежнему приходит параметром ?role= и разбирается ниже. */

/* ═══ PAGE RENDERERS ═══ */
/* п.41: реклама в кабинете пользователя — на «СТАРТ» и «БИЗНЕС», на «ПРЕМИУМ» её нет.
   В «Обзоре» слот стоит между плитками и последним запросом, в остальных разделах — в конце страницы. */
const showUserAds=()=>currentRole==='user'&&['start','biz'].includes(ML.tariff().key);
function userAdSlot(){
  return showUserAds()&&currentPage!=='dash'?`<div class="adslot" style="margin-top:28px">${MH.adMark()}</div>`:'';
}
function renderPage(){
  const m=document.getElementById('mainContent');
  const fn=PAGES[currentPage];
  m.innerHTML=(fn?fn():'<div class="empty-state"><div class="empty-icon"><svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.35"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="empty-text">Раздел в разработке</div></div>')
    + userAdSlot()
    + '<div class="db-ft" id="mh-footer"></div>';
  MH.renderFooter(document.getElementById('mh-footer'));
  if(currentPage==='oshop'||currentPage==='sshop') shopCalc();   // подсказка расчёта сразу под полем
}

/* ══════════════════════════════════════════════
   КАБИНЕТ ПОЛЬЗОВАТЕЛЯ — вспомогательные функции
   Переходы статусов идут ТОЛЬКО через ML.canSetStatus / ML.setStatus.
   ══════════════════════════════════════════════ */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* Экранирование для строк, попадающих внутрь inline-обработчиков. */
const jt  = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');

let REQ_SORT = 'date';
let REQ_TAB = 'active';
function setReqTab(t){ REQ_TAB = t; renderPage(); }
/* Дата окончания подписки: после покупки ПРЕМИУМ за баллы — из модели. */
const subUntil = () => ML.state.premUntil || '01.05.2027';
const SESS_NAME = () => (window._mhSess && window._mhSess.name) || 'Анна Козлова';
const SESS_INI  = () => (window._mhSess && window._mhSess.initials) || 'АК';

/* История платежей в модели не хранится — показываем текущий тариф по его же цене. */
function payments(){
  const t = ML.tariff();
  if (!t.price) return [];
  return ['01.04.2027','01.03.2027','01.02.2027'].map(d =>
    ({ date: d, what: `Подписка «${t.name}», месяц`, rub: t.price }));
}

function setReqSort(k){ REQ_SORT = k; renderPage(); }
function sortedRequests(){
  const list = ML.state.requests.slice();
  if (REQ_SORT === 'title') list.sort((a,b) => String(a.title).localeCompare(String(b.title), 'ru'));
  else list.sort((a,b) => dmy(b.date) - dmy(a.date));
  return list;
}
/* Дата в модели — строка дд.мм.гггг. */
function dmy(s){
  const m = String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : 0;
}

/* ── блок одного запроса ── */
/* Развёрнутые запросы. По умолчанию строки объектов свёрнуты. */
const RQ_OPEN = new Set();
function toggleRq(key){ RQ_OPEN.has(key) ? RQ_OPEN.delete(key) : RQ_OPEN.add(key); renderPage(); }
/** part: 'active' | 'archived' | undefined (весь запрос) */
function reqBlock(r, part){
  const params = Array.isArray(r.params) ? r.params : [];
  const rows = part ? ML.splitRequest(r)[part] : r.objects;
  const key = r.id + ':' + (part || 'all');
  const open = RQ_OPEN.has(key);
  const sum = {};
  rows.forEach(o => { const l = (ML.bothConfirmed(o) ? 'Состоялось, баллы начислены' : (ML.REQUEST_FLOW[o.status] || {}).label || o.status); sum[l] = (sum[l] || 0) + 1; });
  return `<div class="rq" data-rq="${esc(r.id)}">
    <div class="rq-head">
      <div>
        <div class="rq-id">${esc(r.id)}</div>
        <div class="rq-title" onclick="startRename('${esc(r.id)}')" title="Переименовать">
          <span>${esc(r.title)}</span>
          <button class="rq-pen" aria-label="Переименовать запрос">${IC_PEN}</button>
        </div>
        <div class="rq-date">от ${esc(r.date)} · ${rows.length} ${ML.plural(rows.length,['объект','объекта','объектов'])}${part === 'archived' ? ' в архиве' : ''}${
          r.updatedAt ? ` · <span class="rq-upd">исправлен ${esc(r.updatedAt)}</span>` : ''}</div>
        <div class="rq-params">${params.length
          ? params.map(p => `<span class="rq-param">${esc(p)}</span>`).join('')
          : '<span class="none">параметры поиска не сохранялись</span>'}</div>
      </div>
      <div class="btn-row rq-acts">
        <button class="btn-xs" onclick="openReqView('${esc(r.id)}')">Посмотреть запрос</button>
        ${part === 'archived' ? '' : `<button class="btn-xs" onclick="openReqEdit('${esc(r.id)}')">Скорректировать запрос</button>
        <button class="btn-xs" onclick="refreshAll('${esc(r.id)}')">Обновить статус</button>`}
      </div>
    </div>
    <button type="button" class="rq-fold${open ? ' open' : ''}" aria-expanded="${open}" onclick="toggleRq('${jt(key)}')">
      <span class="rq-fold-t">${open ? 'Свернуть' : 'Показать'} объекты запроса (${rows.length})</span>
      <span class="rq-fold-s">${Object.entries(sum).map(([l, n]) => `${esc(l)}${n > 1 ? ' × ' + n : ''}`).join(' · ')}</span>
      <svg class="rq-fold-c" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg>
    </button>
    ${open ? rows.map(o => reqObjRow(r, o)).join('') : ''}
  </div>`;
}

function reqObjRow(r, o){
  const v = ML.venueById(o.venueId);
  const flow = ML.REQUEST_FLOW[o.status] || { label: o.status };
  const dead = o.status === 'cancelled';
  // активность каждой кнопки — только по модели
  const canRefresh   = ML.canSetStatus(o, 'cancelled');   // активна, пока объект не отменён
  const canDone      = ML.canSetStatus(o, 'done');
  const canReview    = ML.canSetStatus(o, 'reviewed');
  const canCancel    = ML.canSetStatus(o, 'cancelled');
  const extra = [
    o.guests ? `${o.guests} чел.` : '',
    o.dates ? esc(o.dates) : '',
    o.reason ? `причина: ${esc(o.reason)}` : '',
  ].filter(Boolean).join(' · ');

  return `<div class="rq-obj${dead ? ' dead' : ''}">
    <div class="rq-obj-top">
      ${v ? `<img class="rq-thumb" src="${ML.photoUrl(v.photo)}" alt="" loading="lazy">` : ''}
      <a class="rq-obj-name" href="venue.html?id=${o.venueId}">${esc(v ? v.name : 'Объект #' + o.venueId)}</a>
      <span class="st ${o.status}">${esc(flow.label)}</span>
      ${accrualChip(r, o)}
      ${extra ? `<span class="rq-obj-meta">${extra}</span>` : ''}
    </div>
    <div class="btn-row">
      <button class="btn-xs" ${canRefresh ? '' : 'disabled'} onclick="refreshOne('${esc(r.id)}',${o.venueId})">Обновить</button>
      <button class="btn-xs" ${canDone ? '' : 'disabled'} onclick="markDone('${esc(r.id)}',${o.venueId})">Мероприятие состоялось</button>
      <button class="btn-xs" ${canReview ? '' : 'disabled'} onclick="openReview('${esc(r.id)}',${o.venueId})">Отзыв</button>
      <button class="btn-xs danger" ${canCancel ? '' : 'disabled'} onclick="openCancel('${esc(r.id)}',${o.venueId})">Отмена</button>
    </div>
  </div>`;
}

const IC_PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 10-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg>';

/* Начисление за мероприятие. Считает модель, здесь только формулировка. */
function accrualChip(r, o){
  const a = ML.accrualFor(r, o);
  if (!a) return '';
  const pts = a.pts.toLocaleString('ru') + ' Б';
  const text = a.state === 'done' ? 'начислено ' + pts
    : a.state === 'waiting' ? pts + ' · ожидает подтверждения объекта'
    : 'будет начислено ' + pts;
  return `<span class="acc ${a.state}">${esc(text)}</span>`;
}

/* Переименование запроса — только в кабинете пользователя.
   Правим прямо в строке: модалка ради одного поля избыточна. */
function startRename(id){
  const r = ML.requestById(id);
  const box = document.querySelector(`[data-rq="${id}"] .rq-title`);
  if (!r || !box || box.dataset.edit) return;
  box.dataset.edit = '1';
  box.removeAttribute('onclick');
  box.innerHTML = `<input class="rq-title-inp" id="rqTitleInp" maxlength="120" value="${esc(r.title)}">
    <button class="btn-xs" onclick="saveRename('${esc(id)}')">Сохранить</button>
    <button class="btn-xs" onclick="renderPage()">Отмена</button>`;
  const inp = document.getElementById('rqTitleInp');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveRename(id); }
    if (e.key === 'Escape') { e.preventDefault(); renderPage(); }
  });
}

function saveRename(id){
  const inp = document.getElementById('rqTitleInp');
  const t = (inp ? inp.value : '').trim();
  if (!t) { MH.toast('Название не может быть пустым', 'error'); return; }
  ML.updateRequest(id, { title: t });
  MH.toast('Название изменено', 'success');
  renderPage();
}

function refreshOne(){ MH.toast('Статус актуален — ответ от объекта пока не поступал', 'info'); }
function refreshAll(){ MH.toast('Статусы обновлены', 'info'); renderPage(); }

/* ══════════════════════════════════════════════
   ПРОСМОТР И КОРРЕКТИРОВКА ЗАПРОСА
   Состав собираем через ML.requestByVenue: он отдаёт объекты вместе
   с выбранными в них залами, а не плоский список.
   ══════════════════════════════════════════════ */
function reqComposition(r){
  return ML.requestByVenue(r).map(x => `
    <div class="rv-obj">
      <div class="rv-obj-top">
        <img class="rq-thumb" src="${ML.photoUrl(x.venue.photo)}" alt="" loading="lazy">
        <div>
          <div class="rv-obj-name">${esc(x.venue.name)}</div>
          <span class="st ${x.obj.status}">${esc((ML.REQUEST_FLOW[x.obj.status]||{}).label || x.obj.status)}</span>
        </div>
      </div>
      ${x.halls.length
        ? `<div class="rv-halls">${x.halls.map(h => `<span class="rv-hall">${esc(h.name)}</span>`).join('')}</div>`
        : '<div class="rv-none">Залы не отмечались — запрос по объекту целиком</div>'}
    </div>`).join('');
}

function openReqView(id){

  const params = Array.isArray(r.params) ? r.params : [];
  dm('Запрос ' + esc(r.id), `
    <div class="rv-row">
      <div><div class="rv-k">Даты</div><div class="rv-v">${esc(r.dates || '—')}</div></div>
      <div><div class="rv-k">Участников</div><div class="rv-v">${esc(String(r.guests || '—'))}</div></div>
      <div><div class="rv-k">Отправлен</div><div class="rv-v">${esc(r.date)}${r.updatedAt ? ' · исправлен ' + esc(r.updatedAt) : ''}</div></div>
    </div>
    <div class="rv-k">Параметры поиска</div>
    <div class="rq-params" style="margin-bottom:14px">${params.length
      ? params.map(x => `<span class="rq-param">${esc(x)}</span>`).join('')
      : '<span class="none">параметры поиска не сохранялись</span>'}</div>
    <div class="rv-k">Куда ушёл запрос</div>
    ${reqComposition(r)}
    <div class="rv-k" style="margin-top:14px">Сопроводительное письмо</div>
    <div class="rv-letter">${esc(r.letter || '—')}</div>`,
    `<button class="btn btn-o" onclick="dmClose()">Закрыть</button>`);
}

function openReqEdit(id){
  const r = ML.requestById(id);
  if (!r) return;
  const live = r.objects.filter(o => o.status !== 'cancelled').length;
  dm('Скорректировать запрос', `
    <div class="rv-row">
      <div>
        <label class="form-label" for="edDates">Даты</label>
        <input class="form-input" id="edDates" value="${esc(r.dates || '')}" placeholder="12–14 сентября">
      </div>
      <div>
        <label class="form-label" for="edGuests">Участников</label>
        <input class="form-input" id="edGuests" type="number" min="0" value="${esc(String(r.guests || ''))}" placeholder="120">
      </div>
    </div>
    <label class="form-label" for="edLetter">Сопроводительное письмо</label>
    <textarea class="form-input" id="edLetter" rows="6">${esc(r.letter || '')}</textarea>
    <div class="dm-note">Исправления отправятся объектам, которые ещё не отменили запрос — сейчас их ${live}.
    Если, скорректировав запрос, вы отправите его заново, статусы обновятся, но объекты,
    отклонившие изначальный запрос, новый уже не получат.</div>`,
    `<button class="btn btn-o" onclick="dmClose()">Отмена</button>
     <button class="btn btn-o" onclick="repeatReq('${esc(r.id)}')">Отправить новый запрос</button>
     <button class="btn btn-c" onclick="saveReqEdit('${esc(r.id)}')">Сохранить</button>`);
}

function edVals(){
  return {
    dates: (document.getElementById('edDates') || {}).value || '',
    guests: +((document.getElementById('edGuests') || {}).value) || 0,
    letter: (document.getElementById('edLetter') || {}).value || '',
  };
}

function saveReqEdit(id){
  const ok = ML.updateRequest(id, edVals());
  dmClose();
  MH.toast(ok ? 'Запрос скорректирован' : 'Не удалось сохранить', ok ? 'success' : 'error');
  renderPage();
}

function repeatReq(id){
  const req = ML.repeatRequest(id, edVals());
  dmClose();
  if (!req) { MH.toast('Все объекты в запросе отменены — повторять нечего', 'error'); return; }
  MH.toast('Новый запрос ' + req.id + ' отправлен', 'success');
  renderPage();
}

/* ── модалка ── */
function dm(title, body, foot){
  document.getElementById('dmRoot').innerHTML = `
  <div class="dm-ovl" onclick="if(event.target===this)dmClose()">
    <div class="dm" role="dialog" aria-modal="true">
      <div class="dm-head"><div class="dm-title">${title}</div>
        <button class="dm-x" onclick="dmClose()" aria-label="Закрыть">✕</button></div>
      <div class="dm-body">${body}</div>
      ${foot ? `<div class="dm-foot">${foot}</div>` : ''}
    </div>
  </div>`;
  document.addEventListener('keydown', dmEsc);
}
function dmEsc(e){ if (e.key === 'Escape') dmClose(); }
function dmClose(){ document.getElementById('dmRoot').innerHTML = ''; document.removeEventListener('keydown', dmEsc); }

/* ── визард «Мероприятие состоялось» ──
   Отдельного шага «Мероприятие подтверждено» больше нет: количество участников
   и даты, которые он спрашивал, уточняются здесь, в момент отметки. */
let WZ = { tier: 0, dates: new Set() };
function markDone(reqId, venueId){
  WZ = { tier: 0, dates: new Set() };
  const v = ML.venueById(venueId);
  dm('Мероприятие состоялось', `
    <p>Отметьте, что мероприятие в объекте <b>${esc(v ? v.name : '')}</b> состоялось, и уточните детали —
    от количества участников зависит, сколько баллов вам начислят.</p>
    <label class="form-label">Название мероприятия</label>
    <input class="form-input" id="wzName" value="Конференция «Итоги полугодия»">
    <label class="form-label" style="margin-top:16px;display:block">Количество человек</label>
    <div id="wzTiers">${ML.FEE_TIERS.map((t,i) => `
      <label class="opt${i===0?' sel':''}" data-i="${i}" onclick="pickTier(${i})">
        <input type="radio" name="wzTier" ${i===0?'checked':''}>
        <span>${esc(t.label)}</span>
        <span class="fee">${tierPoints(t)}</span>
      </label>`).join('')}</div>
    <label class="form-label" style="margin-top:16px;display:block">Даты мероприятия</label>
    <div class="dgrid">${['пн','вт','ср','чт','пт','сб','вс'].map(d => `<div class="dg-h">${d}</div>`).join('')}
      ${dateCells()}</div>
    <div class="dm-note" id="wzHint">Выберите один или несколько дней.</div>`,
    `<button class="btn btn-o" onclick="dmClose()">Отмена</button>
     <button class="btn btn-c" onclick="saveDone('${esc(reqId)}',${venueId})">Отметить</button>`);
}
/* Сколько баллов даёт диапазон на текущем тарифе. Список ярусов берём
   из модели: изменится ML.FEE_TIERS — изменится и визард. */
function tierPoints(t){
  const pts = ML.tariff().key === 'prem' ? t.ptsPrem : t.ptsBiz;
  if (!pts) return 'по согласованию';
  return pts.toLocaleString('ru') + ' ' + ML.plural(pts, ['балл','балла','баллов']);
}

/* Шахматка на три недели, последняя — текущая: мероприятие уже прошло,
   поэтому закрыты будущие дни, а не прошедшие. */
function dateCells(){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - 14);   // понедельник две недели назад
  let out = '';
  for (let i = 0; i < 21; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = d.toLocaleDateString('ru');
    const future = d > today;
    out += `<button class="dcell${future ? ' past' : ''}" ${future ? 'disabled' : ''}
      data-d="${key}" onclick="pickDate(this)">${d.getDate()}</button>`;
  }
  return out;
}
function pickDate(btn){
  const k = btn.dataset.d;
  if (WZ.dates.has(k)) { WZ.dates.delete(k); btn.classList.remove('on'); }
  else { WZ.dates.add(k); btn.classList.add('on'); }
  const h = document.getElementById('wzHint');
  if (h) h.textContent = WZ.dates.size
    ? 'Выбрано: ' + [...WZ.dates].join(', ')
    : 'Выберите один или несколько дней.';
}
function pickTier(i){
  WZ.tier = i;
  document.querySelectorAll('#wzTiers .opt').forEach(el => {
    const on = +el.dataset.i === i;
    el.classList.toggle('sel', on);
    el.querySelector('input').checked = on;
  });
}
function saveDone(reqId, venueId){
  if (!WZ.dates.size) { MH.toast('Выберите даты мероприятия', 'error'); return; }
  const tier = ML.FEE_TIERS[WZ.tier];
  const guests = tier.max === Infinity ? tier.min : tier.max;
  const ok = ML.setStatus(reqId, venueId, 'done', { guests, dates: [...WZ.dates].join(', ') });
  dmClose();
  MH.toast(ok ? 'Отмечено: мероприятие состоялось' : 'Статус изменить нельзя', ok ? 'success' : 'error');
  renderPage();
}

let CANCEL_PICK = 0;
function openCancel(reqId, venueId){
  CANCEL_PICK = 0;
  dm('Отмена', `
    <p>Укажите причину — она уйдёт объекту и попадёт в статистику.</p>
    <div id="cnList">${ML.CANCEL_REASONS.map((r,i) => `
      <label class="opt${i===0?' sel':''}" data-i="${i}" onclick="pickReason(${i})">
        <input type="radio" name="cnR" ${i===0?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div>
    <div id="cnOther" style="display:none;margin-top:10px">
      <label class="form-label">Комментарий</label>
      <textarea class="form-input" id="cnText" rows="3" placeholder="Опишите причину"></textarea>
    </div>`,
    `<button class="btn btn-o" onclick="dmClose()">Назад</button>
     <button class="btn btn-c" onclick="saveCancel('${esc(reqId)}',${venueId})">Отменить мероприятие</button>`);
}
function pickReason(i){
  CANCEL_PICK = i;
  document.querySelectorAll('#cnList .opt').forEach(el => {
    const on = +el.dataset.i === i;
    el.classList.toggle('sel', on);
    el.querySelector('input').checked = on;
  });
  const isOther = ML.CANCEL_REASONS[i] === 'Другое';
  document.getElementById('cnOther').style.display = isOther ? '' : 'none';
}
function saveCancel(reqId, venueId){
  let reason = ML.CANCEL_REASONS[CANCEL_PICK];
  if (reason === 'Другое'){
    const t = (document.getElementById('cnText').value || '').trim();
    if (!t) { MH.toast('Опишите причину', 'error'); return; }
    reason = 'Другое: ' + t;
  }
  const ok = ML.setStatus(reqId, venueId, 'cancelled', { reason });
  dmClose();
  MH.toast(ok ? 'Мероприятие отменено' : 'Статус изменить нельзя', ok ? 'info' : 'error');
  renderPage();
}

function pickStar(n){
  REVIEW_RATE = n;
  document.querySelectorAll('#rvStars .star').forEach(b => b.classList.toggle('on', +b.dataset.n <= n));
}
function saveReview(reqId, venueId){
  const txt = (document.getElementById('rvText').value || '').trim();
  if (!txt) { MH.toast('Напишите пару слов о площадке', 'error'); return; }
  const before = ML.state.points.free;
  // Отзыв уходит в модель вместе со статусом: баллы и запись создаёт сама ML.setStatus
  const ok = ML.setStatus(reqId, venueId, 'reviewed', {
    review: { rating: REVIEW_RATE, text: txt, author: SESS_NAME() },
  });
  dmClose();
  const got = ML.state.points.free - before;
  MH.toast(ok ? (got ? `Спасибо! Начислено ${got} ${ML.plural(got,['балл','балла','баллов'])}` : 'Спасибо за отзыв') : 'Статус изменить нельзя',
    ok ? 'success' : 'error');
  renderPage();
}

/* ── баллы ──
   Журнала начислений в модели нет: собираем строки из того, что в ней есть —
   бонус за регистрацию, вознаграждения за состоявшиеся мероприятия и отзывы. */
function pointsLedger(){
  const out = [{ what: 'Баллы «ПРИВЕТ» за регистрацию', state: 'начислены', pts: ML.POINTS_HELLO }];
  ML.state.requests.forEach(r => r.objects.forEach(o => {
    const v = ML.venueById(o.venueId);
    const name = v ? v.name : 'Объект #' + o.venueId;
    if ((o.status === 'done' || o.status === 'reviewed') && o.guests){
      const p = ML.eventPoints(o.guests);
      if (p) out.push({ what: `Мероприятие в «${name}»`, state: o.status === 'done' ? 'ждём оплату от объекта' : 'начислены', pts: p });
    }
    if (o.status === 'reviewed'){
      const p = ML.reviewPoints();
      if (p) out.push({ what: `Отзыв о «${name}»`, state: 'начислены', pts: p });
    }
  }));
  return out;
}
/* Заказ за баллы. Списание и номер заказа — целиком из ML.orderFromShop. */
function shopItemById(id){ return ML.shopCatalog().find(s => String(s.id) === String(id)); }

function buyShop(id){
  const item = shopItemById(id);
  if (!item) return;
  if (item.premiumMonths) { MH.buyPremium(() => { renderNav(); renderPage(); }); return; }
  const P = ML.state.points;
  if (P.free < item.pts) { MH.toast('Не хватает баллов', 'error'); return; }
  dm('Заказ за баллы',
    `<p><b>${esc(item.title)}</b> — ${esc(item.provider)}</p>
     <table class="wsum" style="margin:12px 0">
       <tr><th>Спишется с баланса</th><td>${item.pts.toLocaleString('ru')} Б</td></tr>
       <tr><th>Останется после заказа</th><td>${(P.free - item.pts).toLocaleString('ru')} Б</td></tr>
     </table>
     <label class="form-label">Комментарий партнёру</label>
     <textarea class="form-input" id="bsNote" rows="3" placeholder="Даты, количество человек, пожелания"></textarea>
     <div class="dm-note">Баллы спишутся сразу. Партнёр подтвердит заказ и свяжется с вами.
     Если заказ будет отклонен, баллы вернутся на счёт.</div>`,
    `<button class="btn btn-o" onclick="dmClose()">Отмена</button>
     <button class="btn btn-c" onclick="confirmShop('${jt(String(item.id))}')">Оформить заказ</button>`);
}
function confirmShop(id){
  const item = shopItemById(id);
  const note = (document.getElementById('bsNote') || {}).value || '';
  const o = ML.orderFromShop(item, note.trim());
  dmClose();
  if (!o) { MH.toast('Не хватает баллов', 'error'); return; }
  renderNav(); renderPage();
  dm('Заказ оформлен',
    `<p>Номер заказа <b>${esc(o.id)}</b>, списано <b>${o.pts.toLocaleString('ru')} Б</b>.</p>
     <p style="margin-top:8px">Партнёр «${esc(o.provider)}» получит заказ во входящих и подтвердит его.
     Статус заказа виден ниже, в списке «Мои заказы».</p>`,
    `<button class="btn btn-c" onclick="dmClose()">Понятно</button>`);
}

/* Верхняя граница даты рождения — минус 18 лет от сегодня. */
function maxBirth(){
  const d = new Date();
  d.setFullYear(d.getFullYear() - 18);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function pickToggle(btn){
  [...btn.parentElement.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

   у модели нет понятия «владелец», а статистике нужен конкретный id. */

const ownVenue=()=>ML.venueById(OWN_VENUE_ID);
const ownSupplier=()=>ML.SUPPLIERS.find(x=>x.id===OWN_SUPPLIER_ID);

  const out=[];
  ML.state.requests.forEach(r=>r.objects.forEach(o=>{
    out.push({req:r,obj:o,venue:ML.venueById(o.venueId)});
  }));
  return out;
}

/* ── стек визардов: вложенный возвращается в родительский ── */
let WIZ=null, WIZSTACK=[];

function openWiz(kind){
  if(WIZ) WIZSTACK.push(WIZ);
  WIZ={kind,step:0,max:0,bad:null,data:{},def:WIZDEFS[kind]};
  drawWiz();
  document.addEventListener('keydown',wizEsc);
}
function wizEsc(e){ if(e.key==='Escape') closeWiz(); }
function closeWiz(){
  if(WIZSTACK.length){ WIZ=WIZSTACK.pop(); drawWiz(); return; }   // назад в родительский
  closeAllWiz();
}
function closeAllWiz(){
  WIZ=null; WIZSTACK=[];
  document.getElementById('dmRoot').innerHTML='';
  document.removeEventListener('keydown',wizEsc);
}

function drawWiz(){
  const d=WIZ.def, st=d.s[WIZ.step], last=WIZ.step===d.s.length-1;
  document.getElementById('dmRoot').innerHTML=`
  <div class="wz-ovl" onclick="if(event.target===this)closeWiz()">
    <div class="wz" role="dialog" aria-modal="true">
      <div class="wz-head">
        <h2>${esc(d.t)}</h2>
        <span class="wz-cnt">Шаг ${WIZ.step+1} из ${d.s.length}</span>
        <button class="dm-x" onclick="closeWiz()" aria-label="Закрыть">✕</button>
      </div>
      <div class="wz-body">
        <div class="wz-steps">${d.s.map((s,i)=>`
          <button class="${i===WIZ.step?'on':''} ${i<WIZ.max?'done':''}" onclick="wizGo(${i})">
            <span class="n">${i<WIZ.max?'✓':i+1}</span><span>${esc(s.t)}</span></button>`).join('')}</div>
        <div class="wz-form">${st.f.map(wfield).join('')}</div>
      </div>
      <div class="wz-foot">
        <button class="btn btn-o" onclick="closeWiz()">${WIZSTACK.length?'Назад к объекту':'Отмена'}</button>
        <span style="flex:1"></span>
        ${WIZ.step>0?`<button class="btn btn-o" onclick="wizGo(${WIZ.step-1})">Назад</button>`:''}
        ${last?`<button class="btn btn-c" onclick="wizSave()">${esc(d.fin)}</button>`
               :`<button class="btn btn-c" onclick="wizNext()">Далее</button>`}
      </div>
    </div>
  </div>`;
}

/* Поле с when рисуется только когда предикат истинен — так звёздность
   не появляется у лофта и корабля. Скрытое поле и не проверяется. */
function wfield(f){
  if(f.when&&!f.when()) return '';
  const v=WIZ.data[f.k], bad=WIZ.bad===f.k?' bad':'';
  const L=f.l?`<label>${esc(f.l)}</label>`:'';
  const H=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  const S=`WIZ.data['${f.k}']`;
  const opts=f.optFn?f.optFn():(f.opt||[]);
  switch(f.ty){
    case 'note': return `<div class="wz-note">${esc(f.text)}</div>`;
    case 'feenote': {
      const t=ML.FEE_TIERS.filter(x=>x.fee).map(x=>`${ML.money(x.fee)} за ${x.label.toLowerCase()}`).join(', ');
      return `<div class="wz-note">Размещение объекта бесплатное. Объект платит фиксированную сумму
        только за состоявшееся мероприятие, рассчитанную исходя из минимального числа участников.</div>`;
    }
    case 'text': case 'num':
      return `<div class="wf${bad}">${L}<input type="${f.ty==='num'?'number':'text'}"
        placeholder="${esc(f.ph||'')}" value="${v==null?'':esc(v)}" oninput="${S}=this.value">${H}</div>`;
    case 'area':
      return `<div class="wf${bad}">${L}<textarea placeholder="${esc(f.ph||'')}"
        oninput="${S}=this.value">${v==null?'':esc(v)}</textarea>${H}</div>`;
    case 'select':
      return `<div class="wf${bad}">${L}<select onchange="${S}=this.value;drawWiz()">
        <option value="">— выберите —</option>
        ${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${H}</div>`;
    case 'child': {
      const kids=ML.SUPPLIER_TREE[WIZ.data.parent]||[];
      return `<div class="wf${bad}">${L}<select ${kids.length?'':'disabled'} onchange="${S}=this.value">
        <option value="">${kids.length?'— выберите —':'сначала выберите раздел'}</option>
        ${kids.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${H}</div>`;
    }
    case 'flag':
      return `<div class="wf"><label class="wcheck wcheck-solo">
        <input type="checkbox" ${v ? 'checked' : ''} onchange="${S}=this.checked">
        <span>${esc(f.l)}</span></label>${H}</div>`;
    case 'checks': {
      const a=v||[];
      return `<div class="wf">${L}<div class="wchecks">${opts.map(o=>`<label class="wcheck">
        <input type="checkbox" ${a.includes(o)?'checked':''} onchange="wizToggle('${f.k}','${jt(o)}')">
        <span>${esc(o)}</span></label>`).join('')}</div>${H}</div>`;
    }
    case 'contracts-ro':
      return `<div class="wf">${L}${contractStatusList(v||[])}</div>`;
    case 'features':
      // четыре группы удобств строго по ML.FEATURE_GROUPS
      return ML.FEATURE_GROUPS.map(g=>{
        const a=WIZ.data[g.k]||[];
        return `<div class="wf"><label>${esc(g.l)}</label><div class="wchecks">
          ${ML.FEATURES[g.k].map(o=>`<label class="wcheck">
            <input type="checkbox" ${a.includes(o)?'checked':''} onchange="wizToggle('${g.k}','${jt(o)}')">
            <span>${esc(o)}</span></label>`).join('')}</div></div>`;
      }).join('');
    case 'seats': {
      const s=v||{};
      return `<div class="wf">${L}<div class="seatgrid">${ML.SEATING.map(x=>`<div>
        <label>${MH.seatIcon(x.k, { size: 14 })}<span>${esc(x.l)}</span></label>
        <input type="number" min="0" placeholder="—" value="${s[x.k]||''}"
          oninput="wizSeat('${x.k}',this.value)"></div>`).join('')}</div>${H}</div>`;
    }
    case 'map': {
      const pin=WIZ.data._pin;
      return `<div class="wf${bad}">${L}
        <div class="wmap" onclick="wizPin(event)">${WZ_MAP}
          ${pin?`<span class="wmap-pin" style="left:${pin.x}%;top:${pin.y}%"></span>`
               :'<span class="wmap-hint">Нажмите на карту, чтобы поставить метку</span>'}</div>
        <input type="text" placeholder="55.7558, 37.6173" value="${v==null?'':esc(v)}" oninput="${S}=this.value">
        <div class="hint">Без координат объект не появится на карте подбора.</div>
      </div>`;
    }
    case 'photo':
      return `<div class="wf">${L}<div class="drop" onclick="MH.toast('Загрузка файлов пока недоступна','info')">
        Перетащите файлы или нажмите, чтобы выбрать
        <div style="margin-top:5px;font-size:12px">JPG, PNG, PDF · до 10 МБ</div></div>${H}</div>`;
    case 'pts': {
      const p=+(WIZ.data.price||0), on=(WIZ.data.loy||[]).length>0;
      if(!on) return `<div class="wz-note">Отметьте участие — покажем, во сколько услуга обойдётся пользователю в баллах.</div>`;
      return `<div class="wf"><table class="wsum">
        <tr><th>Розничная цена услуги</th><td>${ML.money(p)}</td></tr>
        <tr><th>Ресурс платит вам по договору</th><td>${ML.money(ML.serviceCost(p))}</td></tr>
        <tr><th>Списывается с пользователя</th><td>${ML.servicePoints(p).toLocaleString('ru')} Б</td></tr>
      </table></div>`;
    }
    case 'halls': {
      const hs=WIZ.data.halls||[];
      return `<div class="wf">${L}
        ${hs.length?`<div class="wlist">${hs.map((h,i)=>`<div class="witem">
            <b>${esc(h.name||'Без названия')}</b>
            <span class="sub">${esc(h.type||'—')}</span>
            <span class="sub">${h.area||'—'} м²</span>
            <span class="sub">${h.priceDay?ML.money(+h.priceDay):'по договорённости'}</span>
            <span class="sub">${Object.keys(h.seats||{}).length} ${ML.plural(Object.keys(h.seats||{}).length,['схема','схемы','схем'])}</span>
            <button class="btn-xs danger" onclick="wizDelHall(${i})">Удалить</button></div>`).join('')}</div>`
          :`<div class="wz-note wz-warn">Ни одного зала не добавлено. В подбор попадают именно залы —
             объект без залов в выдаче не появится.</div>`}
        <button class="btn btn-c" onclick="openWiz('hall')">Добавить зал</button>${H}</div>`;
    }
    case 'preview': return wizPreview();
  }
  return '';
}

function wizToggle(k,o){
  const a=(WIZ.data[k]||[]).slice(), i=a.indexOf(o);
  i<0?a.push(o):a.splice(i,1);
  WIZ.data[k]=a; drawWiz();
}
function wizSeat(k,v){
  const s=Object.assign({},WIZ.data.seats);
  if(v&&+v>0) s[k]=+v; else delete s[k];
  WIZ.data.seats=s;
}
function wizDelHall(i){ WIZ.data.halls.splice(i,1); drawWiz(); }

/* ── точка на карте в шаге «Локация» ──
   Подложка схематичная: настоящая карта придёт вместе с 2ГИС. Клик считается
   в процентах от рамки, координаты — смещением от центра выбранного города. */

  ${Array.from({length:22},(_,i)=>{

    return `<rect x="${x%94}" y="${y}" width="${w}" height="${h}" rx=".4" fill="#B8CDD8" opacity="${0.2+(i%3)*0.07}"/>`;
  }).join('')}
  <ellipse cx="20" cy="40" rx="8" ry="5" fill="#8FC8B8" opacity=".26"/>
  <ellipse cx="74" cy="18" rx="7" ry="4" fill="#8FC8B8" opacity=".22"/>
