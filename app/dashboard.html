  <path d="M36 0 Q38 18 36 34 T40 60" stroke="#fff" stroke-width="1.1" fill="none" opacity=".65"/>
  <path d="M68 0 Q66 14 69 32 T66 60" stroke="#fff" stroke-width=".9" fill="none" opacity=".55"/>
  <path d="M0 28 Q18 24 40 30 T72 26 T100 31" stroke="#7BB8C8" stroke-width="1.8" fill="none" opacity=".45"/>
</svg>`;

const CITY_CENTER={'Москва':[55.7558,37.6173],'Санкт-Петербург':[59.9386,30.3141],
  'Сочи':[43.5855,39.7231],'Казань':[55.7963,49.1088],'Нижний Новгород':[56.3269,44.0059],
  'Самара':[53.1959,50.1002],'Подмосковье':[55.6000,37.2000]};

function wizPin(e){
  const b=e.currentTarget.getBoundingClientRect();
  const x=Math.min(100,Math.max(0,(e.clientX-b.left)/b.width*100));
  const y=Math.min(100,Math.max(0,(e.clientY-b.top)/b.height*100));
  WIZ.data._pin={x:+x.toFixed(1),y:+y.toFixed(1)};
  const c=CITY_CENTER[WIZ.data.city]||CITY_CENTER['Москва'];
  const lat=c[0]+(50-y)/50*0.045, lon=c[1]+(x-50)/50*0.085;
  WIZ.data.coords=lat.toFixed(4)+', '+lon.toFixed(4);
  drawWiz();
}

function wizGo(i){ if(i>WIZ.step&&!wizValid()) return; WIZ.step=i; WIZ.max=Math.max(WIZ.max,i); drawWiz(); }
function wizNext(){ if(!wizValid()) return; WIZ.step++; WIZ.max=Math.max(WIZ.max,WIZ.step); drawWiz(); }

/* Без заполненного обязательного поля дальше не пускаем и подсвечиваем поле. */
function wizValid(){
  for(const f of WIZ.def.s[WIZ.step].f){
    if(f.when&&!f.when()) continue;
    if(f.req&&!String(WIZ.data[f.k]==null?'':WIZ.data[f.k]).trim()){
      WIZ.bad=f.k; drawWiz();
      MH.toast('Заполните поле «'+f.l+'»','error');
      return false;
    }
  }
  WIZ.bad=null; return true;
}

function wizSave(){
  if(!wizValid()) return;
  if(WIZ.kind==='hall'){
    const h=WIZ.data;
    WIZ=WIZSTACK.pop();                       // возврат в шаг 6 объекта
    WIZ.data.halls=(WIZ.data.halls||[]).concat([h]);
    drawWiz();
    MH.toast('Зал «'+(h.name||'без названия')+'» добавлен','success');
    return;
  }
  if(WIZ.kind==='venue'){
    const v=ML.addMyVenue(WIZ.data);
    // модель звёздность не принимает — дописываем и сохраняем сами
    v.stars=ML.STARRED_CATS.includes(WIZ.data.cat)?(parseInt(WIZ.data.stars,10)||0):0;
    ML.persist.myVenues();
  }
  if(WIZ.kind==='service') ML.addMyService(WIZ.data);
  closeAllWiz();
  MH.toast('Отправлено на модерацию','success');
  renderNav(); renderPage();
}

/* ── отметка «мероприятие состоялось» со стороны объекта ── */
function venueDecline(reqId,venueId){

const CONTRACT_TYPES=['Партнёрский договор с агентским вознаграждением','Договор по бонусной программе','Доп. соглашение на повышенную комиссию'];

    return `<div class="ctr-row"><span>${esc(t)}</span><span class="st ${on?'done':'cancelled'}">${on?'подписан':'не подписан'}</span></div>`;}).join('')}</div>`;

/* ── строка входящего запроса ── */
function incomingRow(x){
  const {req,obj,venue}=x;
  const flow=ML.REQUEST_FLOW[obj.status]||{label:obj.status};
  const dead=obj.status==='cancelled'||obj.status==='declined';
  const both=ML.bothConfirmed(obj);
  const fee=both?ML.venueFee(obj):null;

  let action;
  if(obj.status==='declined') action=`<span class="wait">вы отклонили запрос</span>`;
  else if(dead) action=`<span class="wait">запрос отменён</span>`;
  else if(both) action=`<span class="paid">${fee!=null?'к оплате '+ML.money(fee):'сумма по договорённости'}</span>`;
  else if(obj.venueDone) action=`<span class="wait">ждём подтверждения пользователя</span>`;
  else if(obj.status==='done'||obj.status==='reviewed')
    action=`<button class="btn-xs" onclick="venueDone('${esc(req.id)}',${obj.venueId})">Отметить «мероприятие состоялось»</button>`;
  else action=`<button class="btn-xs" onclick="venueDone('${esc(req.id)}',${obj.venueId})">Отметить «мероприятие состоялось»</button>
    <button class="btn-xs danger" style="margin-top:6px" onclick="venueDecline('${esc(req.id)}',${obj.venueId})">Отклонить</button>`;

  // подпись про вторую сторону
  let note='';
  if(!dead&&!both){
    if(obj.venueDone) note='<div class="wait">объект отметил, ждём пользователя</div>';
    else if(obj.status==='done'||obj.status==='reviewed') note='<div class="wait">пользователь отметил, ждём подтверждения от объекта</div>';
  }
  if(both) note='<div class="wait">баллы пользователю разблокированы</div>';

  return `<tr class="${dead?'dead':''}">
    <td class="num">${esc(req.id)}</td>
    <td>${esc(req.date)}</td>
    <td>${esc(req.title)}${venue?`<div class="wait">${esc(venue.name)}</div>`:''}</td>
    <td class="num">${obj.guests||'—'}</td>
    <td><span class="st ${obj.status}">${esc(flow.label)}</span>${note}</td>
    <td>${action}</td>
  </tr>`;
}

function shopOwnerName(owner){
  const o = owner==='supplier' ? ownSupplier() : ownVenue();
  return (o && o.name) || '';
}
/* Пересчёт под полем цены. Считаем в обработчике, а не при рендере страницы:
   иначе ввод цены сбрасывал бы фокус. */
function shopCalc(){
  const r=+((document.getElementById('shRetail')||{}).value||0);
  const box=document.getElementById('shCalc'); if(!box) return;
  box.innerHTML = r>0
    ? `<table class="wsum">
         <tr><th>Розничная цена услуги</th><td>${ML.money(r)}</td></tr>
         <tr><th>Ресурс платит вам по договору</th><td>${ML.money(ML.serviceCost(r))}</td></tr>
         <tr><th>Спишется с пользователя</th><td>${ML.servicePoints(r).toLocaleString('ru')} Б</td></tr>
       </table>`
    : `<div class="wz-note" style="margin:0">Укажите розничную цену — покажем, сколько получите вы
       и сколько баллов спишется с пользователя.</div>`;
}
function shopAdd(owner){
  const g=id=>document.getElementById(id);
  const title=(g('shTitle').value||'').trim();
  if(!title){ MH.toast('Укажите название услуги','error'); g('shTitle').focus(); return; }
  const retail=+g('shRetail').value||0;
  if(retail<=0){ MH.toast('Укажите розничную цену','error'); g('shRetail').focus(); return; }
  ML.addShopItem({owner, ownerName:shopOwnerName(owner), title,
    about:(g('shAbout').value||'').trim(), retail, limit:+g('shLimit').value||0});
  MH.toast('Позиция отправлена на модерацию','success');
  renderNav(); renderPage();
}
function shopPublish(localId){
  const it=ML.state.shopItems.find(x=>x.localId===localId); if(!it) return;
  it.status='published'; ML.persist.shopItems();
  MH.toast('Позиция опубликована на витрине','success');

/* ═══ HALL MANAGEMENT ═══ */
let hallCounter=1;

function addHall(){
  hallCounter++;
  const list=document.getElementById('hallsList');
  if(!list)return;
  const existing=list.querySelectorAll('.hall-card').length;
  if(existing>=10){MH.toast('В карточке объекта — не больше 10 залов','error');return;}
  const card=document.createElement('div');
  card.className='hall-card';
  card.dataset.hall=hallCounter;
  card.innerHTML=`
    <div class="hall-header">
      <div class="hall-num">Зал ${existing+1}</div>
      <button class="hall-remove" onclick="removeHall(this)" title="Удалить">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Название зала</label><input class="form-input" placeholder="Название зала"></div>
      <div class="form-group"><label class="form-label">Тип</label>
        <select class="form-input" style="-webkit-appearance:none;padding-right:36px;cursor:pointer"><option>Конференц-зал</option><option>Банкетный зал</option><option>Переговорная</option><option>Лофт</option><option>Терраса</option><option>VIP-зона</option><option>Другое</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Вместимость (макс.)</label><input class="form-input" type="number" placeholder="0"></div>
      <div class="form-group"><label class="form-label">Площадь (м²)</label><input class="form-input" type="number" placeholder="0"></div>
    </div>
    <div class="form-group"><label class="form-label">Форматы рассадки</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${['Театр','Банкет','Фуршет','Класс','Кабаре','П-образ.'].map(f=>`<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(197,227,225,.3);background:var(--w);font-size:12px;color:var(--sx)">${f}<input class="form-input" style="width:50px;padding:5px;text-align:center;font-size:12px;margin-left:auto" type="number" placeholder="0"></div>`).join('')}
      </div>
    </div>
    <div class="form-group"><label class="form-label">Особенности</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${['Естественный свет','Панорамный вид','Сцена','Звукоизоляция','Отдельный вход','Терраса'].map(f=>`<div class="chip" style="cursor:pointer;padding:6px 14px;font-size:12px" data-select="multi">${f}</div>`).join('')}
      </div>
    </div>
    <div class="form-group"><label class="form-label">Фото зала (до 10)</label>
      <div class="hall-photos">
        <div class="hall-photo-add" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" multiple style="display:none" onchange="handleHallPhotos(this)">
          <div style="font-size:24px;color:var(--sp);margin-bottom:4px">+</div>
          <div style="font-size:11px;color:var(--sp)">Добавить</div>
        </div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Цена за зал (₽/день)</label><input class="form-input" type="number" placeholder="0"></div>
  `;
  list.appendChild(card);
  card.scrollIntoView({behavior:'smooth',block:'center'});
  initStepInteractions();
  renumberHalls();
}

function removeHall(btn){
  const card=btn.closest('.hall-card');
  const list=card.parentElement;
  if(list.querySelectorAll('.hall-card').length<=1){MH.toast('Необходим минимум 1 зал','error');return;}
  card.style.opacity='0';card.style.transform='translateX(-20px)';card.style.transition='all .3s';
  setTimeout(()=>{card.remove();renumberHalls();},300);
}

function renumberHalls(){
  const cards=document.querySelectorAll('#hallsList .hall-card');
  cards.forEach((c,i)=>{c.querySelector('.hall-num').textContent='Зал '+(i+1);});
}

function handleHallPhotos(input){
  const container=input.closest('.hall-photos');
  const files=input.files;
  const existing=container.querySelectorAll('.hall-photo-thumb').length;
  const max=10-existing;
  for(let i=0;i<Math.min(files.length,max);i++){
    const thumb=document.createElement('div');
    thumb.className='hall-photo-thumb';
    const num=existing+i+1;
    thumb.innerHTML=`<div class="photo-placeholder">Фото ${num}</div><button class="photo-remove" onclick="this.parentElement.remove()">✕</button>`;
    container.insertBefore(thumb,container.querySelector('.hall-photo-add'));
  }
  input.value='';
}

/* ═══ STEPPER NAVIGATION ═══ */
function changeStep(dir){
  if(!window._stepData) return;
  const total=window._stepData.length;
  let next=window._currentStep+dir;
  if(next<0||next>=total) return;
  window._currentStep=next;
  document.getElementById('stepContent').innerHTML=window._stepData[next];
  document.getElementById('stepCurrent').textContent=next+1;
  document.getElementById('stepName').textContent=window._stepNames[next];
  document.querySelectorAll('#stepper .step').forEach((s,i)=>{
    s.classList.remove('active','done');
    if(i<next) s.classList.add('done');
    if(i===next) s.classList.add('active');
  });
  document.querySelectorAll('#stepper .step-line').forEach((l,i)=>{
    l.style.background=i<next?'var(--c)':'';
    l.style.opacity=i<next?'.5':'';
  });
  document.getElementById('stepPrev').style.display=next===0?'none':'';
  const nextBtn=document.getElementById('stepNext');
  if(next===total-1){nextBtn.textContent='Опубликовать';nextBtn.onclick=()=>{currentPage='ovenues';renderNav();renderPage();};}
  else{nextBtn.textContent='Далее →';nextBtn.onclick=()=>changeStep(1);}
  initStepInteractions();
  document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
}

function initStepInteractions(){
  // Form toggles
  document.querySelectorAll('#stepContent .form-toggle button').forEach(b=>{
    b.addEventListener('click',e=>{e.preventDefault();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  });
  // Chip toggles (single-select groups)
  document.querySelectorAll('#stepContent .chip[data-select="single"]').forEach(c=>{
    c.addEventListener('click',()=>{c.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('coral'));c.classList.add('coral');});
  });
  // Chip toggles (multi-select)
  document.querySelectorAll('#stepContent .chip[data-select="multi"]').forEach(c=>{
    c.addEventListener('click',()=>{c.classList.toggle('coral');});
  });
}

/* ═══ INIT ═══ */
renderNav();
renderPage();

// Toggle form buttons
document.addEventListener('click',e=>{
  if(e.target.closest('.form-toggle button')){
    const tg=e.target.closest('.form-toggle');
    tg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
  }
  if(e.target.closest('.chip')){
    const ch=e.target.closest('.chip');
    if(ch.closest('.chip-scroll')||ch.closest('[style]'))ch.classList.toggle('coral');
  }
});

</script>
<script>
(function(){
  const sess=MH.getSession();
  if(!sess){window.location.href='auth.html?next=dashboard.html';return;}
  window._mhSess=sess;
  MH.renderNav(document.getElementById('mh-nav'));
  const _sp=new URLSearchParams(location.search);
  const _role=_sp.get('role');
  const _page=_sp.get('page');
  // ?role=owner — старое имя роли объекта, оставлено ради ссылок из index.html
  const _alias={owner:'venue',venue:'venue',supplier:'supplier',user:'user',guest:'guest'};
  const _sessRole=MH.sessionRole();
  /* Роли — отдельные аккаунты: кабинет открывается в роли сессии. Ссылка
     с другой ?role= (сервисная панель, отчёт) входит в демо-аккаунт этой роли. */
  if(_alias[_role]&&_alias[_role]!=='guest'&&_alias[_role]!==_sessRole){MH.demoRole(_alias[_role],_page);return;}
  const _want=_alias[_role]||_sessRole;
  if(_want&&NAVS[_want]){
    currentRole=_want;
    currentPage=NAVS[_want][0].id;
  }
  // ?page=ocreate вело на отдельный экран добавления — теперь это визард в «Моих объектах»
  const _pg=_page==='ocreate'?'ovenues':_page;
  if(_pg&&NAVS[currentRole].some(x=>x.id===_pg)) currentPage=_pg;
  renderNav();renderPage();
})();
</script>
