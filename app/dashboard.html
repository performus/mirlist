<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — Площадки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c:#EB7454;--c6:#D96345;--c8:#B14A32;--cs:#FCEAE4;--cg:rgba(235,116,84,.14);
  --aq:#79B9C3;--aq-s:#D9ECEB;--aq-p:#EDF6F5;
  --s:#46627A;--sm:#3E596F;--sd:#354E63;--sx:#7A919F;--sp:#B4C3CC;
  --pc:#F6E6DE;--bg:#F8F5F2;--w:#FFF;
  --sh:0 4px 20px rgba(53,78,99,.07);--shl:0 8px 40px rgba(53,78,99,.09);--shc:0 4px 18px rgba(235,116,84,.2);
  --r:10px;--rm:14px;--rl:20px;--rf:50px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--s);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--sp);border-radius:3px;}

/* SIDEBAR */
.sb{width:256px;height:100vh;background:var(--w);border-right:1px solid rgba(197,227,225,.3);display:flex;flex-direction:column;flex-shrink:0;}
.sb-top{padding:22px 22px 16px;}
.sb-logo{font-family:'DM Serif Display',serif;font-size:21px;color:var(--sd);margin-bottom:18px;}
.sb-logo i{font-style:normal;color:var(--c);}
.sb-role{display:flex;background:var(--bg);border-radius:var(--r);padding:3px;margin-bottom:6px;}
.sb-role button{flex:1;padding:8px 0;border-radius:8px;border:none;font-size:12px;font-weight:600;color:var(--sx);background:none;transition:all .25s;}
.sb-role button.active{background:var(--w);color:var(--c);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sb-nav{flex:1;overflow-y:auto;padding:8px 12px;}
.sb-section{margin-bottom:8px;}
.sb-section-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sp);padding:12px 12px 6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13.5px;font-weight:500;color:var(--sx);cursor:pointer;transition:all .2s;margin-bottom:2px;}
.sb-item:hover{background:var(--aq-p);color:var(--sm);}
.sb-item.active{background:var(--cs);color:var(--c);font-weight:600;}
.sb-item svg{flex-shrink:0;opacity:.55;}
.sb-item.active svg{opacity:1;color:var(--c);}
.sb-badge{margin-left:auto;padding:2px 8px;border-radius:var(--rf);font-size:11px;font-weight:700;background:var(--c);color:#fff;}
.sb-bottom{padding:16px;border-top:1px solid rgba(197,227,225,.25);}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);cursor:pointer;transition:background .2s;}
.sb-user:hover{background:var(--aq-p);}
.sb-avatar{width:36px;height:36px;border-radius:50%;background:var(--cs);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--c);flex-shrink:0;}
.sb-uname{font-size:13px;font-weight:600;color:var(--sd);}
.sb-urole{font-size:11.5px;color:var(--sx);}
.sb-premium{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--rf);background:linear-gradient(135deg,var(--c),var(--c6));color:#fff;font-size:10px;font-weight:700;margin-top:2px;}

/* MAIN */
.main{flex:1;height:100vh;overflow-y:auto;padding:28px 36px 60px;}
.page{display:none;animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Common */
.page-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--sd);margin-bottom:6px;}
.page-sub{font-size:15px;color:var(--sx);margin-bottom:28px;}
.card{background:var(--w);border:1px solid rgba(197,227,225,.18);border-radius:var(--rl);padding:24px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s;}
.card:hover{box-shadow:var(--shl);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.btn{padding:10px 22px;border-radius:var(--rf);font-size:13.5px;font-weight:600;border:none;transition:all .25s;display:inline-flex;align-items:center;gap:7px;}
.btn-c{background:var(--c);color:#fff;box-shadow:var(--shc);}.btn-c:hover{background:var(--c6);}
.btn-cs{background:var(--cs);color:var(--c);}.btn-cs:hover{background:var(--c);color:#fff;}
.btn-o{background:none;color:var(--s);border:1.5px solid var(--sp);}.btn-o:hover{border-color:var(--c);color:var(--c);}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:var(--rf);font-size:12px;font-weight:500;background:var(--pc);color:var(--sm);}
.chip.coral{background:var(--cs);color:var(--c);font-weight:600;}
.divider{height:1px;background:rgba(197,227,225,.25);margin:20px 0;}
.empty-state{text-align:center;padding:60px 20px;}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-text{font-size:15px;color:var(--sx);margin-bottom:20px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.section-label{font-family:'DM Serif Display',serif;font-size:20px;color:var(--sd);}

/* STAT CARDS */
.stat-card{background:var(--w);border:1px solid rgba(197,227,225,.15);border-radius:var(--rl);padding:22px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 80px;opacity:.08;}
.stat-card.coral::before{background:var(--c);}
.stat-card.aqua::before{background:var(--aq);}
.stat-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:8px;}
.stat-val{font-size:30px;font-weight:700;color:var(--sd);}
.stat-val.coral{color:var(--c);}
.stat-change{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;}
.stat-change.up{color:#4CAF78;}
.stat-change.down{color:var(--c8);}

/* VENUE CARDS (favorites / listing) */
.v-card{border-radius:var(--rl);overflow:hidden;background:var(--w);border:1px solid rgba(197,227,225,.12);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;cursor:pointer;}
.v-card:hover{transform:translateY(-4px);box-shadow:var(--shl);}
.v-thumb{height:140px;overflow:hidden;position:relative;}
.v-thumb svg{width:100%;height:100%;transition:transform .5s;}
.v-card:hover .v-thumb svg{transform:scale(1.05);}
.v-tag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:var(--rf);font-size:10.5px;font-weight:600;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);color:var(--s);}
.v-status{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:var(--rf);font-size:10.5px;font-weight:600;}
.v-status.active{background:rgba(76,175,120,.15);color:#3a8a5c;}
.v-status.pending{background:var(--cs);color:var(--c);}
.v-body{padding:14px 16px 16px;}
.v-name{font-size:14.5px;font-weight:600;color:var(--sd);margin-bottom:4px;}
.v-loc{font-size:12.5px;color:var(--sx);margin-bottom:10px;}
.v-foot{display:flex;align-items:center;justify-content:space-between;}
.v-price{font-size:12px;color:var(--sx);}.v-price strong{font-size:15px;font-weight:700;color:var(--sd);}
.v-rating{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--sd);}
.v-rating svg{color:#F0B95A;}
.v-actions-row{display:flex;gap:6px;margin-top:10px;}
.v-act-btn{flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid rgba(197,227,225,.3);background:var(--w);color:var(--sx);text-align:center;transition:all .2s;}
.v-act-btn:hover{border-color:var(--c);color:var(--c);}

/* CHAT */
.chat-list{display:flex;flex-direction:column;gap:4px;}
.chat-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--rm);cursor:pointer;transition:background .2s;border:1px solid transparent;}
.chat-item:hover{background:var(--aq-p);border-color:rgba(197,227,225,.3);}
.chat-item.active{background:var(--cs);border-color:rgba(235,116,84,.12);}
.chat-avatar{width:42px;height:42px;border-radius:50%;background:var(--aq-s);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--sm);flex-shrink:0;position:relative;}
.chat-online{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#4CAF78;border:2px solid var(--w);}
.chat-info{flex:1;min-width:0;}
.chat-name{font-size:14px;font-weight:600;color:var(--sd);}
.chat-preview{font-size:12.5px;color:var(--sx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-meta{text-align:right;flex-shrink:0;}
.chat-time{font-size:11px;color:var(--sp);}
.chat-unread{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:4px;margin-left:auto;}

/* CHECKLIST */
.check-list{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--rm);background:var(--w);border:1px solid rgba(197,227,225,.18);cursor:pointer;transition:all .2s;}
.check-item:hover{border-color:var(--cs);}
.check-item.done{background:var(--cs);border-color:rgba(235,116,84,.15);}
.check-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--sp);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.check-item.done .check-box{background:var(--c);border-color:var(--c);}
.check-box svg{opacity:0;transition:opacity .15s;}
.check-item.done .check-box svg{opacity:1;}
.check-text{font-size:14px;color:var(--sm);font-weight:500;}
.check-item.done .check-text{color:var(--c6);}

/* HISTORY */
.hist-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--rm);background:var(--w);border:1px solid rgba(197,227,225,.15);margin-bottom:8px;transition:all .2s;}
.hist-item:hover{border-color:var(--cs);box-shadow:var(--sh);}
.hist-icon{width:38px;height:38px;border-radius:10px;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hist-text{flex:1;}.hist-query{font-size:14px;font-weight:600;color:var(--sd);}
.hist-detail{font-size:12px;color:var(--sx);}
.hist-action{padding:7px 14px;border-radius:var(--rf);font-size:12px;font-weight:600;background:var(--cs);color:var(--c);border:none;transition:all .2s;cursor:pointer;}
.hist-action:hover{background:var(--c);color:#fff;}

/* PROFILE FORM */
.form-group{margin-bottom:20px;}
.form-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sx);margin-bottom:8px;display:block;}
.form-input{width:100%;padding:12px 16px;border-radius:var(--r);border:1.5px solid rgba(197,227,225,.4);background:var(--w);font-family:inherit;font-size:14px;color:var(--sd);transition:border-color .2s;outline:none;}
.form-input:focus{border-color:var(--c);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-toggle{display:flex;gap:4px;padding:3px;background:var(--bg);border-radius:var(--r);}
.form-toggle button{flex:1;padding:9px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;color:var(--sx);background:none;transition:all .25s;}
.form-toggle button.active{background:var(--w);color:var(--c);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);}

/* ONBOARDING STEPPER */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:32px;padding:0 10px;}
.step{display:flex;align-items:center;gap:8px;flex:1;}
.step-num{width:32px;height:32px;border-radius:50%;border:2px solid var(--sp);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sp);flex-shrink:0;transition:all .25s;}
.step.active .step-num{background:var(--c);border-color:var(--c);color:#fff;}
.step.done .step-num{background:var(--cs);border-color:var(--c);color:var(--c);}
.step-label{font-size:12.5px;font-weight:500;color:var(--sx);}
.step.active .step-label{color:var(--c);font-weight:600;}
.step-line{flex:1;height:2px;background:var(--sp);opacity:.3;margin:0 8px;}
.step.done .step-line,.step.active .step-line{background:var(--c);opacity:.5;}

/* OWNER STATS */
.owner-chart{height:140px;background:linear-gradient(to top,var(--cs),var(--w));border-radius:var(--rl);display:flex;align-items:flex-end;padding:16px 20px;gap:8px;}
.chart-bar{flex:1;background:var(--c);border-radius:6px 6px 0 0;transition:height .4s;opacity:.7;}
.chart-bar:hover{opacity:1;}

/* GUEST */
.guest-hero{text-align:center;padding:60px 40px;background:linear-gradient(135deg,var(--cs),var(--pc));border-radius:var(--rl);margin-bottom:24px;}
.guest-hero h2{font-family:'DM Serif Display',serif;font-size:28px;color:var(--sd);margin-bottom:10px;}
.guest-hero p{font-size:15px;color:var(--sx);max-width:400px;margin:0 auto 24px;}
.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.benefit{text-align:center;padding:24px 16px;background:var(--w);border-radius:var(--rl);border:1px solid rgba(197,227,225,.18);}
.benefit-icon{font-size:32px;margin-bottom:10px;}
.benefit-title{font-size:14px;font-weight:600;color:var(--sd);margin-bottom:4px;}
.benefit-desc{font-size:12.5px;color:var(--sx);line-height:1.5;}

@media(max-width:900px){.sb{width:72px;}.sb-top,.sb-section-label,.sb-uname,.sb-urole,.sb-premium,.sb-role{display:none;}.sb-item{justify-content:center;padding:12px;}.sb-item span{display:none;}.sb-badge{display:none;}.main{padding:20px;}}
</style>
</head>
<body>
<!-- SIDEBAR -->
<aside class="sb">
  <div class="sb-top">
    <div class="sb-logo">Площадки<i>.</i></div>
    <div class="sb-role" id="roleSwitch">
      <button class="active" data-role="user">Пользователь</button>
      <button data-role="owner">Площадка</button>
      <button data-role="guest">Гость</button>
    </div>
  </div>
  <nav class="sb-nav" id="sideNav"></nav>
  <div class="sb-bottom" id="sbBottom"></div>
</aside>

<!-- MAIN -->
<div class="main" id="mainContent"></div>

<script>
/* ═══ SVG helper ═══ */
function vIll(h,s){return `<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="400" height="180" fill="hsl(${h},20%,89%)"/><defs><linearGradient id="g${s}" x1="0" y1="0" x2="400" y2="180"><stop stop-color="hsl(${h},28%,85%)" offset="0"/><stop stop-color="hsl(${(h+30)%360},22%,80%)" offset="1"/></linearGradient></defs><rect width="400" height="180" fill="url(#g${s})"/><rect x="20" y="50" width="360" height="100" rx="6" fill="hsl(${h},16%,93%)" opacity=".5"/><rect x="40" y="20" width="90" height="130" rx="4" fill="hsl(${h},22%,80%)" opacity=".5"/><rect x="150" y="35" width="70" height="115" rx="4" fill="hsl(${(h+25)%360},18%,83%)" opacity=".5"/><rect x="240" y="45" width="60" height="105" rx="4" fill="hsl(${(h+55)%360},20%,86%)" opacity=".4"/></svg>`;}

const IC={
  dash:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><rect x="2" y="2" width="6" height="6" rx="2" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="2" width="6" height="6" rx="2" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="10" width="6" height="6" rx="2" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="6" height="6" rx="2" stroke="currentColor" stroke-width="1.4"/></svg>`,
  fav:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><path d="M9 15.5l-6.2-5.8A3.5 3.5 0 019 4a3.5 3.5 0 016.2 5.7L9 15.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  chat:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><path d="M3 4h12a2 2 0 012 2v6a2 2 0 01-2 2H6l-3 2.5V6a2 2 0 012-2z" stroke="currentColor" stroke-width="1.4"/></svg>`,
  hist:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  check:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><path d="M4 9l3.5 3.5 6.5-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  user:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><circle cx="9" cy="6.5" r="3.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 16.5c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.4"/></svg>`,
  venue:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><rect x="2" y="5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 5V3.5a2 2 0 012-2h4a2 2 0 012 2V5" stroke="currentColor" stroke-width="1.4"/></svg>`,
  add:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  req:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 7h6M6 10h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  stat:`<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><path d="M3 14V8M7 14V5M11 14V9M15 14V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  star:`<svg width="11" height="11" fill="currentColor" viewBox="0 0 11 11"><path d="M5.5 0l1.7 3.45 3.8.55-2.75 2.68.65 3.79L5.5 8.75l-3.4 1.72.65-3.79L0 3.99l3.8-.54z"/></svg>`,
  chk:`<svg width="12" height="12" fill="none" viewBox="0 0 12 12"><path d="M2.5 6l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

/* ═══ NAV CONFIG ═══ */
const NAVS={
  user:[
    {id:'dash',icon:IC.dash,label:'Дашборд'},
    {id:'favs',icon:IC.fav,label:'Избранные',badge:'5'},
    {id:'chats',icon:IC.chat,label:'Чаты',badge:'3'},
    {id:'history',icon:IC.hist,label:'История поиска'},
    {id:'checklist',icon:IC.check,label:'Чеклист'},
    {id:'profile',icon:IC.user,label:'Профиль'},
  ],
  owner:[
    {id:'odash',icon:IC.stat,label:'Статистика'},
    {id:'ovenues',icon:IC.venue,label:'Мои площадки'},
    {id:'ocreate',icon:IC.add,label:'Добавить площадку'},
    {id:'oreqs',icon:IC.req,label:'Заявки',badge:'7'},
    {id:'ochats',icon:IC.chat,label:'Чаты',badge:'2'},
    {id:'oprofile',icon:IC.user,label:'Профиль объекта'},
  ],
  guest:[
    {id:'guest',icon:IC.user,label:'Вход'},
  ],
};

/* ═══ RENDER SIDEBAR NAV ═══ */
let currentRole='user', currentPage='dash';

function renderNav(){
  const nav=document.getElementById('sideNav');
  const items=NAVS[currentRole];
  nav.innerHTML='<div class="sb-section-label">Меню</div>'+items.map(it=>`
    <div class="sb-item${it.id===currentPage?' active':''}" data-page="${it.id}">
      ${it.icon}<span>${it.label}</span>
      ${it.badge?`<span class="sb-badge">${it.badge}</span>`:''}
    </div>`).join('');
  nav.querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click',()=>{currentPage=el.dataset.page;renderNav();renderPage();});
  });
  // Bottom user
  const bot=document.getElementById('sbBottom');
  if(currentRole==='guest'){bot.innerHTML='';}
  else if(currentRole==='user'){bot.innerHTML=`<div class="sb-user"><div class="sb-avatar">АК</div><div><div class="sb-uname">Анна Козлова</div><div class="sb-urole">Пользователь</div><div class="sb-premium">⭐ Premium</div></div></div>`;}
