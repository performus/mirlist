<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="МАЙСЛИСТ для артистов: размещение в каталоге и запросы от организаторов мероприятий.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Для артистов — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--c:#EB7454;--c6:#D96345;--cs:#FCEAE4;--aq-p:#EDF6F5;--s:#46627A;--sd:#354E63;--sx:#7A919F;--bg:#F8F5F2;--w:#FFF;--shc:0 4px 18px rgba(235,116,84,.22);--rm:14px;--rf:50px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--s);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
/* Первый экран — как у лендинга «Агентствам»: светлый градиент, крупный заголовок, одна кнопка */
.hero{position:relative;overflow:hidden;padding:96px 24px 104px;}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(235,116,84,.07) 0%,rgba(248,245,242,.6) 35%,rgba(237,246,245,.45) 70%,rgba(246,221,211,.3) 100%);}
.hero-in{position:relative;max-width:1200px;margin:0 auto;}
.hero-label{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(255,255,255,.85);border:1px solid rgba(235,116,84,.15);border-radius:var(--rf);font-size:13px;font-weight:600;color:var(--c);margin-bottom:28px;}
.hero-h1{font-family:'Literata',Georgia,serif;font-weight:600;font-size:clamp(38px,5vw,60px);line-height:1.1;color:var(--sd);margin-bottom:18px;}
.hero-sub{font-size:18px;line-height:1.6;color:var(--sx);max-width:560px;margin-bottom:36px;}
.btn-h{display:inline-block;padding:16px 34px;border-radius:var(--rm);background:var(--c);color:#fff;font-size:15px;font-weight:600;box-shadow:var(--shc);transition:background .2s,transform .2s;}
.btn-h:hover{background:var(--c6);transform:translateY(-1px);}
@media(max-width:600px){.hero{padding:56px 20px 64px;}.hero-sub{font-size:16px;}.btn-h{display:block;text-align:center;}}
</style>
</head>
<body>
<div id="mh-nav"></div>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-in">
    <div class="hero-label">Для артистов и ведущих</div>
    <h1 class="hero-h1">Для артистов</h1>
    <p class="hero-sub">Разместите свои выступления в каталоге МАЙСЛИСТ — вас найдут организаторы мероприятий.</p>
    <a class="btn-h" href="auth.html?mode=supplier">Зарегистрироваться как поставщик</a>
  </div>
</section>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>MH.init('b2b-artists');</script>
</body>
</html>
