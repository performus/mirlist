<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Помощь с оформлением: заполним карточку объекта или поставщика по вашим материалам, сделаем точные схемы и планы пространств.">
<meta property="og:title" content="Помощь с оформлением — МАЙСЛИСТ">
<meta property="og:description" content="Заполним карточку по вашим материалам и сделаем точные схемы и планы пространств.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/og-image.png">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Помощь с оформлением — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1000px;margin:0 auto;padding:28px 28px 72px;animation:pageIn .5s ease both;}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--slate-muted);margin-bottom:18px;}
.crumbs a:hover{color:var(--coral);}
.crumbs .sep{opacity:.5;}
.crumbs .cur{color:var(--slate-deep);font-weight:600;}

h1{font-family:'Literata',Georgia,serif;font-size:32px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;letter-spacing:-.005em;}
.sub{font-size:14px;line-height:1.7;color:var(--slate-muted);margin-top:10px;max-width:680px;}

.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start;margin-top:26px;}
.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:24px;}
.panel + .panel{margin-top:16px;}

.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--slate-muted);margin-bottom:9px;}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
.kind{display:flex;align-items:flex-start;gap:10px;border:1.5px solid rgba(197,227,225,.45);
  border-radius:var(--r-md);padding:14px 15px;text-align:left;background:var(--white);transition:all .2s;}
.kind:hover{border-color:var(--aqua-3);}
.kind.on{border-color:var(--coral);background:var(--coral-soft);}
.kind input{margin-top:2px;accent-color:var(--coral);flex-shrink:0;}
.kind-t{display:block;font-size:13.5px;font-weight:700;color:var(--slate-deep);}
.kind.on .kind-t{color:var(--coral);}
.kind-s{display:block;font-size:11.5px;line-height:1.5;color:var(--slate-muted);margin-top:3px;}

/* ── услуги ── */
.svc{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-bottom:1px solid rgba(197,227,225,.3);}
.svc:last-child{border-bottom:none;padding-bottom:0;}
.svc:first-child{padding-top:0;}
.svc-n{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--coral-soft);color:var(--coral);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.svc-b{flex:1;min-width:0;}
.svc-t{font-size:15px;font-weight:700;color:var(--slate-deep);}
.svc-d{font-size:13px;line-height:1.65;color:var(--slate-muted);margin-top:5px;}
.svc-p{font-size:14px;font-weight:700;color:var(--coral);margin-top:8px;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg{margin-bottom:17px;}
.fi{width:100%;padding:12px 15px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:14px;color:var(--slate-deep);outline:none;transition:border-color .2s,background .2s;}
.fi:focus{border-color:var(--coral);background:var(--white);}
.fi.bad{border-color:#B14A32;background:#FDF3F0;}
textarea.fi{min-height:110px;resize:vertical;line-height:1.6;}
.hint{font-size:12px;line-height:1.6;color:var(--slate-muted);margin-top:7px;}
.req{color:var(--coral);}

/* ── чекбоксы материалов ── */
.mats{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.mat{display:flex;align-items:center;gap:10px;border:1.5px solid rgba(197,227,225,.45);
  border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;color:var(--slate-mid);
  cursor:pointer;transition:all .2s;}
.mat:hover{border-color:var(--aqua-3);}
.mat input{accent-color:var(--coral);flex-shrink:0;}
.mat.on{border-color:var(--coral);background:var(--coral-soft);color:var(--coral);font-weight:600;}

.btn{width:100%;padding:14px;border-radius:var(--r-full);font-size:15px;font-weight:600;
  background:var(--coral);border:none;color:#fff;box-shadow:var(--sh-coral);transition:background .2s;}
.btn:hover{background:var(--coral-hover);}

.side{position:sticky;top:88px;}
.side h3{font-size:14px;font-weight:700;color:var(--slate-deep);margin-bottom:10px;}
.side p{font-size:13px;line-height:1.7;color:var(--slate-muted);}
.side p + p{margin-top:11px;}
.side a{color:var(--coral);font-weight:600;}
.arb{background:var(--aqua-pale);border-radius:var(--r-md);padding:16px 18px;margin-top:14px;
  font-size:12.5px;line-height:1.7;color:var(--slate-mid);}
.arb b{color:var(--slate-deep);}

/* успех */
.done{max-width:520px;margin:40px auto;text-align:center;padding:48px 32px;}
.done h2{font-family:'Literata',Georgia,serif;font-size:26px;font-weight:600;color:var(--slate-deep);margin-bottom:10px;}
.done p{font-size:13.5px;line-height:1.7;color:var(--slate-muted);margin-bottom:8px;}
.done-num{font-family:'Literata',Georgia,serif;font-weight:600;font-size:30px;color:var(--coral);display:block;margin:14px 0 18px;}
.done .btn{width:auto;padding:12px 28px;display:inline-block;margin-top:8px;}

@media(max-width:860px){
  .two{grid-template-columns:minmax(0,1fr);}
  .side{position:static;}
  .kinds,.mats,.row2{grid-template-columns:1fr;}
  h1{font-size:26px;}
  .wrap{padding:20px 16px 56px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Кто заказывает оформление. */
const KINDS = [
  { k:'venue',    t:'Площадка',   s:'Объект с залами для мероприятий' },
  { k:'supplier', t:'Поставщик',  s:'Услуги для мероприятий' },
];
let KIND = 'venue';

/* Что уже есть у заказчика — от этого зависит объём работы. */
const MATS = [
  { k:'photo',  t:'Фотографии залов' },
  { k:'seats',  t:'Схемы рассадки' },
  { k:'plans',  t:'Планы помещений' },
  { k:'texts',  t:'Описания и тексты' },
];
let HAVE = new Set();

function render(){
  const isVenue = KIND === 'venue';
  document.getElementById('root').innerHTML = `
  <div class="crumbs">
    <a href="homepage.html">Главная</a><span class="sep">→</span><span class="cur">Помощь с оформлением</span>
  </div>

  <h1>Помощь с оформлением</h1>
  <p class="sub">Если заполнять карточку самостоятельно некогда — пришлите материалы,
  и мы соберём её за вас: фотографии, залы со схемами рассадки, оснащение и описания.
  Готовую карточку покажем на согласование до публикации.</p>

  <div class="two">
    <div>
      <div class="panel">
        <div class="lbl">Что входит</div>

        <div class="svc">
          <div class="svc-n">1</div>
          <div class="svc-b">
            <div class="svc-t">Заполнение карточки</div>
            <div class="svc-d">Заносим объект или услугу в каталог по вашим материалам:
            залы, вместимость по схемам рассадки, оснащение, цены и описания.
            Карточка проходит модерацию и публикуется.</div>
            <div class="svc-p">500 ₽ за карточку</div>
          </div>
        </div>

        <div class="svc">
          <div class="svc-n">2</div>
          <div class="svc-b">
            <div class="svc-t">Точные схемы и планы пространств</div>
            <div class="svc-d">Выезжаем и делаем обмеры, собираем планы помещений
            и схемы рассадки под каждый зал. Такие планы видны в карточке зала
            и в презентации по отобранным залам.</div>
            <div class="svc-p">Стоимость по общей площади помещений, которые нужно замерить</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="lbl">Заявка на оформление</div>

        <div class="kinds">
          ${KINDS.map(k => `
            <label class="kind${KIND===k.k?' on':''}" onclick="setKind('${k.k}')">
              <input type="radio" name="kind" ${KIND===k.k?'checked':''}>
              <span>
                <span class="kind-t">${esc(k.t)}</span>
                <span class="kind-s">${esc(k.s)}</span>
              </span>
            </label>`).join('')}
        </div>

        <div class="fg">
          <label class="lbl" for="fName">${isVenue ? 'Название объекта' : 'Название или ФИО'} <span class="req">*</span></label>
          <input class="fi" id="fName" type="text" placeholder="${isVenue ? 'Отель «Аврора»' : 'Ведущий Артём Соколов'}">
        </div>

        <div class="row2">
          <div class="fg">
            <label class="lbl" for="fPerson">Контактное лицо <span class="req">*</span></label>
            <input class="fi" id="fPerson" type="text" placeholder="Имя и должность">
          </div>
          <div class="fg">
            <label class="lbl" for="fPhone">Телефон <span class="req">*</span></label>
            <input class="fi" id="fPhone" type="tel" placeholder="+7 495 000-00-00">
          </div>
        </div>

        <div class="row2">
          <div class="fg">
            <label class="lbl" for="fMail">Почта <span class="req">*</span></label>
            <input class="fi" id="fMail" type="email" placeholder="sales@venue.ru">
          </div>
          <div class="fg">
            <label class="lbl" for="fHalls">${isVenue ? 'Количество залов' : 'Количество услуг'}</label>
            <input class="fi" id="fHalls" type="number" min="0" step="1" placeholder="3">
          </div>
        </div>

        <div class="fg">
          <span class="lbl">Какие материалы уже есть</span>
          <div class="mats">
            ${MATS.map(m => `
              <label class="mat${HAVE.has(m.k)?' on':''}" onclick="toggleMat('${m.k}')">
                <input type="checkbox" ${HAVE.has(m.k)?'checked':''}>
                <span>${esc(m.t)}</span>
              </label>`).join('')}
          </div>
          <div class="hint">Чего нет — соберём сами: фотосъёмка и обмеры считаются отдельно.</div>
        </div>

        <div class="fg">
          <label class="lbl" for="fText">Комментарий</label>
          <textarea class="fi" id="fText" placeholder="Сколько залов, есть ли проживание, к какой дате нужно опубликовать"></textarea>
        </div>

        <button class="btn" onclick="send()">Отправить заявку</button>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <h3>Как это устроено</h3>
        <p>Вы оставляете заявку, менеджер связывается и уточняет состав работ.
        После этого присылаете материалы удобным способом — почтой или ссылкой на облако.</p>
        <p>Карточку собираем и показываем на согласование. Правки вносим до публикации,
        дальше карточка редактируется в кабинете самостоятельно.</p>
        <div class="arb"><b>Что прислать:</b> фотографии залов, площади и высоту потолков,
        вместимость по схемам рассадки, оснащение, цены аренды и планы помещений, если есть.</div>
      </div>
      <div class="panel">
        <h3>Другие способы</h3>
        <p>Почта: <a href="mailto:info@micelist.ru">info@micelist.ru</a><br>
        Телефоны: <a href="tel:+79166704905">+79166704905</a> (Алексей), <a href="tel:+79251751570">+79251751570</a> (Денис)</p>
        <p>Вопрос не про оформление — <a href="#" onclick="MH.feedback();return false;">напишите в поддержку</a>.</p>
      </div>
    </aside>
  </div>`;
}

function setKind(k){ KIND = k; render(); }
function toggleMat(k){ HAVE.has(k) ? HAVE.delete(k) : HAVE.add(k); render(); }

const val = id => (document.getElementById(id) || {}).value?.trim() || '';
function bad(id, msg){
  const el = document.getElementById(id);
  if (el) { el.classList.add('bad'); el.focus(); }
  MH.toast(msg, 'error');
}

/* Номер заявки — по той же схеме, что у запросов: префикс, дата, счётчик. */
function ticketNo(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const seq = String(Math.floor(Math.random() * 9000) + 1000);
  return 'ОФ-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + seq;
}

function send(){
  document.querySelectorAll('.fi').forEach(el => el.classList.remove('bad'));
  if (!val('fName'))   return bad('fName', 'Укажите название');
  if (!val('fPerson')) return bad('fPerson', 'Укажите контактное лицо');
  if (!val('fPhone'))  return bad('fPhone', 'Укажите телефон');
  const mail = val('fMail');
  if (!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return bad('fMail', 'Укажите корректную почту');

  const no = ticketNo();
  document.getElementById('root').innerHTML = `
  <div class="panel done">
    <h2>Заявка принята</h2>
    <p>Номер заявки</p>
    <span class="done-num">${esc(no)}</span>
    <p>Менеджер свяжется по указанным контактам и уточнит состав работ.
    Номер пригодится, если захотите дополнить заявку.</p>
    <a class="btn" href="homepage.html">На главную</a>
  </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
</html>
