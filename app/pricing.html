<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Тарифы: что открывается на СТАРТ, БИЗНЕС и ПРЕМИУМ — фильтры, сравнение, презентации и групповые запросы.">
<meta property="og:title" content="Тарифы — МирХАБ">
<meta property="og:description" content="Тарифы: что открывается на СТАРТ, БИЗНЕС и ПРЕМИУМ — фильтры, сравнение, презентации и групповые запросы.">
<meta property="og:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirlist.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Тарифы — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3; --coral-glow:rgba(233,134,103,.18);
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:1180px;margin:0 auto;padding:32px 28px 64px;animation:pageIn .5s ease both;}

.hero{text-align:center;margin-bottom:34px;}
.hero .eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.hero h1{font-family:'Literata',Georgia,serif;font-size:36px;font-weight:600;color:var(--slate-deep);line-height:1.15;margin-top:10px;letter-spacing:-.005em;}
.hero p{font-size:14.5px;line-height:1.65;color:var(--slate-muted);margin:12px auto 0;max-width:620px;}

/* переключатель периода */
.periods{display:inline-flex;gap:4px;background:var(--white);border:1px solid rgba(197,227,225,.4);
  border-radius:var(--r-full);padding:4px;margin-top:22px;box-shadow:var(--sh-sm);}
.periods button{padding:9px 20px;border-radius:var(--r-full);border:none;background:none;
  font-size:13px;font-weight:600;color:var(--slate-muted);transition:all .2s;white-space:nowrap;}
.periods button.on{background:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.periods .off{font-size:11px;font-weight:700;color:var(--coral);margin-left:5px;}
.periods button.on .off{color:rgba(255,255,255,.85);}

/* ── карточки тарифов ── */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:44px;align-items:start;}
.plan{background:var(--white);border:1px solid rgba(197,227,225,.35);border-radius:var(--r-lg);
  padding:28px 24px;box-shadow:var(--sh-md);display:flex;flex-direction:column;position:relative;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s;}
.plan:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);}
.plan.cur{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral-glow),var(--sh-lg);}
.plan-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  padding:5px 15px;border-radius:var(--r-full);background:var(--coral);color:#fff;
  font-size:11px;font-weight:700;white-space:nowrap;box-shadow:var(--sh-coral);}
.plan-name{font-family:'Literata',Georgia,serif;font-weight:600;font-size:24px;color:var(--slate-deep);}
.plan-note{font-size:12.5px;color:var(--slate-muted);margin-top:5px;min-height:34px;line-height:1.5;}
.plan-price{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px;flex-wrap:wrap;}
.plan-num{font-family:'Literata',Georgia,serif;font-weight:600;font-size:34px;color:var(--slate-deep);line-height:1;}
.plan-per{font-size:13px;color:var(--slate-muted);}
.plan-old{font-size:12.5px;color:var(--slate-pale);text-decoration:line-through;}
.plan-save{font-size:12px;font-weight:700;color:var(--coral);margin-bottom:18px;min-height:18px;}
.plan-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:22px;flex:1;}
.plan-list li{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5;color:var(--slate-mid);}
.plan-list svg{flex-shrink:0;margin-top:2px;color:var(--coral);}
.plan-list li.off{color:var(--slate-pale);}
.plan-list li.off svg{color:var(--slate-pale);}
.plan-cta{width:100%;padding:13px;border-radius:var(--r-full);font-size:14px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;}
.plan-cta:hover:not(:disabled){border-color:var(--coral);color:var(--coral);}
.plan-cta.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.plan-cta.pri:hover{background:var(--coral-hover);border-color:var(--coral-hover);}
.plan-cta:disabled{opacity:.55;cursor:default;}

/* ── таблица сравнения ── */
.sec-title{font-family:'Literata',Georgia,serif;font-size:26px;font-weight:600;color:var(--slate-deep);
  text-align:center;margin-bottom:18px;}
.panel{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);overflow:hidden;}
.tscroll{overflow-x:auto;}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px;}
.cmp th,.cmp td{padding:14px 18px;text-align:left;border-bottom:1px solid rgba(197,227,225,.25);}
.cmp thead th{font-size:12px;font-weight:700;color:var(--slate-deep);background:var(--aqua-pale);text-align:center;}
.cmp thead th:first-child{text-align:left;font-weight:600;color:var(--slate-muted);
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.cmp thead th.cur{background:var(--coral-soft);color:var(--coral);}
.cmp tbody td{text-align:center;font-weight:600;color:var(--slate-deep);}
.cmp tbody td:first-child{text-align:left;font-weight:500;color:var(--slate-muted);}
.cmp tbody tr:last-child td{border-bottom:none;}
.cmp tbody tr:hover td{background:rgba(237,246,245,.45);}
.cmp td.no{color:var(--slate-pale);font-weight:500;}
.cmp td.cur{background:rgba(246,221,211,.28);}

.note{background:var(--aqua-pale);border-radius:var(--r-md);padding:16px 18px;
  font-size:13px;line-height:1.7;color:var(--slate-mid);margin-top:18px;}
.note b{color:var(--slate-deep);}

.faq{max-width:760px;margin:44px auto 0;}
.faq-item{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-md);
  padding:16px 20px;margin-bottom:10px;box-shadow:var(--sh-sm);}
.faq-item h3{font-size:14.5px;font-weight:700;color:var(--slate-deep);margin-bottom:7px;}
.faq-item p{font-size:13px;line-height:1.65;color:var(--slate-muted);}

@media(max-width:900px){
  .plans{grid-template-columns:1fr;}
  .hero h1{font-size:27px;}
  .wrap{padding:22px 16px 48px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const IC_YES = '<svg width="15" height="15" fill="none" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5 6.5-7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IC_NO  = '<svg width="15" height="15" fill="none" viewBox="0 0 16 16"><path d="M4 8h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';

/* Порядок колонок; сами данные — из ML.TARIFFS, цифры в разметке не дублируются. */
const ORDER = ['start','biz','prem'];
const NOTES = {
  start: 'Посмотреть, что есть на площадке',
  biz:   'Рабочий набор для подбора площадок',
  prem:  'Когда подбор — это поток мероприятий',
};
let PERIOD = 'month';   // month | half | year

/* ── человекочитаемые значения строк сравнения ── */
function filtersLabel(t){
  const f = t.filters;
  if (f === 'all') return 'все, включая рассадку и TWIN';
  if (f === 'all-except-seating-twin') return 'все, кроме рассадки и TWIN';
  if (Array.isArray(f)) return 'категории, город, гости';
  return '—';
}
function presLabel(t){
  if (!t.presentation) return null;
  return t.presentation === 'ads' ? 'с рекламным блоком' : 'без рекламного блока';
}
function groupLabel(t){
  if (!t.groupRequest) return null;
  return t.groupRequest === Infinity ? 'без ограничения' : 'до ' + t.groupRequest + ' объектов';
}
function bonusLabel(t){
  if (!t.bonusRate) return null;
  return t.bonusRate === 1 ? 'базовое' : '×' + t.bonusRate.toLocaleString('ru');
}

const ROWS = [
  ['Фильтры подбора',        t => filtersLabel(t)],
  ['Залов в сравнении',      t => t.compare === Infinity ? 'без ограничения' : String(t.compare)],
  ['Презентации',            t => presLabel(t)],
  ['Полная информация по объекту', t => t.fullInfo ? 'адрес, оснащение, рассадка' : null],
  ['Групповые запросы',      t => groupLabel(t)],
  ['Блэк-лист объектов',     t => t.blacklist ? 'есть' : null],
  ['Начисление баллов',      t => bonusLabel(t)],
];

/* ── цена и скидка за период ── */
function priceFor(t){
  if (!t.price) return { num: 'Бесплатно', per: '', old: '', save: '' };
  if (PERIOD === 'month') return { num: ML.money(t.price), per: 'в месяц', old: '', save: '' };
  const months = PERIOD === 'half' ? 6 : 12;
  const total  = PERIOD === 'half' ? t.priceHalf : t.priceYear;
  const full   = t.price * months;
  const off    = Math.round((1 - total / full) * 100);
  return {
    num: ML.money(total),
    per: PERIOD === 'half' ? 'за 6 месяцев' : 'за год',
    old: ML.money(full),
    save: `−${off}% · ${ML.money(Math.round(total / months))} в месяц`,
  };
}

function render(){
  const cur = ML.tariff();

  const plans = ORDER.map(k => {
    const t = ML.TARIFFS[k];
    const p = priceFor(t);
    const isCur = cur.key === k;
    // список возможностей строится из тех же строк сравнения
    const feats = ROWS.map(([label, fn]) => {
      const v = fn(t);
      return v
        ? `<li>${IC_YES}<span>${esc(label)}: <b style="font-weight:600;color:var(--slate-deep)">${esc(v)}</b></span></li>`
        : `<li class="off">${IC_NO}<span>${esc(label)}</span></li>`;
    }).join('');
    return `<div class="plan${isCur ? ' cur' : ''}">
      ${isCur ? '<span class="plan-badge">Ваш тариф</span>' : ''}
      <div class="plan-name">${esc(t.name)}</div>
      <div class="plan-note">${esc(NOTES[k] || '')}</div>
      <div class="plan-price">
        <span class="plan-num">${p.num}</span>
        ${p.per ? `<span class="plan-per">${p.per}</span>` : ''}
        ${p.old ? `<span class="plan-old">${p.old}</span>` : ''}
      </div>
      <div class="plan-save">${p.save}</div>
      <ul class="plan-list">${feats}</ul>
      ${isCur
        ? `<button class="plan-cta" disabled>Подключён</button>`
        : t.price
          ? `<a class="plan-cta pri" style="display:block;text-align:center" href="checkout.html?plan=${k}&period=${PERIOD}">Перейти на ${esc(t.name)}</a>`
          : `<button class="plan-cta pri" onclick="pick('${k}')">Перейти на ${esc(t.name)}</button>`}
    </div>`;
  }).join('');

  const head = ORDER.map(k => {
    const t = ML.TARIFFS[k];
    return `<th class="${cur.key === k ? 'cur' : ''}">${esc(t.name)}</th>`;
  }).join('');

  const body = ROWS.map(([label, fn]) => `<tr>
    <td>${esc(label)}</td>
    ${ORDER.map(k => {
      const v = fn(ML.TARIFFS[k]);
      return `<td class="${v ? '' : 'no'} ${cur.key === k ? 'cur' : ''}">${v ? esc(v) : '—'}</td>`;
    }).join('')}
  </tr>`).join('');

  document.getElementById('root').innerHTML = `
  <div class="hero">
    <span class="eyebrow">Тарифы</span>
    <h1>Подбор площадок под ваш объём</h1>
    <p>Размещение для объектов бесплатное — платит тот, кто ищет. Чем больше мероприятий,
    тем нужнее фильтры по рассадке, групповые запросы и презентации.</p>
    <div class="periods">
      <button class="${PERIOD==='month'?'on':''}" onclick="setPeriod('month')">Месяц</button>
      <button class="${PERIOD==='half'?'on':''}" onclick="setPeriod('half')">Полгода${saveBadge('half')}</button>
      <button class="${PERIOD==='year'?'on':''}" onclick="setPeriod('year')">Год${saveBadge('year')}</button>
    </div>
  </div>

  <div class="plans">${plans}</div>

  <h2 class="sec-title">Что входит в тарифы</h2>
  <div class="panel"><div class="tscroll"><table class="cmp">
    <thead><tr><th>Возможность</th>${head}</tr></thead>
    <tbody>${body}</tbody>
  </table></div></div>

  <div class="note">Тариф меняется в любой момент: при понижении лишние залы автоматически
  убираются из сравнения до нового лимита. Оплата по счёту для юрлиц — счёт и закрывающие
  документы формируются после выбора периода.</div>

  <div class="faq">
    <h2 class="sec-title">Частые вопросы</h2>
    ${faq().map(f => `<div class="faq-item"><h3>${esc(f.q)}</h3><p>${esc(f.a)}</p></div>`).join('')}
  </div>`;
}

/* Скидка периода считается из самого тарифа, а не пишется руками. */
function saveBadge(period){
  const t = ML.TARIFFS.biz;
  const months = period === 'half' ? 6 : 12;
  const total  = period === 'half' ? t.priceHalf : t.priceYear;
  const off = Math.round((1 - total / (t.price * months)) * 100);
  return `<span class="off">−${off}%</span>`;
}

function faq(){
  const b = ML.TARIFFS.biz, p = ML.TARIFFS.prem, s = ML.TARIFFS.start;
  return [
    { q: 'Сколько стоит размещение объекта?',
      a: 'Размещение бесплатное. Объект платит фиксированную сумму только за состоявшееся мероприятие — '
       + ML.FEE_TIERS.filter(x => x.fee).map(x => ML.money(x.fee) + ' за ' + x.label.toLowerCase()).join(', ') + '.' },
    { q: 'Что именно закрыто на «' + s.name + '»?',
      a: 'Доступны только категории объектов, город и количество гостей. Схемы рассадки, стоимость, '
       + 'проживание и удобства закрыты, в сравнение помещается ' + s.compare + ' зала, презентации и групповые запросы недоступны.' },
    { q: 'Чем «' + p.name + '» отличается от «' + b.name + '»?',
      a: 'Открываются фильтры по схемам рассадки и TWIN, в сравнении ' + p.compare + ' залов вместо ' + b.compare
       + ', презентация собирается без рекламного блока, появляется блэк-лист, а баллы начисляются с коэффициентом ×' + p.bonusRate.toLocaleString('ru') + '.' },
    { q: 'Как работают баллы?',
      a: 'Часть агентского вознаграждения возвращается баллами за состоявшиеся мероприятия и отзывы. '
       + 'Курс: 1 балл = ' + ML.POINT_RATE.toLocaleString('ru') + ' ₽. Потратить их можно в витрине бонусной программы.' },
  ];
}

function setPeriod(p){ PERIOD = p; render(); }
function pick(k){
  ML.setTariff(k);
  MH.toast('Тариф «' + ML.TARIFFS[k].name + '» подключён', 'success');
  render();
}

render();
</script>
</body>
</html>
