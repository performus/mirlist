<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Тарифы МирХАБ для площадок — бесплатный и премиум доступ к базе организаторов.">
<meta property="og:title" content="МирХАБ">
<meta property="og:description" content="Тарифы МирХАБ для площадок — бесплатный и премиум доступ к базе организаторов.">
<meta property="og:image" content="https://mirhub.vercel.app/assets/photos/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mirhub.vercel.app/assets/photos/hero.jpg">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Тарифы — Площадки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#EB7454;--c6:#D96345;--cs:#FCEAE4;--cg:rgba(235,116,84,.12);--aq:#79B9C3;--aq-p:#EDF6F5;--s:#46627A;--sm:#3E596F;--sd:#354E63;--sx:#7A919F;--sp:#B4C3CC;--pc:#F6E6DE;--bg:#F8F5F2;--w:#FFF;--sh:0 4px 20px rgba(53,78,99,.07);--shl:0 8px 40px rgba(53,78,99,.09);--shc:0 4px 18px rgba(235,116,84,.22);--r:10px;--rm:14px;--rl:20px;--rf:50px;}
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--s);-webkit-font-smoothing:antialiased;}a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
.nav{height:68px;padding:0 48px;display:flex;align-items:center;gap:32px;background:var(--w);border-bottom:1px solid rgba(197,227,225,.3);}.logo{font-family:'DM Serif Display',serif;font-size:24px;color:var(--sd);}.logo i{font-style:normal;color:var(--c);}.nav-links{display:flex;gap:8px;margin-left:auto;}.nav-links a{font-size:13.5px;font-weight:500;color:var(--sx);padding:8px 16px;border-radius:var(--rf);transition:all .2s;}.nav-links a:hover{color:var(--s);background:var(--aq-p);}.nav-links a.active{color:var(--c);background:var(--cs);font-weight:600;}.nav-cta{background:var(--c)!important;color:#fff!important;font-weight:600!important;}
.hero{text-align:center;padding:72px 24px 48px;position:relative;overflow:hidden;}.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--cs) 0%,var(--bg) 100%);opacity:.35;z-index:0;}.hero>*{position:relative;z-index:1;}.hero-label{display:inline-flex;align-items:center;gap:6px;padding:6px 18px;border-radius:var(--rf);background:var(--w);border:1px solid rgba(235,116,84,.15);font-size:12.5px;font-weight:600;color:var(--c);margin-bottom:20px;}.hero h1{font-family:'DM Serif Display',serif;font-size:clamp(32px,4.5vw,52px);color:var(--sd);letter-spacing:-.5px;margin-bottom:12px;}.hero p{font-size:17px;color:var(--sx);max-width:520px;margin:0 auto;line-height:1.6;}
.controls{display:flex;flex-direction:column;align-items:center;gap:20px;padding:0 24px 48px;}.audience-tabs{display:flex;background:var(--w);border:1.5px solid rgba(197,227,225,.35);border-radius:var(--rf);padding:4px;box-shadow:var(--sh);}.audience-tab{padding:12px 32px;border-radius:var(--rf);font-size:14.5px;font-weight:600;color:var(--sx);border:none;background:none;transition:all .3s;}.audience-tab.active{background:var(--c);color:#fff;box-shadow:var(--shc);}
.period-toggle{display:flex;align-items:center;gap:12px;}.period-label{font-size:14px;font-weight:500;color:var(--sx);cursor:pointer;transition:color .2s;}.period-label.active{color:var(--sd);font-weight:600;}.toggle-track{width:52px;height:28px;border-radius:14px;background:var(--sp);cursor:pointer;position:relative;transition:background .3s;}.toggle-track.year{background:var(--c);}.toggle-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .3s;}.toggle-track.year .toggle-thumb{left:27px;}.save-badge{padding:4px 12px;border-radius:var(--rf);background:var(--cs);color:var(--c);font-size:12px;font-weight:700;}
.pricing-wrap{max-width:1100px;margin:0 auto;padding:0 24px;}.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:80px;}
.price-card{background:var(--w);border:1.5px solid rgba(197,227,225,.2);border-radius:var(--rl);padding:36px 28px;position:relative;transition:all .4s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;}.price-card:hover{transform:translateY(-4px);box-shadow:var(--shl);}.price-card.featured{border-color:var(--c);box-shadow:0 0 0 3px var(--cg),var(--sh);z-index:1;transform:scale(1.03);}.price-card.featured:hover{transform:scale(1.03) translateY(-4px);}.featured-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);padding:5px 20px;border-radius:var(--rf);background:var(--c);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;}
.plan-name{font-family:'DM Serif Display',serif;font-size:22px;color:var(--sd);margin-bottom:6px;}.plan-desc{font-size:13.5px;color:var(--sx);margin-bottom:20px;line-height:1.5;}.plan-price{margin-bottom:4px;}.price-amount{font-size:42px;font-weight:800;color:var(--sd);letter-spacing:-1px;line-height:1;}.price-amount.coral{color:var(--c);}.price-currency{font-size:16px;font-weight:600;color:var(--sx);}.price-period{font-size:13px;color:var(--sp);margin-bottom:20px;}.price-old{font-size:14px;color:var(--sp);text-decoration:line-through;margin-right:6px;}
.plan-cta{width:100%;padding:14px;border-radius:var(--rm);font-size:15px;font-weight:600;border:none;transition:all .25s;margin-bottom:24px;}.plan-cta.primary{background:var(--c);color:#fff;box-shadow:var(--shc);}.plan-cta.primary:hover{background:var(--c6);}.plan-cta.secondary{background:var(--cs);color:var(--c);}.plan-cta.secondary:hover{background:var(--c);color:#fff;}.plan-cta.outline{background:none;color:var(--s);border:1.5px solid var(--sp);}.plan-cta.outline:hover{border-color:var(--c);color:var(--c);}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:12px;flex:1;}.plan-features li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--sm);line-height:1.5;}.plan-features li svg{flex-shrink:0;margin-top:2px;}.feat-check{color:var(--c);}.feat-dash{color:var(--sp);}.plan-divider{height:1px;background:rgba(197,227,225,.25);margin:20px 0;}
.compare-section{max-width:1100px;margin:0 auto 80px;padding:0 24px;}.compare-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--sd);text-align:center;margin-bottom:32px;}.compare-table{width:100%;border-collapse:collapse;background:var(--w);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);}.compare-table th,.compare-table td{padding:14px 20px;text-align:left;font-size:14px;border-bottom:1px solid rgba(197,227,225,.18);}.compare-table thead th{background:var(--sd);color:#fff;font-weight:600;font-size:13.5px;}.compare-table thead th.fc{background:var(--c);}.compare-table tbody tr:hover{background:var(--aq-p);}.compare-table .fn{font-weight:500;color:var(--sd);}.compare-table .ck{color:var(--c);font-weight:700;}.compare-table .da{color:var(--sp);}
.faq-section{max-width:760px;margin:0 auto 80px;padding:0 24px;}.faq-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--sd);text-align:center;margin-bottom:32px;}.faq-item{background:var(--w);border:1px solid rgba(197,227,225,.18);border-radius:var(--rm);margin-bottom:10px;overflow:hidden;}.faq-item.open{border-color:rgba(235,116,84,.15);}.faq-q{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-weight:600;color:var(--sd);}.faq-q:hover{color:var(--c);}.faq-q svg{transition:transform .3s;flex-shrink:0;color:var(--sp);}.faq-item.open .faq-q svg{transform:rotate(180deg);color:var(--c);}.faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s;padding:0 22px;}.faq-item.open .faq-a{max-height:200px;padding:0 22px 18px;}.faq-a p{font-size:14px;color:var(--sx);line-height:1.7;}
.final-cta{text-align:center;padding:72px 24px;position:relative;overflow:hidden;}.final-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--cs),var(--pc),var(--aq-p));z-index:0;}.final-cta>*{position:relative;z-index:1;}.final-cta h2{font-family:'DM Serif Display',serif;font-size:clamp(26px,3.5vw,38px);color:var(--sd);margin-bottom:12px;}.final-cta p{font-size:16px;color:var(--sx);margin-bottom:28px;}.final-btn{padding:16px 44px;border-radius:var(--rm);font-size:16px;font-weight:700;border:none;background:var(--c);color:#fff;box-shadow:var(--shc);transition:all .3s;}.final-btn:hover{background:var(--c6);transform:translateY(-2px);}
.footer{background:var(--sd);color:rgba(255,255,255,.5);padding:48px 48px 28px;}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:36px;max-width:1100px;margin:0 auto 32px;}.footer-brand p{font-size:13px;line-height:1.7;margin-top:10px;color:rgba(255,255,255,.3);}.footer-col h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-bottom:12px;}.footer-col a{display:block;font-size:13px;color:rgba(255,255,255,.45);margin-bottom:7px;transition:color .2s;}.footer-col a:hover{color:#fff;}.footer-bottom{max-width:1100px;margin:0 auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.18);}
@media(max-width:900px){.pricing-grid{grid-template-columns:1fr;max-width:420px;margin-left:auto;margin-right:auto;}.price-card.featured{transform:none;}.price-card.featured:hover{transform:translateY(-4px);}.compare-table{font-size:12px;}.compare-table th,.compare-table td{padding:10px 12px;}}
@media(max-width:600px){.nav{padding:0 20px;}.nav-links a:not(.nav-cta){display:none;}.audience-tab{padding:10px 20px;font-size:13px;}.footer{padding:32px 20px 20px;}.footer-grid{grid-template-columns:1fr 1fr;gap:20px;}}
</style>
</head>
<body>
<div id="mh-nav"></div>
<div class="hero"><div class="hero-label">💎 Прозрачные тарифы</div><h1>Выберите подходящий тариф</h1><p>Начните бесплатно. Масштабируйтесь по мере роста. Без скрытых платежей.</p></div>
<div class="controls"><div class="audience-tabs" id="tabs"><button class="audience-tab active" data-tab="users">Для пользователей</button><button class="audience-tab" data-tab="venues">Для площадок</button></div><div class="period-toggle"><span class="period-label active" id="mL">Месяц</span><div class="toggle-track" id="pT"><div class="toggle-thumb"></div></div><span class="period-label" id="yL">Год</span><span class="save-badge">-20%</span></div></div>
<div class="pricing-wrap"><div class="pricing-grid" id="uG"></div><div class="pricing-grid" id="vG" style="display:none"></div></div>
<div class="compare-section" id="cS"></div>
<div class="faq-section"><h2 class="faq-title">Частые вопросы</h2><div id="fL"></div></div>
<div class="final-cta"><h2>Готовы начать?</h2><p>Выберите тариф и получите доступ к лучшим площадкам России</p><button class="final-btn" onclick="MH.go('auth.html')">Выбрать тариф</button></div>
<div id="mh-footer"></div>
<script>
const CHK='<svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5 6.5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DSH='<svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M4 8h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const P={users:[
{name:'Базовый',desc:'Для первого знакомства',m:0,y:0,cta:'Начать бесплатно',cc:'outline',
f:['Поиск площадок на карте','Базовые фильтры (город, тип)','Просмотр до 10 площадок в день','Ограниченные контакты (3/мес)','Базовая информация'],
x:['Безлимит контактов','Быстрые ответы','Расширенные фильтры','Персональные подборки','Сравнение площадок','PDF презентации']},
{name:'Плюс',desc:'Для активного поиска',ft:1,m:990,y:9900,cta:'Выбрать Плюс',cc:'primary',
f:['Всё из Базового','Безлимит просмотров и контактов','Расширенная информация','Быстрые ответы от площадок','Избранное и история поиска','Расширенные фильтры'],
x:['Приоритетные ответы','Скрытые площадки','Персональные подборки','Сравнение площадок','PDF презентации']},
{name:'Премиум',desc:'Максимум для профессионалов',m:2490,y:24900,cta:'Выбрать Премиум',cc:'secondary',
f:['Всё из Плюс','Приоритетные ответы','Доступ к скрытым площадкам','Персональные подборки','Подробные технические данные','Сравнение площадок','PDF презентации','Выделенная поддержка'],x:[]}
],venues:[
{name:'Старт',desc:'Для новых площадок',m:0,y:0,cta:'Начать бесплатно',cc:'outline',
f:['1 площадка','До 10 заявок в месяц','Чаты с клиентами','Базовый профиль','Базовая статистика'],
x:['Приоритет в выдаче','Расширенная статистика','Быстрые ответы','Аналитика','Топ размещение']},
{name:'Бизнес',desc:'Для растущих площадок',ft:1,m:4900,y:49000,cta:'Выбрать Бизнес',cc:'primary',
f:['До 5 площадок','До 50 заявок в месяц','Приоритет в поиске','Расширенная статистика','Быстрые шаблоны','Брендированный профиль','Приоритетная поддержка'],
x:['Безлимит площадок','Топ размещение','Глубокая аналитика']},
{name:'Про',desc:'Максимальная видимость',m:9900,y:99000,cta:'Выбрать Про',cc:'secondary',
f:['Безлимит площадок','Безлимит заявок','Топ размещение','Глубокая аналитика','Максимальная видимость','API интеграция','Персональный менеджер','Приоритетная модерация'],x:[]}
]};
const C={users:{c:['Базовый','Плюс','Премиум'],r:[['Поиск площадок','✓','✓','✓'],['Базовые фильтры','✓','✓','✓'],['Расширенные фильтры','—','✓','✓'],['Просмотры в день','10','∞','∞'],['Контакты в месяц','3','∞','∞'],['Быстрые ответы','—','✓','✓'],['Избранное','—','✓','✓'],['Приоритетные ответы','—','—','✓'],['Скрытые площадки','—','—','✓'],['Персональные подборки','—','—','✓'],['Сравнение площадок','—','—','✓'],['PDF презентации','—','—','✓'],['Поддержка','Базовая','Приоритет','Выделенная']]},venues:{c:['Старт','Бизнес','Про'],r:[['Площадок','1','5','∞'],['Заявок в месяц','10','50','∞'],['Чаты','✓','✓','✓'],['Профиль','Базовый','Бренд','Бренд'],['Приоритет','—','✓','Топ'],['Статистика','Базовая','Расширенная','Глубокая'],['Быстрые ответы','—','✓','✓'],['Аналитика','—','—','✓'],['API','—','—','✓'],['Менеджер','—','—','✓'],['Поддержка','Базовая','Приоритет','Персональная']]}};
const F=[{q:'Можно ли попробовать бесплатно?',a:'Да, базовый тариф полностью бесплатный. Начните без оплаты и перейдите на платный тариф в любой момент.'},{q:'Как работает скидка за год?',a:'При оплате за год вы экономите 20%. Оплата списывается единоразово.'},{q:'Можно ли сменить тариф?',a:'Да, повысить или понизить тариф можно в любой момент из личного кабинета.'},{q:'Есть ли комиссия за бронирование?',a:'Нет. Мы не берём комиссию. Вы платите только за тариф.'},{q:'Какие способы оплаты?',a:'Карты Visa, Mastercard, МИР, безналичный расчёт для юрлиц, СБП.'},{q:'Что после окончания подписки?',a:'Аккаунт перейдёт на бесплатный тариф. Все данные сохранятся.'}];

let tab='users',yr=false;
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}

function renderCards(){
  const plans=P[tab],uG=document.getElementById('uG'),vG=document.getElementById('vG');
  uG.style.display=tab==='users'?'grid':'none';vG.style.display=tab==='venues'?'grid':'none';
  const g=tab==='users'?uG:vG;
  g.innerHTML=plans.map(p=>{
    const price=yr?p.y:p.m,me=yr&&p.y>0?Math.round(p.y/12):null,om=yr&&p.m>0?p.m:null;
    return `<div class="price-card${p.ft?' featured':''}">
      ${p.ft?'<div class="featured-badge">Популярный выбор</div>':''}
      <div class="plan-name">${p.name}</div><div class="plan-desc">${p.desc}</div>
      <div class="plan-price">${price===0?`<span class="price-amount">0 <span class="price-currency">₽</span></span>`:`${om?`<span class="price-old">${fmt(om)} ₽/мес</span>`:''}<span class="price-amount${p.ft?' coral':''}">${fmt(yr?(me||0):price)} <span class="price-currency">₽</span></span>`}</div>
      <div class="price-period">${price===0?'Бесплатно навсегда':yr?fmt(price)+' ₽ / год':'в месяц'}</div>
      <button class="plan-cta ${p.cc}" onclick="MH.go('auth.html')">${p.cta}</button><div class="plan-divider"></div>
      <ul class="plan-features">${p.f.map(f=>`<li><span class="feat-check">${CHK}</span>${f}</li>`).join('')}${p.x.map(f=>`<li style="opacity:.4"><span class="feat-dash">${DSH}</span>${f}</li>`).join('')}</ul>
    </div>`;
  }).join('');
}

function renderCompare(){
  const d=C[tab],s=document.getElementById('cS');
  s.innerHTML=`<h2 class="compare-title">Сравнение тарифов</h2><table class="compare-table"><thead><tr><th>Функция</th>${d.c.map((c,i)=>`<th${i===1?' class="fc"':''}>${c}</th>`).join('')}</tr></thead><tbody>${d.r.map(r=>`<tr><td class="fn">${r[0]}</td>${r.slice(1).map(v=>`<td class="${v==='✓'||v==='Топ'?'ck':v==='—'?'da':''}">${v==='✓'?CHK:v==='—'?DSH:v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderFaq(){
  document.getElementById('fL').innerHTML=F.map(f=>`<div class="faq-item"><div class="faq-q" onclick="this.parentElement.classList.toggle('open')">${f.q}<svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="faq-a"><p>${f.a}</p></div></div>`).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.dataset.tab;if(!t)return;tab=t;document.querySelectorAll('.audience-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderCards();renderCompare();});
document.getElementById('pT').addEventListener('click',()=>{yr=!yr;document.getElementById('pT').classList.toggle('year',yr);document.getElementById('mL').classList.toggle('active',!yr);document.getElementById('yL').classList.toggle('active',yr);renderCards();});

renderCards();renderCompare();renderFaq();
</script>
<script src="shared.js"></script>
<script>MH.init();</script>
</body>
</html>
