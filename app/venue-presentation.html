<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Печатная версия сравнения залов: характеристики, рассадка и карточки объектов.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Сравнение залов — печатная версия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Aqua Coral Slate
   ══════════════════════════════════════════════ */
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

.wrap{max-width:1000px;margin:0 auto;padding:24px 28px 64px;}

/* ── панель действий (не печатается) ── */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.btn{display:inline-block;padding:11px 22px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--coral);color:var(--coral);}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--sh-coral);}
.btn.pri:hover{background:var(--coral-hover);border-color:var(--coral-hover);color:#fff;}

/* ── титульный блок ── */
.doc-head{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:28px 30px;margin-bottom:20px;}
.doc-eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.doc-title{font-family:'Literata',Georgia,serif;font-size:30px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;margin-top:8px;letter-spacing:-.005em;}
.doc-meta{font-size:13px;color:var(--slate-muted);margin-top:10px;}
.doc-params{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
.doc-param{font-size:12px;font-weight:500;background:var(--aqua-pale);color:var(--slate-mid);
  border-radius:var(--r-sm);padding:5px 11px;}
.doc-params .none{font-size:12px;color:var(--slate-pale);}

/* ── рекламный блок (только на БИЗНЕС) ── */
.ads{background:var(--coral-soft);border-radius:var(--r-md);padding:16px 20px;margin-bottom:20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.ads-t{font-family:'Literata',Georgia,serif;font-weight:600;font-size:17px;color:var(--slate-deep);}
.ads-s{font-size:12.5px;line-height:1.6;color:var(--slate-mid);flex:1;min-width:220px;}

/* ── карточка зала ── */
.hall{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);overflow:hidden;margin-bottom:18px;page-break-inside:avoid;break-inside:avoid;}
.hall-top{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;}
.hall-img{background:var(--aqua-pale);min-height:200px;}
.hall-img img{width:100%;height:100%;object-fit:cover;display:block;}
.hall-main{padding:22px 24px;}
.hall-n{font-size:11.5px;font-weight:700;color:var(--coral);letter-spacing:.04em;}
.hall-name{font-family:'Literata',Georgia,serif;font-size:23px;font-weight:600;color:var(--slate-deep);
  line-height:1.2;margin-top:6px;}
.hall-sub{font-size:13px;color:var(--slate-muted);margin-top:6px;}
.hall-price{font-size:20px;font-weight:800;color:var(--slate-deep);margin-top:12px;}
.hall-price i{font-style:normal;font-size:13px;font-weight:500;color:var(--slate-muted);}
.hall-price span{font-size:13px;font-weight:500;color:var(--slate-muted);margin-left:8px;}

/* характеристики и рассадка */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid rgba(197,227,225,.28);}
.block{padding:18px 24px;}
.block + .block{border-left:1px solid rgba(197,227,225,.28);}
.block h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--slate-muted);margin-bottom:11px;}
.kv{width:100%;border-collapse:collapse;font-size:13px;}
.kv th,.kv td{text-align:left;padding:6px 0;vertical-align:top;}
.kv th{font-weight:500;color:var(--slate-muted);width:52%;}
.kv td{font-weight:600;color:var(--slate-deep);}
.kv td.dim{color:var(--slate-pale);font-weight:500;}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.seat{background:var(--aqua-pale);border-radius:var(--r-sm);padding:9px 8px;text-align:center;}
.seat-n{font-family:'Literata',Georgia,serif;font-weight:600;font-size:19px;color:var(--slate-deep);line-height:1;}
.seat-l{font-size:10.5px;color:var(--slate-muted);margin-top:4px;}
.seat.off{background:var(--bg);opacity:.55;}
.seat.off .seat-n{color:var(--slate-pale);}

/* карточка объекта под залом */
.venue{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 24px;background:var(--bg);border-top:1px solid rgba(197,227,225,.28);}
.venue-img{width:76px;height:56px;border-radius:var(--r-sm);overflow:hidden;flex:none;background:var(--aqua-pale);}
.venue-img img{width:100%;height:100%;object-fit:cover;}
.venue-mid{flex:1;min-width:200px;}
.venue-name{font-size:14.5px;font-weight:700;color:var(--slate-deep);}
.venue-sub{font-size:12.5px;color:var(--slate-muted);margin-top:3px;}
.venue-stars{color:#F0B95A;letter-spacing:1px;}

.empty{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:56px 28px;text-align:center;max-width:520px;margin:0 auto;}
.empty h2{font-family:'Literata',Georgia,serif;font-size:24px;font-weight:600;color:var(--slate-deep);margin-bottom:10px;}
.empty p{font-size:13.5px;line-height:1.65;color:var(--slate-muted);margin-bottom:20px;}

.foot-note{font-size:12px;line-height:1.65;color:var(--slate-muted);margin-top:20px;
  padding-top:16px;border-top:1px solid rgba(197,227,225,.4);}

/* ══════════════════════════════════════════════
   ПЕЧАТЬ: без шапки сайта, подвала и кнопок
   ══════════════════════════════════════════════ */
@media print{
  @page{margin:14mm;}
  body{background:#fff;}
  #mh-nav,#mh-footer,.mh-header,.mh-footer,.bar,button,#mh-toasts{display:none!important;}
  body.has-mh-nav{padding-top:0!important;}
  .wrap{max-width:none;padding:0;}
  .doc-head,.hall,.ads{box-shadow:none;border-color:#d8e3e2;}
  .hall{margin-bottom:12px;}
  .hall-img{min-height:0;}
  a{color:inherit;text-decoration:none;}
}

@media(max-width:860px){
  .hall-top{grid-template-columns:1fr;}
  .hall-img{min-height:180px;}
  .grid2{grid-template-columns:1fr;}
  .block + .block{border-left:none;border-top:1px solid rgba(197,227,225,.28);}
  .wrap{padding:18px 16px 48px;}
}
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function render(){
  const halls = ML.compareHalls();
  const t = ML.tariff();
  const root = document.getElementById('root');

  if (!halls.length){
    root.innerHTML = `<div class="empty">
      <h2>Нечего показывать</h2>
      <p>В сравнении пока нет залов. Отметьте нужные значком сравнения на подборе —
      здесь соберётся версия под печать.</p>
      <a class="btn pri" href="search.html">Перейти к подбору</a>
    </div>`;
    return;
  }

  const params = ML.filtersSummary(ML.loadFilters());
  const venues = [...new Set(halls.map(h => h.venueId))];

  // Рекламный блок — только когда тариф отдаёт 'ads'; на 'clean' его нет.
  const ads = t.presentation === 'ads' ? `<div class="ads">
      <div>
        <div class="ads-t">МАЙСЛИСТ</div>
        <div class="ads-s">Подбор площадок и залов для деловых мероприятий</div>
      </div>
      <div class="ads-s">Файл собран на тарифе «${esc(t.name)}». На «ПРЕМИУМ» презентация
      выгружается без этого блока — только ваши залы и данные.</div>
    </div>` : '';

  const cards = halls.map((h, i) => {
    const v = ML.hallVenue(h);
    const seats = ML.SEATING.map(s => {
      const n = h.seats[s.k];
      return `<div class="seat${n ? '' : ' off'}">
        <div class="seat-n">${n || '—'}</div><div class="seat-l">${esc(s.l)}</div></div>`;
    }).join('');

    return `<section class="hall">
      <div class="hall-top">
        <div class="hall-img"><img src="${ML.photoUrl(h.photo)}" alt="${esc(h.name)}"></div>
        <div class="hall-main">
          <div class="hall-n">Зал ${i + 1} из ${halls.length}</div>
          <div class="hall-name">${esc(h.name)}</div>
          <div class="hall-sub">${esc(h.type)} · ${esc(v.name)} · ${esc(v.city)}</div>
          <div class="hall-price">
            ${h.priceDay ? ML.money(h.priceDay) : '<i>по договорённости</i>'}
            <span>${h.priceHour ? ML.money(h.priceHour) + ' в час' : 'почасовой аренды нет'}</span>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div class="block">
          <h4>Характеристики</h4>
          <table class="kv">
            <tr><th>Тип зала</th><td>${esc(h.type)}</td></tr>
            <tr><th>Площадь</th><td>${h.area} м²</td></tr>
            <tr><th>Высота потолка</th><td>${h.height ? h.height + ' м' : '<span class="dim">—</span>'}</td></tr>
            <tr><th>Максимальная вместимость</th><td>${ML.hallCapacity(h)} чел.</td></tr>
            <tr><th>Точный план пространства</th><td class="${h.plan ? '' : 'dim'}">${h.plan ? 'есть' : 'нет'}</td></tr>
            <tr><th>Номерной фонд объекта</th><td class="${(v.rooms.twin || v.rooms.sngl) ? '' : 'dim'}">${
              (v.rooms.twin || v.rooms.sngl) ? `TWIN ${v.rooms.twin} · SNGL ${v.rooms.sngl}` : 'нет'}</td></tr>
          </table>
        </div>
        <div class="block">
          <h4>Вместимость по схемам рассадки</h4>
          <div class="seats">${seats}</div>
        </div>
      </div>

      <div class="venue">
        <div class="venue-img"><img src="${ML.photoUrl(v.photo)}" alt="" loading="lazy"></div>
        <div class="venue-mid">
          <div class="venue-name">${esc(v.name)}</div>
          <div class="venue-sub">${esc(v.cat)} · ${esc(v.city)}${v.addr ? ', ' + esc(v.addr) : ''}
            ${v.stars ? ` · <span class="venue-stars">${'★'.repeat(v.stars)}</span>` : ''}</div>
          <div class="venue-sub">Рейтинг ${v.rating} (${v.reviews}) ·
            ${v.halls.length} ${ML.plural(v.halls.length, ['зал','зала','залов'])} в объекте ·
            до ${ML.venueCapacity(v)} чел.</div>
        </div>
      </div>
    </section>`;
  }).join('');

  root.innerHTML = `
  <div class="bar">
    <button class="btn pri" onclick="window.print()">Печать или PDF</button>
    <a class="btn" href="compare.html">Вернуться в сравнение</a>
    <a class="btn" href="search.html">К подбору</a>
  </div>

  <div class="doc-head">
    <span class="doc-eyebrow">Подборка залов</span>
    <div class="doc-title">Сравнение залов</div>
    <div class="doc-meta">${halls.length} ${ML.plural(halls.length, ['зал','зала','залов'])}
      из ${venues.length} ${ML.plural(venues.length, ['объекта','объектов','объектов'])} ·
      подготовлено ${new Date().toLocaleDateString('ru')}</div>
    <div class="doc-params">${params.length
      ? params.map(p => `<span class="doc-param">${esc(p)}</span>`).join('')
      : '<span class="none">параметры подбора не задавались</span>'}</div>
  </div>

  ${ads}
  ${cards}

  <div class="foot-note">Стоимость указана по данным объектов на дату подготовки файла и не является офертой.
  Залы с ценой «по договорённости» обсуждаются напрямую с отделом продаж объекта.</div>`;
}

render();
</script>
</body>
</html>
