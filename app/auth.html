<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Вход и регистрация: пользователь, площадка или поставщик услуг.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Вход и регистрация — МАЙСЛИСТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:520px;margin:0 auto;padding:36px 24px 72px;animation:pageIn .5s ease both;}

.head{text-align:center;margin-bottom:24px;}
.head .eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.head h1{font-family:'Literata',Georgia,serif;font-size:30px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;margin-top:10px;}
.head p{font-size:13.5px;line-height:1.65;color:var(--slate-muted);margin-top:9px;}

/* вкладки вход / регистрация */
.tabs{display:flex;gap:4px;background:var(--white);border:1px solid rgba(197,227,225,.4);
  border-radius:var(--r-full);padding:4px;margin-bottom:18px;box-shadow:var(--sh-sm);}
.tabs button{flex:1;padding:10px;border-radius:var(--r-full);border:none;background:none;
  font-size:13.5px;font-weight:600;color:var(--slate-muted);transition:all .2s;}
.tabs button.on{background:var(--coral);color:#fff;box-shadow:var(--sh-coral);}

/* переключатель роли */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.role{background:var(--white);border:1.5px solid rgba(197,227,225,.45);border-radius:var(--r-md);
  padding:14px 10px;text-align:center;transition:all .2s;}
.role:hover{border-color:var(--aqua-3);}
.role.on{border-color:var(--coral);background:var(--coral-soft);}
.role-ic{font-size:19px;line-height:1;}
.role-t{font-size:12.5px;font-weight:700;color:var(--slate-deep);margin-top:7px;}
.role.on .role-t{color:var(--coral);}
.role-s{font-size:11px;color:var(--slate-muted);margin-top:3px;line-height:1.4;}

.card{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:24px;}
.fg{margin-bottom:15px;}
.fg label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--slate-muted);margin-bottom:6px;}
.fi{width:100%;padding:12px 15px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:14px;color:var(--slate-deep);outline:none;transition:border-color .2s,background .2s;}
.fi:focus{border-color:var(--coral);background:var(--white);}
.fi.bad{border-color:#B14A32;background:#FDF3F0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── пароль: показать/скрыть, требования и совпадение ── */
.pw-wrap{position:relative;}
.pw-wrap .fi{padding-right:44px;}
.pw-eye{position:absolute;top:50%;right:8px;transform:translateY(-50%);
  width:30px;height:30px;border:none;background:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--slate-pale);transition:color .2s,background .2s;}
.pw-eye:hover{color:var(--slate-mid);background:var(--aqua-pale);}
.pw-note{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.4;
  color:var(--slate-muted);margin-top:6px;min-height:17px;}
.pw-note.ok{color:#2E7D5B;}
.pw-note.bad{color:#B14A32;}
.pw-note svg{width:13px;height:13px;flex-shrink:0;}
.btn[disabled]{opacity:.5;cursor:default;}

.check{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.55;
  color:var(--slate-muted);margin-bottom:16px;cursor:pointer;}
.check input{margin-top:2px;accent-color:var(--coral);flex-shrink:0;}
.check a{color:var(--coral);font-weight:600;}

.btn{width:100%;padding:13px;border-radius:var(--r-full);font-size:14.5px;font-weight:600;
  background:var(--coral);border:none;color:#fff;box-shadow:var(--sh-coral);transition:background .2s;}
.btn:hover{background:var(--coral-hover);}
.alt{text-align:center;font-size:13px;color:var(--slate-muted);margin-top:16px;}
.alt button{background:none;border:none;color:var(--coral);font-weight:600;font-size:13px;padding:0;}
.alt button:hover{text-decoration:underline;text-underline-offset:3px;}
.forgot{display:block;text-align:right;font-size:12.5px;color:var(--slate-muted);
  background:none;border:none;padding:0;margin:-6px 0 16px auto;}
.forgot:hover{color:var(--coral);}

.hint{font-size:12px;line-height:1.6;color:var(--slate-muted);background:var(--aqua-pale);
  border-radius:var(--r-sm);padding:12px 14px;margin-top:16px;}
.hint b{color:var(--slate-deep);}

/* модалка-заглушка */
.ovl{position:fixed;inset:0;z-index:900;background:rgba(53,78,99,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:440px;
  box-shadow:var(--sh-lg);overflow:hidden;}
.modal-h{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-t{font-family:'Literata',Georgia,serif;font-weight:600;font-size:20px;color:var(--slate-deep);}
.modal-b{padding:14px 24px 20px;font-size:13.5px;line-height:1.7;color:var(--slate-mid);}
.fg-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--slate-muted);margin-bottom:8px;}
.fg-roles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fg-role{padding:8px 14px;border-radius:50px;border:1.5px solid var(--slate-pale);background:#fff;font-family:inherit;
  font-size:13px;font-weight:600;color:var(--slate-mid);cursor:pointer;}
.fg-role.on{border-color:var(--coral);color:var(--coral);background:#FCEAE4;}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px;}
.x{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--slate-pale);background:var(--white);
  color:var(--slate-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.x:hover{border-color:var(--coral);color:var(--coral);}
.btn-o{padding:10px 20px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;width:auto;box-shadow:none;}
.btn-o:hover{border-color:var(--coral);color:var(--coral);background:var(--white);}

@media(max-width:520px){ .roles{grid-template-columns:1fr;} .row2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>
<div id="modalRoot"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const ROLES = [
  { k:'user',     ic:'👤', t:'Пользователь', s:'Ищу площадки' },
  { k:'venue',    ic:'🏛', t:'Площадка',     s:'Размещаю объект' },
  { k:'supplier', ic:'🎪', t:'Поставщик',    s:'Оказываю услуги' },
];
/* Роли, допустимые в ссылках вида ?role=venue. */
const HOME = { user:1, venue:1, supplier:1 };

let MODE = 'login';      // login | signup
let ROLE = 'user';

(function init(){
  const p = new URLSearchParams(location.search);
  if (p.get('mode') === 'venue') { ROLE = 'venue'; MODE = 'signup'; }
  if (p.get('mode') === 'supplier') { ROLE = 'supplier'; MODE = 'signup'; }
  if (p.get('mode') === 'signup') MODE = 'signup';
  const r = p.get('role');
  if (r && HOME[r]) ROLE = r;
})();

/* После входа — на главную. Если на вход пришли с конкретной страницы
   (?next=…, например с закрытой карточки зала), возвращаем туда. */
function nextUrl(){
  const n = new URLSearchParams(location.search).get('next');
  if (n && /^[\w.\-?=&%]+$/.test(n) && !/^auth\.html/.test(n)) return n;
  return 'homepage.html';
}

function render(){
  const isUp = MODE === 'signup';
  const role = ROLES.find(r => r.k === ROLE);

  const fields = isUp ? signupFields() : `
    <div class="fg"><label for="fMail">Почта</label>
      <input class="fi" id="fMail" type="email" placeholder="you@company.ru" autocomplete="email"></div>
    <div class="fg"><label for="fPass">Пароль</label>
      <input class="fi" id="fPass" type="password" placeholder="Ваш пароль" autocomplete="current-password"></div>
    <button class="forgot" onclick="forgot()">Забыли пароль?</button>
    ${MH.protoNote(`Демо-аккаунты: почта <b>demo@micelist.ru</b>, пароль зависит от роли —
      <code>user1234</code> пользователь, <code>venue1234</code> площадка, <code>supp1234</code> поставщик.
      Один адрес в трёх ролях — три разных аккаунта.`)}`;

  document.getElementById('root').innerHTML = `
  <div class="head">
    <h1>${isUp ? 'Создать аккаунт' : 'Вход в кабинет'}</h1>
    <p>${isUp
      ? 'Правильно укажите вашу специализацию, иначе нужные инструменты могут оказаться вам недоступны.'
      : 'Выберите роль и войдите по почте и паролю этой роли.'}</p>
  </div>

  <div class="tabs">
    <button class="${MODE==='login'?'on':''}" onclick="setMode('login')">Вход</button>
    <button class="${MODE==='signup'?'on':''}" onclick="setMode('signup')">Регистрация</button>
  </div>

  <div class="roles">
    ${ROLES.map(r => `<button class="role${ROLE===r.k?' on':''}" onclick="setRole('${r.k}')">
      <div class="role-ic">${r.ic}</div>
      <div class="role-t">${esc(r.t)}</div>
      <div class="role-s">${esc(r.s)}</div>
    </button>`).join('')}
  </div>

  <div class="card">
    ${fields}
    ${isUp ? `<label class="check">
      <input type="checkbox" id="fAgree" checked>
      <span>Согласен с <a href="privacy.html">политикой конфиденциальности</a> и условиями использования</span>
    </label>` : ''}
    <button class="btn" id="btnSubmit" onclick="submit()">${isUp ? 'Зарегистрироваться' : 'Войти'}</button>
    <div class="alt">${isUp
      ? `Уже есть аккаунт? <button onclick="setMode('login')">Войти</button>`
      : `Нет аккаунта? <button onclick="setMode('signup')">Зарегистрироваться</button>`}</div>
    ${isUp && ROLE === 'user'
      ? `<div class="hint">За регистрацию начислим <b>${ML.POINTS_HELLO} ${ML.plural(ML.POINTS_HELLO,['балл','балла','баллов'])} «ПРИВЕТ»</b> —
         их можно потратить в витрине бонусной программы.</div>` : ''}
    ${isUp && ROLE === 'venue'
      ? `<div class="hint">Размещение объекта <b>бесплатное</b>. Объект платит фиксированную сумму
         только за состоявшееся мероприятие, пришедшее через ресурс.</div>` : ''}
    ${isUp && ROLE === 'supplier'
      ? `<div class="hint">Размещение поставщика <b>платное</b>: один тариф по образцу
         пользовательского «${esc(ML.TARIFFS.prem.name)}».</div>` : ''}
  </div>`;

  if (isUp) bindPw();
}

function signupFields(){
  if (ROLE === 'user') return `
    <div class="fg"><label for="fName">Имя и фамилия</label>
      <input class="fi" id="fName" type="text" placeholder="Анна Козлова" autocomplete="name"></div>
    <div class="fg"><label for="fMail">Почта</label>
      <input class="fi" id="fMail" type="email" placeholder="you@company.ru" autocomplete="email"></div>
    <div class="row2">
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 916 000-00-00" autocomplete="tel"></div>
    </div>
    ${passBlock()}
    <div class="fg"><label for="fOrg">Место работы</label>
      <input class="fi" id="fOrg" type="text" placeholder="Агентство или компания"></div>`;
  if (ROLE === 'venue') return `
    <div class="fg"><label for="fName">Название объекта</label>
      <input class="fi" id="fName" type="text" placeholder="Отель «Аврора»"></div>
    <div class="fg"><label for="fPerson">Контактное лицо</label>
      <input class="fi" id="fPerson" type="text" placeholder="Имя и должность"></div>
    <div class="row2">
      <div class="fg"><label for="fMail">Почта отдела продаж</label>
        <input class="fi" id="fMail" type="email" placeholder="sales@venue.ru"></div>
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 495 000-00-00"></div>
    </div>
    <div class="row2">
      <div class="fg"><label for="fCity">Город</label>
        <input class="fi" id="fCity" type="text" placeholder="Москва"></div>
    </div>
    ${passBlock()}`;
  return `
    <div class="fg"><label for="fName">Название или ФИО</label>
      <input class="fi" id="fName" type="text" placeholder="Ведущий Артём Соколов"></div>
    <div class="fg"><label for="fCat">Раздел каталога</label>
      <select class="fi" id="fCat">${Object.keys(ML.SUPPLIER_TREE).map(p => `<option>${esc(p)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="fg"><label for="fMail">Почта</label>
        <input class="fi" id="fMail" type="email" placeholder="hello@supplier.ru"></div>
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 916 000-00-00"></div>
    </div>
    ${passBlock()}`;
}

/* ══════════════════════════════════════════════
   ПАРОЛЬ ПРИ РЕГИСТРАЦИИ
   Требования показываем сразу, а не после ошибки. Ругаемся не с первого
   символа: первое поле проверяем по уходу фокуса, второе — по ходу ввода,
   потому что там человек уже знает, что печатает.
   ══════════════════════════════════════════════ */
const PW_MIN = 8;
const IC_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const IC_NO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const IC_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const IC_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.7a3 3 0 004.2 4.2"/><path d="M9.4 5.2A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17.6 17.6 0 01-3.4 4.2M6.3 6.5C3.7 8.2 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/></svg>';

let PW_TOUCHED = false;   // первое поле уже покидали

function passBlock(){
  return `
    <div class="fg">
      <label for="fPass">Пароль</label>
      <div class="pw-wrap">
        <input class="fi" id="fPass" type="password" placeholder="Придумайте пароль" autocomplete="new-password">
        <button type="button" class="pw-eye" id="pwEye" aria-label="Показать пароль" onclick="togglePw()">${IC_EYE}</button>
      </div>
      <div class="pw-note" id="pwReq">Не короче ${PW_MIN} символов</div>
    </div>
    <div class="fg">
      <label for="fPass2">Повторите пароль</label>
      <div class="pw-wrap">
        <input class="fi" id="fPass2" type="password" placeholder="Ещё раз" autocomplete="new-password">
      </div>
      <div class="pw-note" id="pwMatch"></div>
    </div>`;
}

function pwState(){
  const a = (document.getElementById('fPass') || {}).value || '';
  const b = (document.getElementById('fPass2') || {}).value || '';
  return { a, b, long: a.length >= PW_MIN, match: !!a && a === b };
}

function togglePw(){
  const a = document.getElementById('fPass'), b = document.getElementById('fPass2');
  const eye = document.getElementById('pwEye');
  const show = a.type === 'password';
  a.type = b.type = show ? 'text' : 'password';
  eye.innerHTML = show ? IC_EYE_OFF : IC_EYE;
  eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
}

function pwPaint(){
  const req = document.getElementById('pwReq');
  const mt = document.getElementById('pwMatch');
  const btn = document.getElementById('btnSubmit');
  if (!req || !mt) return;
  const st = pwState();

  if (st.long) req.className = 'pw-note ok', req.innerHTML = IC_OK + '<span>Длина подходит</span>';
  else if (PW_TOUCHED && st.a) req.className = 'pw-note bad', req.innerHTML = IC_NO + `<span>Не короче ${PW_MIN} символов</span>`;
  else req.className = 'pw-note', req.textContent = `Не короче ${PW_MIN} символов`;

  document.getElementById('fPass').classList.toggle('bad', PW_TOUCHED && !!st.a && !st.long);

  if (!st.b) { mt.className = 'pw-note'; mt.textContent = ''; }
  else if (st.match) { mt.className = 'pw-note ok'; mt.innerHTML = IC_OK + '<span>Пароли совпадают</span>'; }
  else { mt.className = 'pw-note bad'; mt.innerHTML = IC_NO + '<span>Пароли не совпадают</span>'; }
  document.getElementById('fPass2').classList.toggle('bad', !!st.b && !st.match);

  if (btn) btn.disabled = !(st.long && st.match);
}

function bindPw(){
  const a = document.getElementById('fPass'), b = document.getElementById('fPass2');
  if (!a || !b) return;
  a.addEventListener('input', () => { if (PW_TOUCHED || pwState().long) pwPaint(); });
  a.addEventListener('blur', () => { PW_TOUCHED = true; pwPaint(); });
  b.addEventListener('input', pwPaint);
  b.addEventListener('blur', pwPaint);
  pwPaint();
}

function setMode(m){ MODE = m; PW_TOUCHED = false; render(); }
function setRole(r){ ROLE = r; PW_TOUCHED = false; render(); }

const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
function bad(id, msg){
  const el = document.getElementById(id);
  if (el) { el.classList.add('bad'); el.focus(); }
  MH.toast(msg, 'error');
  return false;
}
function initials(name){
  const p = String(name).trim().split(/\s+/);
  return (((p[0]||'')[0]||'') + ((p[1]||'')[0]||'')).toUpperCase() || 'МХ';
}

/* Поля читаются и кладутся в сессию — захардкоженных данных больше нет. */
function submit(){
  document.querySelectorAll('.fi').forEach(el => el.classList.remove('bad'));
  const mail = val('fMail'), pass = val('fPass');
  if (!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return bad('fMail', 'Укажите корректную почту');
  if (!pass) return bad('fPass', 'Введите пароль');

  if (MODE === 'signup') {
    const st = pwState();
    if (!st.long) { PW_TOUCHED = true; pwPaint(); return bad('fPass', `Пароль короче ${PW_MIN} символов`); }
    if (!st.match) { pwPaint(); return bad('fPass2', 'Пароли не совпадают'); }
  }

  if (MODE === 'signup') {
    const name = val('fName');
    if (!name) return bad('fName', 'Укажите название или имя');
    const agree = document.getElementById('fAgree');
    if (agree && !agree.checked) { MH.toast('Нужно принять условия использования', 'error'); return; }

    // каждая роль — отдельный аккаунт: та же почта в другой роли регистрируется заново
    const reg = MH.register(ROLE, mail, pass, {
      name, phone: val('fPhone'), org: val('fOrg') || val('fCity') || val('fCat') || '',
    });
    if (!reg.ok) return bad('fMail', reg.error);
    MH.setSession(MH.sessionFor(reg.account));

    if (ROLE === 'user') {
      // баллы «ПРИВЕТ» начисляет модель
      ML.addPoints(ML.POINTS_HELLO, 'free');
      MH.toast(`Аккаунт создан. Начислено ${ML.POINTS_HELLO} ${ML.plural(ML.POINTS_HELLO,['балл','балла','баллов'])} «ПРИВЕТ»`, 'success');
    } else {
      MH.toast('Аккаунт создан', 'success');
    }
  } else {
    const res = MH.login(ROLE, mail, pass);
    if (!res.ok) return bad(/пароль/i.test(res.error) ? 'fPass' : 'fMail', res.error);
    MH.setSession(MH.sessionFor(res.account));
    MH.toast('С возвращением', 'success');
  }

  /* Регистрация и вход снимают гостевой замок. Поднимаем только с guest:
     у того, кто уже на БИЗНЕС или ПРЕМИУМ, вход не должен отбирать тариф. */
  if (ML.isGuest()) ML.setTariff('start');

  setTimeout(() => { window.location.href = nextUrl(); }, 600);
}

/* Восстановление пароля начинается с выбора роли: у каждой роли свой
   аккаунт и свой пароль, меняется пароль только выбранной. */
let FG = { role: 'user', mail: '', step: 1 };
function forgot(){
  FG = { role: ROLE, mail: val('fMail'), step: 1 };
  drawForgot();
  document.addEventListener('keydown', escClose);
}
function drawForgot(){
  const body = FG.step === 1 ? `
      <div class="modal-b">
        <div class="fg-l">Для какой роли восстановить пароль?</div>
        <div class="fg-roles">${ROLES.map(r => `<button type="button" class="fg-role${FG.role === r.k ? ' on' : ''}"
          onclick="FG.role='${r.k}';FG.mail=val('fgMail');drawForgot()">${esc(r.t)}</button>`).join('')}</div>
        <div class="fg"><label for="fgMail">Почта этого аккаунта</label>
          <input class="fi" id="fgMail" type="email" value="${esc(FG.mail)}" placeholder="you@company.ru"></div>
      </div>
      <div class="modal-f">
        <button class="btn-o" onclick="closeModal()">Отмена</button>
        <button class="btn-o" onclick="forgotSend()" style="border-color:var(--coral);color:var(--coral)">Прислать ссылку</button>
      </div>` : `
      <div class="modal-b">
        <p style="margin-bottom:12px">Ссылка отправлена на <b>${esc(FG.mail)}</b>. Новый пароль будет установлен
          только для роли «${esc(MH.ROLE_NAMES[FG.role])}» — пароли других ролей этой почты не изменятся.</p>
        ${MH.protoNote('Письма в прототипе не уходят, поэтому шаг из письма показан здесь же: задайте новый пароль.')}
        <div class="fg"><label for="fgPass">Новый пароль</label>
          <input class="fi" id="fgPass" type="password" placeholder="Не короче ${PW_MIN} символов" autocomplete="new-password"></div>
      </div>
      <div class="modal-f">
        <button class="btn-o" onclick="closeModal()">Отмена</button>
        <button class="btn-o" onclick="forgotSave()" style="border-color:var(--coral);color:var(--coral)">Сохранить пароль</button>
      </div>`;
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-h"><div class="modal-t">Восстановление доступа</div>
        <button class="x" onclick="closeModal()" aria-label="Закрыть">✕</button></div>
      ${body}
    </div>
  </div>`;
}
function forgotSend(){
  FG.mail = val('fgMail');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(FG.mail)) return bad('fgMail', 'Укажите корректную почту');
  if (!MH.findAccount(FG.role, FG.mail))
    return bad('fgMail', `Аккаунт с этой почтой в роли «${MH.ROLE_NAMES[FG.role]}» не найден`);
  FG.step = 2; drawForgot();
}
function forgotSave(){
  const p = val('fgPass');
  if (p.length < PW_MIN) return bad('fgPass', `Пароль короче ${PW_MIN} символов`);
  const res = MH.resetPassword(FG.role, FG.mail, p);
  if (!res.ok) return bad('fgPass', res.error);
  closeModal();
  ROLE = FG.role; MODE = 'login'; render();
  document.getElementById('fMail').value = FG.mail;
  MH.toast(`Пароль для роли «${MH.ROLE_NAMES[FG.role]}» обновлён — войдите с ним`, 'success');
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

render();
</script>
</body>
</html>
