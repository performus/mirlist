<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Вход и регистрация: пользователь, площадка или поставщик услуг.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<title>Вход и регистрация — МирХАБ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#E98667; --coral-hover:#D97757; --coral-soft:#F6DDD3;
  --peach:#F6E6DE;
  --aqua-1:#D9ECEB; --aqua-2:#C5E3E1; --aqua-3:#A8D4D8; --aqua-pale:#EDF6F5;
  --slate:#46627A; --slate-mid:#3E596F; --slate-deep:#354E63; --slate-muted:#7A919F; --slate-pale:#B4C3CC;
  --bg:#F8F5F2; --white:#FFFFFF;
  --sh-sm:0 1px 4px rgba(53,78,99,.05); --sh-md:0 4px 20px rgba(53,78,99,.07); --sh-lg:0 8px 40px rgba(53,78,99,.09);
  --sh-coral:0 4px 18px rgba(233,134,103,.22);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',system-ui,sans-serif;background:var(--bg);color:var(--slate);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

@keyframes pageIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.wrap{max-width:520px;margin:0 auto;padding:36px 24px 72px;animation:pageIn .5s ease both;}

.head{text-align:center;margin-bottom:24px;}
.head .eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--coral);}
.head h1{font-family:'Literata',Georgia,serif;font-size:30px;font-weight:600;color:var(--slate-deep);
  line-height:1.15;margin-top:10px;}
.head p{font-size:13.5px;line-height:1.65;color:var(--slate-muted);margin-top:9px;}

/* вкладки вход / регистрация */
.tabs{display:flex;gap:4px;background:var(--white);border:1px solid rgba(197,227,225,.4);
  border-radius:var(--r-full);padding:4px;margin-bottom:18px;box-shadow:var(--sh-sm);}
.tabs button{flex:1;padding:10px;border-radius:var(--r-full);border:none;background:none;
  font-size:13.5px;font-weight:600;color:var(--slate-muted);transition:all .2s;}
.tabs button.on{background:var(--coral);color:#fff;box-shadow:var(--sh-coral);}

/* переключатель роли */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.role{background:var(--white);border:1.5px solid rgba(197,227,225,.45);border-radius:var(--r-md);
  padding:14px 10px;text-align:center;transition:all .2s;}
.role:hover{border-color:var(--aqua-3);}
.role.on{border-color:var(--coral);background:var(--coral-soft);}
.role-ic{font-size:19px;line-height:1;}
.role-t{font-size:12.5px;font-weight:700;color:var(--slate-deep);margin-top:7px;}
.role.on .role-t{color:var(--coral);}
.role-s{font-size:11px;color:var(--slate-muted);margin-top:3px;line-height:1.4;}

.card{background:var(--white);border:1px solid rgba(197,227,225,.3);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:24px;}
.fg{margin-bottom:15px;}
.fg label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--slate-muted);margin-bottom:6px;}
.fi{width:100%;padding:12px 15px;border-radius:var(--r-sm);
  border:1.5px solid rgba(197,227,225,.5);background:var(--bg);
  font-family:inherit;font-size:14px;color:var(--slate-deep);outline:none;transition:border-color .2s,background .2s;}
.fi:focus{border-color:var(--coral);background:var(--white);}
.fi.bad{border-color:#B14A32;background:#FDF3F0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.check{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.55;
  color:var(--slate-muted);margin-bottom:16px;cursor:pointer;}
.check input{margin-top:2px;accent-color:var(--coral);flex-shrink:0;}
.check a{color:var(--coral);font-weight:600;}

.btn{width:100%;padding:13px;border-radius:var(--r-full);font-size:14.5px;font-weight:600;
  background:var(--coral);border:none;color:#fff;box-shadow:var(--sh-coral);transition:background .2s;}
.btn:hover{background:var(--coral-hover);}
.alt{text-align:center;font-size:13px;color:var(--slate-muted);margin-top:16px;}
.alt button{background:none;border:none;color:var(--coral);font-weight:600;font-size:13px;padding:0;}
.alt button:hover{text-decoration:underline;text-underline-offset:3px;}
.forgot{display:block;text-align:right;font-size:12.5px;color:var(--slate-muted);
  background:none;border:none;padding:0;margin:-6px 0 16px auto;}
.forgot:hover{color:var(--coral);}

.hint{font-size:12px;line-height:1.6;color:var(--slate-muted);background:var(--aqua-pale);
  border-radius:var(--r-sm);padding:12px 14px;margin-top:16px;}
.hint b{color:var(--slate-deep);}

/* модалка-заглушка */
.ovl{position:fixed;inset:0;z-index:900;background:rgba(53,78,99,.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:440px;
  box-shadow:var(--sh-lg);overflow:hidden;}
.modal-h{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.modal-t{font-family:'Literata',Georgia,serif;font-weight:600;font-size:20px;color:var(--slate-deep);}
.modal-b{padding:14px 24px 20px;font-size:13.5px;line-height:1.7;color:var(--slate-mid);}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px;}
.x{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--slate-pale);background:var(--white);
  color:var(--slate-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.x:hover{border-color:var(--coral);color:var(--coral);}
.btn-o{padding:10px 20px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;
  border:1.5px solid var(--slate-pale);background:var(--white);color:var(--slate);transition:all .2s;width:auto;box-shadow:none;}
.btn-o:hover{border-color:var(--coral);color:var(--coral);background:var(--white);}

@media(max-width:520px){ .roles{grid-template-columns:1fr;} .row2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="mh-nav"></div>

<div class="wrap" id="root"></div>
<div id="modalRoot"></div>

<div id="mh-footer"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
MH.init();

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const ROLES = [
  { k:'user',     ic:'👤', t:'Пользователь', s:'Ищу площадки' },
  { k:'venue',    ic:'🏛', t:'Площадка',     s:'Размещаю объект' },
  { k:'supplier', ic:'🎪', t:'Поставщик',    s:'Оказываю услуги' },
];
/* Куда уходим после входа — кабинет своей роли. */
const HOME = { user:'dashboard.html?role=user', venue:'dashboard.html?role=venue', supplier:'dashboard.html?role=supplier' };

let MODE = 'login';      // login | signup
let ROLE = 'user';

(function init(){
  const p = new URLSearchParams(location.search);
  if (p.get('mode') === 'venue') { ROLE = 'venue'; MODE = 'signup'; }
  if (p.get('mode') === 'supplier') { ROLE = 'supplier'; MODE = 'signup'; }
  if (p.get('mode') === 'signup') MODE = 'signup';
  const r = p.get('role');
  if (r && HOME[r]) ROLE = r;
})();

function nextUrl(){
  const n = new URLSearchParams(location.search).get('next');
  if (n && /^[\w.\-?=&]+$/.test(n)) return n;
  return HOME[ROLE];
}

function render(){
  const isUp = MODE === 'signup';
  const role = ROLES.find(r => r.k === ROLE);

  const fields = isUp ? signupFields() : `
    <div class="fg"><label for="fMail">Почта</label>
      <input class="fi" id="fMail" type="email" placeholder="you@company.ru" autocomplete="email"></div>
    <div class="fg"><label for="fPass">Пароль</label>
      <input class="fi" id="fPass" type="password" placeholder="Ваш пароль" autocomplete="current-password"></div>
    <button class="forgot" onclick="forgot()">Забыли пароль?</button>`;

  document.getElementById('root').innerHTML = `
  <div class="head">
    <span class="eyebrow">${isUp ? 'Регистрация' : 'Вход'}</span>
    <h1>${isUp ? 'Создать аккаунт' : 'Вход в кабинет'}</h1>
    <p>${isUp
      ? 'Выберите роль — от неё зависит, какой кабинет откроется после регистрации.'
      : 'Войдите по почте и паролю. Роль определяет, куда вы попадёте.'}</p>
  </div>

  <div class="tabs">
    <button class="${MODE==='login'?'on':''}" onclick="setMode('login')">Вход</button>
    <button class="${MODE==='signup'?'on':''}" onclick="setMode('signup')">Регистрация</button>
  </div>

  <div class="roles">
    ${ROLES.map(r => `<button class="role${ROLE===r.k?' on':''}" onclick="setRole('${r.k}')">
      <div class="role-ic">${r.ic}</div>
      <div class="role-t">${esc(r.t)}</div>
      <div class="role-s">${esc(r.s)}</div>
    </button>`).join('')}
  </div>

  <div class="card">
    ${fields}
    ${isUp ? `<label class="check">
      <input type="checkbox" id="fAgree" checked>
      <span>Согласен с <a href="privacy.html">политикой конфиденциальности</a> и условиями использования</span>
    </label>` : ''}
    <button class="btn" onclick="submit()">${isUp ? 'Зарегистрироваться' : 'Войти'}</button>
    <div class="alt">${isUp
      ? `Уже есть аккаунт? <button onclick="setMode('login')">Войти</button>`
      : `Нет аккаунта? <button onclick="setMode('signup')">Зарегистрироваться</button>`}</div>
    ${isUp && ROLE === 'user'
      ? `<div class="hint">За регистрацию начислим <b>${ML.POINTS_HELLO} ${ML.plural(ML.POINTS_HELLO,['балл','балла','баллов'])} «ПРИВЕТ»</b> —
         их можно потратить в витрине бонусной программы.</div>` : ''}
    ${isUp && ROLE === 'venue'
      ? `<div class="hint">Размещение объекта <b>бесплатное</b>. Объект платит фиксированную сумму
         только за состоявшееся мероприятие, пришедшее через ресурс.</div>` : ''}
    ${isUp && ROLE === 'supplier'
      ? `<div class="hint">Размещение поставщика <b>платное</b>: один тариф по образцу
         пользовательского «${esc(ML.TARIFFS.prem.name)}».</div>` : ''}
  </div>`;
}

function signupFields(){
  if (ROLE === 'user') return `
    <div class="fg"><label for="fName">Имя и фамилия</label>
      <input class="fi" id="fName" type="text" placeholder="Анна Козлова" autocomplete="name"></div>
    <div class="fg"><label for="fMail">Почта</label>
      <input class="fi" id="fMail" type="email" placeholder="you@company.ru" autocomplete="email"></div>
    <div class="row2">
      <div class="fg"><label for="fPass">Пароль</label>
        <input class="fi" id="fPass" type="password" placeholder="Придумайте пароль" autocomplete="new-password"></div>
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 916 000-00-00" autocomplete="tel"></div>
    </div>
    <div class="fg"><label for="fOrg">Место работы</label>
      <input class="fi" id="fOrg" type="text" placeholder="Агентство или компания"></div>`;
  if (ROLE === 'venue') return `
    <div class="fg"><label for="fName">Название объекта</label>
      <input class="fi" id="fName" type="text" placeholder="Отель «Аврора»"></div>
    <div class="fg"><label for="fPerson">Контактное лицо</label>
      <input class="fi" id="fPerson" type="text" placeholder="Имя и должность"></div>
    <div class="row2">
      <div class="fg"><label for="fMail">Почта отдела продаж</label>
        <input class="fi" id="fMail" type="email" placeholder="sales@venue.ru"></div>
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 495 000-00-00"></div>
    </div>
    <div class="row2">
      <div class="fg"><label for="fPass">Пароль</label>
        <input class="fi" id="fPass" type="password" placeholder="Придумайте пароль"></div>
      <div class="fg"><label for="fCity">Город</label>
        <input class="fi" id="fCity" type="text" placeholder="Москва"></div>
    </div>`;
  return `
    <div class="fg"><label for="fName">Название или ФИО</label>
      <input class="fi" id="fName" type="text" placeholder="Ведущий Артём Соколов"></div>
    <div class="fg"><label for="fCat">Раздел каталога</label>
      <select class="fi" id="fCat">${Object.keys(ML.SUPPLIER_TREE).map(p => `<option>${esc(p)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="fg"><label for="fMail">Почта</label>
        <input class="fi" id="fMail" type="email" placeholder="hello@supplier.ru"></div>
      <div class="fg"><label for="fPhone">Телефон</label>
        <input class="fi" id="fPhone" type="tel" placeholder="+7 916 000-00-00"></div>
    </div>
    <div class="fg"><label for="fPass">Пароль</label>
      <input class="fi" id="fPass" type="password" placeholder="Придумайте пароль"></div>`;
}

function setMode(m){ MODE = m; render(); }
function setRole(r){ ROLE = r; render(); }

const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
function bad(id, msg){
  const el = document.getElementById(id);
  if (el) { el.classList.add('bad'); el.focus(); }
  MH.toast(msg, 'error');
  return false;
}
function initials(name){
  const p = String(name).trim().split(/\s+/);
  return (((p[0]||'')[0]||'') + ((p[1]||'')[0]||'')).toUpperCase() || 'МХ';
}

/* Поля читаются и кладутся в сессию — захардкоженных данных больше нет. */
function submit(){
  document.querySelectorAll('.fi').forEach(el => el.classList.remove('bad'));
  const mail = val('fMail'), pass = val('fPass');
  if (!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return bad('fMail', 'Укажите корректную почту');
  if (!pass) return bad('fPass', 'Введите пароль');

  if (MODE === 'signup') {
    const name = val('fName');
    if (!name) return bad('fName', 'Укажите название или имя');
    const agree = document.getElementById('fAgree');
    if (agree && !agree.checked) { MH.toast('Нужно принять условия использования', 'error'); return; }

    MH.setSession({
      name, initials: initials(name), role: ROLE, email: mail,
      phone: val('fPhone'), org: val('fOrg') || val('fCity') || val('fCat') || '',
      premium: false,
    });

    if (ROLE === 'user') {
      // баллы «ПРИВЕТ» начисляет модель
      ML.addPoints(ML.POINTS_HELLO, 'free');
      MH.toast(`Аккаунт создан. Начислено ${ML.POINTS_HELLO} ${ML.plural(ML.POINTS_HELLO,['балл','балла','баллов'])} «ПРИВЕТ»`, 'success');
    } else {
      MH.toast('Аккаунт создан', 'success');
    }
  } else {
    // вход: имя выводим из почты, пока профиля на бэкенде нет
    const guess = mail.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    MH.setSession({ name: guess, initials: initials(guess), role: ROLE, email: mail, premium: false });
    MH.toast('С возвращением', 'success');
  }

  /* Регистрация и вход снимают гостевой замок. Поднимаем только с guest:
     у того, кто уже на БИЗНЕС или ПРЕМИУМ, вход не должен отбирать тариф. */
  if (ML.isGuest()) ML.setTariff('start');

  setTimeout(() => { window.location.href = nextUrl(); }, 600);
}

/* Отдельной страницы восстановления нет — заглушка. */
function forgot(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="ovl" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-h"><div class="modal-t">Восстановление доступа</div>
        <button class="x" onclick="closeModal()" aria-label="Закрыть">✕</button></div>
      <div class="modal-b">Введите почту, и мы пришлём ссылку для смены пароля.
      В прототипе письма не отправляются — экран восстановления появится на разработке.</div>
      <div class="modal-f">
        <button class="btn-o" onclick="closeModal()">Закрыть</button>
        <button class="btn-o" onclick="closeModal();MH.toast('Письмо отправлено на указанную почту','info')"
          style="border-color:var(--coral);color:var(--coral)">Прислать ссылку</button>
      </div>
    </div>
  </div>`;
  document.addEventListener('keydown', escClose);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

render();
</script>
</body>
</html>
