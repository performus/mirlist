<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep navy matching brand blue-gray -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091827"/>
      <stop offset="55%" stop-color="#0d2030"/>
      <stop offset="100%" stop-color="#142c3e"/>
    </linearGradient>

    <!-- Teal glow (top-left) -->
    <radialGradient id="tealGlow" cx="0" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7FC4C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7FC4C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Coral glow (bottom-right) -->
    <radialGradient id="coralGlow" cx="1200" cy="600" r="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8846A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8846A" stop-opacity="0"/>
    </radialGradient>

    <!-- Right panel darker overlay -->
    <linearGradient id="rightDark" x1="720" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04101a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04101a" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Dot grid texture -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="white" fill-opacity="0.04"/>
    </pattern>

    <!-- Photo placeholder gradient (venue interior feel) -->
    <linearGradient id="photoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3e58"/>
      <stop offset="100%" stop-color="#0b2133"/>
    </linearGradient>

    <!-- Photo bottom darkening -->
    <linearGradient id="photoDarken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="40%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Vertical separator between left and right columns -->
    <linearGradient id="sepGrad" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="20%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="80%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom accent gradient (coral → teal) -->
    <linearGradient id="bottomAccent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8846A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#E8846A" stop-opacity="1"/>
      <stop offset="65%" stop-color="#7FC4C4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7FC4C4" stop-opacity="0"/>
    </linearGradient>

    <!-- Card drop shadow -->
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Back card shadow (lighter) -->
    <filter id="backCardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>
  <rect width="1200" height="630" fill="url(#coralGlow)"/>
  <!-- Right column darker overlay for depth -->
  <rect x="718" y="0" width="482" height="630" fill="url(#rightDark)"/>
  <!-- Column separator line -->
  <rect x="714" y="0" width="1" height="630" fill="url(#sepGrad)"/>
  <!-- Left coral accent bar -->
  <rect x="0" y="78" width="5" height="474" rx="2.5" fill="#E8846A"/>


  <!-- ==================== LEFT CONTENT ==================== -->

  <!-- LOGO: icon box + wordmark -->
  <rect x="54" y="46" width="46" height="46" rx="12" fill="#E8846A"/>
  <text x="77" y="78" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="24" fill="white" text-anchor="middle">М</text>
  <!-- Wordmark "МирХАБ" — Мир in coral, ХАБ in teal -->
  <text x="112" y="80" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" letter-spacing="-0.5">
    <tspan fill="#E8846A">Мир</tspan><tspan fill="#7FC4C4">ХАБ</tspan>
  </text>

  <!-- Category label -->
  <text x="54" y="132" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" fill="rgba(127,196,196,0.75)" letter-spacing="2.8">МАРКЕТПЛЕЙС ПЛОЩАДОК</text>

  <!-- Short coral divider -->
  <rect x="54" y="144" width="54" height="2.5" rx="1.25" fill="#E8846A" opacity="0.8"/>

  <!-- HEADLINE (3 lines, 68px bold) -->
  <text x="54" y="234" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="68" fill="white" letter-spacing="-2">Площадки</text>
  <text x="54" y="314" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="68" fill="white" letter-spacing="-2">для любого</text>
  <!-- Third line in teal -->
  <text x="54" y="394" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="68" fill="#7FC4C4" letter-spacing="-2">мероприятия</text>

  <!-- Description line -->
  <text x="54" y="448" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="rgba(255,255,255,0.46)" letter-spacing="0.1">Более 12 000 проверенных площадок по всей России</text>

  <!-- STAT PILLS (y=470, height=42) -->
  <!-- Pill 1: coral accent, main stat -->
  <rect x="54" y="470" width="202" height="42" rx="21" fill="rgba(232,132,106,0.14)" stroke="#E8846A" stroke-width="1.5"/>
  <text x="155" y="496" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="14" fill="#E8846A" text-anchor="middle">12 000+ площадок</text>

  <!-- Pill 2: neutral -->
  <rect x="268" y="470" width="128" height="42" rx="21" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <text x="332" y="496" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.60)" text-anchor="middle">Вся Россия</text>

  <!-- Pill 3: neutral -->
  <rect x="408" y="470" width="122" height="42" rx="21" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <text x="469" y="496" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.60)" text-anchor="middle">Бесплатно</text>

  <!-- Decorative dot trio -->
  <circle cx="54" cy="548" r="3.5" fill="#E8846A" opacity="0.55"/>
  <circle cx="66" cy="548" r="3.5" fill="#7FC4C4" opacity="0.38"/>
  <circle cx="78" cy="548" r="3.5" fill="white" opacity="0.16"/>

  <!-- URL -->
  <text x="54" y="584" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="rgba(255,255,255,0.28)" letter-spacing="0.6">mirhub.ru</text>


  <!-- ==================== RIGHT CONTENT: VENUE CARD MOCKUPS ==================== -->

  <!-- Decorative teal glow circles (top-right corner) -->
  <circle cx="1155" cy="72" r="170" fill="#7FC4C4" fill-opacity="0.055"/>
  <circle cx="1155" cy="72" r="85" fill="#7FC4C4" fill-opacity="0.06"/>
  <circle cx="1155" cy="72" r="28" fill="#7FC4C4" fill-opacity="0.1"/>

  <!-- CARD 3 (background, barely visible, top-right) -->
  <g transform="rotate(-8, 1080, 110)" opacity="0.38">
    <rect x="968" y="30" width="224" height="148" rx="18" fill="#0c1f30" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
    <rect x="984" y="46" width="192" height="76" rx="12" fill="#091928"/>
    <rect x="984" y="136" width="130" height="10" rx="5" fill="rgba(255,255,255,0.14)"/>
    <rect x="984" y="152" width="82" height="8" rx="4" fill="rgba(255,255,255,0.07)"/>
  </g>

  <!-- CARD 2 (back card, rotated 6deg) -->
  <g transform="rotate(6, 982, 210)" filter="url(#backCardShadow)">
    <rect x="840" y="68" width="318" height="238" rx="22" fill="#102437" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Photo area -->
    <rect x="856" y="84" width="286" height="144" rx="16" fill="url(#photoGrad)"/>
    <!-- Teal venue type badge over photo -->
    <rect x="872" y="100" width="90" height="24" rx="12" fill="rgba(127,196,196,0.82)"/>
    <text x="917" y="116" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="11" fill="white" text-anchor="middle">Банкетный зал</text>
    <!-- Text placeholder lines below photo -->
    <rect x="856" y="244" width="148" height="10" rx="5" fill="rgba(255,255,255,0.18)"/>
    <rect x="856" y="260" width="92" height="8" rx="4" fill="rgba(255,255,255,0.09)"/>
    <!-- Price -->
    <text x="856" y="286" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.36)">от 5 500 ₽/ч</text>
  </g>

  <!-- CARD 1 (MAIN front card) — no rotation -->
  <rect x="728" y="238" width="424" height="360" rx="26" fill="#102436" stroke="rgba(127,196,196,0.18)" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="728" y="238" width="424" height="360" rx="26" fill="#102436" stroke="rgba(127,196,196,0.18)" stroke-width="1"/>

  <!-- Photo placeholder -->
  <rect x="744" y="254" width="392" height="192" rx="18" fill="url(#photoGrad)"/>
  <rect x="744" y="254" width="392" height="192" rx="18" fill="url(#photoDarken)"/>
  <!-- Subtle horizontal lines to suggest interior space geometry -->
  <rect x="744" y="318" width="392" height="1.5" fill="rgba(255,255,255,0.035)"/>
  <rect x="744" y="376" width="392" height="1.5" fill="rgba(255,255,255,0.025)"/>
  <rect x="744" y="418" width="392" height="1.5" fill="rgba(255,255,255,0.02)"/>

  <!-- Venue type badge (coral, top-left of photo) -->
  <rect x="760" y="270" width="118" height="26" rx="13" fill="rgba(232,132,106,0.9)"/>
  <text x="819" y="287" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" fill="white" text-anchor="middle">Конференц-зал</text>

  <!-- Capacity badge (top-right of photo) -->
  <rect x="1018" y="270" width="94" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
  <text x="1065" y="287" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">120 чел.</text>

  <!-- VENUE NAME -->
  <text x="760" y="468" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="white">Бизнес-центр «Горизонт»</text>

  <!-- Location row -->
  <text x="760" y="492" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">Москва, Центральный</text>

  <!-- Thin divider -->
  <rect x="760" y="508" width="376" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Price + rating row -->
  <text x="760" y="533" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" fill="rgba(255,255,255,0.80)">от 8 000 ₽/ч</text>
  <text x="1112" y="533" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#E8846A" text-anchor="end">★ 4.9</text>

  <!-- CTA button strip -->
  <rect x="760" y="550" width="376" height="34" rx="17" fill="rgba(127,196,196,0.1)" stroke="rgba(127,196,196,0.28)" stroke-width="1.5"/>
  <text x="948" y="572" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="13" fill="rgba(127,196,196,0.82)" text-anchor="middle">Посмотреть площадку →</text>


  <!-- ==================== BOTTOM ACCENT LINE ==================== -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#bottomAccent)"/>
</svg>
